    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-card-hover: #273449;
            --border-color: #334155;
            --border-accent: #3b82f6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: rgba(59, 130, 246, 0.1);
            --success: #10b981;
            --success-light: rgba(16, 185, 129, 0.1);
            --warning: #f59e0b;
            --warning-light: rgba(245, 158, 11, 0.1);
            --error: #ef4444;
            --error-light: rgba(239, 68, 68, 0.1);
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --gradient-encode: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            --gradient-decode: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.4);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 20px;
        }

        .badge {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
        }

        /* 모드 토글 */
        .mode-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .mode-toggle-group {
            display: flex;
            gap: 4px;
            background: var(--bg-secondary);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            padding: 12px 28px;
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .mode-btn:hover {
            color: var(--text-primary);
            background: var(--bg-card-hover);
        }

        .mode-btn.active-encode {
            background: var(--gradient-encode);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .mode-btn.active-decode {
            background: var(--gradient-decode);
            color: white;
            box-shadow: var(--shadow-md);
        }

        /* 카드 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-light);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .char-count {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            padding: 4px 10px;
            background: var(--bg-primary);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* 텍스트 영역 */
        .textarea-wrapper {
            position: relative;
        }

        .editor-textarea {
            width: 100%;
            min-height: 200px;
            padding: 16px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            line-height: 1.7;
            resize: vertical;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .editor-textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .editor-textarea::placeholder {
            color: var(--text-muted);
        }

        .code-output {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
        }

        /* 버튼 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }

        .btn-success {
            background: var(--gradient-success);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-danger {
            background: var(--error-light);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: var(--error);
            color: white;
        }

        /* 실시간 변환 토글 */
        .realtime-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .realtime-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            cursor: pointer;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--border-color);
            border-radius: 12px;
            transition: all 0.3s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: var(--accent);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(20px);
        }

        /* 액션 버튼 그룹 */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-convert {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: var(--radius-md);
        }

        .btn-convert.encode {
            background: var(--gradient-encode);
            color: white;
        }

        .btn-convert.decode {
            background: var(--gradient-decode);
            color: white;
        }

        .btn-convert:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* 에러 메시지 */
        .error-bar {
            display: none;
            padding: 12px 16px;
            background: var(--error-light);
            border: 1px solid var(--error);
            border-radius: var(--radius-sm);
            color: var(--error);
            font-size: 13px;
            margin-bottom: 16px;
        }

        .error-bar.show {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 공유 버튼 */
        .share-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* 푸터 */
        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 반응형 640px */
        @media (max-width: 640px) {
            .container {
                padding: 16px 12px 32px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .card {
                padding: 20px 16px;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .card-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .mode-btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .editor-textarea {
                min-height: 150px;
                font-size: 13px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn-convert {
                width: 100%;
            }

            .share-buttons {
                flex-direction: column;
            }

            .share-buttons .btn {
                width: 100%;
            }

            .realtime-toggle {
                flex-wrap: wrap;
            }
        }
    
        /* mobile-ios-zoom-fix */
        @media (max-width: 640px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="container">
        <header>
            <span class="badge">인코딩 도구</span>
            <h1>Base64 인코더/디코더</h1>
            <p class="subtitle">텍스트를 Base64로 인코딩하거나 Base64를 텍스트로 디코딩하세요.<br>UTF-8 한글을 완벽하게 지원합니다.</p>
        </header>

        <!-- 모드 토글 -->
        <div class="mode-toggle">
            <div class="mode-toggle-group">
                <button class="mode-btn active-encode" id="btnEncode" onclick="setMode('encode')">인코딩</button>
                <button class="mode-btn" id="btnDecode" onclick="setMode('decode')">디코딩</button>
            </div>
        </div>

        <!-- 실시간 변환 토글 -->
        <div class="realtime-toggle">
            <label class="toggle-switch">
                <input type="checkbox" id="realtimeToggle" checked onchange="toggleRealtime()">
                <span class="toggle-slider"></span>
            </label>
            <span class="realtime-label">실시간 변환</span>
            <span style="font-size: 12px; color: var(--text-muted); margin-left: auto;">입력 시 자동으로 변환됩니다</span>
        </div>

        <!-- 에러 바 -->
        <div class="error-bar" id="errorBar">
            <span>&#9888;</span>
            <span id="errorMessage"></span>
        </div>

        <!-- 입력 카드 -->
        <div class="card" id="inputCard">
            <div class="card-header">
                <div class="card-header-left">
                    <div class="card-icon" id="inputIcon">Aa</div>
                    <div class="card-title" id="inputTitle">텍스트 입력</div>
                </div>
                <div class="card-actions">
                    <span class="char-count" id="inputCount">0자 / 0 bytes</span>
                    <button class="btn btn-sm btn-secondary" onclick="copyInput()" title="입력 복사">복사</button>
                    <button class="btn btn-sm btn-danger" onclick="clearInput()" title="입력 지우기">지우기</button>
                </div>
            </div>
            <div class="textarea-wrapper">
                <textarea
                    class="editor-textarea"
                    id="inputArea"
                    placeholder="인코딩할 텍스트를 입력하세요..."
                    oninput="onInputChange()"
                ></textarea>
            </div>
        </div>

        <!-- 변환 버튼 -->
        <div class="action-buttons">
            <button class="btn btn-convert encode" id="convertBtn" onclick="convert()">
                <span id="convertIcon">&#9660;</span> <span id="convertText">Base64로 인코딩</span>
            </button>
        </div>

        <!-- 출력 카드 -->
        <div class="card" id="outputCard">
            <div class="card-header">
                <div class="card-header-left">
                    <div class="card-icon" id="outputIcon">B64</div>
                    <div class="card-title" id="outputTitle">Base64 출력</div>
                </div>
                <div class="card-actions">
                    <span class="char-count" id="outputCount">0자 / 0 bytes</span>
                    <button class="btn btn-sm btn-success" onclick="copyOutput()" title="출력 복사">복사</button>
                    <button class="btn btn-sm btn-danger" onclick="clearOutput()" title="출력 지우기">지우기</button>
                </div>
            </div>
            <div class="textarea-wrapper">
                <textarea
                    class="editor-textarea code-output"
                    id="outputArea"
                    placeholder="변환 결과가 여기에 표시됩니다..."
                    readonly
                ></textarea>
            </div>
        </div>

        <!-- 공유 버튼 -->
        <div class="share-buttons">
            <button class="btn btn-secondary" onclick="swapInputOutput()">
                <span>&#8645;</span> 입출력 교체
            </button>
            <button class="btn btn-secondary" onclick="shareKakao()">
                <span>&#128172;</span> 카카오톡 공유
            </button>
        </div>

        <footer>
            <p>&copy; 2025 <a href="https://braindetox.kr">BrainDetox</a>. All rights reserved.</p>
            <p style="margin-top: 8px;">모든 처리는 브라우저에서 이루어지며 서버로 전송되지 않습니다.</p>
        </footer>
    </div>

    <!-- 토스트 -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== 상태 관리 ==========
        const state = {
            mode: 'encode',     // 'encode' | 'decode'
            realtime: true
        };

        // ========== 카카오 SDK 초기화 ==========
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }
        });

        // ========== 모드 전환 ==========
        function setMode(mode) {
            state.mode = mode;
            const btnEncode = document.getElementById('btnEncode');
            const btnDecode = document.getElementById('btnDecode');
            const inputTitle = document.getElementById('inputTitle');
            const outputTitle = document.getElementById('outputTitle');
            const inputIcon = document.getElementById('inputIcon');
            const outputIcon = document.getElementById('outputIcon');
            const inputArea = document.getElementById('inputArea');
            const convertBtn = document.getElementById('convertBtn');
            const convertText = document.getElementById('convertText');

            if (mode === 'encode') {
                btnEncode.className = 'mode-btn active-encode';
                btnDecode.className = 'mode-btn';
                inputTitle.textContent = '텍스트 입력';
                outputTitle.textContent = 'Base64 출력';
                inputIcon.textContent = 'Aa';
                outputIcon.textContent = 'B64';
                inputArea.placeholder = '인코딩할 텍스트를 입력하세요...';
                convertBtn.className = 'btn btn-convert encode';
                convertText.textContent = 'Base64로 인코딩';
            } else {
                btnEncode.className = 'mode-btn';
                btnDecode.className = 'mode-btn active-decode';
                inputTitle.textContent = 'Base64 입력';
                outputTitle.textContent = '텍스트 출력';
                inputIcon.textContent = 'B64';
                outputIcon.textContent = 'Aa';
                inputArea.placeholder = '디코딩할 Base64 문자열을 입력하세요...';
                convertBtn.className = 'btn btn-convert decode';
                convertText.textContent = '텍스트로 디코딩';
            }

            // 에러 초기화
            hideError();

            // 실시간 모드면 즉시 변환
            if (state.realtime && inputArea.value.trim()) {
                convert();
            }
        }

        // ========== 실시간 변환 토글 ==========
        function toggleRealtime() {
            state.realtime = document.getElementById('realtimeToggle').checked;
            if (state.realtime && document.getElementById('inputArea').value.trim()) {
                convert();
            }
        }

        // ========== 입력 변경 이벤트 ==========
        function onInputChange() {
            updateInputCount();
            hideError();

            if (state.realtime) {
                convert();
            }
        }

        // ========== Base64 인코딩 (UTF-8 한글 지원) ==========
        function utf8Encode(str) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(str);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        // ========== Base64 디코딩 (UTF-8 한글 지원) ==========
        function utf8Decode(base64Str) {
            const binary = atob(base64Str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

        // ========== 변환 실행 ==========
        function convert() {
            const input = document.getElementById('inputArea').value;
            const outputArea = document.getElementById('outputArea');

            if (!input) {
                outputArea.value = '';
                updateOutputCount();
                hideError();
                return;
            }

            try {
                let result;
                if (state.mode === 'encode') {
                    result = utf8Encode(input);
                } else {
                    // Base64 유효성 체크
                    const cleanInput = input.replace(/\s/g, '');
                    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(cleanInput)) {
                        showError('유효하지 않은 Base64 문자열입니다. Base64는 A-Z, a-z, 0-9, +, /, = 문자만 포함할 수 있습니다.');
                        outputArea.value = '';
                        updateOutputCount();
                        return;
                    }
                    result = utf8Decode(cleanInput);
                }

                outputArea.value = result;
                hideError();
                updateOutputCount();
            } catch (e) {
                if (state.mode === 'decode') {
                    showError('디코딩 실패: 올바른 Base64 문자열인지 확인하세요.');
                } else {
                    showError('인코딩 실패: ' + e.message);
                }
                outputArea.value = '';
                updateOutputCount();
            }
        }

        // ========== 글자 수 업데이트 ==========
        function updateInputCount() {
            const input = document.getElementById('inputArea').value;
            const chars = input.length;
            const bytes = new Blob([input]).size;
            document.getElementById('inputCount').textContent = chars.toLocaleString() + '자 / ' + formatBytes(bytes);
        }

        function updateOutputCount() {
            const output = document.getElementById('outputArea').value;
            const chars = output.length;
            const bytes = new Blob([output]).size;
            document.getElementById('outputCount').textContent = chars.toLocaleString() + '자 / ' + formatBytes(bytes);
        }

        // ========== 에러 표시 ==========
        function showError(message) {
            const errorBar = document.getElementById('errorBar');
            document.getElementById('errorMessage').textContent = message;
            errorBar.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorBar').classList.remove('show');
        }

        // ========== 복사 ==========
        function copyInput() {
            copyToClipboard(document.getElementById('inputArea').value, '입력 내용이 복사되었습니다.');
        }

        function copyOutput() {
            copyToClipboard(document.getElementById('outputArea').value, '출력 결과가 복사되었습니다.');
        }

        function copyToClipboard(text, successMessage) {
            if (!text) {
                showToast('복사할 내용이 없습니다.');
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(successMessage);
                }).catch(() => {
                    fallbackCopy(text, successMessage);
                });
            } else {
                fallbackCopy(text, successMessage);
            }
        }

        function fallbackCopy(text, successMessage) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMessage);
            } catch (err) {
                showToast('복사에 실패했습니다.');
            }
            document.body.removeChild(textarea);
        }

        // ========== 지우기 ==========
        function clearInput() {
            document.getElementById('inputArea').value = '';
            updateInputCount();
            hideError();
            if (state.realtime) {
                document.getElementById('outputArea').value = '';
                updateOutputCount();
            }
            showToast('입력이 초기화되었습니다.');
        }

        function clearOutput() {
            document.getElementById('outputArea').value = '';
            updateOutputCount();
            showToast('출력이 초기화되었습니다.');
        }

        // ========== 입출력 교체 ==========
        function swapInputOutput() {
            const inputArea = document.getElementById('inputArea');
            const outputArea = document.getElementById('outputArea');
            const currentOutput = outputArea.value;

            if (!currentOutput) {
                showToast('교체할 출력 내용이 없습니다.');
                return;
            }

            inputArea.value = currentOutput;
            outputArea.value = '';
            updateInputCount();
            updateOutputCount();
            hideError();

            // 모드 전환
            if (state.mode === 'encode') {
                setMode('decode');
            } else {
                setMode('encode');
            }

            // 실시간 변환이면 자동 변환
            if (state.realtime) {
                convert();
            }

            showToast('입출력이 교체되었습니다.');
        }

        // ========== 카카오톡 공유 ==========
        function shareKakao() {
            if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
                showToast('카카오톡 공유를 준비 중입니다.');
                return;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: 'Base64 인코더/디코더 - 온라인 인코딩 변환 도구',
                    description: '텍스트를 Base64로 인코딩하거나 Base64를 텍스트로 디코딩하세요. UTF-8 한글 완벽 지원!',
                    imageUrl: 'https://braindetox.kr/site_logo.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/static/base64_encoder.html',
                        webUrl: 'https://braindetox.kr/static/base64_encoder.html'
                    }
                },
                buttons: [
                    {
                        title: 'Base64 변환하기',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/static/base64_encoder.html',
                            webUrl: 'https://braindetox.kr/static/base64_encoder.html'
                        }
                    }
                ]
            });
        }

        // ========== 유틸리티 함수 ==========
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 bytes';
            const k = 1024;
            const sizes = ['bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // ========== 초기화 ==========
        document.addEventListener('DOMContentLoaded', function() {
            updateInputCount();
            updateOutputCount();
        });
    </script>
</body>
</html>
