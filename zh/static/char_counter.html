    <!-- Kakao SDK -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.5.0/kakao.min.js" defer></script>

    <script>
        // ========================================
        // State
        // ========================================
        let includeSpaces = true;
        let stats = {
            chars: 0,
            charsNoSpace: 0,
            bytes: 0,
            words: 0,
            sentences: 0,
            lines: 0,
            readTime: 0
        };

        // ========================================
        // Stats Calculation
        // ========================================
        function updateStats() {
            const text = document.getElementById('text-input').value;

            // Character counts
            stats.chars = text.length;
            stats.charsNoSpace = text.replace(/\s/g, '').length;

            // Byte count (UTF-8)
            stats.bytes = new Blob([text]).size;

            // Word count (Korean and English)
            const koreanWords = (text.match(/[가-힣]+/g) || []).length;
            const englishWords = (text.match(/[a-zA-Z]+/g) || []).length;
            stats.words = koreanWords + englishWords;

            // Sentence count
            stats.sentences = (text.match(/[.!?。！？]+/g) || []).length || (text.trim() ? 1 : 0);

            // Line count
            stats.lines = text ? text.split('\n').length : 0;

            // Reading time (average 500 chars/min for Korean, 200 words/min for English)
            const avgCharsPerMin = 500;
            stats.readTime = Math.ceil(stats.chars / avgCharsPerMin);

            renderStats();
        }

        function renderStats() {
            const displayChars = includeSpaces ? stats.chars : stats.charsNoSpace;
            document.getElementById('char-count').textContent = displayChars.toLocaleString();
            document.getElementById('char-no-space').textContent = stats.charsNoSpace.toLocaleString();
            document.getElementById('byte-count').textContent = formatBytes(stats.bytes);
            document.getElementById('word-count').textContent = stats.words.toLocaleString();
            document.getElementById('sentence-count').textContent = stats.sentences.toLocaleString();
            document.getElementById('line-count').textContent = stats.lines.toLocaleString();
            document.getElementById('read-time').textContent = stats.readTime < 1 ? '不到 1' : stats.readTime;
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return bytes;
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'K';
            return (bytes / (1024 * 1024)).toFixed(1) + 'M';
        }

        function setOption(option) {
            includeSpaces = option === 'with';
            document.getElementById('with-space').classList.toggle('active', includeSpaces);
            document.getElementById('without-space').classList.toggle('active', !includeSpaces);
            renderStats();
            vibrate();
        }

        // ========================================
        // Text Actions
        // ========================================
        function clearText() {
            document.getElementById('text-input').value = '';
            updateStats();
            showToast('文本已清除');
            vibrate();
        }

        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                const input = document.getElementById('text-input');
                input.value = text;
                updateStats();
                showToast('粘贴完成');
            } catch (err) {
                showToast('需要剪贴板访问权限');
            }
            vibrate();
        }

        function copyText() {
            const text = document.getElementById('text-input').value;
            if (!text) {
                showToast('没有可复制的文本');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showToast('文本已复制');
            }).catch(() => {
                showToast('复制失败');
            });
            vibrate();
        }

        // ========================================
        // Share Functions
        // ========================================
        function shareKakao() {
            if (!window.Kakao) {
                showToast('KakaoTalk SDK 加载失败');
                return;
            }

            if (!Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: '字数统计',
                    description: `字符数 ${stats.chars.toLocaleString()} 字 | 单词数 ${stats.words.toLocaleString()} 个 | 字节 ${formatBytes(stats.bytes)}`,
                    imageUrl: 'https://braindetox.kr/static/images/char_counter_og.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/zh/static/char_counter.html',
                        webUrl: 'https://braindetox.kr/zh/static/char_counter.html'
                    }
                },
                buttons: [
                    {
                        title: '字数统计',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/zh/static/char_counter.html',
                            webUrl: 'https://braindetox.kr/zh/static/char_counter.html'
                        }
                    }
                ]
            });
        }

        // ========================================
        // Utilities
        // ========================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function vibrate() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        // ========================================
        // Install Banner
        // ========================================
        function showInstallBanner() {
            if (localStorage.getItem('char_installDismissed') === 'forever') return;
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            if (sessionStorage.getItem('char_installDismissed')) return;

            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);

            if (isIOS) {
                document.getElementById('ios-steps').style.display = 'block';
            } else if (isAndroid) {
                document.getElementById('android-steps').style.display = 'block';
            } else {
                document.getElementById('desktop-steps').style.display = 'block';
            }

            setTimeout(() => {
                document.getElementById('install-banner').classList.add('show');
            }, 5000);
        }

        function closeInstallBanner() {
            document.getElementById('install-banner').classList.remove('show');
            sessionStorage.setItem('char_installDismissed', 'true');
        }

        function closeInstallBannerForever() {
            document.getElementById('install-banner').classList.remove('show');
            localStorage.setItem('char_installDismissed', 'forever');
            showToast('将不再显示');
        }

        // ========================================
        // Initialize
        // ========================================
        function init() {
            updateStats();

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/static/char_counter_sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            }

            showInstallBanner();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
