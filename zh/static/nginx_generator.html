<body>
    <div class="bg-pattern"></div>
    <div class="container">
        <header>
            <span class="badge">Web Server</span>
            <h1>Nginx 配置生成器</h1>
            <p class="subtitle">轻松生成Web服务器配置<br>适合初学者到专家</p>
        </header>

        <div class="mode-toggle">
            <button class="mode-btn active" data-mode="basic">基本模式</button>
            <button class="mode-btn" data-mode="advanced">高级模式</button>
        </div>

        <div id="basicMode">
            <div class="card">
                <div class="card-header"><div class="card-icon">⚙️</div><span class="card-title">基本设置</span></div>
                <div class="input-group"><label class="input-label">服务器名称（域名）</label><div class="input-wrapper"><input type="text" id="serverName" placeholder="example.com www.example.com"></div></div>
                <div class="input-row">
                    <div class="input-group" style="flex:1"><label class="input-label">根目录</label><div class="input-wrapper"><input type="text" id="rootPath" value="/var/www/html"></div></div>
                    <div class="input-group" style="flex:1"><label class="input-label">端口</label><div class="input-wrapper"><select id="listenPort"><option value="80">HTTP (80)</option><option value="443">HTTPS (443)</option><option value="both">HTTP + HTTPS</option></select></div></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><div class="card-icon">📋</div><span class="card-title">预设模板（点击选择）</span></div>
                <div class="preset-grid">
                    <button class="preset-btn" data-preset="static"><span class="preset-icon">📁</span>Static Site<span class="preset-desc">静态网站</span></button>
                    <button class="preset-btn" data-preset="spa"><span class="preset-icon">⚛️</span>SPA<span class="preset-desc">React/Vue/Angular</span></button>
                    <button class="preset-btn" data-preset="wordpress"><span class="preset-icon">📝</span>WordPress<span class="preset-desc">PHP-FPM</span></button>
                    <button class="preset-btn" data-preset="php"><span class="preset-icon">🐘</span>PHP-FPM<span class="preset-desc">PHP应用</span></button>
                    <button class="preset-btn" data-preset="nodejs"><span class="preset-icon">🟢</span>Node.js<span class="preset-desc">反向代理</span></button>
                    <button class="preset-btn" data-preset="python"><span class="preset-icon">🐍</span>Django/Flask<span class="preset-desc">Python应用</span></button>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><div class="card-icon">⚡</div><span class="card-title">快速选项</span></div>
                <div class="checkbox-group">
                    <div class="checkbox-item"><input type="checkbox" id="enableSSL"><label for="enableSSL">启用SSL/TLS（Let's Encrypt）</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="forceHTTPS"><label for="forceHTTPS">强制HTTPS重定向</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="wwwRedirect"><label for="wwwRedirect">www重定向</label></div>
                </div>
                <div class="checkbox-group">
                    <div class="checkbox-item"><input type="checkbox" id="enableGzip" checked><label for="enableGzip">gzip压缩</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="securityHeaders" checked><label for="securityHeaders">安全头</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="enableCaching"><label for="enableCaching">静态文件缓存</label></div>
                </div>
            </div>
        </div>

        <div id="advancedMode" class="hidden">
            <div class="card">
                <div class="card-header"><div class="card-icon">🖥️</div><span class="card-title">Server块设置</span></div>
                <div class="input-group"><label class="input-label">server_name</label><div class="input-wrapper"><input type="text" id="advServerName" placeholder="example.com"></div></div>
                <div class="input-row">
                    <div class="input-group" style="flex:1"><label class="input-label">listen</label><div class="input-wrapper"><input type="text" id="advListen" value="80"></div></div>
                    <div class="input-group" style="flex:1"><label class="input-label">root</label><div class="input-wrapper"><input type="text" id="advRoot" value="/var/www/html"></div></div>
                </div>
            </div>
        </div>

        <div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7911569280980377" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins></div>

        <div class="card"><div style="display:flex;gap:10px"><button class="btn btn-outline" id="resetConfig">重置</button><button class="btn btn-success" id="generateConfig" style="flex:2">生成配置</button></div></div>

        <div class="card" id="resultCard" style="display:none">
            <div class="card-header"><div class="card-icon">📄</div><span class="card-title">生成的Nginx配置</span></div>
            <div class="result-area"><pre id="generatedConfig"></pre></div>
            <div class="share-group">
                <button class="share-btn" id="copyConfig">📋 复制配置</button>
                <button class="share-btn" id="downloadConfig">💾 下载文件</button>
                <button class="share-btn kakao" id="shareKakao">💬 分享到KakaoTalk</button>
            </div>
        </div>

        <footer><p>&copy; 2025 <a href="https://braindetox.kr">BrainDetox</a>. All rights reserved.</p><p style="margin-top:8px">本工具仅供参考。在生产环境应用前请进行充分测试。</p></footer>
    </div>

    <script>
        const state = { mode: 'basic', preset: null, lastConfig: '' };
        const presets = {
            static: { name: '静态网站', index: 'index.html index.htm', locations: [{ pattern: '/', type: 'static' }] },
            spa: { name: 'SPA', index: 'index.html', locations: [{ pattern: '/', type: 'spa' }] },
            wordpress: { name: 'WordPress', index: 'index.php index.html', locations: [{ pattern: '/', type: 'wordpress' }, { pattern: '~ \\.php$', type: 'php' }] },
            php: { name: 'PHP-FPM', index: 'index.php index.html', locations: [{ pattern: '/', type: 'static' }, { pattern: '~ \\.php$', type: 'php' }] },
            nodejs: { name: 'Node.js', index: '', proxyUrl: 'http://127.0.0.1:3000', locations: [{ pattern: '/', type: 'proxy' }] },
            python: { name: 'Django/Flask', index: '', proxyUrl: 'http://127.0.0.1:8000', locations: [{ pattern: '/static/', type: 'alias', path: '/var/www/app/static/' }, { pattern: '/', type: 'proxy' }] }
        };

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.mode = btn.dataset.mode;
                document.getElementById('basicMode').classList.toggle('hidden', state.mode !== 'basic');
                document.getElementById('advancedMode').classList.toggle('hidden', state.mode !== 'advanced');
            });
        });

        document.querySelectorAll('.preset-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); state.preset = btn.dataset.preset; }); });

        document.getElementById('generateConfig').addEventListener('click', generateConfig);

        function generateConfig() {
            const serverName = document.getElementById('serverName').value.trim() || 'example.com';
            const rootPath = document.getElementById('rootPath').value.trim() || '/var/www/html';
            const listenPort = document.getElementById('listenPort').value;
            const preset = state.preset ? presets[state.preset] : null;
            const enableSSL = document.getElementById('enableSSL').checked;
            const forceHTTPS = document.getElementById('forceHTTPS').checked;
            const enableGzip = document.getElementById('enableGzip').checked;
            const securityHeaders = document.getElementById('securityHeaders').checked;
            const enableCaching = document.getElementById('enableCaching').checked;

            let config = `# Nginx配置文件\n# Generated by BrainDetox Nginx Generator\n# https://braindetox.kr/zh/static/nginx_generator.html\n# 生成时间: ${new Date().toLocaleString('zh-CN')}\n\n`;

            if (enableSSL && forceHTTPS) config += `# HTTP到HTTPS重定向\nserver {\n    listen 80;\n    listen [::]:80;\n    server_name ${serverName};\n    return 301 https://$host$request_uri;\n}\n\n`;

            config += `server {\n`;
            if (listenPort === 'both' || listenPort === '80') { if (!enableSSL || !forceHTTPS) config += `    listen 80;\n    listen [::]:80;\n`; }
            if (listenPort === 'both' || listenPort === '443' || enableSSL) config += `    listen 443 ssl http2;\n    listen [::]:443 ssl http2;\n`;
            config += `\n    server_name ${serverName};\n    root ${rootPath};\n`;
            if (preset?.index) config += `    index ${preset.index};\n`;

            if (enableSSL) { const domain = serverName.split(' ')[0]; config += `\n    # SSL配置\n    ssl_certificate /etc/letsencrypt/live/${domain}/fullchain.pem;\n    ssl_certificate_key /etc/letsencrypt/live/${domain}/privkey.pem;\n    ssl_protocols TLSv1.2 TLSv1.3;\n`; }
            if (securityHeaders) { config += `\n    # 安全头\n    add_header X-Frame-Options "SAMEORIGIN" always;\n    add_header X-Content-Type-Options "nosniff" always;\n`; if (enableSSL) config += `    add_header Strict-Transport-Security "max-age=31536000" always;\n`; }
            if (enableGzip) config += `\n    # gzip压缩\n    gzip on;\n    gzip_vary on;\n    gzip_types text/plain text/css application/json application/javascript;\n`;

            config += `\n`;
            if (preset) preset.locations.forEach(loc => { config += generateLocationBlock(loc, preset); });
            else config += `    location / {\n        try_files $uri $uri/ =404;\n    }\n`;
            if (enableCaching) config += `\n    # 静态文件缓存\n    location ~* \\.(jpg|jpeg|png|gif|ico|css|js|woff2)$ {\n        expires 30d;\n        add_header Cache-Control "public, immutable";\n    }\n`;
            config += `\n    location ~ /\\. {\n        deny all;\n    }\n}\n`;

            state.lastConfig = config;
            document.getElementById('generatedConfig').textContent = config;
            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
        }

        function generateLocationBlock(loc, preset) {
            switch (loc.type) {
                case 'static': return `    location ${loc.pattern} {\n        try_files $uri $uri/ =404;\n    }\n\n`;
                case 'spa': return `    location ${loc.pattern} {\n        try_files $uri $uri/ /index.html;\n    }\n\n`;
                case 'wordpress': return `    location ${loc.pattern} {\n        try_files $uri $uri/ /index.php?$args;\n    }\n\n`;
                case 'php': return `    location ${loc.pattern} {\n        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;\n        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;\n        include fastcgi_params;\n    }\n\n`;
                case 'proxy': return `    location ${loc.pattern} {\n        proxy_pass ${preset?.proxyUrl || 'http://127.0.0.1:3000'};\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection 'upgrade';\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n    }\n\n`;
                case 'alias': return `    location ${loc.pattern} {\n        alias ${loc.path};\n    }\n\n`;
                default: return '';
            }
        }

        document.getElementById('resetConfig').addEventListener('click', () => { if (confirm('确定要重置配置吗？')) location.reload(); });
        document.getElementById('copyConfig').addEventListener('click', () => { navigator.clipboard.writeText(state.lastConfig).then(() => { const btn = document.getElementById('copyConfig'); const o = btn.innerHTML; btn.innerHTML = '✓ 已复制'; setTimeout(() => btn.innerHTML = o, 2000); }); });
        document.getElementById('downloadConfig').addEventListener('click', () => { const d = (document.getElementById('serverName').value.trim() || 'example.com').split(' ')[0].replace(/\./g,'_'); const b = new Blob([state.lastConfig],{type:'text/plain'}); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = `${d}.conf`; a.click(); URL.revokeObjectURL(u); });
        document.getElementById('shareKakao').addEventListener('click', () => { if (!window.Kakao) return; if (!window.Kakao.isInitialized()) window.Kakao.init('e06d0ee93e450a11bc6451d46e09cd88'); try { Kakao.Share.sendDefault({ objectType:'feed', content:{title:'Nginx 配置生成器',description:'轻松生成Nginx Web服务器配置！',imageUrl:'https://braindetox.kr/site_logo.png',link:{mobileWebUrl:'https://braindetox.kr/zh/static/nginx_generator.html',webUrl:'https://braindetox.kr/zh/static/nginx_generator.html'}}, buttons:[{title:'立即使用',link:{mobileWebUrl:'https://braindetox.kr/zh/static/nginx_generator.html',webUrl:'https://braindetox.kr/zh/static/nginx_generator.html'}}] }); } catch(e){} });
        document.addEventListener('DOMContentLoaded', () => { try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e){} });
    </script>
