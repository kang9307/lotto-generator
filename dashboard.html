<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브레인디톡스(BrainDetox) - 실시간 프로젝트 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7911569280980377"
         crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1f36 0%, #2d3561 50%, #1a1f36 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(30, 41, 75, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px 24px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .header h1 {
            font-size: 2.2em;
            font-weight: 600;
            margin-bottom: 12px;
            color: #f1f5f9;
            letter-spacing: -0.025em;
        }
        
        .update-time {
            font-size: 0.875em;
            color: #94a3b8;
            margin-bottom: 16px;
            font-weight: 400;
        }
        
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(34, 197, 94, 0.2);
            font-size: 0.875em;
            font-weight: 500;
        }
        
        .live-dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: rgba(30, 41, 75, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        
        .stat-card:hover::before {
            opacity: 1;
        }
        
        .stat-number {
            font-size: 2.25em;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f1f5f9;
            line-height: 1;
        }
        
        .stat-label {
            font-size: 0.875em;
            color: #94a3b8;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }
        
        .chart-card {
            background: rgba(30, 41, 75, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            height: 320px; /* 고정 높이 */
        }
        
        .chart-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: 600;
            color: #f1f5f9;
            letter-spacing: -0.025em;
        }
        
        .chart-container {
            height: 240px; /* 차트 컨테이너 고정 높이 */
            position: relative;
        }
        

        
        .posts-section {
            background: rgba(30, 41, 75, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }
        
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        
        .post-card {
            background: rgba(51, 65, 85, 0.4);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: all 0.3s ease;
        }
        
        .post-card:hover {
            background: rgba(51, 65, 85, 0.6);
            transform: translateY(-2px);
        }
        
        .post-title {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 0.9em;
            line-height: 1.4;
            color: #f1f5f9;
        }
        
        .post-meta {
            font-size: 0.8em;
            color: #94a3b8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .post-category {
            display: inline-flex;
            align-items: center;
            background: rgba(99, 102, 241, 0.2);
            color: #c7d2fe;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 500;
            margin-top: 8px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .featured-badge {
            background: rgba(245, 158, 11, 0.2);
            color: #fde68a;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .featured-star {
            font-size: 0.75em;
            color: #fbbf24;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        @media (max-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }
        }
        
        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.8em;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .stat-card {
                padding: 16px;
            }
            .stat-number {
                font-size: 1.8em;
            }
            .stat-label {
                font-size: 0.75em;
            }
            .chart-card {
                height: 280px;
            }
            .chart-container {
                height: 200px;
            }
        }
        
        /* 스크롤바 스타일링 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 75, 0.3);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 브레인디톡스 (BrainDetox)</h1>
            <div class="update-time">마지막 업데이트: <span id="lastUpdate"></span></div>
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span>실시간 모니터링</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalFiles">-</div>
                <div class="stat-label">총 파일 수</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalPosts">-</div>
                <div class="stat-label">총 포스트 수</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="featuredPosts">-</div>
                <div class="stat-label">추천 포스트</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="categories">-</div>
                <div class="stat-label">카테고리 수</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalKeywords">-</div>
                <div class="stat-label">총 키워드 수</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgTitleLength">-</div>
                <div class="stat-label">평균 제목 길이</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">📊 카테고리별 포스트 분포</div>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">📅 월별 작성 트렌드 (2025년)</div>
                <div class="chart-container">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">🏷️ 인기 키워드 TOP 10</div>
                <div class="chart-container">
                    <canvas id="keywordChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">📁 파일 타입 분포</div>
                <div class="chart-container">
                    <canvas id="fileTypeChart"></canvas>
                </div>
            </div>
        </div>

        <div class="posts-section">
            <div class="chart-title">📝 최신 포스트 (실시간)</div>
            <div class="posts-grid" id="recentPosts">
                <!-- 포스트들이 여기에 동적으로 로드됩니다 -->
            </div>
        </div>
    </div>

    <script>
        // 전역 변수
        let postsData = null;
        let categoryChart = null;
        let fileTypeChart = null;
        let monthlyChart = null;
        let keywordChart = null;

        // 실시간 업데이트 함수
        function updateLastUpdateTime() {
            const now = new Date();
            const timeString = now.toLocaleString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            document.getElementById('lastUpdate').textContent = timeString;
        }

        // 키워드 분석 함수
        function analyzeKeywords(posts) {
            const keywordCount = {};
            posts.forEach(post => {
                if (post.keywords) {
                    const keywords = post.keywords.split(',').map(k => k.trim());
                    keywords.forEach(keyword => {
                        if (keyword && keyword.length > 1) {
                            keywordCount[keyword] = (keywordCount[keyword] || 0) + 1;
                        }
                    });
                }
            });
            
            return Object.entries(keywordCount)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 10);
        }

        // 월별 트렌드 분석 함수
        function analyzeMonthlyTrend(posts) {
            const monthlyCount = {};
            posts.forEach(post => {
                const date = new Date(post.date);
                if (date.getFullYear() === 2025) {
                    const month = date.getMonth() + 1;
                    monthlyCount[month] = (monthlyCount[month] || 0) + 1;
                }
            });
            
            return monthlyCount;
        }

        // 제목 길이 분석 함수
        function analyzeTitleLength(posts) {
            const lengths = posts.map(post => post.title.length);
            const avgLength = lengths.reduce((a, b) => a + b, 0) / lengths.length;
            return Math.round(avgLength);
        }

        // 총 키워드 수 계산 함수
        function getTotalKeywordCount(posts) {
            const uniqueKeywords = new Set();
            posts.forEach(post => {
                if (post.keywords) {
                    const keywords = post.keywords.split(',').map(k => k.trim());
                    keywords.forEach(keyword => {
                        if (keyword && keyword.length > 1) {
                            uniqueKeywords.add(keyword);
                        }
                    });
                }
            });
            return uniqueKeywords.size;
        }

        // 포스트 데이터 로드
        async function loadPostsData() {
            try {
                const response = await fetch('./posts/index.json?t=' + Date.now());
                postsData = await response.json();
                updateStatistics();
                updateCharts();
                updateRecentPosts();
            } catch (error) {
                console.error('포스트 데이터 로드 실패:', error);
                // 오류 시 기본 통계 표시
                updateBasicStats();
            }
        }

        // 통계 업데이트
        function updateStatistics() {
            if (!postsData) return;

            // 기본 통계
            document.getElementById('totalFiles').textContent = '57';
            document.getElementById('totalPosts').textContent = postsData.totalFiles || postsData.posts.length;

            // 추천 포스트 계산
            const featuredCount = postsData.posts.filter(post => post.featured).length;
            document.getElementById('featuredPosts').textContent = featuredCount;

            // 카테고리 수 계산
            const categories = [...new Set(postsData.posts.map(post => post.category))];
            document.getElementById('categories').textContent = categories.length;

            // 새로운 분석 데이터
            const totalKeywords = getTotalKeywordCount(postsData.posts);
            document.getElementById('totalKeywords').textContent = totalKeywords;

            const avgTitleLength = analyzeTitleLength(postsData.posts);
            document.getElementById('avgTitleLength').textContent = avgTitleLength + '자';
        }

        // 기본 통계 (포스트 데이터 없을 때)
        function updateBasicStats() {
            document.getElementById('totalFiles').textContent = '57';
            document.getElementById('totalPosts').textContent = '65';
            document.getElementById('featuredPosts').textContent = '12';
            document.getElementById('categories').textContent = '7';
            document.getElementById('totalKeywords').textContent = '120';
            document.getElementById('avgTitleLength').textContent = '45자';
        }

        // 차트 업데이트
        function updateCharts() {
            if (!postsData) return;

            // 카테고리별 분포
            const categoryCount = {};
            postsData.posts.forEach(post => {
                categoryCount[post.category] = (categoryCount[post.category] || 0) + 1;
            });

            // 분석 데이터
            const topKeywords = analyzeKeywords(postsData.posts);
            const monthlyTrend = analyzeMonthlyTrend(postsData.posts);

            updateCategoryChart(categoryCount);
            updateMonthlyChart(monthlyTrend);
            updateKeywordChart(topKeywords);
            updateFileTypeChart();
        }

        // 카테고리 차트 업데이트
        function updateCategoryChart(categoryCount) {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            
            if (categoryChart) {
                categoryChart.destroy();
            }

            const colors = [
                '#60a5fa', '#a78bfa', '#f472b6', '#06d6a0',
                '#fbbf24', '#f87171', '#34d399', '#a1a1aa'
            ];

            categoryChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categoryCount),
                    datasets: [{
                        data: Object.values(categoryCount),
                        backgroundColor: colors,
                        borderWidth: 2,
                        borderColor: 'rgba(30, 41, 75, 0.8)',
                        hoverBorderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#e2e8f0',
                                font: { size: 11 },
                                padding: 15,
                                usePointStyle: true
                            }
                        }
                    },
                    elements: {
                        arc: {
                            borderWidth: 2
                        }
                    }
                }
            });
        }

        // 월별 트렌드 차트 업데이트
        function updateMonthlyChart(monthlyTrend) {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            
            if (monthlyChart) {
                monthlyChart.destroy();
            }

            const months = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
            const data = months.map((month, index) => monthlyTrend[index + 1] || 0);

            monthlyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: '포스트 수',
                        data: data,
                        borderColor: '#60a5fa',
                        backgroundColor: 'rgba(96, 165, 250, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#60a5fa',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(148, 163, 184, 0.1)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 11 }
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 11 }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        // 키워드 차트 업데이트
        function updateKeywordChart(topKeywords) {
            const ctx = document.getElementById('keywordChart').getContext('2d');
            
            if (keywordChart) {
                keywordChart.destroy();
            }

            const labels = topKeywords.map(([keyword]) => keyword);
            const data = topKeywords.map(([, count]) => count);

            keywordChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '사용 횟수',
                        data: data,
                        backgroundColor: [
                            '#60a5fa', '#a78bfa', '#f472b6', '#06d6a0', '#fbbf24',
                            '#f87171', '#34d399', '#a1a1aa', '#fb7185', '#38bdf8'
                        ],
                        borderColor: 'rgba(30, 41, 75, 0.8)',
                        borderWidth: 2,
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    scales: {
                        x: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(148, 163, 184, 0.1)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 11 }
                            }
                        },
                        y: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 10 },
                                callback: function(value, index) {
                                    const label = this.getLabelForValue(value);
                                    return label.length > 8 ? label.substring(0, 8) + '...' : label;
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    elements: {
                        bar: {
                            borderRadius: 6
                        }
                    }
                }
            });
        }

        // 파일 타입 차트 업데이트
        function updateFileTypeChart() {
            const ctx = document.getElementById('fileTypeChart').getContext('2d');
            
            if (fileTypeChart) {
                fileTypeChart.destroy();
            }

            fileTypeChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['HTML', 'JS', 'CSS', 'JSON', 'MD', 'TXT'],
                    datasets: [{
                        label: '파일 수',
                        data: [17, 8, 1, 3, 2, 1],
                        backgroundColor: [
                            '#60a5fa', '#a78bfa', '#f472b6', 
                            '#06d6a0', '#fbbf24', '#f87171'
                        ],
                        borderColor: 'rgba(30, 41, 75, 0.8)',
                        borderWidth: 2,
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(148, 163, 184, 0.1)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 11 }
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 11 }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    elements: {
                        bar: {
                            borderRadius: 6
                        }
                    }
                }
            });
        }

        // 최신 포스트 업데이트
        function updateRecentPosts() {
            if (!postsData) return;

            const recentPostsContainer = document.getElementById('recentPosts');
            
            // 날짜 순으로 정렬하여 최신 8개 포스트 가져오기
            const sortedPosts = postsData.posts
                .sort((a, b) => new Date(b.date) - new Date(a.date))
                .slice(0, 8);

            recentPostsContainer.innerHTML = sortedPosts.map(post => `
                <div class="post-card">
                    <div class="post-title">${post.title}</div>
                    <div class="post-meta">📅 ${post.date}</div>
                    <div class="post-category ${post.featured ? 'featured-badge' : ''}">${post.category}</div>
                    ${post.featured ? '<div class="featured-star">⭐ 추천 포스트</div>' : ''}
                </div>
            `).join('');
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            updateLastUpdateTime();
            loadPostsData();

            // 30초마다 데이터 새로고침
            setInterval(() => {
                updateLastUpdateTime();
                loadPostsData();
            }, 30000);

            // 1초마다 시간 업데이트
            setInterval(updateLastUpdateTime, 1000);
        });
    </script>
