                    <div class="btn-group"><button class="btn btn-primary" id="downloadBtn">📥 下载PNG</button></div>
                    <div class="btn-group" style="margin-top: 8px;">
                        <button class="btn btn-secondary" id="copyBtn">📋 复制</button>
                        <button class="btn btn-secondary" id="shareBtn">💬 分享</button>
                    </div>
                </div>
            </div>

            <div class="editor-area">
                <div class="code-input-wrapper">
                    <div class="code-input-header">
                        <span class="code-input-title">📝 代码输入</span>
                        <span class="char-count" id="charCount">0字符</span>
                    </div>
                    <textarea class="code-input" id="codeInput" placeholder="在此粘贴代码...">function greeting(name) {
    const message = `Hello, ${name}!`;
    console.log(message);
    return message;
}

// 调用函数
greeting("World");</textarea>
                </div>

                <div class="preview-wrapper">
                    <div class="preview-header"><span class="preview-title">👁️ 预览</span></div>
                    <div class="preview-container">
                        <div class="code-card" id="codeCard">
                            <div class="code-card-inner theme-dracula" id="codeCardInner">
                                <div class="window-controls" id="windowControls">
                                    <div class="window-dot red"></div>
                                    <div class="window-dot yellow"></div>
                                    <div class="window-dot green"></div>
                                </div>
                                <pre class="code-block line-numbers" id="codeBlock"><code class="language-javascript" id="codeContent"></code></pre>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="ad-container">
                    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7911569280980377" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
                </div>
            </div>
        </div>

        <footer>
            <div class="footer-links">
                <a href="../index.html">首页</a>
                <a href="../static_index.html">工具列表</a>
                <a href="../blog.html">博客</a>
            </div>
            <p>&copy; 2025 <a href="https://braindetox.kr">BrainDetox</a>. All rights reserved.</p>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const gradients = [
            'none',
            'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', 'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)',
            'linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%)', 'linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%)',
            'linear-gradient(135deg, #6366f1 0%, #ec4899 100%)', 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
            'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)', 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            'linear-gradient(135deg, #f472b6 0%, #ec4899 100%)', 'linear-gradient(135deg, #ef4444 0%, #f97316 100%)',
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)', 'linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%)',
            'linear-gradient(135deg, #10b981 0%, #34d399 100%)', 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
            'linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%)', 'linear-gradient(135deg, #ff8c00 0%, #ff6b6b 100%)',
            'linear-gradient(135deg, #fde68a 0%, #fca5a5 100%)', 'linear-gradient(135deg, #fdba74 0%, #f472b6 100%)',
            'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)', 'linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%)',
            'linear-gradient(135deg, #c1dfc4 0%, #deecdd 100%)', 'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)',
            'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)', 'linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%)',
            'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)', 'linear-gradient(135deg, #232526 0%, #414345 100%)',
            'linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%)', 'linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)'
        ];

        let currentGradient = gradients[0], currentTheme = 'dracula', currentLanguage = 'javascript';
        const codeInput = document.getElementById('codeInput'), codeBlock = document.getElementById('codeBlock'),
              codeContent = document.getElementById('codeContent'), codeCard = document.getElementById('codeCard'),
              codeCardInner = document.getElementById('codeCardInner'), windowControls = document.getElementById('windowControls'),
              charCount = document.getElementById('charCount'), languageSelect = document.getElementById('languageSelect'),
              themeSelect = document.getElementById('themeSelect'), paddingSelect = document.getElementById('paddingSelect'),
              fontSizeSelect = document.getElementById('fontSizeSelect'), widthSelect = document.getElementById('widthSelect'),
              showWindowControls = document.getElementById('showWindowControls'),
              showLineNumbers = document.getElementById('showLineNumbers'), gradientGrid = document.getElementById('gradientGrid'),
              downloadBtn = document.getElementById('downloadBtn'), copyBtn = document.getElementById('copyBtn'),
              shareBtn = document.getElementById('shareBtn'), mobileToggle = document.getElementById('mobileToggle'),
              controlPanel = document.getElementById('controlPanel');

        function init() { createGradientButtons(); updatePreview(); updateBackground(); updatePadding(); updateFontSize(); updateWidth(); updateCharCount(); setupEventListeners(); }

        function createGradientButtons() {
            gradientGrid.innerHTML = '';
            gradients.forEach((gradient, index) => {
                const btn = document.createElement('button');
                btn.className = 'gradient-btn' + (index === 0 ? ' active' : '');
                if (gradient === 'none') {
                    btn.style.background = 'repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 50% / 8px 8px';
                    btn.title = '无背景';
                    btn.innerHTML = '<span style="font-size:10px;color:#666;">✕</span>';
                    btn.style.display = 'flex';
                    btn.style.alignItems = 'center';
                    btn.style.justifyContent = 'center';
                } else {
                    btn.style.background = gradient;
                    btn.title = `背景 ${index}`;
                }
                btn.dataset.gradient = gradient;
                gradientGrid.appendChild(btn);
            });
        }

        function setupEventListeners() {
            codeInput.addEventListener('input', () => { updatePreview(); updateCharCount(); });
            languageSelect.addEventListener('change', (e) => { currentLanguage = e.target.value; updatePreview(); });
            themeSelect.addEventListener('change', (e) => { currentTheme = e.target.value; updateTheme(); });
            gradientGrid.addEventListener('click', (e) => {
                const btn = e.target.closest('.gradient-btn');
                if (btn) { document.querySelectorAll('.gradient-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentGradient = btn.dataset.gradient; updateBackground(); }
            });
            paddingSelect.addEventListener('change', updatePadding);
            fontSizeSelect.addEventListener('change', updateFontSize);
            widthSelect.addEventListener('change', updateWidth);
            showWindowControls.addEventListener('change', () => { windowControls.style.display = showWindowControls.checked ? 'flex' : 'none'; });
            showLineNumbers.addEventListener('change', () => { if (showLineNumbers.checked) codeBlock.classList.add('line-numbers'); else codeBlock.classList.remove('line-numbers'); updatePreview(); });
            downloadBtn.addEventListener('click', downloadImage);
            copyBtn.addEventListener('click', copyImage);
            shareBtn.addEventListener('click', shareKakao);
            mobileToggle.addEventListener('click', () => { mobileToggle.classList.toggle('active'); controlPanel.classList.toggle('show'); });
        }

        function updatePreview() { const code = codeInput.value || '// 请输入代码'; codeContent.className = `language-${currentLanguage}`; codeContent.textContent = code; Prism.highlightElement(codeContent); }
        function updateTheme() { codeCardInner.className = `code-card-inner theme-${currentTheme}`; }
        function updateBackground() {
            if (currentGradient === 'none') {
                codeCard.style.background = 'transparent';
                codeCard.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1)';
            } else {
                codeCard.style.background = currentGradient;
                codeCard.style.boxShadow = '0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 12px 24px -8px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1)';
            }
        }
        function updatePadding() { codeCard.style.padding = paddingSelect.value + 'px'; }
        function updateFontSize() { codeBlock.style.fontSize = fontSizeSelect.value + 'px'; }
        function updateWidth() {
            const width = widthSelect.value;
            if (width === 'auto') { codeCard.style.width = 'auto'; codeCard.style.minWidth = '320px'; codeCard.style.maxWidth = '100%'; }
            else if (width === '100%') { codeCard.style.width = '100%'; codeCard.style.minWidth = 'auto'; codeCard.style.maxWidth = 'none'; }
            else { codeCard.style.width = width + 'px'; codeCard.style.minWidth = 'auto'; codeCard.style.maxWidth = '100%'; }
        }
        function updateCharCount() { charCount.textContent = codeInput.value.length + '字符'; }

        async function downloadImage() {
            try { downloadBtn.disabled = true; downloadBtn.textContent = '⏳ 生成中...';
                const canvas = await html2canvas(codeCard, { backgroundColor: null, scale: 2, useCORS: true, logging: false });
                const link = document.createElement('a'); link.download = `code-image-${Date.now()}.png`; link.href = canvas.toDataURL('image/png'); link.click();
                showToast('图片已下载！');
            } catch (err) { showToast('下载失败。'); console.error(err); }
            finally { downloadBtn.disabled = false; downloadBtn.textContent = '📥 下载PNG'; }
        }

        async function copyImage() {
            try { copyBtn.disabled = true; copyBtn.textContent = '⏳';
                const canvas = await html2canvas(codeCard, { backgroundColor: null, scale: 2, useCORS: true, logging: false });
                canvas.toBlob(async (blob) => { try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); showToast('图片已复制到剪贴板！'); } catch (err) { showToast('复制失败，请直接下载。'); } }, 'image/png');
            } catch (err) { showToast('复制失败。'); console.error(err); }
            finally { copyBtn.disabled = false; copyBtn.textContent = '📋 复制'; }
        }

        function shareKakao() {
            if (typeof Kakao === 'undefined') { showToast('分享功能准备中...'); return; }
            if (!Kakao.isInitialized()) Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: { title: '🎨 代码图片生成器', description: '将源代码转换为精美图片！30种背景、8种主题', imageUrl: 'https://braindetox.kr/site_logo.png', link: { mobileWebUrl: 'https://braindetox.kr/zh/static/code_image.html', webUrl: 'https://braindetox.kr/zh/static/code_image.html' } },
                buttons: [{ title: '创建代码图片', link: { mobileWebUrl: 'https://braindetox.kr/zh/static/code_image.html', webUrl: 'https://braindetox.kr/zh/static/code_image.html' } }]
            });
        }

        function showToast(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); setTimeout(() => { toast.classList.remove('show'); }, 2500); }
        document.addEventListener('DOMContentLoaded', init);
        document.addEventListener('DOMContentLoaded', () => { try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {} });
    </script>
</body>
