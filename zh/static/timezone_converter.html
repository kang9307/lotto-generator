    <script>
        const TIMEZONES=[{id:'Asia/Seoul',city:'首尔',country:'韩国',offset:'UTC+9',flag:'🇰🇷'},{id:'Asia/Tokyo',city:'东京',country:'日本',offset:'UTC+9',flag:'🇯🇵'},{id:'Asia/Shanghai',city:'上海',country:'中国',offset:'UTC+8',flag:'🇨🇳'},{id:'Asia/Hong_Kong',city:'香港',country:'香港',offset:'UTC+8',flag:'🇭🇰'},{id:'Asia/Singapore',city:'新加坡',country:'新加坡',offset:'UTC+8',flag:'🇸🇬'},{id:'Asia/Bangkok',city:'曼谷',country:'泰国',offset:'UTC+7',flag:'🇹🇭'},{id:'Asia/Dubai',city:'迪拜',country:'阿联酋',offset:'UTC+4',flag:'🇦🇪'},{id:'Asia/Kolkata',city:'孟买',country:'印度',offset:'UTC+5:30',flag:'🇮🇳'},{id:'Europe/London',city:'伦敦',country:'英国',offset:'UTC+0',flag:'🇬🇧'},{id:'Europe/Paris',city:'巴黎',country:'法国',offset:'UTC+1',flag:'🇫🇷'},{id:'Europe/Berlin',city:'柏林',country:'德国',offset:'UTC+1',flag:'🇩🇪'},{id:'Europe/Moscow',city:'莫斯科',country:'俄罗斯',offset:'UTC+3',flag:'🇷🇺'},{id:'America/New_York',city:'纽约',country:'美国',offset:'UTC-5',flag:'🇺🇸'},{id:'America/Los_Angeles',city:'洛杉矶',country:'美国',offset:'UTC-8',flag:'🇺🇸'},{id:'America/Chicago',city:'芝加哥',country:'美国',offset:'UTC-6',flag:'🇺🇸'},{id:'America/Toronto',city:'多伦多',country:'加拿大',offset:'UTC-5',flag:'🇨🇦'},{id:'America/Sao_Paulo',city:'圣保罗',country:'巴西',offset:'UTC-3',flag:'🇧🇷'},{id:'Australia/Sydney',city:'悉尼',country:'澳大利亚',offset:'UTC+11',flag:'🇦🇺'},{id:'Pacific/Auckland',city:'奥克兰',country:'新西兰',offset:'UTC+13',flag:'🇳🇿'},{id:'UTC',city:'UTC',country:'协调世界时',offset:'UTC+0',flag:'🌐'}];
        const state={selectedTimezones:['Asia/Seoul','America/New_York','Europe/London'],timeFormat:24,sourceTimezone:'Asia/Seoul',customDateTime:null};
        document.addEventListener('DOMContentLoaded',function(){if(typeof Kakao!=='undefined'&&!Kakao.isInitialized()){Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');}initializeTimezoneList();renderTimezoneCards();updateAllTimes();setInterval(updateAllTimes,1000);});
        function initializeTimezoneList(){const list=document.getElementById('timezoneList');list.innerHTML=TIMEZONES.map(tz=>`<div class="timezone-option" onclick="selectTimezone('${tz.id}')"><div class="timezone-option-city">${tz.flag} ${tz.city}</div><div class="timezone-option-offset">${tz.country} · ${tz.offset}</div></div>`).join('');}
        function filterTimezones(){const query=document.getElementById('timezoneSearch').value.toLowerCase();const list=document.getElementById('timezoneList');const filtered=TIMEZONES.filter(tz=>tz.city.toLowerCase().includes(query)||tz.country.toLowerCase().includes(query));list.innerHTML=filtered.map(tz=>`<div class="timezone-option" onclick="selectTimezone('${tz.id}')"><div class="timezone-option-city">${tz.flag} ${tz.city}</div><div class="timezone-option-offset">${tz.country} · ${tz.offset}</div></div>`).join('');}
        function addTimezone(tzId){if(state.selectedTimezones.includes(tzId)){showToast('该时区已添加。');return;}if(state.selectedTimezones.length>=8){showToast('最多可添加8个时区。');return;}state.selectedTimezones.push(tzId);renderTimezoneCards();updateAllTimes();showToast('时区已添加。');}
        function selectTimezone(tzId){addTimezone(tzId);closeModal();}
        function removeTimezone(tzId){if(state.selectedTimezones.length<=1){showToast('至少需要1个时区。');return;}state.selectedTimezones=state.selectedTimezones.filter(id=>id!==tzId);renderTimezoneCards();updateAllTimes();}
        function renderTimezoneCards(){const grid=document.getElementById('timezoneGrid');grid.innerHTML=state.selectedTimezones.map(tzId=>{const tz=TIMEZONES.find(t=>t.id===tzId)||{city:tzId,offset:'',flag:'🌐'};const isSource=tzId===state.sourceTimezone;return `<div class="timezone-card ${isSource?'source':''}" data-tz="${tzId}"><button class="timezone-remove" onclick="removeTimezone('${tzId}')">&times;</button><div class="timezone-city">${tz.flag} ${tz.city}</div><div class="timezone-offset">${tz.offset}</div><div class="timezone-time" id="time-${tzId.replace(/\//g,'-')}">--:--</div><div class="timezone-date" id="date-${tzId.replace(/\//g,'-')}">--</div><div class="timezone-diff" id="diff-${tzId.replace(/\//g,'-')}"></div></div>`;}).join('');}
        function updateAllTimes(){const customInput=document.getElementById('customDateTime').value;const baseDate=customInput?new Date(customInput):new Date();const currentTimeEl=document.getElementById('currentTime');const currentDateEl=document.getElementById('currentDate');const now=new Date();currentTimeEl.textContent=formatTime(now);currentDateEl.textContent=formatDate(now);const sourceTimezone=document.getElementById('sourceTimezone').value;state.sourceTimezone=sourceTimezone;state.selectedTimezones.forEach(tzId=>{const timeEl=document.getElementById(`time-${tzId.replace(/\//g,'-')}`);const dateEl=document.getElementById(`date-${tzId.replace(/\//g,'-')}`);const diffEl=document.getElementById(`diff-${tzId.replace(/\//g,'-')}`);if(timeEl&&dateEl){const options={timeZone:tzId,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:state.timeFormat===12};const dateOptions={timeZone:tzId,year:'numeric',month:'short',day:'numeric',weekday:'short'};timeEl.textContent=baseDate.toLocaleTimeString('zh-CN',options);dateEl.textContent=baseDate.toLocaleDateString('zh-CN',dateOptions);if(diffEl){const sourceDateStr=baseDate.toLocaleString('en-US',{timeZone:sourceTimezone});const targetDateStr=baseDate.toLocaleString('en-US',{timeZone:tzId});const sourceDate=new Date(sourceDateStr);const targetDate=new Date(targetDateStr);const diffHours=(targetDate-sourceDate)/(1000*60*60);if(tzId===sourceTimezone){diffEl.textContent='基准时区';}else if(diffHours>0){diffEl.textContent=`+${diffHours}小时`;}else if(diffHours<0){diffEl.textContent=`${diffHours}小时`;}else{diffEl.textContent='相同时间';}}}});document.querySelectorAll('.timezone-card').forEach(card=>{card.classList.remove('source');if(card.dataset.tz===sourceTimezone){card.classList.add('source');}});}
        function formatTime(date){const options={hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:state.timeFormat===12};return date.toLocaleTimeString('zh-CN',options);}
        function formatDate(date){const options={year:'numeric',month:'long',day:'numeric',weekday:'long'};return date.toLocaleDateString('zh-CN',options);}
        function setTimeFormat(format){state.timeFormat=format;document.querySelectorAll('.format-btn').forEach(btn=>{btn.classList.remove('active');});event.target.classList.add('active');updateAllTimes();}
        function resetToNow(){document.getElementById('customDateTime').value='';updateAllTimes();showToast('已重置为当前时间。');}
        function openModal(){document.getElementById('modalOverlay').classList.add('show');document.getElementById('timezoneSearch').value='';filterTimezones();}
        function closeModal(event){if(!event||event.target===document.getElementById('modalOverlay')){document.getElementById('modalOverlay').classList.remove('show');}}
        function copyTimes(){const lines=state.selectedTimezones.map(tzId=>{const tz=TIMEZONES.find(t=>t.id===tzId)||{city:tzId,flag:'🌐'};const timeEl=document.getElementById(`time-${tzId.replace(/\//g,'-')}`);const dateEl=document.getElementById(`date-${tzId.replace(/\//g,'-')}`);return `${tz.flag} ${tz.city}: ${timeEl?.textContent||''} (${dateEl?.textContent||''})`;});const text=`🌍 时区比较\n\n${lines.join('\n')}\n\n🔗 braindetox.kr/zh/static/timezone_converter.html`;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>{showToast('已复制到剪贴板。');});}else{fallbackCopy(text);}}
        function fallbackCopy(text){const textarea=document.createElement('textarea');textarea.value=text;textarea.style.position='fixed';textarea.style.opacity='0';document.body.appendChild(textarea);textarea.select();try{document.execCommand('copy');showToast('已复制到剪贴板。');}catch(err){showToast('复制失败。');}document.body.removeChild(textarea);}
        function shareKakao(){if(typeof Kakao==='undefined'||!Kakao.isInitialized()){showToast('正在准备KakaoTalk分享...');return;}Kakao.Share.sendDefault({objectType:'feed',content:{title:'时区转换器 - 世界时钟',description:'轻松比较和转换全球时区。实时查看主要城市的当前时间！',imageUrl:'https://braindetox.kr/site_logo.png',link:{mobileWebUrl:'https://braindetox.kr/zh/static/timezone_converter.html',webUrl:'https://braindetox.kr/zh/static/timezone_converter.html'}},buttons:[{title:'使用时区转换器',link:{mobileWebUrl:'https://braindetox.kr/zh/static/timezone_converter.html',webUrl:'https://braindetox.kr/zh/static/timezone_converter.html'}}]});}
        function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000);}
    </script>
</body>
