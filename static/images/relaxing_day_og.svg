<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14"/>
      <stop offset="50%" style="stop-color:#0f1520"/>
      <stop offset="100%" style="stop-color:#0a0e14"/>
    </linearGradient>

    <!-- 보라색 글로우 -->
    <radialGradient id="purpleGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:rgba(147, 112, 219, 0.15)"/>
      <stop offset="100%" style="stop-color:rgba(147, 112, 219, 0)"/>
    </radialGradient>

    <!-- 골드 글로우 -->
    <radialGradient id="goldGlow" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:rgba(212, 165, 116, 0.12)"/>
      <stop offset="100%" style="stop-color:rgba(212, 165, 116, 0)"/>
    </radialGradient>

    <!-- 블루 글로우 -->
    <radialGradient id="blueGlow" cx="50%" cy="90%" r="35%">
      <stop offset="0%" style="stop-color:rgba(100, 149, 237, 0.08)"/>
      <stop offset="100%" style="stop-color:rgba(100, 149, 237, 0)"/>
    </radialGradient>

    <!-- 텍스트 그라데이션 -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8eef5"/>
      <stop offset="100%" style="stop-color:#d4a574"/>
    </linearGradient>

    <!-- 호흡 원 글로우 -->
    <filter id="circleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- 그라데이션 오버레이 -->
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>

  <!-- 파티클 효과 (작은 빛나는 점들) -->
  <circle cx="150" cy="100" r="2" fill="#d4a574" opacity="0.5"/>
  <circle cx="300" cy="180" r="1.5" fill="#9370db" opacity="0.4"/>
  <circle cx="450" cy="80" r="2" fill="#d4a574" opacity="0.6"/>
  <circle cx="600" cy="150" r="1" fill="#6495ed" opacity="0.3"/>
  <circle cx="750" cy="100" r="2.5" fill="#d4a574" opacity="0.4"/>
  <circle cx="900" cy="200" r="1.5" fill="#9370db" opacity="0.5"/>
  <circle cx="1050" cy="120" r="2" fill="#d4a574" opacity="0.4"/>
  <circle cx="200" cy="450" r="1.5" fill="#6495ed" opacity="0.4"/>
  <circle cx="400" cy="520" r="2" fill="#d4a574" opacity="0.5"/>
  <circle cx="700" cy="480" r="1" fill="#9370db" opacity="0.3"/>
  <circle cx="950" cy="500" r="2" fill="#d4a574" opacity="0.4"/>
  <circle cx="1100" cy="420" r="1.5" fill="#6495ed" opacity="0.5"/>

  <!-- 호흡 원 (장식) -->
  <circle cx="950" cy="315" r="100" fill="none" stroke="#d4a574" stroke-width="1" opacity="0.15" filter="url(#circleGlow)"/>
  <circle cx="950" cy="315" r="75" fill="none" stroke="#d4a574" stroke-width="2" opacity="0.25" filter="url(#circleGlow)"/>
  <circle cx="950" cy="315" r="50" fill="none" stroke="#9370db" stroke-width="1" opacity="0.2"/>

  <!-- 메인 타이틀 -->
  <text x="100" y="240" font-family="'Noto Serif KR', Georgia, serif" font-size="72" font-weight="400" fill="url(#textGradient)">
    하루 마무리 힐링
  </text>

  <!-- 서브타이틀 -->
  <text x="100" y="310" font-family="'Noto Sans KR', sans-serif" font-size="28" fill="#9aa5b4">
    4-7-8 호흡 명상 | 감사 일기 | 힐링 시구절
  </text>

  <!-- 구분선 -->
  <rect x="100" y="340" width="120" height="2" fill="#d4a574" opacity="0.6"/>

  <!-- 설명 텍스트 -->
  <text x="100" y="400" font-family="'Noto Sans KR', sans-serif" font-size="22" fill="#6b7687">
    하루를 평온하게 마무리하는 무료 힐링 웹앱
  </text>
  <text x="100" y="440" font-family="'Noto Sans KR', sans-serif" font-size="22" fill="#6b7687">
    숲소리 배경음악과 함께 편안한 저녁 루틴을 만들어보세요
  </text>

  <!-- 브랜드 -->
  <text x="100" y="560" font-family="'Noto Sans KR', sans-serif" font-size="18" fill="#6b7687" letter-spacing="3">
    BRAINDETOX.KR
  </text>

  <!-- 하단 장식선 -->
  <rect x="0" y="620" width="1200" height="10" fill="#d4a574" opacity="0.3"/>
</svg>
