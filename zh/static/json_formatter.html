<body>

    <div class="container">

            <div class="toolbar">

                <button class="btn btn-primary" onclick="formatJSON()"><span>✨</span> 格式化</button>

    </div>
    <div class="toast" id="toast"></div>
    <script>
        const state={indent:2,viewMode:'text',lastFormatted:'',isValid:false};
        document.addEventListener('DOMContentLoaded',function(){if(typeof Kakao!=='undefined'&&!Kakao.isInitialized()){Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');}});
        function setIndent(indent){state.indent=indent;document.querySelectorAll('.toolbar-btn[data-indent]').forEach(btn=>{btn.classList.remove('active');if(btn.dataset.indent===String(indent)){btn.classList.add('active');}});if(state.isValid&&document.getElementById('inputArea').value.trim()){formatJSON();}}
        function setViewMode(mode){state.viewMode=mode;document.querySelectorAll('.view-tab').forEach(tab=>{tab.classList.remove('active');});event.target.classList.add('active');if(state.lastFormatted){displayOutput(state.lastFormatted);}}
        function validateInput(){const input=document.getElementById('inputArea').value.trim();const errorBar=document.getElementById('errorBar');const errorMessage=document.getElementById('errorMessage');const validStatus=document.getElementById('validStatus');const sizeInfo=document.getElementById('sizeInfo');const bytes=new Blob([input]).size;sizeInfo.textContent=formatBytes(bytes);if(!input){errorBar.classList.remove('show');validStatus.innerHTML='⏳ 等待输入';validStatus.className='status-item';state.isValid=false;return;}try{JSON.parse(input);errorBar.classList.remove('show');validStatus.innerHTML='✅ 有效的JSON';validStatus.className='status-valid';state.isValid=true;}catch(e){const match=e.message.match(/position (\d+)/);let errorText=e.message;if(match){const pos=parseInt(match[1]);const lines=input.substring(0,pos).split('\n');const line=lines.length;const col=lines[lines.length-1].length+1;errorText=`${e.message} (第${line}行, 第${col}列)`;}errorMessage.textContent=errorText;errorBar.classList.add('show');validStatus.innerHTML='❌ 无效的JSON';validStatus.className='status-invalid';state.isValid=false;}}
        function formatJSON(){const input=document.getElementById('inputArea').value.trim();if(!input){showToast('请输入JSON。');return;}try{const parsed=JSON.parse(input);let indentStr=state.indent==='tab'?'\t':state.indent;const formatted=JSON.stringify(parsed,null,indentStr);state.lastFormatted=formatted;displayOutput(formatted);showToast('JSON格式化完成。');}catch(e){showToast('无效的JSON。');}}
        function minifyJSON(){const input=document.getElementById('inputArea').value.trim();if(!input){showToast('请输入JSON。');return;}try{const parsed=JSON.parse(input);const minified=JSON.stringify(parsed);state.lastFormatted=minified;displayOutput(minified);showToast('JSON压缩完成。');}catch(e){showToast('无效的JSON。');}}
        function displayOutput(json){const outputArea=document.getElementById('outputArea');if(state.viewMode==='tree'){try{const parsed=JSON.parse(json);outputArea.innerHTML=renderTree(parsed);}catch(e){outputArea.innerHTML=highlightJSON(json);}}else{outputArea.innerHTML=highlightJSON(json);}}
        function highlightJSON(json){return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?)/g,function(match){let cls='json-string';if(/:$/.test(match)){cls='json-key';match=match.replace(/:$/,'')+':';}return '<span class="'+cls+'">'+match+'</span>';}).replace(/\b(true|false)\b/g,'<span class="json-boolean">$1</span>').replace(/\bnull\b/g,'<span class="json-null">null</span>').replace(/\b(-?\d+\.?\d*([eE][+-]?\d+)?)\b/g,'<span class="json-number">$1</span>');}
        function renderTree(obj,key=null){const type=Array.isArray(obj)?'array':typeof obj;let html='<div class="tree-item">';if(key!==null){html+=`<span class="json-key">"${key}"</span>: `;}if(type==='object'&&obj!==null){const keys=Object.keys(obj);if(keys.length===0){html+='{}';}else{html+=`<span class="tree-toggle" onclick="toggleTree(this)">▼</span>{`;html+='<div class="tree-children">';keys.forEach((k,i)=>{html+=renderTree(obj[k],k);if(i<keys.length-1)html+=',';});html+='</div>}';}}else if(type==='array'){if(obj.length===0){html+='[]';}else{html+=`<span class="tree-toggle" onclick="toggleTree(this)">▼</span>[`;html+='<div class="tree-children">';obj.forEach((item,i)=>{html+=renderTree(item);if(i<obj.length-1)html+=',';});html+='</div>]';}}else if(type==='string'){html+=`<span class="json-string">"${escapeHtml(obj)}"</span>`;}else if(type==='number'){html+=`<span class="json-number">${obj}</span>`;}else if(type==='boolean'){html+=`<span class="json-boolean">${obj}</span>`;}else if(obj===null){html+='<span class="json-null">null</span>';}html+='</div>';return html;}
        function toggleTree(element){const parent=element.parentElement;parent.classList.toggle('tree-collapsed');element.textContent=parent.classList.contains('tree-collapsed')?'▶':'▼';}
        function handleFileUpload(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){document.getElementById('inputArea').value=e.target.result;validateInput();formatJSON();};reader.readAsText(file);event.target.value='';}
        function loadSample(){const sample={"name":"BrainDetox JSON 格式化工具","version":"1.0.0","description":"在线JSON格式化与验证工具","features":["Pretty Print","压缩","树形视图","语法高亮"],"author":{"name":"BrainDetox","website":"https://braindetox.kr"},"isOpenSource":true,"rating":4.9,"users":null};document.getElementById('inputArea').value=JSON.stringify(sample);validateInput();formatJSON();}
        function clearAll(){document.getElementById('inputArea').value='';document.getElementById('outputArea').innerHTML='';document.getElementById('errorBar').classList.remove('show');document.getElementById('validStatus').innerHTML='⏳ 等待输入';document.getElementById('validStatus').className='status-item';document.getElementById('sizeInfo').textContent='0 bytes';state.lastFormatted='';state.isValid=false;showToast('已清除。');}
        function copyOutput(){if(!state.lastFormatted){showToast('没有可复制的内容。');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(state.lastFormatted).then(()=>{showToast('已复制到剪贴板。');}).catch(()=>{fallbackCopy(state.lastFormatted);});}else{fallbackCopy(state.lastFormatted);}}
        function fallbackCopy(text){const textarea=document.createElement('textarea');textarea.value=text;textarea.style.position='fixed';textarea.style.opacity='0';document.body.appendChild(textarea);textarea.select();try{document.execCommand('copy');showToast('已复制到剪贴板。');}catch(err){showToast('复制失败。');}document.body.removeChild(textarea);}
        function downloadJSON(){if(!state.lastFormatted){showToast('没有可下载的内容。');return;}const blob=new Blob([state.lastFormatted],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='formatted.json';a.click();URL.revokeObjectURL(url);showToast('下载已开始。');}
        function shareKakao(){if(typeof Kakao==='undefined'||!Kakao.isInitialized()){showToast('正在准备KakaoTalk分享。');return;}Kakao.Share.sendDefault({objectType:'feed',content:{title:'JSON 格式化工具 - 在线JSON格式化',description:'美化和验证JSON数据。支持Pretty Print、压缩、树形视图！',imageUrl:'https://braindetox.kr/site_logo.png',link:{mobileWebUrl:'https://braindetox.kr/zh/static/json_formatter.html',webUrl:'https://braindetox.kr/zh/static/json_formatter.html'}},buttons:[{title:'使用JSON格式化工具',link:{mobileWebUrl:'https://braindetox.kr/zh/static/json_formatter.html',webUrl:'https://braindetox.kr/zh/static/json_formatter.html'}}]});}
        function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000);}
        function formatBytes(bytes){if(bytes===0)return '0 bytes';const k=1024;const sizes=['bytes','KB','MB'];const i=Math.floor(Math.log(bytes)/Math.log(k));return parseFloat((bytes/Math.pow(k,i)).toFixed(2))+' '+sizes[i];}
        function escapeHtml(str){return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
