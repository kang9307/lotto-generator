    <script>
        // ========== Name Value Calculation ==========
        function getCharValue(char) {
            const code = char.charCodeAt(0);

            // Korean character range (가 ~ 힣)
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const strokeCount = {
                    cho: { 'ㄱ': 2, 'ㄲ': 4, 'ㄴ': 2, 'ㄷ': 3, 'ㄸ': 6, 'ㄹ': 5, 'ㅁ': 4, 'ㅂ': 4, 'ㅃ': 8, 'ㅅ': 2, 'ㅆ': 4, 'ㅇ': 1, 'ㅈ': 3, 'ㅉ': 6, 'ㅊ': 4, 'ㅋ': 3, 'ㅌ': 4, 'ㅍ': 4, 'ㅎ': 3 },
                    jung: { 'ㅏ': 2, 'ㅐ': 3, 'ㅑ': 3, 'ㅒ': 4, 'ㅓ': 2, 'ㅔ': 3, 'ㅕ': 3, 'ㅖ': 4, 'ㅗ': 2, 'ㅘ': 4, 'ㅙ': 5, 'ㅚ': 3, 'ㅛ': 3, 'ㅜ': 2, 'ㅝ': 4, 'ㅞ': 5, 'ㅟ': 3, 'ㅠ': 3, 'ㅡ': 1, 'ㅢ': 2, 'ㅣ': 1 },
                    jong: { '': 0, 'ㄱ': 2, 'ㄲ': 4, 'ㄳ': 4, 'ㄴ': 2, 'ㄵ': 5, 'ㄶ': 5, 'ㄷ': 3, 'ㄹ': 5, 'ㄺ': 7, 'ㄻ': 9, 'ㄼ': 9, 'ㄽ': 7, 'ㄾ': 9, 'ㄿ': 9, 'ㅀ': 8, 'ㅁ': 4, 'ㅂ': 4, 'ㅄ': 6, 'ㅅ': 2, 'ㅆ': 4, 'ㅇ': 1, 'ㅈ': 3, 'ㅊ': 4, 'ㅋ': 3, 'ㅌ': 4, 'ㅍ': 4, 'ㅎ': 3 }
                };
                const choList = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
                const jungList = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
                const jongList = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

                const base = code - 0xAC00;
                const choIdx = Math.floor(base / (21 * 28));
                const jungIdx = Math.floor((base % (21 * 28)) / 28);
                const jongIdx = base % 28;

                const cho = choList[choIdx];
                const jung = jungList[jungIdx];
                const jong = jongList[jongIdx];

                return (strokeCount.cho[cho] || 0) + (strokeCount.jung[jung] || 0) + (strokeCount.jong[jong] || 0);
            }

            // English letters (A-Z, a-z)
            if (/[a-zA-Z]/.test(char)) {
                return char.toLowerCase().charCodeAt(0) - 96; // a=1, b=2, ..., z=26
            }

            // Numbers
            if (/[0-9]/.test(char)) return parseInt(char);

            // Other characters
            return 1;
        }

        function getNameValue(name) {
            return name.split('').reduce((sum, char) => sum + getCharValue(char), 0);
        }

        function calculateCompatibility(name1, name2) {
            const value1 = getNameValue(name1);
            const value2 = getNameValue(name2);

            // Compatibility algorithm: value-based calculation
            const combined = value1 + value2;
            const diff = Math.abs(value1 - value2);
            const product = value1 * value2;

            // Calculate score using various factors
            let score = 50; // Base score

            // Bonus for specific combined ranges
            if (combined % 2 === 0) score += 5;
            if (combined % 7 === 0) score += 10;
            if (combined >= 20 && combined <= 80) score += 8;

            // Lower difference = higher score
            if (diff <= 5) score += 15;
            else if (diff <= 10) score += 10;
            else if (diff <= 15) score += 5;
            else score -= 5;

            // Bonus based on product's last digit
            const lastDigit = product % 10;
            if (lastDigit === 0 || lastDigit === 5) score += 7;
            if (lastDigit === 7 || lastDigit === 8) score += 5;

            // Name length bonus
            if (name1.length === name2.length) score += 5;

            // Deterministic "random" element (same names = same result)
            const seed = (value1 * 17 + value2 * 31) % 20;
            score += seed - 10;

            // Adjust score range (1-100)
            score = Math.max(1, Math.min(100, Math.round(score)));

            return score;
        }

        // ========== Result Messages ==========
        const messages = {
            excellent: [
                "A match made in heaven! You two are destined to be together. You understand and respect each other deeply - the perfect partners!",
                "Amazing chemistry! Together, you can overcome any obstacle. You're like a gift to each other.",
                "Perfect harmony between you two! Every moment together will be special and filled with happiness. Congratulations!"
            ],
            good: [
                "Great compatibility! You bring out the best in each other. Looking forward to an amazing partnership.",
                "A wonderful connection! With mutual care and understanding, your bond can grow even deeper.",
                "Nice chemistry! Being together will bring lots of joy. Your energies complement each other well."
            ],
            normal: [
                "Average compatibility, but with effort, you can build a great relationship! Understanding each other is key.",
                "A typical connection. But remember, true relationships are built through effort. Show interest in each other.",
                "Decent compatibility! Respect your differences and communicate often for a better relationship."
            ],
            low: [
                "A challenging match! But don't worry - accepting and respecting differences can lead to something special.",
                "Not the easiest compatibility, but true love conquers all. It takes effort from both sides.",
                "A unique combination! You have many differences, but that means there's so much to learn from each other."
            ]
        };

        function getGradeInfo(score) {
            if (score >= 80) return { grade: 'Soulmates', class: 'grade-excellent', type: 'excellent' };
            if (score >= 60) return { grade: 'Great Match', class: 'grade-good', type: 'good' };
            if (score >= 40) return { grade: 'Good Match', class: 'grade-normal', type: 'normal' };
            return { grade: 'Needs Effort', class: 'grade-low', type: 'low' };
        }

        function getRandomMessage(type) {
            const msgList = messages[type];
            return msgList[Math.floor(Math.random() * msgList.length)];
        }

        function showResult(name1, name2, score) {
            const gradeInfo = getGradeInfo(score);

            document.getElementById('resultName1').textContent = name1;
            document.getElementById('resultName2').textContent = name2;
            document.getElementById('resultScore').textContent = score + '%';
            document.getElementById('resultGrade').textContent = gradeInfo.grade;
            document.getElementById('resultGrade').className = 'result-grade ' + gradeInfo.class;
            document.getElementById('resultMessage').textContent = getRandomMessage(gradeInfo.type);

            document.getElementById('inputCard').style.display = 'none';
            document.getElementById('resultCard').classList.add('show');
        }

        function resetTest() {
            document.getElementById('name1').value = '';
            document.getElementById('name2').value = '';
            document.getElementById('inputCard').style.display = 'block';
            document.getElementById('resultCard').classList.remove('show');
        }

        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // ========== Event Listeners ==========
        document.getElementById('checkBtn').addEventListener('click', () => {
            const name1 = document.getElementById('name1').value.trim();
            const name2 = document.getElementById('name2').value.trim();

            if (!name1 || !name2) {
                showToast('Please enter both names!');
                return;
            }

            const score = calculateCompatibility(name1, name2);
            showResult(name1, name2, score);
        });

        document.getElementById('retryBtn').addEventListener('click', resetTest);

        // Enter key submit
        document.querySelectorAll('.name-input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('checkBtn').click();
                }
            });
        });

        // Copy result
        document.getElementById('copyResult').addEventListener('click', () => {
            const name1 = document.getElementById('resultName1').textContent;
            const name2 = document.getElementById('resultName2').textContent;
            const score = document.getElementById('resultScore').textContent;
            const grade = document.getElementById('resultGrade').textContent;

            const text = `💕 Name Compatibility Test Result 💕\n\n${name1} ❤️ ${name2}\nCompatibility Score: ${score}\nResult: ${grade}\n\n🔗 Try it yourself: https://braindetox.kr/en/static/name_compatibility.html`;

            navigator.clipboard.writeText(text).then(() => {
                showToast('Result copied to clipboard!');
            }).catch(() => {
                showToast('Failed to copy.');
            });
        });

        // KakaoTalk share
        document.getElementById('shareKakao').addEventListener('click', () => {
            if (typeof Kakao === 'undefined') {
                showToast('Preparing KakaoTalk share...');
                return;
            }

            if (!Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            const name1 = document.getElementById('resultName1').textContent;
            const name2 = document.getElementById('resultName2').textContent;
            const score = document.getElementById('resultScore').textContent;

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: '💕 Name Compatibility Test Result',
                    description: `${name1} ❤️ ${name2}\nCompatibility Score: ${score}`,
                    imageUrl: 'https://braindetox.kr/site_logo.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/en/static/name_compatibility.html',
                        webUrl: 'https://braindetox.kr/en/static/name_compatibility.html'
                    }
                },
                buttons: [
                    {
                        title: 'Try it yourself',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/en/static/name_compatibility.html',
                            webUrl: 'https://braindetox.kr/en/static/name_compatibility.html'
                        }
                    }
                ]
            });
        });

        // ========== Ad Load ==========
        document.addEventListener('DOMContentLoaded', () => {
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch (e) {}
        });
    </script>
</body>
</html>
