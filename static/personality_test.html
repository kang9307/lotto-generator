        // Initialize Kakao SDK
        if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {

        }

        // Questions Data (48 questions)
        const questions = [
            // E/I Questions (1-12)
            { id: 1, text: "새로운 사람들을 만나면 에너지가 충전되는 느낌이 든다.", dimension: "EI", direction: "E" },
            { id: 2, text: "파티나 모임에서 여러 사람들과 대화하는 것을 즐긴다.", dimension: "EI", direction: "E" },
            { id: 3, text: "혼자 있는 시간이 길어지면 외롭고 지루해진다.", dimension: "EI", direction: "E" },
            { id: 4, text: "생각을 말로 표현하면서 정리하는 편이다.", dimension: "EI", direction: "E" },
            { id: 5, text: "조용하고 혼자만의 시간이 있어야 재충전이 된다.", dimension: "EI", direction: "I" },
            { id: 6, text: "깊은 대화를 나눌 수 있는 소수의 친구가 좋다.", dimension: "EI", direction: "I" },
            { id: 7, text: "말하기 전에 충분히 생각하고 정리하는 편이다.", dimension: "EI", direction: "I" },
            { id: 8, text: "처음 보는 사람에게 먼저 말을 거는 것이 어렵지 않다.", dimension: "EI", direction: "E" },
            { id: 9, text: "사람이 많은 곳에 오래 있으면 피곤해진다.", dimension: "EI", direction: "I" },
            { id: 10, text: "내 생각이나 감정을 글로 표현하는 것이 더 편하다.", dimension: "EI", direction: "I" },
            { id: 11, text: "활발하고 활동적인 환경에서 일하는 것이 좋다.", dimension: "EI", direction: "E" },
            { id: 12, text: "중요한 결정을 할 때 혼자 깊이 생각하는 시간이 필요하다.", dimension: "EI", direction: "I" },

            // S/N Questions (13-24)
            { id: 13, text: "구체적이고 실제적인 정보를 선호한다.", dimension: "SN", direction: "S" },

            showQuestion(0);
        }

        function showQuestion(index) {
            const question = questions[index];
            document.getElementById('questionNumber').textContent = `질문 ${index + 1}`;
            document.getElementById('questionText').textContent = question.text;

            // Update progress
            const progress = ((index) / questions.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressNum').textContent = `${index + 1}/${questions.length}`;
            document.getElementById('progressPercent').textContent = `${Math.round(progress)}%`;

            // Update buttons
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').textContent = index === questions.length - 1 ? '결과 보기' : '다음';

            // Clear selection
            document.querySelectorAll('.answer-btn').forEach(btn => btn.classList.remove('selected'));

            // Restore previous answer if exists
            if (answers[index]) {
                document.querySelectorAll('.answer-btn').forEach(btn => {
                    if (parseInt(btn.querySelector('.answer-score').textContent) === answers[index]) {
                        btn.classList.add('selected');
                    }
                });
            }
        }

        function selectAnswer(score) {
            answers[currentQuestion] = score;
            document.querySelectorAll('.answer-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (parseInt(btn.querySelector('.answer-score').textContent) === score) {
                    btn.classList.add('selected');
                }
            });
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion(currentQuestion);
            }
        }

        function nextQuestion() {
            if (!answers[currentQuestion]) {
                showToast('답변을 선택해주세요');
                return;
            }

            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion(currentQuestion);
            } else {
                calculateResult();
            }
        }

        function calculateResult() {
            // Show loading
            document.getElementById('testScreen').classList.remove('active');
            document.getElementById('loadingScreen').classList.add('active');

            // Calculate scores
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

            questions.forEach((q, i) => {
                scores[q.direction] += answers[i];
            });

            // Determine type
            const type = [
                scores.E >= scores.I ? 'E' : 'I',
                scores.S >= scores.N ? 'S' : 'N',
                scores.T >= scores.F ? 'T' : 'F',
                scores.J >= scores.P ? 'J' : 'P'
            ].join('');

            // Show result after delay
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.remove('active');
                document.getElementById('resultScreen').classList.add('active');
                showResult(type);
            }, 2000);
        }

        function showResult(type) {
            const result = typeResults[type];
            const totalEI = scores.E + scores.I;
            const totalSN = scores.S + scores.N;
            const totalTF = scores.T + scores.F;
            const totalJP = scores.J + scores.P;

            let html = `
                <div class="result-header" id="resultCapture">
                    <div class="result-type-badge" style="background: ${result.color}20; color: ${result.color}">
                        ${result.group === 'analyst' ? '분석가' : result.group === 'diplomat' ? '외교관' : result.group === 'sentinel' ? '관리자' : '탐험가'}
                    </div>
                    <div class="result-type-code" style="color: ${result.color}">${type}</div>
                    <div class="result-nickname">${result.nickname}</div>
                    <div class="result-tagline">${result.tagline}</div>
                </div>

                <!-- Dimension Bars -->
                <div class="result-section">
                    <div class="section-title">
                        <span class="section-icon">📊</span>
                        성향 분석
                    </div>
                    <div class="dimension-item">
                        <div class="dimension-labels">
                            <span class="dimension-label ${scores.E >= scores.I ? 'active' : ''}" style="${scores.E >= scores.I ? 'background:' + result.color : ''}">E 외향</span>
                            <span class="dimension-label ${scores.I > scores.E ? 'active' : ''}" style="${scores.I > scores.E ? 'background:' + result.color : ''}">I 내향</span>
                        </div>
                        <div class="dimension-bar">
                            <div class="dimension-fill" style="width: ${(scores.E / totalEI) * 100}%; background: ${result.color}"></div>
                        </div>
                        <div class="dimension-percent">${Math.round((scores.E / totalEI) * 100)}% : ${Math.round((scores.I / totalEI) * 100)}%</div>
                    </div>
                    <div class="dimension-item">
                        <div class="dimension-labels">
                            <span class="dimension-label ${scores.S >= scores.N ? 'active' : ''}" style="${scores.S >= scores.N ? 'background:' + result.color : ''}">S 감각</span>
                            <span class="dimension-label ${scores.N > scores.S ? 'active' : ''}" style="${scores.N > scores.S ? 'background:' + result.color : ''}">N 직관</span>
                        </div>
                        <div class="dimension-bar">
                            <div class="dimension-fill" style="width: ${(scores.S / totalSN) * 100}%; background: ${result.color}"></div>
                        </div>
                        <div class="dimension-percent">${Math.round((scores.S / totalSN) * 100)}% : ${Math.round((scores.N / totalSN) * 100)}%</div>
                    </div>
                    <div class="dimension-item">
                        <div class="dimension-labels">
                            <span class="dimension-label ${scores.T >= scores.F ? 'active' : ''}" style="${scores.T >= scores.F ? 'background:' + result.color : ''}">T 사고</span>
                            <span class="dimension-label ${scores.F > scores.T ? 'active' : ''}" style="${scores.F > scores.T ? 'background:' + result.color : ''}">F 감정</span>
                        </div>
                        <div class="dimension-bar">
                            <div class="dimension-fill" style="width: ${(scores.T / totalTF) * 100}%; background: ${result.color}"></div>
                        </div>
                        <div class="dimension-percent">${Math.round((scores.T / totalTF) * 100)}% : ${Math.round((scores.F / totalTF) * 100)}%</div>
                    </div>
                    <div class="dimension-item">
                        <div class="dimension-labels">
                            <span class="dimension-label ${scores.J >= scores.P ? 'active' : ''}" style="${scores.J >= scores.P ? 'background:' + result.color : ''}">J 판단</span>
                            <span class="dimension-label ${scores.P > scores.J ? 'active' : ''}" style="${scores.P > scores.J ? 'background:' + result.color : ''}">P 인식</span>
                        </div>
                        <div class="dimension-bar">
                            <div class="dimension-fill" style="width: ${(scores.J / totalJP) * 100}%; background: ${result.color}"></div>
                        </div>
                        <div class="dimension-percent">${Math.round((scores.J / totalJP) * 100)}% : ${Math.round((scores.P / totalJP) * 100)}%</div>
                    </div>
                </div>

                <!-- Description -->
                <div class="result-section">
                    <div class="section-title">
                        <span class="section-icon">📖</span>
                        ${type} 유형 설명
                    </div>
                    <p class="description-text">${result.description.replace(/\n\n/g, '</p><p class="description-text" style="margin-top:16px">')}</p>
                </div>

                <!-- Cognitive Stack -->
                <div class="result-section">
                    <div class="section-title">
                        <span class="section-icon">🧩</span>
                        인지 기능 스택
                    </div>
                    <div class="cognitive-stack">
                        ${result.cognitiveStack.map(c => `
                            <div class="cognitive-item">
                                <div class="cognitive-rank">${c.rank}</div>
                                <div class="cognitive-func" style="color: ${result.color}">${c.func}</div>
                                <div class="cognitive-name">${c.name}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Careers -->
                <div class="result-section">
                    <div class="section-title">
                        <span class="section-icon">💼</span>
                        추천 직업
                    </div>
                    <div class="career-list">
                        ${result.careers.map(c => `
                            <div class="career-item">
                                <span class="career-icon">✨</span>
                                <span>${c}</span>
                            </div>
                        `).join('')}
                    </div>
                    <p class="description-text" style="margin-top: 16px">${result.workStyle}</p>
                </div>

                <!-- Romance -->
                <div class="result-section">
                    <div class="section-title">
                        <span class="section-icon">💕</span>
                        연애 스타일
                    </div>
                    <p class="description-text">${result.romance.style}</p>
                    <div style="margin-top: 16px">
                        <div style="font-weight: 600; margin-bottom: 8px; color: ${result.color}">💪 강점</div>
                        <div class="trait-list">
                            ${result.romance.strengths.map(s => `<span class="trait-tag">${s}</span>`).join('')}
                        </div>
                    </div>
                    <div style="margin-top: 16px">
                        <div style="font-weight: 600; margin-bottom: 8px; color: var(--warning)">⚠️ 주의점</div>
                        <p class="description-text">${result.romance.caution}</p>
                    </div>
                </div>

                <!-- Strengths & Growth -->
                <div class="result-section">
                    <div class="section-title">
                        <span class="section-icon">⭐</span>
                        강점
                    </div>
                    <div class="trait-list">
                        ${result.strengths.map(s => `<span class="trait-tag">${s}</span>`).join('')}
                    </div>
                </div>

                <div class="result-section">
                    <div class="section-title">
                        <span class="section-icon">🌱</span>
                        성장 포인트
                    </div>
                    <div class="trait-list">
                        ${result.growth.map(g => `<span class="trait-tag">${g}</span>`).join('')}
                    </div>
                </div>

                <!-- Celebrities -->
                <div class="result-section">
                    <div class="section-title">
                        <span class="section-icon">🌟</span>
                        같은 유형의 유명인
                    </div>
                    <div class="celeb-list" style="grid-template-columns: repeat(2, 1fr)">
                        ${result.celebrities.map(c => `
                            <div class="celeb-item">
                                <span class="celeb-emoji">👤</span>
                                <span>${c}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Compatibility -->
                <div class="result-section">
                    <div class="section-title">
                        <span class="section-icon">💑</span>
                        궁합 TOP 3
                    </div>
                    <div class="compat-list">
                        ${result.compatibility.map((c, i) => `
                            <div class="compat-item">
                                <span class="compat-rank">${i + 1}</span>
                                <div>
                                    <div class="compat-type" style="color: ${typeResults[c.type].color}">${c.type}</div>
                                    <div class="compat-name">${c.name}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Share -->
                <div class="share-section">
                    <div class="section-title">
                        <span class="section-icon">📤</span>
                        결과 공유하기
                    </div>
                    <div class="share-buttons">
                        <button class="share-btn kakao" onclick="shareKakao('${type}')">
                            <span class="share-btn-icon">💬</span>
                            <span class="share-btn-text">카카오톡</span>
                        </button>
                        <button class="share-btn" onclick="saveImage()">
                            <span class="share-btn-icon">📷</span>
                            <span class="share-btn-text">이미지 저장</span>
                        </button>
                        <button class="share-btn" onclick="copyLink()">
                            <span class="share-btn-icon">🔗</span>
                            <span class="share-btn-text">링크 복사</span>
                        </button>
                    </div>
                </div>

                <button class="retry-btn" onclick="retryTest()">다시 테스트하기</button>
            `;

            document.getElementById('resultContent').innerHTML = html;

            // Scroll to top
            window.scrollTo(0, 0);
        }

        function shareKakao(type) {
            if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
                showToast('카카오 SDK 로딩 중...');
                return;
            }

            const result = typeResults[type];

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: `나의 성격유형: ${type} - ${result.nickname}`,
                    description: result.tagline,
                    imageUrl: 'https://testpro.site/static/images/personality_test_og.png',
                    link: {
                        mobileWebUrl: 'https://testpro.site/static/personality_test.html',
                        webUrl: 'https://testpro.site/static/personality_test.html'
                    }
                },
                buttons: [
                    {
                        title: '나도 테스트하기',
                        link: {
                            mobileWebUrl: 'https://testpro.site/static/personality_test.html',
                            webUrl: 'https://testpro.site/static/personality_test.html'
                        }
                    }
                ]
            });
        }

        function saveImage() {
            const element = document.getElementById('resultCapture');
            html2canvas(element, {
                backgroundColor: '#000000',
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'personality_result.png';
                link.href = canvas.toDataURL();
                link.click();
                showToast('이미지가 저장되었습니다');
            });
        }

        function copyLink() {
            navigator.clipboard.writeText('https://testpro.site/static/personality_test.html').then(() => {
                showToast('링크가 복사되었습니다');
            });
        }

        function retryTest() {
            currentQuestion = 0;
            answers = [];
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('startScreen').classList.add('active');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
