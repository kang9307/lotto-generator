    <!-- 社交分享脚本 -->
    <script>
        // Kakao SDK 初始化
        Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');

        document.addEventListener('DOMContentLoaded', function() {
            // KakaoTalk 分享按钮
            const kakaoShareBtn = document.getElementById('kakao-share');
            if (kakaoShareBtn) {
                kakaoShareBtn.addEventListener('click', function() {
                    if (!window.Kakao) {
                        alert('无法加载 KakaoTalk SDK。');
                        return;
                    }

                    // 确认并重试 SDK 初始化
                    if (!window.Kakao.isInitialized()) {
                        window.Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
                    }

                    try {
                        if (window.Kakao.Share) {
                            window.Kakao.Share.sendDefault({
                                objectType: 'feed',
                                content: {
                                    title: '💝 配对测试',
                                    description: '通过姓名、生日、MBTI、星座进行的完美配对测试！来趣味确认与恋人、朋友、家人之间的配对指数。',
                                    imageUrl: 'https://braindetox.kr/images/compatibility_test_bg.png',
                                    link: {
                                        mobileWebUrl: window.location.href,
                                        webUrl: window.location.href
                                    }
                                },
                                buttons: [
                                    {
                                        title: '我也做配对测试',
                                        link: {
                                            mobileWebUrl: window.location.href,
                                            webUrl: window.location.href
                                        }
                                    }
                                ]
                            });
                        } else if (window.Kakao.Link) {
                            window.Kakao.Link.sendDefault({
                                objectType: 'feed',
                                content: {
                                    title: '💝 配对测试',
                                    description: '通过姓名、生日、MBTI、星座进行的完美配对测试！来趣味确认与恋人、朋友、家人之间的配对指数。',
                                    imageUrl: 'https://braindetox.kr/images/compatibility_test_bg.png',
                                    link: {
                                        mobileWebUrl: window.location.href,
                                        webUrl: window.location.href
                                    }
                                },
                                buttons: [
                                    {
                                        title: '我也做配对测试',
                                        link: {
                                            mobileWebUrl: window.location.href,
                                            webUrl: window.location.href
                                        }
                                    }
                                ]
                            });
                        } else {
                            window.open(`https://sharer.kakao.com/talk/friends/picker/link?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent('💝 配对测试 - 通过姓名、生日、MBTI、星座进行的完美配对测试！')}`, 'kakaotalk_share', 'width=350, height=650');
                        }
                    } catch (error) {
                        console.error('KakaoTalk 分享时出错:', error);
                        alert('无法使用 KakaoTalk 分享功能，请使用其他方式分享。');
                    }
                });
            }

            // Facebook 分享按钮
            const facebookShareBtn = document.getElementById('facebook-share');
            if (facebookShareBtn) {
                facebookShareBtn.addEventListener('click', function() {
                    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                    const shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`;

                    if (isMobile) {
                        window.location.href = shareUrl;
                    } else {
                        window.open(shareUrl, 'facebook-share-dialog', 'width=626,height=436');
                    }
                });
            }

            // X (Twitter) 分享按钮
            const twitterShareBtn = document.getElementById('twitter-share');
            if (twitterShareBtn) {
                twitterShareBtn.addEventListener('click', function() {
                    const text = '💝 配对测试\n通过姓名、生日、MBTI、星座进行的完美配对测试！\n\n#配对测试 #MBTI配对 #星座配对 #恋爱运';
                    const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`;
                    window.open(shareUrl, 'twitter-share-dialog', 'width=626,height=436');
                });
            }

            // Threads 分享按钮
            const threadsShareBtn = document.getElementById('threads-share');
            if (threadsShareBtn) {
                threadsShareBtn.addEventListener('click', function() {
                    const currentUrl = window.location.href;
                    const tempTextArea = document.createElement('textarea');
                    tempTextArea.value = currentUrl;
                    document.body.appendChild(tempTextArea);
                    tempTextArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempTextArea);
                    alert('链接已复制。请粘贴到 Threads 应用中进行分享！');
                });
            }

            // 复制链接按钮
            const linkCopyBtn = document.getElementById('link-copy');
            if (linkCopyBtn) {
                linkCopyBtn.addEventListener('click', function() {
                    const currentUrl = window.location.href;
                    const tempTextArea = document.createElement('textarea');
                    tempTextArea.value = currentUrl;
                    document.body.appendChild(tempTextArea);
                    tempTextArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempTextArea);
                    alert('链接已复制！');
                });
            }
        });
    </script>
