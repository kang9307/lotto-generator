<body>
    <!-- 页眉 -->
    <div id="header-placeholder"></div>

    <div class="container">
        <div class="calculator-container">
            <!-- 头部区域 -->
            <div class="calculator-header">
                <h1>💰 利息计算器</h1>
                <p>精确计算贷款、存款、零存整取等多种金融产品的利息</p>
            </div>

            <!-- 标签菜单 -->
            <div class="calculator-tabs">
                <button class="calculator-tab active" data-tab="loan">贷款利息</button>
                <button class="calculator-tab" data-tab="deposit">存款利息</button>
                <button class="calculator-tab" data-tab="saving">零存整取利息</button>
                <button class="calculator-tab" data-tab="compound">复利计算</button>
            </div>

            <!-- 贷款利息计算 -->
            <div class="calculator-content active" id="loan-content">
                <div class="calculator-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>贷款金额（韩元）</label>
                            <input type="text" id="loan-amount" class="form-input amount-input" placeholder="例如：100,000,000" inputmode="numeric">
                        </div>
                        <div class="form-group">
                            <label>年利率（%）</label>
                            <input type="number" id="loan-rate" class="form-input" placeholder="例如：3.5" min="0" max="50" step="0.1">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>贷款期限设置</label>
                            <div class="period-toggle">
                                <button type="button" class="toggle-btn active" data-mode="years" onclick="togglePeriodMode('loan', 'years')">按年数输入</button>
                                <button type="button" class="toggle-btn" data-mode="dates" onclick="togglePeriodMode('loan', 'dates')">按日期选择</button>
                            </div>
                            <div class="period-input years-input">
                                <input type="number" id="loan-period" class="form-input" placeholder="例如：30" min="1" max="50">
                                <span class="input-suffix">年</span>
                            </div>
                            <div class="period-input dates-input" style="display: none;">
                                <div class="date-row">
                                    <div class="date-group">
                                        <label class="date-label">开始日期</label>
                                        <input type="date" id="loan-start-date" class="form-input date-input">
                                    </div>
                                    <div class="date-group">
                                        <label class="date-label">结束日期</label>
                                        <input type="date" id="loan-end-date" class="form-input date-input">
                                    </div>
                                </div>
                                <div class="calculated-period" id="loan-calculated-period"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>还款方式</label>
                            <select id="loan-method" class="form-input form-select">
                                <option value="equal">等额本息</option>
                                <option value="principal">等额本金</option>
                                <option value="maturity">到期一次还款</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>宽限期（月）— 可选</label>
                        <input type="number" id="loan-grace" class="form-input" placeholder="例如：12" min="0" max="120">
                        <small style="color: #6c757d; font-size: 0.85rem; margin-top: 5px; display: block;">
                            💡 宽限期：仅支付利息、不偿还本金的期间（仅适用于到期一次性还款方式）
                        </small>
                    </div>

                    <button class="calculator-button" onclick="calculateLoan()">💰 计算贷款利息</button>
                </div>

                <div class="result-container" id="loan-result">
                    <div class="result-title">贷款利息计算结果</div>
                    <div class="result-summary" id="loan-summary"></div>
                    <div class="result-table" id="loan-table"></div>
                </div>
            </div>

            <!-- 存款利息计算 -->
            <div class="calculator-content" id="deposit-content">
                <div class="calculator-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>存款本金（韩元）</label>
                            <input type="text" id="deposit-amount" class="form-input amount-input" placeholder="例如：10,000,000" inputmode="numeric">
                        </div>
                        <div class="form-group">
                            <label>年利率（%）</label>
                            <input type="number" id="deposit-rate" class="form-input" placeholder="例如：2.5" min="0" max="20" step="0.1">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>存款期限（年）</label>
                            <input type="number" id="deposit-period" class="form-input" placeholder="例如：3" min="0.1" max="10" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>利息支付方式</label>
                            <select id="deposit-method" class="form-input form-select">
                                <option value="simple">单利</option>
                                <option value="compound">复利</option>
                                <option value="monthly">按月支付</option>
                            </select>
                        </div>
                    </div>

                    <button class="calculator-button" onclick="calculateDeposit()">💵 计算存款利息</button>
                </div>

                <div class="result-container" id="deposit-result">
                    <div class="result-title">存款利息计算结果</div>
                    <div class="result-summary" id="deposit-summary"></div>
                </div>

    <script>
        // 标签切换功能
        document.querySelectorAll('.calculator-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // 移除所有标签与内容的 active 类
                document.querySelectorAll('.calculator-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.calculator-content').forEach(c => c.classList.remove('active'));

                // 为被点击的标签与对应内容添加 active 类
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-content').classList.add('active');
            });
        });

        // 数字格式化函数
        function formatNumber(num) {
            return new Intl.NumberFormat('zh-CN').format(Math.round(num));
        }

        // 千分位格式化函数
        function formatAmount(value) {
            return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // 去除逗号函数
        function removeCommas(value) {
            return value.replace(/,/g, '');
        }

        // 返回还款方式名称
        function getMethodName(method) {
            switch(method) {
                case 'equal': return '等额本息';
                case 'principal': return '等额本金';
                case 'maturity': return '到期一次还款';
                default: return '等额本息';
            }
        }

        // 金额输入框格式化
        function setupAmountFormatting() {
            document.querySelectorAll('.amount-input').forEach(input => {
                input.addEventListener('input', function(e) {
                    let value = e.target.value;
                    // 仅允许数字与逗号
                    value = value.replace(/[^\d,]/g, '');
                    // 去除逗号后转换为数字
                    const numericValue = removeCommas(value);
                    if (numericValue === '') {
                        e.target.value = '';
                        return;
                    }
                    // 添加逗号后重新设置
                    e.target.value = formatAmount(numericValue);
                });

                // 失去焦点时检查空值
                input.addEventListener('blur', function(e) {
                    if (e.target.value === '') {
                        e.target.value = '';
                    }
                });
            });
        }

        // 切换期限设置模式
        function togglePeriodMode(type, mode) {
            const yearsInput = document.querySelector(`#${type}-content .years-input`);
            const datesInput = document.querySelector(`#${type}-content .dates-input`);
            const toggleBtns = document.querySelectorAll(`#${type}-content .toggle-btn`);

            // 切换按钮的激活状态
            toggleBtns.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === mode) {
                    btn.classList.add('active');
                }
            });

            if (mode === 'years') {
                yearsInput.style.display = 'flex';
                datesInput.style.display = 'none';
            } else {
                yearsInput.style.display = 'none';
                datesInput.style.display = 'block';
            }
        }

        // 计算日期差
        function calculateDateDifference(startDate, endDate) {
            const start = new Date(startDate + 'T00:00:00');
            const end = new Date(endDate + 'T00:00:00');

            if (start >= end) {
                return null;
            }

            // 精确的天数计算
            const timeDiff = end.getTime() - start.getTime();
            const diffDays = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));

            // 年数计算（按 365 天计）
            const years = parseFloat((diffDays / 365).toFixed(4));

            // 实际年/月计算（按准确日历）
            let actualYears = end.getFullYear() - start.getFullYear();
            let actualMonths = end.getMonth() - start.getMonth();

            if (end.getDate() < start.getDate()) {
                actualMonths--;
            }

            if (actualMonths < 0) {
                actualYears--;
                actualMonths += 12;
            }

            const totalMonths = actualYears * 12 + actualMonths;

            const yearMonthDisplay = actualYears > 0 ?
                `${actualYears} 年 ${actualMonths} 个月` :
                `${actualMonths} 个月`;

            return {
                days: diffDays,
                months: totalMonths,
                years: years,
                yearMonthDisplay: yearMonthDisplay,
                fraction: `${diffDays}/365`
            };
        }

        // 闰年检查函数
        function isLeapYear(year) {
            return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
        }

        // 选择日期时显示计算出的期限
        function setupDateCalculation() {
            const startDateInput = document.getElementById('loan-start-date');
            const endDateInput = document.getElementById('loan-end-date');
            const calculatedPeriodDiv = document.getElementById('loan-calculated-period');

            function updateCalculatedPeriod() {
                const startDate = startDateInput.value;
                const endDate = endDateInput.value;

                if (!startDate || !endDate) {
                    calculatedPeriodDiv.innerHTML = '请同时选择开始日期和结束日期。';
                    calculatedPeriodDiv.className = 'calculated-period empty';
                    return;
                }

                const diff = calculateDateDifference(startDate, endDate);
                if (!diff) {
                    calculatedPeriodDiv.innerHTML = '结束日期必须晚于开始日期。';
                    calculatedPeriodDiv.className = 'calculated-period empty';
                    return;
                }

                calculatedPeriodDiv.innerHTML = `
                    📅 计算得出的期限：<strong>${diff.years} 年</strong><br>
                    <small>共 ${diff.days} 天（${diff.fraction} 年）= ${diff.yearMonthDisplay}</small>
                `;
                calculatedPeriodDiv.className = 'calculated-period';
            }

            startDateInput.addEventListener('change', updateCalculatedPeriod);
            endDateInput.addEventListener('change', updateCalculatedPeriod);
        }

        // 获取贷款期限（年数输入或日期选择）
        function getLoanPeriod() {
            const yearsInput = document.querySelector('#loan-content .years-input');
            const datesInput = document.querySelector('#loan-content .dates-input');

            if (yearsInput.style.display !== 'none') {
                // 年数输入模式
                return parseFloat(document.getElementById('loan-period').value);
            } else {
                // 日期选择模式
                const startDate = document.getElementById('loan-start-date').value;
                const endDate = document.getElementById('loan-end-date').value;

                if (!startDate || !endDate) {
                    return null;
                }

                const diff = calculateDateDifference(startDate, endDate);
                return diff ? diff.years : null;
            }
        }

        // 贷款利息计算函数
        function calculateLoan() {
            const amountText = document.getElementById('loan-amount').value;
            const amount = parseFloat(removeCommas(amountText));
            const rate = parseFloat(document.getElementById('loan-rate').value) / 100;
            const years = getLoanPeriod();
            const method = document.getElementById('loan-method').value;
            const graceMonths = parseInt(document.getElementById('loan-grace').value) || 0;

            if (!amount || !rate || !years) {
                alert('请填写所有必填项。');
                return;
            }

            const months = years * 12;
            const monthlyRate = rate / 12;
            let results = [];
            let totalInterest = 0;
            let monthlyPayment = 0;

            if (method === 'equal') {
                // 等额本息还款
                monthlyPayment = amount * (monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);
                let balance = amount;

                for (let i = 1; i <= months; i++) {
                    const interestPayment = balance * monthlyRate;
                    const principalPayment = monthlyPayment - interestPayment;
                    balance -= principalPayment;
                    totalInterest += interestPayment;

                    if (i <= 12 || i % 12 === 0 || i === months) {
                        results.push({
                            month: i,
                            payment: monthlyPayment,
                            principal: principalPayment,
                            interest: interestPayment,
                            balance: Math.max(0, balance)
                        });
                    }
                }

                displayLoanResult(monthlyPayment, totalInterest, results, method);

            } else if (method === 'principal') {
                // 等额本金还款
                const principalPayment = amount / months;
                let balance = amount;

                for (let i = 1; i <= months; i++) {
                    const interestPayment = balance * monthlyRate;
                    const currentMonthlyPayment = principalPayment + interestPayment;
                    balance -= principalPayment;
                    totalInterest += interestPayment;

                    if (i <= 12 || i % 12 === 0 || i === months) {
                        results.push({
                            month: i,
                            payment: currentMonthlyPayment,
                            principal: principalPayment,
                            interest: interestPayment,
                            balance: Math.max(0, balance)
                        });
                    }
                }

                // 等额本金取首月还款额作为代表值
                monthlyPayment = principalPayment + (amount * monthlyRate);
                displayLoanResult(monthlyPayment, totalInterest, results, method);

            } else if (method === 'maturity') {
                // 到期一次还款
                if (graceMonths > 0 && graceMonths < months) {
                    // 存在宽限期：宽限期内仅支付利息
                    const monthlyInterestOnly = amount * monthlyRate;

                    // 记录宽限期内的利息支付
                    for (let i = 1; i <= graceMonths; i++) {
                        if (i <= 6 || i % 6 === 0) { // 前 6 个月及之后每 6 个月显示一次
                            results.push({
                                month: i,
                                payment: monthlyInterestOnly,
                                principal: 0,
                                interest: monthlyInterestOnly,
                                balance: amount
                            });
                        }
                    }

                    // 到期时一次偿还本金 + 剩余期间利息
                    const remainingYears = years - (graceMonths / 12);
                    const remainingInterest = amount * rate * remainingYears;
                    const graceInterest = monthlyInterestOnly * graceMonths;

                    results.push({
                        month: months,
                        payment: amount + remainingInterest,
                        principal: amount,
                        interest: remainingInterest,
                        balance: 0
                    });

                    totalInterest = graceInterest + remainingInterest;
                    monthlyPayment = monthlyInterestOnly; // 宽限期内的月付金额

                } else {
                    // 无宽限期或整个期间都是宽限期：到期时一次偿还本金 + 全部利息
                    totalInterest = amount * rate * years;
                    const finalPayment = amount + totalInterest;

                    results.push({
                        month: months,
                        payment: finalPayment,
                        principal: amount,
                        interest: totalInterest,
                        balance: 0
                    });
                    monthlyPayment = 0; // 无中间还款
                }

                displayLoanResult(monthlyPayment, totalInterest, results, method);
            }
        }

        // 存款利息计算函数
        function calculateDeposit() {
            const amountText = document.getElementById('deposit-amount').value;
            const amount = parseFloat(removeCommas(amountText));
            const rate = parseFloat(document.getElementById('deposit-rate').value) / 100;
            const years = parseFloat(document.getElementById('deposit-period').value);
            const method = document.getElementById('deposit-method').value;

            if (!amount || !rate || !years) {
                alert('请填写所有必填项。');
                return;
            }

            let totalAmount, interest;

            if (method === 'simple') {
                // 单利
                interest = amount * rate * years;
                totalAmount = amount + interest;
            } else if (method === 'compound') {
                // 复利
                totalAmount = amount * Math.pow(1 + rate, years);
                interest = totalAmount - amount;
            } else {
                // 按月支付
                const monthlyInterest = amount * rate / 12;
                interest = monthlyInterest * 12 * years;
                totalAmount = amount + interest;
            }

            displayDepositResult(amount, interest, totalAmount, years);
        }

        // 零存整取利息计算函数
        function calculateSaving() {
            const monthlyAmountText = document.getElementById('saving-amount').value;
            const monthlyAmount = parseFloat(removeCommas(monthlyAmountText));
            const rate = parseFloat(document.getElementById('saving-rate').value) / 100;
            const years = parseFloat(document.getElementById('saving-period').value);

            if (!monthlyAmount || !rate || !years) {
                alert('请填写所有必填项。');
                return;
            }

            const months = years * 12;
            const monthlyRate = rate / 12;
            let totalPrincipal = monthlyAmount * months;
            let totalInterest = 0;

            // 零存整取利息计算（每月存入、到期一次性支付利息）
            for (let i = 1; i <= months; i++) {
                const remainingMonths = months - i + 1;
                totalInterest += monthlyAmount * monthlyRate * (remainingMonths - 1);
            }

            const totalAmount = totalPrincipal + totalInterest;

            displaySavingResult(totalPrincipal, totalInterest, totalAmount, months);
        }

        // 复利计算函数
        function calculateCompound() {
            const initialText = document.getElementById('compound-initial').value;
            const initial = parseFloat(removeCommas(initialText));
            const rate = parseFloat(document.getElementById('compound-rate').value) / 100;
            const years = parseFloat(document.getElementById('compound-period').value);
            const frequency = parseFloat(document.getElementById('compound-frequency').value);
            const monthlyText = document.getElementById('compound-monthly').value;
            const monthly = monthlyText ? parseFloat(removeCommas(monthlyText)) : 0;

            if (!initial || !rate || !years) {
                alert('请填写所有必填项。');
                return;
            }

            // 复利计算
            let totalAmount = initial * Math.pow(1 + rate / frequency, frequency * years);

            // 如存在月投资额
            if (monthly > 0) {
                const monthlyRate = rate / 12;
                const months = years * 12;
                const futureValueAnnuity = monthly * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);
                totalAmount += futureValueAnnuity;
            }

            const totalInvested = initial + (monthly * 12 * years);
            const totalReturn = totalAmount - totalInvested;

            displayCompoundResult(totalInvested, totalReturn, totalAmount, years);
        }

        // 展示贷款结果
        function displayLoanResult(monthlyPayment, totalInterest, schedule, method) {
            const container = document.getElementById('loan-result');

            const loanAmount = parseFloat(removeCommas(document.getElementById('loan-amount').value));

            let paymentLabel = '月还款额';
            let paymentValue = `${formatNumber(monthlyPayment)} 韩元`;

            if (method === 'principal') {
                paymentLabel = '首月还款额';
                paymentValue = `${formatNumber(monthlyPayment)} 韩元（逐月递减）`;
            } else if (method === 'maturity') {
                if (monthlyPayment > 0) {
                    paymentLabel = '月利息支付额';
                    paymentValue = `${formatNumber(monthlyPayment)} 韩元`;
                } else {
                    paymentLabel = '中间还款';
                    paymentValue = '无（到期一次还款）';

            summary.innerHTML = `

                <div class="result-item">
                    <div class="result-item-label">总还款额</div>
                    <div class="result-item-value">${formatNumber(loanAmount + totalInterest)} 韩元</div>
                </div>
                <div class="result-item">
                    <div class="result-item-label">还款方式</div>
                    <div class="result-item-value">${getMethodName(method)}</div>
                </div>
            `;

            let tableHTML = '';

            if (schedule.length > 0) {
                tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>期次</th>
                                <th>还款额</th>
                                <th>本金</th>
                                <th>利息</th>
                                <th>余额</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                schedule.forEach(row => {
                    const monthDisplay = method === 'maturity' && row.month > 12 ?
                        `第 ${row.month} 期（到期）` : `第 ${row.month} 期`;

                    tableHTML += `
                        <tr>
                            <td>${monthDisplay}</td>
                            <td>${formatNumber(row.payment)}</td>
                            <td>${formatNumber(row.principal)}</td>
                            <td>${formatNumber(row.interest)}</td>
                            <td>${formatNumber(row.balance)}</td>
                        </tr>
                    `;
                });

                tableHTML += '</tbody></table>';

                if (method === 'principal') {
                    tableHTML += '<div style="margin-top: 10px; font-size: 0.9rem; color: #6c757d; text-align: center;">💡 等额本金方式下，每月还款额逐月递减。</div>';
                } else if (method === 'maturity') {
                    tableHTML += '<div style="margin-top: 10px; font-size: 0.9rem; color: #6c757d; text-align: center;">💡 到期一次还款方式：贷款期间仅支付利息，到期时一次性偿还本金。</div>';
                }
            } else {
                tableHTML = '<div style="text-align: center; color: #6c757d; padding: 20px;">没有还款计划表。</div>';
            }

            table.innerHTML = tableHTML;
            container.classList.add('show');
        }
