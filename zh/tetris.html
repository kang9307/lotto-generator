    <style>
                 /* 俄罗斯方块 游戏 전용 样式 */
        
        /* 俄罗斯方块 콘텐츠 영역 */
        .tetris-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            margin: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* 헤더 */
        .game-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .game-title {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease-in-out infinite;
            margin-bottom: 10px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .game-subtitle {
            font-size: 1.2rem;
            color: #fff;
            opacity: 0.9;
        }

        /* 메인 游戏 영역 */
        .game-container {
            display: grid;
            grid-template-columns: 300px auto 300px;
            gap: 30px;
            align-items: stretch;
            margin-bottom: 30px;
            min-height: 500px;
        }

        /* 左侧 패널 */
        .left-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            height: fit-content;
            min-height: 500px;
        }

        .score-section {
            flex: 1;
        }

        .score-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .score-label {
            font-weight: 600;
            color: #555;
        }

        .score-value {
            font-weight: 700;
            color: #667eea;
        }

        .game-board {

            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: fit-content;
            min-height: 500px;
        }

        #gameCanvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            display: block;
            background: #000;
            margin: auto;
        }

        /* 右侧 패널 */
        .right-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            height: fit-content;
            min-height: 500px;
        }

        .next-piece {
            text-align: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .next-piece h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .controls-info {
            flex: 1;
            margin-bottom: 15px;
        }

        .controls-info h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

            border: 2px solid #ddd;
            border-radius: 8px;
            background: #000;
        }

        /* 컨트롤 버튼 */
        .game-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
            margin-top: auto;
            margin-bottom: 20px;
            width: 100%;
        }

        .control-btn {
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;

            width: 100%;

            align-items: center;
            justify-content: center;

        }

            justify-content: center;

        .touch-btn:active {

        }

        .touch-btn.drop-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);

        }

        .touch-btn.drop-btn:active {

            display: none;
            position: fixed;
            top: 0;
            left: 0;

    <script>
        // 俄罗斯方块 游戏 클래스
        class TetrisGame {
            constructor() {
                // 移动端 감지
                this.isMobile = window.innerWidth <= 768;
                
                // 캔버스 设置
                if (this.isMobile) {
                    this.canvas = document.getElementById('gameCanvasMobile');
                    this.nextCanvas = document.getElementById('nextCanvasMobile');
                } else {
                    this.canvas = document.getElementById('gameCanvas');
                    this.nextCanvas = document.getElementById('nextCanvas');
                }
                
                this.ctx = this.canvas.getContext('2d');
                this.nextCtx = this.nextCanvas.getContext('2d');
                
                // 游戏 设置
                this.BOARD_WIDTH = 10;
                this.BOARD_HEIGHT = 20;
                this.CELL_SIZE = this.isMobile ? 20 : 30;
                
                // 游戏 상태
                this.board = [];
                this.currentPiece = null;
                this.nextPiece = null;
                this.score = 0;
                this.level = 1;
                this.lines = 0;
                this.isPlaying = false;
                this.isPaused = false;
                this.gameSpeed = 500;
                this.gameLoop = null;
                this.dropTimer = null;
                
                // 테트로미노 정의
                this.pieces = {
                    I: { shape: [[1,1,1,1]], color: '#00ffff' },
                    O: { shape: [[1,1],[1,1]], color: '#ffff00' },
                    T: { shape: [[0,1,0],[1,1,1]], color: '#800080' },
                    S: { shape: [[0,1,1],[1,1,0]], color: '#00ff00' },
                    Z: { shape: [[1,1,0],[0,1,1]], color: '#ff0000' },
                    J: { shape: [[1,0,0],[1,1,1]], color: '#0000ff' },
                    L: { shape: [[0,0,1],[1,1,1]], color: '#ffa500' }
                };
                
                this.pieceNames = Object.keys(this.pieces);
                
                this.initializeBoard();
                this.loadGameData();
                this.bindEvents();
                this.generateNextPiece();
                this.spawnPiece();
                this.draw();
            }
            
            initializeBoard() {
                this.board = Array(this.BOARD_HEIGHT).fill().map(() => 
                    Array(this.BOARD_WIDTH).fill(0)
                );
            }
            
            generateNextPiece() {
                const randomPiece = this.pieceNames[Math.floor(Math.random() * this.pieceNames.length)];
                this.nextPiece = {
                    type: randomPiece,
                    shape: [...this.pieces[randomPiece].shape.map(row => [...row])],
                    color: this.pieces[randomPiece].color,
                    x: 0,
                    y: 0
                };
                this.drawNextPiece();
            }
            
            spawnPiece() {
                if (this.nextPiece) {
                    this.currentPiece = {
                        ...this.nextPiece,
                        x: Math.floor(this.BOARD_WIDTH / 2) - Math.floor(this.nextPiece.shape[0].length / 2),
                        y: 0
                    };
                    
                    // 游戏 오버 체크
                    if (this.isCollision(this.currentPiece.x, this.currentPiece.y, this.currentPiece.shape)) {
                        this.gameOver();
                        return;
                    }
                    
                    this.generateNextPiece();
                }
            }
            
            isCollision(x, y, shape) {
                for (let row = 0; row < shape.length; row++) {
                    for (let col = 0; col < shape[row].length; col++) {
                        if (shape[row][col]) {
                            const newX = x + col;
                            const newY = y + row;
                            
                            if (newX < 0 || newX >= this.BOARD_WIDTH || 
                                newY >= this.BOARD_HEIGHT || 
                                (newY >= 0 && this.board[newY][newX])) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }
            
            placePiece() {
                const piece = this.currentPiece;
                for (let row = 0; row < piece.shape.length; row++) {
                    for (let col = 0; col < piece.shape[row].length; col++) {
                        if (piece.shape[row][col]) {
                            const boardY = piece.y + row;
                            const boardX = piece.x + col;
                            if (boardY >= 0) {
                                this.board[boardY][boardX] = piece.color;
                            }
                        }
                    }
                }
                
                this.clearLines();
                this.spawnPiece();
            }
            
            clearLines() {
                let linesCleared = 0;
                
                for (let row = this.BOARD_HEIGHT - 1; row >= 0; row--) {
                    if (this.board[row].every(cell => cell !== 0)) {
                        this.board.splice(row, 1);
                        this.board.unshift(Array(this.BOARD_WIDTH).fill(0));
                        linesCleared++;
                        row++; // 같은 row를 다시 체크
                    }
                }
                
                if (linesCleared > 0) {
                    this.lines += linesCleared;
                    
                    // 점수 计算
                    const basePoints = [0, 100, 300, 500, 800];
                    this.score += basePoints[linesCleared] * this.level;
                    
                    // 레벨업
                    const newLevel = Math.floor(this.lines / 10) + 1;
                    if (newLevel > this.level) {
                        this.level = newLevel;
                        this.gameSpeed = Math.max(50, 500 - (this.level - 1) * 50);
                        this.showAchievement(`🎉 达到等级 ${this.level}！`);
                    }
                    
                    this.updateDisplay();
                    this.saveGameData();
                    
                    // 특별 성취
                    if (linesCleared === 4) {
                        this.showAchievement('🏆 Tetris！同时消除 4 行！');
                    }
                }
            }
            
            rotatePiece() {
                if (!this.currentPiece) return;
                
                const rotated = this.currentPiece.shape[0].map((_, i) => 
                    this.currentPiece.shape.map(row => row[i]).reverse()
                );
                
                if (!this.isCollision(this.currentPiece.x, this.currentPiece.y, rotated)) {
                    this.currentPiece.shape = rotated;
                }
            }
            
            movePiece(dx, dy) {
                if (!this.currentPiece) return false;
                
                const newX = this.currentPiece.x + dx;
                const newY = this.currentPiece.y + dy;
                
                if (!this.isCollision(newX, newY, this.currentPiece.shape)) {
                    this.currentPiece.x = newX;
                    this.currentPiece.y = newY;
                    return true;
                }
                
                if (dy > 0) {
                    this.placePiece();
                }
                
                return false;
            }
            
            dropPiece() {
                if (!this.currentPiece) return;
                
                while (this.movePiece(0, 1)) {
                    // 빈 루프 - 계속 向下 이동
                }
            }
            
            draw() {
                // 보드 지우기
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 보드 그리기
                for (let row = 0; row < this.BOARD_HEIGHT; row++) {
                    for (let col = 0; col < this.BOARD_WIDTH; col++) {
                        if (this.board[row][col]) {
                            this.drawCell(col, row, this.board[row][col]);
                        }
                    }
                }
                
                // 현재 블록 그리기
                if (this.currentPiece) {
                    for (let row = 0; row < this.currentPiece.shape.length; row++) {
                        for (let col = 0; col < this.currentPiece.shape[row].length; col++) {
                            if (this.currentPiece.shape[row][col]) {
                                this.drawCell(
                                    this.currentPiece.x + col,
                                    this.currentPiece.y + row,
                                    this.currentPiece.color
                                );
                            }
                        }
                    }
                }
                
                // 그리드 라인 그리기
                this.drawGrid();
            }
            
            drawCell(x, y, color) {
                const pixelX = x * this.CELL_SIZE;
                const pixelY = y * this.CELL_SIZE;
                
                this.ctx.fillStyle = color;
                this.ctx.fillRect(pixelX, pixelY, this.CELL_SIZE, this.CELL_SIZE);
                
                // 블록 테두리
                this.ctx.strokeStyle = '#fff';
                this.ctx.lineWidth = 1;
                this.ctx.strokeRect(pixelX, pixelY, this.CELL_SIZE, this.CELL_SIZE);
            }
            
            drawGrid() {
                this.ctx.strokeStyle = '#333';
                this.ctx.lineWidth = 0.5;
                
                for (let i = 0; i <= this.BOARD_WIDTH; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * this.CELL_SIZE, 0);
                    this.ctx.lineTo(i * this.CELL_SIZE, this.canvas.height);
                    this.ctx.stroke();
                }
                
                for (let i = 0; i <= this.BOARD_HEIGHT; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * this.CELL_SIZE);
                    this.ctx.lineTo(this.canvas.width, i * this.CELL_SIZE);
                    this.ctx.stroke();
                }
            }
            
            drawNextPiece() {
                if (!this.nextPiece) return;
                
                this.nextCtx.fillStyle = '#000';
                this.nextCtx.fillRect(0, 0, this.nextCanvas.width, this.nextCanvas.height);
                
                const cellSize = this.isMobile ? 12 : 20;
                const offsetX = (this.nextCanvas.width - this.nextPiece.shape[0].length * cellSize) / 2;
                const offsetY = (this.nextCanvas.height - this.nextPiece.shape.length * cellSize) / 2;
                
                for (let row = 0; row < this.nextPiece.shape.length; row++) {
                    for (let col = 0; col < this.nextPiece.shape[row].length; col++) {
                        if (this.nextPiece.shape[row][col]) {
                            const x = offsetX + col * cellSize;
                            const y = offsetY + row * cellSize;
                            
                            this.nextCtx.fillStyle = this.nextPiece.color;
                            this.nextCtx.fillRect(x, y, cellSize, cellSize);
                            
                            this.nextCtx.strokeStyle = '#fff';
                            this.nextCtx.lineWidth = 1;
                            this.nextCtx.strokeRect(x, y, cellSize, cellSize);
                        }
                    }
                }
            }
            
            startGame() {
                if (this.isPlaying) return;
                
                this.isPlaying = true;
                this.isPaused = false;
                this.updateGameStatus('playing');
                
                this.gameLoop = setInterval(() => {
                    if (!this.isPaused) {
                        this.movePiece(0, 1);
                        this.draw();
                    }
                }, this.gameSpeed);
            }
            
            pauseGame() {
                if (!this.isPlaying) return;
                
                this.isPaused = !this.isPaused;
                this.updateGameStatus(this.isPaused ? 'paused' : 'playing');
            }
            
            gameOver() {
                this.isPlaying = false;
                this.isPaused = false;
                
                if (this.gameLoop) {
                    clearInterval(this.gameLoop);
                    this.gameLoop = null;
                }
                
                this.updateGameStatus('gameover');
                this.saveGameData();
                this.showGameOverModal();
            }
            
            resetGame() {
                this.isPlaying = false;
                this.isPaused = false;
                
                if (this.gameLoop) {
                    clearInterval(this.gameLoop);
                    this.gameLoop = null;
                }
                
                this.score = 0;
                this.level = 1;
                this.lines = 0;
                this.gameSpeed = 500;
                
                this.initializeBoard();
                this.generateNextPiece();
                this.spawnPiece();
                this.updateDisplay();
                this.updateGameStatus('ready');
                this.draw();
                
                // 모달 关闭
                document.getElementById('gameOverModal').style.display = 'none';
            }
            
            updateDisplay() {
                if (this.isMobile) {
                    document.getElementById('currentScoreMobile').textContent = this.score.toLocaleString();
                    document.getElementById('currentLevelMobile').textContent = this.level;
                    document.getElementById('linesClearedMobile').textContent = this.lines;
                    
                    const highScore = localStorage.getItem('tetris_highScore') || 0;
                    document.getElementById('highScoreMobile').textContent = parseInt(highScore).toLocaleString();
                } else {
                    document.getElementById('currentScore').textContent = this.score.toLocaleString();
                    document.getElementById('currentLevel').textContent = this.level;
                    document.getElementById('linesCleared').textContent = this.lines;
                    
                    const highScore = localStorage.getItem('tetris_highScore') || 0;
                    document.getElementById('highScore').textContent = parseInt(highScore).toLocaleString();
                }
            }
            
            updateGameStatus(status) {
                const messages = {
                    ready: '快来开始游戏吧！🚀',
                    playing: '游戏进行中… 🎮',
                    paused: '暂停中 ⏸️',
                    gameover: '游戏结束！💀'
                };
                
                if (this.isMobile) {
                    const statusElement = document.getElementById('gameStatusMobile');
                    if (statusElement) {
                        statusElement.className = `game-status status-${status}`;
                        statusElement.innerHTML = `<span>${messages[status]}</span>`;
                    }
                } else {
                    const statusElement = document.getElementById('gameStatus');
                    if (statusElement) {
                        statusElement.className = `game-status status-${status}`;
                        statusElement.innerHTML = `<span>${messages[status]}</span>`;
                    }
                }
            }
            
            showGameOverModal() {
                document.getElementById('finalScore').textContent = `分数：${this.score.toLocaleString()}`;
                document.getElementById('finalLevel').textContent = this.level;
                document.getElementById('finalLines').textContent = this.lines;
                document.getElementById('gameOverModal').style.display = 'block';
            }
            
            showAchievement(text) {
                const notification = document.getElementById('achievementNotification');
                document.getElementById('achievementText').textContent = text;
                
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
            
            saveGameData() {
                const currentHighScore = localStorage.getItem('tetris_highScore') || 0;
                if (this.score > currentHighScore) {
                    localStorage.setItem('tetris_highScore', this.score);
                    this.showAchievement('🏆 刷新纪录！');
                }
                
                // 游戏 통계 保存
                const stats = JSON.parse(localStorage.getItem('tetris_stats') || '{}');
                stats.gamesPlayed = (stats.gamesPlayed || 0) + 1;
                stats.totalScore = (stats.totalScore || 0) + this.score;
                stats.totalLines = (stats.totalLines || 0) + this.lines;
                stats.maxLevel = Math.max(stats.maxLevel || 0, this.level);
                
                localStorage.setItem('tetris_stats', JSON.stringify(stats));
            }
            
            loadGameData() {
                const highScore = localStorage.getItem('tetris_highScore') || 0;
                if (this.isMobile) {
                    document.getElementById('highScoreMobile').textContent = parseInt(highScore).toLocaleString();
                } else {
                    document.getElementById('highScore').textContent = parseInt(highScore).toLocaleString();
                }
            }
            
            bindEvents() {
                // 키보드 이벤트
                document.addEventListener('keydown', (e) => {
                    if (!this.isPlaying || this.isPaused) return;
                    
                    switch(e.key) {
                        case 'ArrowLeft':
                            this.movePiece(-1, 0);
                            break;
                        case 'ArrowRight':
                            this.movePiece(1, 0);
                            break;
                        case 'ArrowDown':
                            this.movePiece(0, 1);
                            break;
                        case 'ArrowUp':
                            this.rotatePiece();
                            break;
                        case ' ':
                            this.dropPiece();
                            break;
                    }
                    
                    this.draw();
                    e.preventDefault();
                });
            }
        }
        
        // 전역 游戏 인스턴스
        let tetrisGame;
        
        // 游戏 컨트롤 함수들
        function startGame() {
            if (!tetrisGame) {
                tetrisGame = new TetrisGame();
            }
            tetrisGame.startGame();
        }
        
        function pauseGame() {
            if (tetrisGame) {
                tetrisGame.pauseGame();
            }
        }
        
        function resetGame() {
            if (tetrisGame) {
                tetrisGame.resetGame();
            }
        }
        
        function playAgain() {
            resetGame();
            startGame();
        }
        
        function showRecords() {
            const stats = JSON.parse(localStorage.getItem('tetris_stats') || '{}');
            const highScore = localStorage.getItem('tetris_highScore') || 0;
            
            alert(`🏆 俄罗斯方块记录\n\n` +
                  `最高分：${parseInt(highScore).toLocaleString()}\n` +
                  `总游戏次数：${stats.gamesPlayed || 0} 次\n` +
                  `累计分数：${(stats.totalScore || 0).toLocaleString()}\n` +
                  `累计行数：${stats.totalLines || 0} 行\n` +
                  `最高等级：${stats.maxLevel || 0}`);
        }
        
        // 移动端 터치 컨트롤
        function handleTouchMove(direction) {
            if (!tetrisGame || !tetrisGame.isPlaying || tetrisGame.isPaused) return;
            
            switch(direction) {
                case 'left':
                    tetrisGame.movePiece(-1, 0);
                    break;
                case 'right':
                    tetrisGame.movePiece(1, 0);
                    break;
                case 'down':
                    tetrisGame.movePiece(0, 1);
                    break;
                case 'rotate':
                    tetrisGame.rotatePiece();
                    break;
                case 'drop':
                    tetrisGame.dropPiece();
                    break;
            }
            
            tetrisGame.draw();
        }
        
        function handleTouchEnd(direction) {
            // 필요시 터치 종료 처리
        }
        
        // 점수 分享 함수 (游戏 오버 모달용)
        function shareScore() {
            const score = tetrisGame ? tetrisGame.score : 0;
            const level = tetrisGame ? tetrisGame.level : 1;
            const lines = tetrisGame ? tetrisGame.lines : 0;
            
            if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
                Kakao.Share.sendDefault({
                    objectType: 'feed',
                    content: {
                        title: '🎮 俄罗斯方块成绩分享！',
                        description: `分数：${score.toLocaleString()} 分\n等级：${level}\n行数：${lines} 行\n\n一起来玩经典俄罗斯方块，锻炼脑力吧！`,
                        imageUrl: 'https://braindetox.kr/images/tetris_og.png',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/tetris.html',
                            webUrl: 'https://braindetox.kr/tetris.html'
                        }
                    },
                    buttons: [{
                        title: '我也来挑战',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/tetris.html',
                            webUrl: 'https://braindetox.kr/tetris.html'
                        }
                    }]
                });
            } else {
                // 기본 分享 (Web Share API 또는 클립보드)
                const shareText = `🎮 我在俄罗斯方块里拿到了 ${score.toLocaleString()} 分！（等级 ${level}，${lines} 行）\n\nhttps://braindetox.kr/tetris.html`;
                
                if (navigator.share) {
                    navigator.share({
                        title: '俄罗斯方块成绩分享',
                        text: shareText,
                        url: 'https://braindetox.kr/tetris.html'
                    });
                } else {
                    navigator.clipboard.writeText(shareText).then(() => {
                        alert('成绩已复制到剪贴板！');
                    });
                }
            }
        }
        
                    // 소셜 分享 功能
            function initializeSocialSharing() {
                // 分享到KakaoTalk
                const kakaoShareBtn = document.getElementById('kakao-share');
                if (kakaoShareBtn) {
                    kakaoShareBtn.addEventListener('click', function() {
                        if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
                            Kakao.Share.sendDefault({
                                objectType: 'feed',
                                content: {
                                    title: '经典俄罗斯方块游戏',
                                    description: '免费畅玩怀旧方块拼图游戏！使用 7 种俄罗斯方块完成消行，积累分数记录，锻炼你的大脑！',
                                    imageUrl: 'https://braindetox.kr/images/tetris_og.png',
                                    link: {
                                        mobileWebUrl: 'https://braindetox.kr/tetris.html',
                                        webUrl: 'https://braindetox.kr/tetris.html'
                                    }
                                },
                                buttons: [{
                                    title: '马上去玩',
                                    link: {
                                        mobileWebUrl: 'https://braindetox.kr/tetris.html',
                                        webUrl: 'https://braindetox.kr/tetris.html'
                                    }
                                }]
                            });
                        }
                    });
                }

                // 分享到Facebook
                const facebookShareBtn = document.getElementById('facebook-share');
                if (facebookShareBtn) {
                    facebookShareBtn.addEventListener('click', function() {
                        const shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`;
                        window.open(shareUrl, 'facebook-share-dialog', 'width=626,height=436');
                    });
                }

                // X (Twitter) 分享
                const twitterShareBtn = document.getElementById('twitter-share');
                if (twitterShareBtn) {
                    twitterShareBtn.addEventListener('click', function() {
                        const text = '经典俄罗斯方块游戏 - 玩怀旧方块拼图，训练大脑提升专注力！';
                        const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`;
                        window.open(shareUrl, 'twitter-share-dialog', 'width=626,height=436');
                    });
                }

                // 复制链接
                const linkCopyBtn = document.getElementById('link-copy');
                if (linkCopyBtn) {
                    linkCopyBtn.addEventListener('click', function() {
                        navigator.clipboard.writeText(window.location.href).then(function() {
                            alert('链接已复制！');
                        }).catch(function() {
                            const tempTextArea = document.createElement('textarea');
                            tempTextArea.value = window.location.href;
                            document.body.appendChild(tempTextArea);
                            tempTextArea.select();
                            document.execCommand('copy');
                            document.body.removeChild(tempTextArea);
                            alert('链接已复制！');
                        });
                    });
                }
            }

            // 화면 大小 변경 처리
            function handleResize() {
                const wasMobile = tetrisGame ? tetrisGame.isMobile : false;
                const isMobile = window.innerWidth <= 768;
                
                if (wasMobile !== isMobile && tetrisGame) {
                    // 화면 大小가 바뀌면 游戏 재开始
                    location.reload();
                }
            }

            // 페이지 로드시 重置
            document.addEventListener('DOMContentLoaded', function() {
                // 헤더/푸터 로드
                fetch('components/header.html')
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById('header-placeholder').innerHTML = data;
                    })
                    .catch(() => {
                        console.log('Header loading failed - using fallback');
                    });
                
                fetch('components/footer.html')
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById('footer-placeholder').innerHTML = data;
                    })
                    .catch(() => {
                        console.log('Footer loading failed - using fallback');
                    });
                
                // 游戏 重置
                tetrisGame = new TetrisGame();
                
                // 소셜 分享 重置
                initializeSocialSharing();
                
                // 리사이즈 이벤트 처리
                window.addEventListener('resize', handleResize);
                
                // 移动端 터치 이벤트 최적화
                if (window.innerWidth <= 768) {
                    document.addEventListener('touchmove', function(e) {
                        if (e.target.classList.contains('touch-btn') || e.target.classList.contains('control-btn-mobile')) {
                            e.preventDefault();
                        }
                    }, { passive: false });
                    
                    // 터치 버튼 개선
                    document.querySelectorAll('.touch-btn').forEach(btn => {
                        btn.addEventListener('touchend', function(e) {
                            e.preventDefault();
                        });
                    });
                }
            });
    </script>
