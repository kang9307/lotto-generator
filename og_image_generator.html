<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG 이미지 생성기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }
        .generator-section {
            margin-bottom: 50px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 12px;
        }
        .generator-section h2 {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #444;
        }
        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        canvas {
            border: 2px solid #444;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
        .btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-pink {
            background: #ff6b9d;
            color: #fff;
        }
        .btn-pink:hover {
            background: #ff4785;
            transform: scale(1.05);
        }
        .btn-gold {
            background: #f39c12;
            color: #fff;
        }
        .btn-gold:hover {
            background: #e67e22;
            transform: scale(1.05);
        }
        .info {
            text-align: center;
            color: #888;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>OG 이미지 생성기 (1200x630)</h1>

    <!-- MBTI 궁합 테스트 OG -->
    <div class="generator-section">
        <h2 style="color: #ff6b9d;">1. MBTI 궁합 테스트 OG 이미지</h2>
        <div class="canvas-container">
            <canvas id="mbtiCanvas" width="1200" height="630"></canvas>
            <button class="btn btn-pink" onclick="downloadMbti()">다운로드 (mbti_compatibility_og.png)</button>
            <p class="info">저장 위치: static/images/mbti_compatibility_og.png</p>
        </div>
    </div>

    <!-- 띠별 운세 OG -->
    <div class="generator-section">
        <h2 style="color: #f39c12;">2. 띠별 운세 OG 이미지</h2>
        <div class="canvas-container">
            <canvas id="zodiacCanvas" width="1200" height="630"></canvas>
            <button class="btn btn-gold" onclick="downloadZodiac()">다운로드 (fortune_zodiac_og.png)</button>
            <p class="info">저장 위치: static/images/fortune_zodiac_og.png</p>
        </div>
    </div>

    <script>
        // MBTI 궁합 테스트 OG 이미지
        function drawMbtiOG() {
            const canvas = document.getElementById('mbtiCanvas');
            const ctx = canvas.getContext('2d');
            const w = 1200, h = 630;

            // 배경 그라데이션
            const bgGrad = ctx.createLinearGradient(0, 0, w, h);
            bgGrad.addColorStop(0, '#1a0a10');
            bgGrad.addColorStop(0.5, '#2d1020');
            bgGrad.addColorStop(1, '#1a0a10');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // 장식 원들
            ctx.globalAlpha = 0.1;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * w, Math.random() * h, 50 + Math.random() * 150, 0, Math.PI * 2);
                ctx.fillStyle = '#ff6b9d';
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // 하트 아이콘들 (양쪽)
            ctx.font = '80px Arial';
            ctx.fillText('💕', 100, 320);
            ctx.fillText('💕', 1020, 320);

            // 메인 원형 배경
            const centerX = w / 2;
            const centerY = h / 2;

            // 외곽 글로우
            ctx.shadowColor = '#ff6b9d';
            ctx.shadowBlur = 60;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 200, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 107, 157, 0.2)';
            ctx.fill();
            ctx.shadowBlur = 0;

            // 내부 원
            const circleGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 180);
            circleGrad.addColorStop(0, 'rgba(255, 107, 157, 0.3)');
            circleGrad.addColorStop(1, 'rgba(255, 107, 157, 0.1)');
            ctx.beginPath();
            ctx.arc(centerX, centerY, 180, 0, Math.PI * 2);
            ctx.fillStyle = circleGrad;
            ctx.fill();
            ctx.strokeStyle = '#ff6b9d';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 메인 텍스트
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 제목
            ctx.font = 'bold 72px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ff6b9d';
            ctx.shadowBlur = 20;
            ctx.fillText('MBTI 궁합', centerX, centerY - 40);
            ctx.fillText('테스트', centerX, centerY + 50);
            ctx.shadowBlur = 0;

            // 부제목
            ctx.font = '32px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = '#ff6b9d';
            ctx.fillText('두 사람의 성격 궁합을 알아보세요', centerX, h - 120);

            // 태그들
            ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, sans-serif';
            const tags = ['연애', '친구', '직장'];
            const tagWidth = 100;
            const tagSpacing = 20;
            const totalTagWidth = tags.length * tagWidth + (tags.length - 1) * tagSpacing;
            let tagX = centerX - totalTagWidth / 2 + tagWidth / 2;

            tags.forEach(tag => {
                ctx.fillStyle = 'rgba(255, 107, 157, 0.3)';
                roundRect(ctx, tagX - 45, h - 70, 90, 36, 18);
                ctx.fill();
                ctx.strokeStyle = '#ff6b9d';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.fillText(tag, tagX, h - 52);
                tagX += tagWidth + tagSpacing;
            });

            // 브랜드
            ctx.font = '20px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = '#666666';
            ctx.fillText('braindetox.kr', centerX, h - 20);
        }

        // 띠별 운세 OG 이미지
        function drawZodiacOG() {
            const canvas = document.getElementById('zodiacCanvas');
            const ctx = canvas.getContext('2d');
            const w = 1200, h = 630;

            // 배경 그라데이션
            const bgGrad = ctx.createLinearGradient(0, 0, w, h);
            bgGrad.addColorStop(0, '#1a1200');
            bgGrad.addColorStop(0.5, '#2d2010');
            bgGrad.addColorStop(1, '#1a1200');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // 장식 원들
            ctx.globalAlpha = 0.1;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * w, Math.random() * h, 50 + Math.random() * 150, 0, Math.PI * 2);
                ctx.fillStyle = '#f39c12';
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // 12지신 이모지 배치 (원형)
            const zodiacEmojis = ['🐀', '🐂', '🐅', '🐇', '🐉', '🐍', '🐎', '🐐', '🐒', '🐓', '🐕', '🐖'];
            const centerX = w / 2;
            const centerY = h / 2;
            const radius = 250;

            ctx.font = '40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            zodiacEmojis.forEach((emoji, i) => {
                const angle = (i * 30 - 90) * Math.PI / 180;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                ctx.globalAlpha = 0.6;
                ctx.fillText(emoji, x, y);
            });
            ctx.globalAlpha = 1;

            // 중앙 원형 배경
            ctx.shadowColor = '#f39c12';
            ctx.shadowBlur = 60;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 160, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(243, 156, 18, 0.2)';
            ctx.fill();
            ctx.shadowBlur = 0;

            // 내부 원
            const circleGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 150);
            circleGrad.addColorStop(0, 'rgba(243, 156, 18, 0.3)');
            circleGrad.addColorStop(1, 'rgba(243, 156, 18, 0.1)');
            ctx.beginPath();
            ctx.arc(centerX, centerY, 150, 0, Math.PI * 2);
            ctx.fillStyle = circleGrad;
            ctx.fill();
            ctx.strokeStyle = '#f39c12';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 용 이모지 (중앙 상단)
            ctx.font = '70px Arial';
            ctx.fillText('🐲', centerX, centerY - 60);

            // 메인 텍스트
            ctx.font = 'bold 56px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#f39c12';
            ctx.shadowBlur = 20;
            ctx.fillText('띠별 운세', centerX, centerY + 40);
            ctx.shadowBlur = 0;

            // 부제목
            ctx.font = '32px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = '#f39c12';
            ctx.fillText('12지신으로 보는 오늘의 운세', centerX, h - 120);

            // 태그들
            ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, sans-serif';
            const tags = ['종합운', '금전운', '애정운', '건강운'];
            const tagWidth = 100;
            const tagSpacing = 15;
            const totalTagWidth = tags.length * tagWidth + (tags.length - 1) * tagSpacing;
            let tagX = centerX - totalTagWidth / 2 + tagWidth / 2;

            tags.forEach(tag => {
                ctx.fillStyle = 'rgba(243, 156, 18, 0.3)';
                roundRect(ctx, tagX - 45, h - 70, 90, 36, 18);
                ctx.fill();
                ctx.strokeStyle = '#f39c12';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.fillText(tag, tagX, h - 52);
                tagX += tagWidth + tagSpacing;
            });

            // 브랜드
            ctx.font = '20px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = '#666666';
            ctx.fillText('braindetox.kr', centerX, h - 20);
        }

        // 둥근 사각형 헬퍼
        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        // 다운로드 함수
        function downloadMbti() {
            const canvas = document.getElementById('mbtiCanvas');
            const link = document.createElement('a');
            link.download = 'mbti_compatibility_og.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadZodiac() {
            const canvas = document.getElementById('zodiacCanvas');
            const link = document.createElement('a');
            link.download = 'fortune_zodiac_og.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 초기 그리기
        window.onload = function() {
            drawMbtiOG();
            drawZodiacOG();
        };
    </script>
</body>
</html>
