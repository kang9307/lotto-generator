                    <option value="Asia/Tokyo">도쿄 (JST, UTC+9)</option>
                    <option value="America/New_York">뉴욕 (EST, UTC-5)</option>

                    <button class="preset-btn" onclick="addTimezone('Europe/London')">🇬🇧 런던</button>
                    <button class="preset-btn" onclick="addTimezone('Europe/Paris')">🇫🇷 파리</button>
                    <button class="preset-btn" onclick="addTimezone('Australia/Sydney')">🇦🇺 시드니</button>
                    <button class="preset-btn" onclick="addTimezone('Asia/Singapore')">🇸🇬 싱가포르</button>
                </div>
            </div>

            <!-- 포맷 토글 -->
            <div class="format-toggle">
                <button class="format-btn active" onclick="setTimeFormat(24)">24시간</button>
                <button class="format-btn" onclick="setTimeFormat(12)">12시간</button>
            </div>

            <!-- 시간대 카드 그리드 -->
            <div class="timezone-grid" id="timezoneGrid">
                <!-- 동적으로 추가됨 -->
            </div>

            <!-- 시간대 추가 버튼 -->
            <button class="add-timezone-btn" onclick="openModal()">
                <span>+</span> 시간대 추가
            </button>

            <!-- 공유 버튼 -->
            <div class="share-buttons">
                <button class="btn btn-success" onclick="copyTimes()">
                    <span>📋</span> 복사하기
                </button>
                <button class="btn btn-secondary" onclick="shareKakao()">
                    <span>💬</span> 카카오톡 공유
                </button>
                <button class="btn btn-secondary" onclick="resetToNow()">
                    <span>🔄</span> 현재 시간으로
                </button>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 <a href="https://braindetox.kr">BrainDetox</a>. All rights reserved.</p>
            <p style="margin-top: 8px;">시간은 1초마다 자동으로 갱신됩니다.</p>
        </footer>
    </div>

    <!-- 시간대 추가 모달 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">시간대 선택</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="input-group">
                <input type="text" id="timezoneSearch" placeholder="도시 검색..." oninput="filterTimezones()">
            </div>
            <div class="timezone-list" id="timezoneList">
                <!-- 동적으로 생성됨 -->
            </div>
        </div>
    </div>

    <!-- 토스트 -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== 시간대 데이터 ==========
        const TIMEZONES = [
            { id: 'Asia/Seoul', city: '서울', country: '한국', offset: 'UTC+9', flag: '🇰🇷' },
            { id: 'Asia/Tokyo', city: '도쿄', country: '일본', offset: 'UTC+9', flag: '🇯🇵' },
            { id: 'Asia/Shanghai', city: '상하이', country: '중국', offset: 'UTC+8', flag: '🇨🇳' },
            { id: 'Asia/Hong_Kong', city: '홍콩', country: '홍콩', offset: 'UTC+8', flag: '🇭🇰' },
            { id: 'Asia/Singapore', city: '싱가포르', country: '싱가포르', offset: 'UTC+8', flag: '🇸🇬' },
            { id: 'Asia/Bangkok', city: '방콕', country: '태국', offset: 'UTC+7', flag: '🇹🇭' },
            { id: 'Asia/Dubai', city: '두바이', country: 'UAE', offset: 'UTC+4', flag: '🇦🇪' },
            { id: 'Asia/Kolkata', city: '뭄바이', country: '인도', offset: 'UTC+5:30', flag: '🇮🇳' },
            { id: 'Europe/London', city: '런던', country: '영국', offset: 'UTC+0', flag: '🇬🇧' },
            { id: 'Europe/Paris', city: '파리', country: '프랑스', offset: 'UTC+1', flag: '🇫🇷' },
            { id: 'Europe/Berlin', city: '베를린', country: '독일', offset: 'UTC+1', flag: '🇩🇪' },
            { id: 'Europe/Moscow', city: '모스크바', country: '러시아', offset: 'UTC+3', flag: '🇷🇺' },
            { id: 'America/New_York', city: '뉴욕', country: '미국', offset: 'UTC-5', flag: '🇺🇸' },
            { id: 'America/Los_Angeles', city: '로스앤젤레스', country: '미국', offset: 'UTC-8', flag: '🇺🇸' },
            { id: 'America/Chicago', city: '시카고', country: '미국', offset: 'UTC-6', flag: '🇺🇸' },
            { id: 'America/Toronto', city: '토론토', country: '캐나다', offset: 'UTC-5', flag: '🇨🇦' },
            { id: 'America/Sao_Paulo', city: '상파울루', country: '브라질', offset: 'UTC-3', flag: '🇧🇷' },
            { id: 'Australia/Sydney', city: '시드니', country: '호주', offset: 'UTC+11', flag: '🇦🇺' },
            { id: 'Pacific/Auckland', city: '오클랜드', country: '뉴질랜드', offset: 'UTC+13', flag: '🇳🇿' },
            { id: 'UTC', city: 'UTC', country: '협정 세계시', offset: 'UTC+0', flag: '🌐' }
        ];

        // ========== 상태 관리 ==========
        const state = {
            selectedTimezones: ['Asia/Seoul', 'America/New_York', 'Europe/London'],
            timeFormat: 24,
            sourceTimezone: 'Asia/Seoul',
            customDateTime: null
        };

        // ========== 카카오 SDK 초기화 ==========
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }
            initializeTimezoneList();
            renderTimezoneCards();
            updateAllTimes();
            setInterval(updateAllTimes, 1000);
        });

        // ========== 시간대 목록 초기화 ==========
        function initializeTimezoneList() {
            const list = document.getElementById('timezoneList');
            list.innerHTML = TIMEZONES.map(tz => `
                <div class="timezone-option" onclick="selectTimezone('${tz.id}')">
                    <div class="timezone-option-city">${tz.flag} ${tz.city}</div>
                    <div class="timezone-option-offset">${tz.country} · ${tz.offset}</div>
                </div>
            `).join('');
        }

        // ========== 시간대 필터 ==========
        function filterTimezones() {
            const query = document.getElementById('timezoneSearch').value.toLowerCase();
            const list = document.getElementById('timezoneList');
            const filtered = TIMEZONES.filter(tz =>
                tz.city.toLowerCase().includes(query) ||
                tz.country.toLowerCase().includes(query)
            );
            list.innerHTML = filtered.map(tz => `
                <div class="timezone-option" onclick="selectTimezone('${tz.id}')">
                    <div class="timezone-option-city">${tz.flag} ${tz.city}</div>
                    <div class="timezone-option-offset">${tz.country} · ${tz.offset}</div>
                </div>
            `).join('');
        }

        // ========== 시간대 추가 ==========
        function addTimezone(tzId) {
            if (state.selectedTimezones.includes(tzId)) {
                showToast('이미 추가된 시간대입니다.');
                return;
            }
            if (state.selectedTimezones.length >= 8) {
                showToast('최대 8개까지 추가할 수 있습니다.');
                return;
            }
            state.selectedTimezones.push(tzId);
            renderTimezoneCards();
            updateAllTimes();
            showToast('시간대가 추가되었습니다.');
        }

        // ========== 시간대 선택 (모달에서) ==========
        function selectTimezone(tzId) {
            addTimezone(tzId);
            closeModal();
        }

        // ========== 시간대 제거 ==========
        function removeTimezone(tzId) {
            if (state.selectedTimezones.length <= 1) {
                showToast('최소 1개의 시간대가 필요합니다.');
                return;
            }
            state.selectedTimezones = state.selectedTimezones.filter(id => id !== tzId);
            renderTimezoneCards();
            updateAllTimes();
        }

        // ========== 시간대 카드 렌더링 ==========
        function renderTimezoneCards() {
            const grid = document.getElementById('timezoneGrid');
            grid.innerHTML = state.selectedTimezones.map(tzId => {
                const tz = TIMEZONES.find(t => t.id === tzId) || { city: tzId, offset: '', flag: '🌐' };
                const isSource = tzId === state.sourceTimezone;
                return `
                    <div class="timezone-card ${isSource ? 'source' : ''}" data-tz="${tzId}">
                        <button class="timezone-remove" onclick="removeTimezone('${tzId}')">&times;</button>
                        <div class="timezone-city">${tz.flag} ${tz.city}</div>
                        <div class="timezone-offset">${tz.offset}</div>
                        <div class="timezone-time" id="time-${tzId.replace(/\//g, '-')}">--:--</div>
                        <div class="timezone-date" id="date-${tzId.replace(/\//g, '-')}">--</div>
                        <div class="timezone-diff" id="diff-${tzId.replace(/\//g, '-')}"></div>
                    </div>
                `;
            }).join('');
        }

        // ========== 시간 업데이트 ==========
        function updateAllTimes() {
            const customInput = document.getElementById('customDateTime').value;
            const baseDate = customInput ? new Date(customInput) : new Date();

            // 현재 시간 표시
            const currentTimeEl = document.getElementById('currentTime');
            const currentDateEl = document.getElementById('currentDate');
            const now = new Date();
            currentTimeEl.textContent = formatTime(now);
            currentDateEl.textContent = formatDate(now);

            // 기준 시간대
            const sourceTimezone = document.getElementById('sourceTimezone').value;
            state.sourceTimezone = sourceTimezone;

            // 각 시간대 업데이트
            state.selectedTimezones.forEach(tzId => {
                const timeEl = document.getElementById(`time-${tzId.replace(/\//g, '-')}`);
                const dateEl = document.getElementById(`date-${tzId.replace(/\//g, '-')}`);
                const diffEl = document.getElementById(`diff-${tzId.replace(/\//g, '-')}`);

                if (timeEl && dateEl) {
                    const options = {
                        timeZone: tzId,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: state.timeFormat === 12
                    };
                    const dateOptions = {
                        timeZone: tzId,
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        weekday: 'short'
                    };

                    timeEl.textContent = baseDate.toLocaleTimeString('ko-KR', options);
                    dateEl.textContent = baseDate.toLocaleDateString('ko-KR', dateOptions);

                    // 시차 계산
                    if (diffEl) {
                        const sourceDateStr = baseDate.toLocaleString('en-US', { timeZone: sourceTimezone });
                        const targetDateStr = baseDate.toLocaleString('en-US', { timeZone: tzId });
                        const sourceDate = new Date(sourceDateStr);
                        const targetDate = new Date(targetDateStr);
                        const diffHours = (targetDate - sourceDate) / (1000 * 60 * 60);

                        if (tzId === sourceTimezone) {
                            diffEl.textContent = '기준 시간대';
                        } else if (diffHours > 0) {
                            diffEl.textContent = `+${diffHours}시간`;
                        } else if (diffHours < 0) {
                            diffEl.textContent = `${diffHours}시간`;
                        } else {
                            diffEl.textContent = '동일';
                        }
                    }
                }
            });

            // 카드 스타일 업데이트
            document.querySelectorAll('.timezone-card').forEach(card => {
                card.classList.remove('source');
                if (card.dataset.tz === sourceTimezone) {
                    card.classList.add('source');
                }
            });
        }

        // ========== 시간 포맷 ==========
        function formatTime(date) {
            const options = {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: state.timeFormat === 12
            };
            return date.toLocaleTimeString('ko-KR', options);
        }

        function formatDate(date) {
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            };
            return date.toLocaleDateString('ko-KR', options);
        }

        // ========== 시간 포맷 설정 ==========
        function setTimeFormat(format) {
            state.timeFormat = format;
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            updateAllTimes();
        }

        // ========== 현재 시간으로 리셋 ==========
        function resetToNow() {
            document.getElementById('customDateTime').value = '';
            updateAllTimes();
            showToast('현재 시간으로 설정되었습니다.');
        }

        // ========== 모달 제어 ==========
        function openModal() {
            document.getElementById('modalOverlay').classList.add('show');
            document.getElementById('timezoneSearch').value = '';
            filterTimezones();
        }

        function closeModal(event) {
            if (!event || event.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').classList.remove('show');
            }
        }

        // ========== 복사 ==========
        function copyTimes() {
            const lines = state.selectedTimezones.map(tzId => {
                const tz = TIMEZONES.find(t => t.id === tzId) || { city: tzId, flag: '🌐' };
                const timeEl = document.getElementById(`time-${tzId.replace(/\//g, '-')}`);
                const dateEl = document.getElementById(`date-${tzId.replace(/\//g, '-')}`);
                return `${tz.flag} ${tz.city}: ${timeEl?.textContent || ''} (${dateEl?.textContent || ''})`;
            });

            const text = `🌍 시간대 비교\n\n${lines.join('\n')}\n\n🔗 braindetox.kr/static/timezone_converter.html`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('클립보드에 복사되었습니다.');
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('클립보드에 복사되었습니다.');
            } catch (err) {
                showToast('복사에 실패했습니다.');
            }
            document.body.removeChild(textarea);
        }

        // ========== 카카오톡 공유 ==========
        function shareKakao() {
            if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
                showToast('카카오톡 공유를 준비 중입니다.');
                return;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: '시간대 변환기 - 전 세계 시간 비교',
                    description: '전 세계 시간대를 쉽게 비교하고 변환하세요. 주요 도시의 현재 시간을 실시간으로 확인!',
                    imageUrl: 'https://braindetox.kr/site_logo.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/static/timezone_converter.html',
                        webUrl: 'https://braindetox.kr/static/timezone_converter.html'
                    }
                },
                buttons: [
                    {
                        title: '시간대 변환기 사용하기',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/static/timezone_converter.html',
                            webUrl: 'https://braindetox.kr/static/timezone_converter.html'
                        }
                    }
                ]
            });
        }

        // ========== 토스트 ==========
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

    </script>
</body>
</html>
