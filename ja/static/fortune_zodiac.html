            padding: 16px;

            background: var(--gold-gradient);

            margin-bottom: 20px;

            gap: 12px;

        .lucky-item {

            padding: 16px 12px;
            text-align: center;

        }

        .lucky-value {

        /* Footer */

            color: var(--text-muted);
            font-size: 0.75rem;
            background: var(--bg-secondary);

            gap: 16px;
            margin-bottom: 8px;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2000;
        }

        .toast.show {
            opacity: 1;
        }

        /* Install Banner */
        .install-banner {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            max-width: 448px;

            z-index: 1500;
            animation: slideUp 0.3s ease;
        }

        .install-banner.show {
            display: block;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .install-banner-close {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;

        .install-banner-header {

        .step-num {
            width: 20px;

        .install-banner-buttons {

            gap: 8px;
        }

        .btn-later, .btn-dismiss {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-later {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-dismiss {
            background: var(--accent);
            border: none;
            color: white;
        }

        /* Responsive */
        @media (min-width: 481px) {
            .container {
                border-left: 1px solid var(--border-color);

        }

        @media (max-width: 360px) {
            .zodiac-icon {
                font-size: 4rem;
            }
            .lucky-section {
                gap: 8px;
            }
            .lucky-item {
                padding: 12px 8px;
            }
        }
    </style>

        // 運勢メッセージのプール
        const FORTUNE_MESSAGES = {
            overall: [
                { level: 5, messages: ['天の運気が味方する最高の日です。すべてが順調に進み、思いがけない幸運が訪れる可能性があります。自信を持って積極的に行動しましょう。', '今日はすべてがあなたの味方です。大きな決断を下すのに良い日で、新しいスタートを切るのにも向いています。'] },

                { level: 2, messages: ['疲れがたまりやすい日です。十分な休息を取りましょう。', '免疫力の管理に気を配りましょう。過労を避けるのが賢明です。'] },

        const LUCKY_COLORS = ['赤', 'オレンジ', '黄', '緑', '青', '紺', '紫', 'ピンク', '白', '黒', '金', '銀'];
        const LUCKY_DIRECTIONS = ['東', '西', '南', '北', '南東', '北東', '南西', '北西'];

        // ========================================
        // State
        // ========================================
        let currentResult = null;

        // ========================================
        // Zodiac Calculation
        // ========================================
        function getZodiac(year) {
            const index = (year - 1900) % 12;
            return ZODIAC_ORDER[index < 0 ? index + 12 : index];
        }

        // ========================================
        // Seeded Random for Consistent Fortune
        // ========================================
        function getDailySeed(zodiacKey) {
            const today = new Date();
            const dateString = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
            const zodiacValue = zodiacKey.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            return parseInt(dateString) + zodiacValue;
        }

        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function selectFromArray(array, seed) {
            const index = Math.floor(seededRandom(seed) * array.length);
            return array[index];
        }

        // ========================================
        // Fortune Generation
        // ========================================
        function generateDailyFortune(zodiacKey) {
            const baseSeed = getDailySeed(zodiacKey);

            // 各運勢のレベルを決定(1-5)
            const overallLevel = Math.floor(seededRandom(baseSeed) * 5) + 1;
            const moneyLevel = Math.floor(seededRandom(baseSeed + 1000) * 5) + 1;
            const loveLevel = Math.floor(seededRandom(baseSeed + 2000) * 5) + 1;
            const healthLevel = Math.floor(seededRandom(baseSeed + 3000) * 5) + 1;

            // メッセージを選択
            const overallMsg = selectFromArray(FORTUNE_MESSAGES.overall.find(f => f.level === overallLevel).messages, baseSeed + 100);
            const moneyMsg = selectFromArray(FORTUNE_MESSAGES.money.find(f => f.level === moneyLevel).messages, baseSeed + 1100);
            const loveMsg = selectFromArray(FORTUNE_MESSAGES.love.find(f => f.level === loveLevel).messages, baseSeed + 2100);
            const healthMsg = selectFromArray(FORTUNE_MESSAGES.health.find(f => f.level === healthLevel).messages, baseSeed + 3100);

            // ラッキー情報
            const luckyNumbers = [];
            for (let i = 0; i < 3; i++) {
                let num;
                do {
                    num = Math.floor(seededRandom(baseSeed + 4000 + i * 100) * 45) + 1;
                } while (luckyNumbers.includes(num));
                luckyNumbers.push(num);
            }
            luckyNumbers.sort((a, b) => a - b);

            const luckyColor = selectFromArray(LUCKY_COLORS, baseSeed + 5000);
            const luckyDirection = selectFromArray(LUCKY_DIRECTIONS, baseSeed + 6000);

            return {
                overall: { level: overallLevel, message: overallMsg },
                money: { level: moneyLevel, message: moneyMsg },
                love: { level: loveLevel, message: loveMsg },
                health: { level: healthLevel, message: healthMsg },
                lucky: {
                    numbers: luckyNumbers.join(', '),
                    color: luckyColor,
                    direction: luckyDirection
                }
            };
        }

        function generateYearFortune(zodiacKey) {
            const currentYear = new Date().getFullYear();
            const yearZodiac = getZodiac(currentYear);
            const seed = currentYear * 100 + ZODIAC_ORDER.indexOf(zodiacKey);

            const level = Math.floor(seededRandom(seed) * 5) + 1;
            const zodiacName = ZODIAC_DATA[zodiacKey].name;

            const yearMessages = {
                5: `${currentYear}年は${zodiacName}にとって最高の一年になるでしょう!新しいチャンスが豊富で、努力した分だけ成果を得られます。挑戦を恐れないでください。`,
                4: `${currentYear}年、${zodiacName}の運勢は上昇カーブを描きます。上半期に基盤を固め、下半期に収穫するパターンが見込まれます。`,
                3: `${currentYear}年は安定した一年です。急激な変化よりも、着実さで目標に向かって進みましょう。忍耐が実を結びます。`,
                2: `${currentYear}年は成長のための準備期間です。目先の結果より、未来への投資に集中すると良いでしょう。`,
                1: `${currentYear}年は内面を磨く時間です。健康や家族により気を配り、新年の幸運を待ちましょう。`
            };

            return {
                year: currentYear,
                message: yearMessages[level]
            };
        }

        function getLevelText(level) {
            const texts = ['', '注意', '無難', '良好', '好調', '絶好調'];
            return texts[level];
        }

        function getStars(level) {
            return '★'.repeat(level) + '☆'.repeat(5 - level);
        }

        // ========================================
        // Main Functions
        // ========================================
        function checkFortune() {
            const birthdate = document.getElementById('birthdate').value;

            if (!birthdate) {
                showToast('生年月日を入力してください');
                return;
            }

            vibrate();

            const birthYear = new Date(birthdate).getFullYear();
            const zodiacKey = getZodiac(birthYear);
            const zodiacInfo = ZODIAC_DATA[zodiacKey];
            const fortune = generateDailyFortune(zodiacKey);
            const yearFortune = generateYearFortune(zodiacKey);

            currentResult = { zodiacKey, zodiacInfo, birthYear, fortune, yearFortune };

            // Zodiac Info
            document.getElementById('zodiac-icon').textContent = zodiacInfo.icon;
            document.getElementById('zodiac-name').textContent = zodiacInfo.name;
            document.getElementById('zodiac-year').textContent = `${birthYear}年生まれ`;
            document.getElementById('zodiac-element').textContent = zodiacInfo.element;

            // Personality
            document.getElementById('personality-text').textContent = zodiacInfo.personality;
            document.getElementById('traits').innerHTML = zodiacInfo.traits.map(t => `<span class="trait-tag">${t}</span>`).join('');

            // Fortune
            document.getElementById('overall-stars').textContent = getStars(fortune.overall.level);
            document.getElementById('overall-level').textContent = getLevelText(fortune.overall.level);
            document.getElementById('overall-message').textContent = fortune.overall.message;

            document.getElementById('money-stars').textContent = getStars(fortune.money.level);
            document.getElementById('money-level').textContent = getLevelText(fortune.money.level);
            document.getElementById('money-message').textContent = fortune.money.message;

            document.getElementById('love-stars').textContent = getStars(fortune.love.level);
            document.getElementById('love-level').textContent = getLevelText(fortune.love.level);
            document.getElementById('love-message').textContent = fortune.love.message;

            document.getElementById('health-stars').textContent = getStars(fortune.health.level);
            document.getElementById('health-level').textContent = getLevelText(fortune.health.level);
            document.getElementById('health-message').textContent = fortune.health.message;

            // Lucky
            document.getElementById('lucky-numbers').textContent = fortune.lucky.numbers;
            document.getElementById('lucky-color').textContent = fortune.lucky.color;
            document.getElementById('lucky-direction').textContent = fortune.lucky.direction;

            // Year Fortune
            document.getElementById('year-fortune-title').textContent = `${yearFortune.year}年の運勢`;
            document.getElementById('year-fortune-text').textContent = yearFortune.message;

            // Show result
            document.getElementById('result-section').classList.add('show');
            document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
        }

        function switchFortuneTab(tabName) {
            // Tabs
            document.querySelectorAll('.fortune-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.tab === tabName);
            });

            // Contents
            document.querySelectorAll('.fortune-content').forEach(content => {
                content.classList.toggle('active', content.id === `fortune-${tabName}`);
            });
        }

        // ========================================
        // Share Functions
        // ========================================
        function shareKakao() {
            if (!Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            let title = '干支別運勢 - 十二支で見る今日の運勢';
            let description = '生年月日から分かる干支別運勢をチェックしましょう!';

            if (currentResult) {
                title = `${currentResult.zodiacInfo.icon} ${currentResult.zodiacInfo.name} 今日の運勢`;
                description = `総合運 ${getStars(currentResult.fortune.overall.level)} - 干支別運勢をチェックしましょう!`;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: title,
                    description: description,
                    imageUrl: 'https://braindetox.kr/static/images/fortune_zodiac_og.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/ja/static/fortune_zodiac.html',
                        webUrl: 'https://braindetox.kr/ja/static/fortune_zodiac.html'

                },
                buttons: [{
                    title: '自分の運勢を見る',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/ja/static/fortune_zodiac.html',
                        webUrl: 'https://braindetox.kr/ja/static/fortune_zodiac.html'
                    }
                }]
            });

        function copyResult() {
            let text = `🐲 干支別運勢\n\n生年月日から分かる十二支の今日の運勢\n\n👉 https://braindetox.kr/ja/static/fortune_zodiac.html`;

            if (currentResult) {
                text = `${currentResult.zodiacInfo.icon} ${currentResult.zodiacInfo.name} 今日の運勢\n\n総合運: ${getStars(currentResult.fortune.overall.level)}\nラッキーナンバー: ${currentResult.fortune.lucky.numbers}\nラッキーカラー: ${currentResult.fortune.lucky.color}\n\n👉 https://braindetox.kr/ja/static/fortune_zodiac.html`;
            }

            navigator.clipboard.writeText(text).then(() => {
                showToast('コピーしました');
            }).catch(() => {
                showToast('コピーに失敗しました');
            });
        }

        // ========================================
        // Utility Functions
        // ========================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function vibrate() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            const weekday = weekdays[date.getDay()];
            return `${year}年 ${month}月 ${day}日 (${weekday})`;
        }

        // ========================================
        // PWA Install Banner
        // ========================================
        function showInstallBanner() {
            if (localStorage.getItem('fortune_zodiac_installDismissed') === 'forever') return;
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            if (sessionStorage.getItem('fortune_zodiac_installDismissed')) return;

            const banner = document.getElementById('install-banner');
            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);

            if (isIOS) {
                document.getElementById('ios-steps').style.display = 'block';
            } else if (isAndroid) {
                document.getElementById('android-steps').style.display = 'block';
            } else {
                document.getElementById('desktop-steps').style.display = 'block';
            }

            setTimeout(() => banner.classList.add('show'), 5000);
        }

        function closeInstallBanner() {
            document.getElementById('install-banner').classList.remove('show');
            sessionStorage.setItem('fortune_zodiac_installDismissed', 'true');
        }

        function closeInstallBannerForever() {
            document.getElementById('install-banner').classList.remove('show');
            localStorage.setItem('fortune_zodiac_installDismissed', 'forever');
        }

        // ========================================
        // Service Worker
        // ========================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/fortune_zodiac_sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed'));
        }

        // ========================================
        // Init
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('today-date').textContent = formatDate(new Date());
            showInstallBanner();

            // Set default date to reasonable year
            const dateInput = document.getElementById('birthdate');
            dateInput.max = new Date().toISOString().split('T')[0];
        });
