    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-muted: #636366;
            --accent: #ff9500;
            --accent-hover: #ffaa33;
            --border-color: #3a3a3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 20px;
            text-align: center;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Slot Machine Area */
        .slot-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .slot-machine {
            width: 100%;
            max-width: 320px;
            height: 200px;
            background: var(--bg-secondary);
            border-radius: 24px;
            border: 2px solid var(--border-color);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot-window {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .slot-items {
            position: absolute;
            width: 100%;
            transition: transform 0.1s ease-out;
        }

        .slot-item {
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .slot-emoji {
            font-size: 4rem;
            margin-bottom: 12px;
        }

        .slot-text {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .slot-category {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 8px;
            padding: 4px 16px;
            background: var(--bg-tertiary);
            border-radius: 12px;
        }

        /* Spin Button */
        .spin-btn {
            margin-top: 32px;
            padding: 18px 64px;
            font-size: 1.2rem;
            font-weight: 700;
            background: var(--accent);
            color: var(--text-primary);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(255, 149, 0, 0.3);
        }

        .spin-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        .spin-btn:active {
            transform: scale(0.98);
        }

        .spin-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Result Actions */
        .result-actions {
            display: none;
            gap: 12px;
            margin-top: 24px;
        }

        .result-actions.show {
            display: flex;
        }

        /* Share Actions (항상 보임) */
        .share-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .action-btn {
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .btn-retry {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-retry:hover {
            border-color: var(--accent);
        }

        .btn-share {
            background: #fee500;
            color: #000;
            border: none;
        }

        .btn-copy {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        /* History */
        .history-section {
            padding: 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .history-clear {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
        }

        .history-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .history-list::-webkit-scrollbar {
            display: none;
        }

        .history-item {
            flex-shrink: 0;
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border-radius: 16px;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        /* Footer */
        .footer {
            padding: 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 8px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* Install Banner */
        .install-banner {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 1500;
            display: none;
            animation: slideUp 0.3s ease;
            border: 1px solid var(--border-color);
            max-width: 448px;
            margin: 0 auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .install-banner.show {
            display: block;
        }

        .install-banner-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .install-banner-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #ff9500 0%, #ff6b6b 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .install-banner-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .install-banner-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .install-banner-close {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .install-steps {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .install-step {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .install-step:last-child {
            margin-bottom: 0;
        }

        .step-num {
            width: 20px;
            height: 20px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .install-banner-buttons {
            display: flex;
            gap: 8px;
        }

        .install-banner-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-later {
            background: var(--bg-tertiary);
            border: none;
            color: white;
        }

        .btn-dismiss {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (min-width: 481px) {
            .container {
                border-left: 1px solid var(--border-color);
                border-right: 1px solid var(--border-color);
            }
        }

        @media (max-height: 700px) {
            .slot-machine {
                height: 160px;
            }
            .slot-item {
                height: 160px;
            }
            .slot-emoji {
                font-size: 3rem;
            }
            .slot-text {
                font-size: 1.5rem;
            }
            .slot-area {
                padding: 20px;
            }
        }
    </style>

            '제육볶음', '보쌈', '족발', '닭갈비', '찜닭', '닭볶음탕', '닭한마리', '양념치킨', '후라이드치킨',

            // 돈까스/튀김류 (15)
            '돈까스', '치즈돈까스', '생선까스', '치킨까스', '등심돈까스', '안심돈까스', '왕돈까스', '카레돈까스',
            '탕수육', '깐풍기', '유린기', '꿔바로우', '새우튀김', '오징어튀김', '야채튀김',

            // 分식류 (15)
            '떡볶이', '라볶이', '로제떡볶이', '즉석떡볶이', '순대', '김밥', '튀김', '오뎅', '어묵탕',
            '라면', '쫄면', '만두', '군만두', '물만두', '찐만두',

            // 해산물류 (15)
            '회', '회덮밥', '물회', '매운탕', '생선구이', '고등어구이', '삼치구이', '갈치조림', '조기구이',
            '꽃게찜', '간장게장', '양념게장', '새우구이', '낙지볶음', '오징어볶음',

            // 전/부침류 (10)
            '파전', '해물파전', '김치전', '감자전', '녹두전', '빈대떡', '동그랑땡', '부추전', '호박전', '계란말이',

            // 양식류 (25)
            '피자', '스파게티', '파스타', '카르보나라', '로제파스타', '알리오올리오', '봉골레', '크림파스타',
            '햄버거', '치즈버거', '베이컨버거', '스테이크', '함박스테이크', '리조또', '오믈라이스',
            '샌드위치', '토스트', '샐러드', '시저샐러드', '연어샐러드', '감바스', '필라프', '도리아', '그라탕', '나폴리탄',

            // 日식류 (15)
            '秒밥', '돈부리', '가츠동', '규동', '오야코동', '텐동', '카레라이스', '日본카레',
            '우동', '소바', '규카츠', '사시미', '타코야키', '야키소바', '오코노미야키',

            // 중식류 (10)
            '마라탕', '마라샹궈', '훠궈', '양장피', '깐쇼새우', '팔보채', '고추잡채', '라조기', '유산슬', '짬뽕밥'
        ];

        const EMOJIS = ['🍚', '🍲', '🥢', '🍜', '🥘', '🍖', '🥓', '🍗', '🍝', '🍕', '🍔', '🥩', '🥗', '🍣', '🍱', '🍛', '🍤'];

        // ========================================
        // State
        // ========================================
        let isSpinning = false;
        let lastResult = null;
        let history = JSON.parse(localStorage.getItem('menuHistory') || '[]');

        // ========================================
        // Spin Function
        // ========================================
        function spin() {
            if (isSpinning) return;

            isSpinning = true;
            const spinBtn = document.getElementById('spin-btn');
            const resultActions = document.getElementById('result-actions');
            const slotItems = document.getElementById('slot-items');

            spinBtn.disabled = true;
            resultActions.classList.remove('show');
            vibrate();

            // Final result (pick first so it's at the end of animation)
            const finalMenu = MENUS[Math.floor(Math.random() * MENUS.length)];
            const finalEmoji = getRandomEmoji();

            // Generate random sequence for animation (19 random + 1 final = 20 total)
            const spinCount = 20;
            const items = [];
            for (let i = 0; i < spinCount - 1; i++) {
                const randomMenu = MENUS[Math.floor(Math.random() * MENUS.length)];
                const emoji = getRandomEmoji();
                items.push({ menu: randomMenu, emoji });
            }
            // Add final result as last item
            items.push({ menu: finalMenu, emoji: finalEmoji });

            // Build slot items HTML
            let html = '';
            items.forEach(item => {
                html += `
                    <div class="slot-item">
                        <div class="slot-emoji">${item.emoji}</div>
                        <div class="slot-text">${item.menu}</div>
                    </div>
                `;
            });
            slotItems.innerHTML = html;

            // Animate
            let currentIndex = 0;
            const itemHeight = 200;
            let speed = 50;

            function animateStep() {
                if (currentIndex >= spinCount) {
                    // Animation complete
                    isSpinning = false;
                    spinBtn.disabled = false;
                    resultActions.classList.add('show');

                    // Save result
                    lastResult = { menu: finalMenu, emoji: finalEmoji };

                    // Add to history
                    addToHistory(finalMenu);

                    return;
                }

                slotItems.style.transform = `translateY(-${currentIndex * itemHeight}px)`;
                currentIndex++;

                // Slow down towards end
                if (currentIndex > spinCount - 5) {
                    speed += 30;
                }

                vibrate();
                setTimeout(animateStep, speed);
            }

            slotItems.style.transform = 'translateY(0)';
            setTimeout(animateStep, speed);
        }

        function getRandomEmoji() {
            return EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
        }

        // ========================================
        // History
        // ========================================
        function addToHistory(menu) {
            // Remove if exists
            history = history.filter(m => m !== menu);
            // Add to front
            history.unshift(menu);
            // Keep only last 10
            history = history.slice(0, 10);
            // Save
            localStorage.setItem('menuHistory', JSON.stringify(history));
            // Update UI
            renderHistory();
        }

        function renderHistory() {
            const section = document.getElementById('history-section');
            const list = document.getElementById('history-list');

            if (history.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            list.innerHTML = history.map(menu => `<span class="history-item">${menu}</span>`).join('');
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('menuHistory');
            renderHistory();
            showToast('기록이 削除되었습니다');
            vibrate();
        }

        // ========================================
        // Share Functions
        // ========================================
        function shareKakao() {
            if (!window.Kakao) {
                showToast('카카오톡 SDK 로드 失敗');
                return;
            }

            if (!Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: '今日 뭐 먹지? - ランチメニュー おすすめ',
                    description: 'ランチメニュー 고민될 때! 한국인이 좋아하는 200가지 メニュー 중 ランダム おすすめ받아 보세요 🍽️',
                    imageUrl: 'https://braindetox.kr/static/images/random_menu_og.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/static/random_menu.html',
                        webUrl: 'https://braindetox.kr/static/random_menu.html'
                    }
                },
                buttons: [
                    {
                        title: 'メニュー 뽑으러 가기',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/static/random_menu.html',
                            webUrl: 'https://braindetox.kr/static/random_menu.html'
                        }
                    }
                ]
            });
        }

        function copyResult() {
            const text = `🍽️ 今日 뭐 먹지?\n\nランチメニュー 고민될 때! 200가지 メニュー 중 ランダム おすすめ받아 보세요.\n\n👉 https://braindetox.kr/static/random_menu.html`;

            navigator.clipboard.writeText(text).then(() => {
                showToast('コピーしました！');
            }).catch(() => {
                showToast('コピー 失敗');
            });
        }

        // ========================================
        // Utilities
        // ========================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function vibrate() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        // ========================================
        // Install Banner
        // ========================================
        function showInstallBanner() {
            if (localStorage.getItem('menu_installDismissed') === 'forever') return;
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            if (sessionStorage.getItem('menu_installDismissed')) return;

            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);

            if (isIOS) {
                document.getElementById('ios-steps').style.display = 'block';
            } else if (isAndroid) {
                document.getElementById('android-steps').style.display = 'block';
            } else {
                document.getElementById('desktop-steps').style.display = 'block';
            }

            setTimeout(() => {
                document.getElementById('install-banner').classList.add('show');
            }, 5000);
        }

        function closeInstallBanner() {
            document.getElementById('install-banner').classList.remove('show');
            sessionStorage.setItem('menu_installDismissed', 'true');
        }

        function closeInstallBannerForever() {
            document.getElementById('install-banner').classList.remove('show');
            localStorage.setItem('menu_installDismissed', 'forever');
            showToast('다시 표시하지 않습니다');
        }

        // ========================================
        // Initialize
        // ========================================
        function init() {
            renderHistory();

            // Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/static/random_menu_sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            }

            showInstallBanner();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
