    <style>
        :root {

            --border-color: #334155;

            --success-light: rgba(16, 185, 129, 0.1);

            --warning-light: rgba(245, 158, 11, 0.1);
            --error: #ef4444;

            --gradient-decode: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);

            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.4);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;

            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;

            max-width: 800px;

            padding: 20px 16px 40px;
        }

            text-align: center;
            margin-bottom: 32px;
            padding-top: 20px;

            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
        }

        /* 模式切换 */
        .mode-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .mode-toggle-group {
            display: flex;
            gap: 4px;
            background: var(--bg-secondary);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);

        .mode-btn {
            padding: 12px 28px;
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .mode-btn:hover {
            color: var(--text-primary);
            background: var(--bg-card-hover);
        }

        .mode-btn.active-encode {
            background: var(--gradient-encode);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .mode-btn.active-decode {
            background: var(--gradient-decode);
            color: white;
            box-shadow: var(--shadow-md);
        }

        /* 卡片 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-light);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .char-count {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            padding: 4px 10px;
            background: var(--bg-primary);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* 文本区域 */
        .textarea-wrapper {
            position: relative;
        }

        .editor-textarea {
            width: 100%;
            min-height: 200px;
            padding: 16px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 14px;
            line-height: 1.7;
            resize: vertical;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .editor-textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .editor-textarea::placeholder {
            color: var(--text-muted);
        }

        .code-output {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
        }

        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }

        .btn-success {
            background: var(--gradient-success);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-danger {
            background: var(--error-light);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: var(--error);
            color: white;
        }

        /* 实时转换开关 */
        .realtime-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .realtime-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            cursor: pointer;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--border-color);
            border-radius: 12px;
            transition: all 0.3s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: var(--accent);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(20px);
        }

        /* 操作按钮组 */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-convert {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: var(--radius-md);
        }

        .btn-convert.encode {
            background: var(--gradient-encode);
            color: white;
        }

        .btn-convert.decode {
            background: var(--gradient-decode);
            color: white;
        }

        .btn-convert:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* 错误消息 */
        .error-bar {
            display: none;
            padding: 12px 16px;
            background: var(--error-light);
            border: 1px solid var(--error);
            border-radius: var(--radius-sm);
            color: var(--error);
            font-size: 13px;
            margin-bottom: 16px;
        }

        .error-bar.show {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 分享按钮 */
        .share-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 响应式 640px */
        @media (max-width: 640px) {
            .container {
                padding: 16px 12px 32px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .card {
                padding: 20px 16px;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .card-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .mode-btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .editor-textarea {
                min-height: 150px;
                font-size: 13px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn-convert {
                width: 100%;
            }

            .share-buttons {
                flex-direction: column;
            }

            .share-buttons .btn {
                width: 100%;
            }

            .realtime-toggle {
                flex-wrap: wrap;
            }
        }
    </style>

<body>
    <div class="bg-pattern"></div>

    <div class="container">
        <header>
            <span class="badge">编码工具</span>

            <p class="subtitle">将文本编码为Base64或将Base64解码为文本。<br>完美支持UTF-8字符。</p>
        </header>

        <!-- 模式切换 -->
        <div class="mode-toggle">
            <div class="mode-toggle-group">
                <button class="mode-btn active-encode" id="btnEncode" onclick="setMode('encode')">编码</button>
                <button class="mode-btn" id="btnDecode" onclick="setMode('decode')">解码</button>
            </div>
        </div>

        <!-- 实时转换开关 -->
        <div class="realtime-toggle">
            <label class="toggle-switch">
                <input type="checkbox" id="realtimeToggle" checked onchange="toggleRealtime()">
                <span class="toggle-slider"></span>
            </label>
            <span class="realtime-label">实时转换</span>
            <span style="font-size: 12px; color: var(--text-muted); margin-left: auto;">输入时自动转换</span>
        </div>

        <!-- 错误栏 -->
        <div class="error-bar" id="errorBar">
            <span>&#9888;</span>
            <span id="errorMessage"></span>
        </div>

        <!-- 输入卡片 -->
        <div class="card" id="inputCard">
            <div class="card-header">
                <div class="card-header-left">
                    <div class="card-icon" id="inputIcon">Aa</div>
                    <div class="card-title" id="inputTitle">文本输入</div>
                </div>
                <div class="card-actions">
                    <span class="char-count" id="inputCount">0字符 / 0 bytes</span>
                    <button class="btn btn-sm btn-secondary" onclick="copyInput()" title="复制输入">复制</button>
                    <button class="btn btn-sm btn-danger" onclick="clearInput()" title="清除输入">清除</button>
                </div>
            </div>
            <div class="textarea-wrapper">
                <textarea
                    class="editor-textarea"
                    id="inputArea"
                    placeholder="请输入要编码的文本..."
                    oninput="onInputChange()"
                ></textarea>
            </div>
        </div>

        <!-- 转换按钮 -->
        <div class="action-buttons">
            <button class="btn btn-convert encode" id="convertBtn" onclick="convert()">
                <span id="convertIcon">&#9660;</span> <span id="convertText">编码为Base64</span>
            </button>
        </div>

        <!-- 输出卡片 -->
        <div class="card" id="outputCard">
            <div class="card-header">
                <div class="card-header-left">
                    <div class="card-icon" id="outputIcon">B64</div>
                    <div class="card-title" id="outputTitle">Base64 输出</div>
                </div>
                <div class="card-actions">
                    <span class="char-count" id="outputCount">0字符 / 0 bytes</span>
                    <button class="btn btn-sm btn-success" onclick="copyOutput()" title="复制输出">复制</button>
                    <button class="btn btn-sm btn-danger" onclick="clearOutput()" title="清除输出">清除</button>
                </div>
            </div>
            <div class="textarea-wrapper">

                <span>&#128172;</span> 通过KakaoTalk分享
            </button>
        </div>

        <footer>

    <!-- 提示消息 -->

    <script>
        // ========== 状态管理 ==========
        const state = {
            mode: 'encode',     // 'encode' | 'decode'
            realtime: true
        };

        // ========== Kakao SDK 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }
        });

        // ========== 模式切换 ==========
        function setMode(mode) {
            state.mode = mode;
            const btnEncode = document.getElementById('btnEncode');
            const btnDecode = document.getElementById('btnDecode');
            const inputTitle = document.getElementById('inputTitle');
            const outputTitle = document.getElementById('outputTitle');
            const inputIcon = document.getElementById('inputIcon');
            const outputIcon = document.getElementById('outputIcon');
            const inputArea = document.getElementById('inputArea');
            const convertBtn = document.getElementById('convertBtn');
            const convertText = document.getElementById('convertText');

            if (mode === 'encode') {
                btnEncode.className = 'mode-btn active-encode';
                btnDecode.className = 'mode-btn';
                inputTitle.textContent = '文本输入';
                outputTitle.textContent = 'Base64 输出';
                inputIcon.textContent = 'Aa';
                outputIcon.textContent = 'B64';
                inputArea.placeholder = '请输入要编码的文本...';
                convertBtn.className = 'btn btn-convert encode';
                convertText.textContent = '编码为Base64';
            } else {
                btnEncode.className = 'mode-btn';
                btnDecode.className = 'mode-btn active-decode';
                inputTitle.textContent = 'Base64 输入';
                outputTitle.textContent = '文本输出';
                inputIcon.textContent = 'B64';
                outputIcon.textContent = 'Aa';
                inputArea.placeholder = '请输入要解码的Base64字符串...';
                convertBtn.className = 'btn btn-convert decode';
                convertText.textContent = '解码为文本';
            }

            // 重置错误
            hideError();

            // 如果是实时模式，立即转换
            if (state.realtime && inputArea.value.trim()) {
                convert();
            }
        }

        // ========== 实时转换开关 ==========
        function toggleRealtime() {
            state.realtime = document.getElementById('realtimeToggle').checked;
            if (state.realtime && document.getElementById('inputArea').value.trim()) {
                convert();
            }
        }

        // ========== 输入变更事件 ==========
        function onInputChange() {
            updateInputCount();
            hideError();

            if (state.realtime) {
                convert();
            }
        }

        // ========== Base64 编码 (UTF-8支持) ==========
        function utf8Encode(str) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(str);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        // ========== Base64 解码 (UTF-8支持) ==========
        function utf8Decode(base64Str) {
            const binary = atob(base64Str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

        // ========== 执行转换 ==========
        function convert() {
            const input = document.getElementById('inputArea').value;
            const outputArea = document.getElementById('outputArea');

            if (!input) {
                outputArea.value = '';
                updateOutputCount();
                hideError();
                return;
            }

            try {
                let result;
                if (state.mode === 'encode') {
                    result = utf8Encode(input);
                } else {
                    // Base64 验证检查
                    const cleanInput = input.replace(/\s/g, '');
                    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(cleanInput)) {
                        showError('无效的Base64字符串。Base64只能包含A-Z、a-z、0-9、+、/、=字符。');
                        outputArea.value = '';
                        updateOutputCount();
                        return;
                    }
                    result = utf8Decode(cleanInput);
                }

                outputArea.value = result;
                hideError();
                updateOutputCount();
            } catch (e) {
                if (state.mode === 'decode') {
                    showError('解码失败：请检查是否为有效的Base64字符串。');
                } else {
                    showError('编码失败：' + e.message);
                }
                outputArea.value = '';
                updateOutputCount();
            }
        }

        // ========== 字符数更新 ==========
        function updateInputCount() {
            const input = document.getElementById('inputArea').value;
            const chars = input.length;
            const bytes = new Blob([input]).size;
            document.getElementById('inputCount').textContent = chars.toLocaleString() + '字符 / ' + formatBytes(bytes);
        }

        function updateOutputCount() {
            const output = document.getElementById('outputArea').value;
            const chars = output.length;
            const bytes = new Blob([output]).size;
            document.getElementById('outputCount').textContent = chars.toLocaleString() + '字符 / ' + formatBytes(bytes);
        }

        // ========== 错误显示 ==========
        function showError(message) {
            const errorBar = document.getElementById('errorBar');
            document.getElementById('errorMessage').textContent = message;
            errorBar.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorBar').classList.remove('show');
        }

        // ========== 复制 ==========
        function copyInput() {
            copyToClipboard(document.getElementById('inputArea').value, '输入内容已复制。');
        }

        function copyOutput() {
            copyToClipboard(document.getElementById('outputArea').value, '输出结果已复制。');
        }

        function copyToClipboard(text, successMessage) {
            if (!text) {
                showToast('没有可复制的内容。');
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(successMessage);
                }).catch(() => {
                    fallbackCopy(text, successMessage);
                });
            } else {
                fallbackCopy(text, successMessage);
            }
        }

        function fallbackCopy(text, successMessage) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMessage);
            } catch (err) {
                showToast('复制失败。');
            }
            document.body.removeChild(textarea);
        }

        // ========== 清除 ==========
        function clearInput() {
            document.getElementById('inputArea').value = '';
            updateInputCount();
            hideError();
            if (state.realtime) {
                document.getElementById('outputArea').value = '';
                updateOutputCount();
            }
            showToast('输入已清除。');
        }

        function clearOutput() {
            document.getElementById('outputArea').value = '';
            updateOutputCount();
            showToast('输出已清除。');
        }

        // ========== 交换输入/输出 ==========
        function swapInputOutput() {
            const inputArea = document.getElementById('inputArea');
            const outputArea = document.getElementById('outputArea');
            const currentOutput = outputArea.value;

            if (!currentOutput) {
                showToast('没有可交换的输出内容。');
                return;
            }

            inputArea.value = currentOutput;
            outputArea.value = '';
            updateInputCount();
            updateOutputCount();
            hideError();

            // 切换模式
            if (state.mode === 'encode') {
                setMode('decode');
            } else {
                setMode('encode');
            }

            // 如果是实时模式，自动转换
            if (state.realtime) {
                convert();
            }

            showToast('输入和输出已交换。');
        }

        // ========== KakaoTalk 分享 ==========
        function shareKakao() {
            if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
                showToast('正在准备KakaoTalk分享...');
                return;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: 'Base64 编码器/解码器 - 在线编码转换工具',
                    description: '将文本编码为Base64或将Base64解码为文本。完美支持UTF-8！',
                    imageUrl: 'https://braindetox.kr/site_logo.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/zh/static/base64_encoder.html',
                        webUrl: 'https://braindetox.kr/zh/static/base64_encoder.html'
                    }
                },
                buttons: [
                    {
                        title: '使用Base64转换工具',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/zh/static/base64_encoder.html',
                            webUrl: 'https://braindetox.kr/zh/static/base64_encoder.html'
                        }
                    }
                ]
            });
        }

        // ========== 工具函数 ==========
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 bytes';
            const k = 1024;
            const sizes = ['bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            updateInputCount();
            updateOutputCount();
        });
    </script>
</body>
</html>
