    <script>
        const ZODIAC = [
            { name: '猴', emoji: '🐵', hanja: '申' },
            { name: '鸡', emoji: '🐔', hanja: '酉' },
            { name: '狗', emoji: '🐕', hanja: '戌' },
            { name: '猪', emoji: '🐷', hanja: '亥' },
            { name: '鼠', emoji: '🐭', hanja: '子' },
            { name: '牛', emoji: '🐂', hanja: '丑' },
            { name: '虎', emoji: '🐯', hanja: '寅' },
            { name: '兔', emoji: '🐰', hanja: '卯' },
            { name: '龙', emoji: '🐲', hanja: '辰' },
            { name: '蛇', emoji: '🐍', hanja: '巳' },
            { name: '马', emoji: '🐴', hanja: '午' },
            { name: '羊', emoji: '🐑', hanja: '未' }
        ];

        const HEAVENLY_STEMS = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];

        let birthDate = null;
        let result = null;

        function initDateSelects() {
            const yearSelect = document.getElementById('year-select');
            const monthSelect = document.getElementById('month-select');
            const daySelect = document.getElementById('day-select');

            const currentYear = new Date().getFullYear();

            for (let y = currentYear; y >= 1920; y--) {
                const option = document.createElement('option');
                option.value = y;
                option.textContent = y + '年';
                if (y === 1990) option.selected = true;
                yearSelect.appendChild(option);
            }

            for (let m = 1; m <= 12; m++) {
                const option = document.createElement('option');
                option.value = m;
                option.textContent = m + '月';
                if (m === 1) option.selected = true;
                monthSelect.appendChild(option);
            }

            updateDays();

            yearSelect.addEventListener('change', updateDays);
            monthSelect.addEventListener('change', updateDays);
        }

        function updateDays() {
            const year = parseInt(document.getElementById('year-select').value);
            const month = parseInt(document.getElementById('month-select').value);
            const daySelect = document.getElementById('day-select');
            const currentDay = parseInt(daySelect.value) || 1;

            const daysInMonth = new Date(year, month, 0).getDate();

            daySelect.innerHTML = '';
            for (let d = 1; d <= daysInMonth; d++) {
                const option = document.createElement('option');
                option.value = d;
                option.textContent = d + '日';
                if (d === Math.min(currentDay, daysInMonth)) option.selected = true;
                daySelect.appendChild(option);
            }
        }

        function calculate() {
            const year = parseInt(document.getElementById('year-select').value);
            const month = parseInt(document.getElementById('month-select').value);
            const day = parseInt(document.getElementById('day-select').value);

            birthDate = new Date(year, month - 1, day);
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (birthDate > today) {
                showToast('不能选择未来的日期');
                return;
            }

            const intAge = calculateIntAge(birthDate, today);
            const koreanAge = today.getFullYear() - year + 1;

            const daysLived = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));

            let nextBirthday = new Date(today.getFullYear(), month - 1, day);
            if (nextBirthday <= today) {
                nextBirthday = new Date(today.getFullYear() + 1, month - 1, day);
            }
            const dday = Math.ceil((nextBirthday - today) / (1000 * 60 * 60 * 24));

            const zodiacIndex = year % 12;
            const zodiac = ZODIAC[zodiacIndex];
            const stemIndex = (year - 4) % 10;
            const stem = HEAVENLY_STEMS[stemIndex];
            const branchHanja = zodiac.hanja;

            const weeks = Math.floor(daysLived / 7);
            const months = Math.floor(daysLived / 30.44);
            const hours = daysLived * 24;

            result = {
                intAge,
                koreanAge,
                daysLived,
                dday,
                zodiac,
                stem,
                branchHanja,
                weeks,
                months,
                hours,
                birthDate: `${year}年${month}月${day}日`
            };

            renderResults();
            vibrate();
        }

        function calculateIntAge(birth, today) {
            let age = today.getFullYear() - birth.getFullYear();
            const monthDiff = today.getMonth() - birth.getMonth();

            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
                age--;
            }

            return age;
        }

        function renderResults() {
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('results-container').style.display = 'block';

            document.getElementById('age-int').textContent = result.intAge;
            document.getElementById('age-detail').textContent = `出生于 ${result.birthDate}`;
            document.getElementById('korean-age').textContent = result.koreanAge;
            document.getElementById('zodiac-emoji').textContent = result.zodiac.emoji;
            document.getElementById('zodiac-name').textContent = '属' + result.zodiac.name;
            document.getElementById('zodiac-year').textContent = `${result.stem}${result.branchHanja}年（${result.stem}${result.zodiac.name}）`;
            document.getElementById('dday').textContent = result.dday === 0 ? '今天!' : result.dday;
            document.getElementById('days-lived').textContent = result.daysLived.toLocaleString();
            document.getElementById('extra-info').innerHTML = `
                • 出生至今 <strong>${result.weeks.toLocaleString()}</strong> 周 / <strong>${result.months.toLocaleString()}</strong> 个月<br>
                • 已度过约 <strong>${result.hours.toLocaleString()}</strong> 小时
            `;
        }

        function shareKakao() {
            if (!result) {
                showToast('请先计算年龄');
                return;
            }

            if (!window.Kakao) {
                showToast('KakaoTalk SDK 加载失败');
                return;
            }

            if (!Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: '年龄计算器',
                    description: `出生于 ${result.birthDate}\n周岁 ${result.intAge} 岁 | 虚岁 ${result.koreanAge} 岁 | ${result.zodiac.emoji} 属${result.zodiac.name}`,
                    imageUrl: 'https://braindetox.kr/static/images/age_calculator_og.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/zh/static/age_calculator.html',
                        webUrl: 'https://braindetox.kr/zh/static/age_calculator.html'
                    }
                },
                buttons: [
                    {
                        title: '我也来算一下',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/zh/static/age_calculator.html',
                            webUrl: 'https://braindetox.kr/zh/static/age_calculator.html'
                        }
                    }
                ]
            });
        }

        function copyResult() {
            if (!result) {
                showToast('请先计算年龄');
                return;
            }

            const text = `🎂 年龄计算结果

📅 出生日期：${result.birthDate}
👤 周岁：${result.intAge} 岁
🇰🇷 韩国虚岁：${result.koreanAge} 岁
${result.zodiac.emoji} 生肖：属${result.zodiac.name}
⏱️ 出生至今：${result.daysLived.toLocaleString()} 天
📆 距下一个生日：${result.dday} 天

👉 https://braindetox.kr/zh/static/age_calculator.html`;

            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制');
            }).catch(() => {
                showToast('复制失败');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function vibrate() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        function showInstallBanner() {
            if (localStorage.getItem('age_installDismissed') === 'forever') return;
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            if (sessionStorage.getItem('age_installDismissed')) return;

            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);

            if (isIOS) {
                document.getElementById('ios-steps').style.display = 'block';
            } else if (isAndroid) {
                document.getElementById('android-steps').style.display = 'block';
            } else {
                document.getElementById('desktop-steps').style.display = 'block';
            }

            setTimeout(() => {
                document.getElementById('install-banner').classList.add('show');
            }, 5000);
        }

        function closeInstallBanner() {
            document.getElementById('install-banner').classList.remove('show');
            sessionStorage.setItem('age_installDismissed', 'true');
        }

        function closeInstallBannerForever() {
            document.getElementById('install-banner').classList.remove('show');
            localStorage.setItem('age_installDismissed', 'forever');
            showToast('将不再显示');
        }

        function init() {
            initDateSelects();

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/static/age_sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            }

            showInstallBanner();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
