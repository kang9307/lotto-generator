    <style>
        :root {
            --bg-deep: #0b1120;
            --bg-night: #101828;
            --bg-card: rgba(16, 24, 48, 0.85);
            --border-subtle: rgba(80, 100, 140, 0.3);
            --text-primary: #e8ecf4;
            --text-secondary: #a8b4c8;
            --text-muted: #6878a0;
            --accent: #c9b896;
            --accent-glow: rgba(201, 184, 150, 0.35);
            --accent-soft: rgba(201, 184, 150, 0.1);
            --moonlight: rgba(220, 225, 240, 0.08);
            --moonlight-glow: rgba(200, 210, 235, 0.15);
            --star-color: rgba(255, 255, 240, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', -apple-system, sans-serif;
            background: linear-gradient(180deg, #0b1120 0%, #0d1628 40%, #101c35 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 月夜グラデーション背景 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 120% 80% at 75% 15%, rgba(200, 210, 235, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse 80% 60% at 20% 80%, rgba(60, 80, 140, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 90% 70%, rgba(100, 120, 180, 0.05) 0%, transparent 40%);
            animation: moonlightShift 25s ease-in-out infinite alternate;
        }

        @keyframes moonlightShift {
            0% {
                background:
                    radial-gradient(ellipse 120% 80% at 75% 15%, rgba(200, 210, 235, 0.12) 0%, transparent 50%),
                    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(60, 80, 140, 0.08) 0%, transparent 50%),
                    radial-gradient(ellipse 60% 40% at 90% 70%, rgba(100, 120, 180, 0.05) 0%, transparent 40%);
            }
            50% {
                background:
                    radial-gradient(ellipse 100% 70% at 70% 20%, rgba(200, 210, 235, 0.15) 0%, transparent 55%),
                    radial-gradient(ellipse 70% 50% at 25% 75%, rgba(60, 80, 140, 0.1) 0%, transparent 45%),
                    radial-gradient(ellipse 50% 50% at 85% 60%, rgba(100, 120, 180, 0.06) 0%, transparent 45%);
            }
            100% {
                background:
                    radial-gradient(ellipse 110% 75% at 80% 10%, rgba(200, 210, 235, 0.1) 0%, transparent 50%),
                    radial-gradient(ellipse 90% 55% at 15% 85%, rgba(60, 80, 140, 0.12) 0%, transparent 55%),
                    radial-gradient(ellipse 55% 45% at 95% 65%, rgba(100, 120, 180, 0.07) 0%, transparent 50%);
            }
        }

        /* 星 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: var(--star-color);
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 月 */
        .moon {
            position: fixed;
            top: 8%;
            right: 12%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                rgba(255, 255, 250, 0.95) 0%,
                rgba(230, 235, 245, 0.8) 40%,
                rgba(200, 210, 230, 0.6) 70%,
                rgba(180, 190, 210, 0.4) 100%);
            box-shadow:
                0 0 40px rgba(220, 225, 240, 0.4),
                0 0 80px rgba(200, 210, 235, 0.25),
                0 0 120px rgba(180, 195, 220, 0.15);
            pointer-events: none;
            z-index: 0;
            animation: moonGlow 8s ease-in-out infinite alternate;
        }

        @keyframes moonGlow {
            0% {
                box-shadow:
                    0 0 40px rgba(220, 225, 240, 0.4),
                    0 0 80px rgba(200, 210, 235, 0.25),
                    0 0 120px rgba(180, 195, 220, 0.15);
            }
            100% {
                box-shadow:
                    0 0 50px rgba(220, 225, 240, 0.5),
                    0 0 100px rgba(200, 210, 235, 0.3),
                    0 0 150px rgba(180, 195, 220, 0.2);
            }
        }

        /* 漂うパーティクル（蛍） */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 220, 0.9);
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 6px rgba(255, 255, 200, 0.6);
            animation: firefly 12s infinite;
        }

        @keyframes firefly {
            0% {
                opacity: 0;
                transform: translateY(80vh) translateX(0) scale(0.5);
            }
            15% {
                opacity: 0.8;
            }
            50% {
                transform: translateY(40vh) translateX(30px) scale(1);
            }
            85% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: translateY(0vh) translateX(-20px) scale(0.5);
            }
        }

        /* メインコンテナ */
        .container {
            position: relative;
            z-index: 1;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 24px;
            min-height: 100vh;
        }

        /* ヘッダー */
        header {
            text-align: center;
            padding: 60px 0 40px;
        }

        .time-display {
            font-size: 4.5rem;
            font-weight: 200;
            letter-spacing: -3px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-shadow: 0 0 60px var(--accent-glow);
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ナビゲーション */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 40px 0;
            padding: 6px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(10px);
        }

        .nav-tab {
            flex: 1;
            padding: 14px 10px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-tab:hover {
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--accent-soft) 0%, var(--purple-soft) 100%);
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* セクション共通 */
        .section {
            margin-bottom: 24px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 詩 */
        .poem-section {
            text-align: center;
            padding: 48px 0;
        }

        .poem-content {
            font-family: 'Noto Serif JP', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 2.4;
            color: var(--text-primary);
            margin-bottom: 36px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        .poem-author {
            font-size: 0.9rem;
            color: var(--accent);
            font-style: italic;
            opacity: 0.8;
        }

        .poem-refresh {
            margin-top: 48px;
            padding: 14px 28px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .poem-refresh:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        /* 感謝日記 */
        .gratitude-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .gratitude-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .gratitude-dot {
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, var(--accent), #9370db);
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 12px var(--accent-glow);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .gratitude-input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 0;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .gratitude-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 2px 15px -5px var(--accent-glow);
        }

        .gratitude-input::placeholder {
            color: var(--text-muted);
        }

        .save-btn {
            margin-top: 28px;
            padding: 16px 36px;
            background: linear-gradient(135deg, var(--accent) 0%, #c4956a 100%);
            border: none;
            border-radius: 10px;
            color: var(--bg-deep);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px var(--accent-glow);
        }

        .saved-message {
            margin-top: 16px;
            color: var(--accent);
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .saved-message.show {
            opacity: 1;
        }

        /* 呼吸瞑想 */
        .breathing-section {
            text-align: center;
            padding: 32px 0;
        }

        .breathing-visual {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 48px auto;
        }

        .breathing-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            border: 2px solid rgba(200, 210, 235, 0.5);
            border-radius: 50%;
            opacity: 0.4;
            transition: all 4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 30px rgba(200, 210, 235, 0.3), inset 0 0 25px rgba(200, 210, 235, 0.15);
        }

        .breathing-ring-outer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 1px solid rgba(147, 112, 219, 0.3);
            border-radius: 50%;
            animation: breatheOuter 8s ease-in-out infinite;
        }

        @keyframes breatheOuter {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.5; }
        }

        .breathing-ring.inhale {
            width: 200px;
            height: 200px;
            opacity: 0.7;
            box-shadow: 0 0 50px rgba(200, 210, 235, 0.4), inset 0 0 40px rgba(200, 210, 235, 0.2);
        }

        .breathing-ring.hold {
            width: 200px;
            height: 200px;
            opacity: 0.5;
        }

        .breathing-ring.exhale {
            width: 100px;
            height: 100px;
            opacity: 0.3;
            box-shadow: 0 0 20px rgba(200, 210, 235, 0.25), inset 0 0 15px rgba(200, 210, 235, 0.1);
        }

        .breathing-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .breathing-instruction {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .breathing-count {
            font-size: 2.8rem;
            font-weight: 200;
            background: linear-gradient(135deg, var(--accent), #9370db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .breathing-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 36px;
        }

        .breathing-btn {
            padding: 14px 32px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .breathing-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .breathing-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-deep);
        }

        .breathing-guide {
            margin-top: 36px;
            padding: 20px;
            background: linear-gradient(135deg, var(--accent-soft), var(--purple-soft));
            border-radius: 12px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.9;
            border: 1px solid var(--border-subtle);
        }

        /* 心配の手放し */
        .release-section {
            text-align: center;
            padding: 32px 0;
        }

        .release-textarea {
            width: 100%;
            min-height: 160px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 22px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .release-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .release-textarea::placeholder {
            color: var(--text-muted);
        }

        .release-btn {
            margin-top: 24px;
            padding: 16px 36px;
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: 10px;
            color: var(--accent);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .release-btn:hover {
            background: linear-gradient(135deg, var(--accent) 0%, #c4956a 100%);
            color: var(--bg-deep);
            box-shadow: 0 4px 25px var(--accent-glow);
            transform: translateY(-2px);
        }

        .flying-worry {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 0.9rem;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 18px 26px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            animation: flyAway 2.5s ease-out forwards;
            max-width: 280px;
            backdrop-filter: blur(10px);
        }

        @keyframes flyAway {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -350%) scale(0.4) rotate(10deg); }
        }

        .release-complete {
            display: none;
            padding: 28px;
            margin-top: 28px;
            text-align: center;
        }

        .release-complete.show {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        .release-complete p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.9;
        }

        /* 共有セクション */
        .share-section {
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid var(--border-subtle);
            margin-top: 20px;
        }

        .share-section h3 {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .social-share {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .share-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .share-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .share-btn img {
            width: 20px;
            height: 20px;
        }

        .kakao-btn:hover {
            border-color: #fee500;
            background: linear-gradient(135deg, rgba(254, 229, 0, 0.1), transparent);
        }

        .copy-btn:hover {
            border-color: var(--accent);
        }

        /* おやすみメッセージ */
        .goodnight-section {
            text-align: center;
            padding: 60px 20px;
            margin-top: 40px;
            border-top: 1px solid var(--border-subtle);
        }

        .goodnight-message {
            font-family: 'Noto Serif JP', Georgia, serif;
            font-size: 1.15rem;
            line-height: 2.2;
            color: var(--text-secondary);
        }

        /* フッター */
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            color: var(--accent);
        }

        /* コントロールボタン */
        .controls {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .control-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(1.05);
        }

        .control-btn.playing {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* レスポンシブ */
        @media (max-width: 600px) {
            .container {
                padding: 0 18px;
            }

            header {
                padding: 48px 0 28px;
            }

            .time-display {
                font-size: 3.2rem;
            }

            .nav-tabs {
                margin: 28px 0;
            }

            .nav-tab {
                padding: 12px 8px;
                font-size: 0.75rem;
            }

            .poem-content {
                font-size: 1.25rem;
                line-height: 2.2;
            }

            .breathing-visual {
                width: 180px;
                height: 180px;
            }

            .breathing-ring {
                width: 130px;
                height: 130px;
            }

            .breathing-ring.inhale {
                width: 170px;
                height: 170px;
            }

            .breathing-ring.exhale {
                width: 80px;
                height: 80px;
            }

            .controls {
                top: 16px;
                right: 16px;
                gap: 8px;
            }

            .control-btn {
                width: 42px;
                height: 42px;
                font-size: 1rem;
            }

            .breathing-controls {
                flex-direction: column;
            }

            .save-btn,
            .release-btn,
            .poem-refresh {
                width: 100%;
            }

            .social-share {
                flex-direction: column;
                align-items: center;
            }

            .share-btn {
                width: 100%;
                max-width: 200px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- 背景グラデーション -->
    <div class="bg-gradient"></div>

    <!-- 月 -->
    <div class="moon"></div>

    <!-- 星 -->
    <div class="stars" id="stars"></div>

    <!-- 蛍のパーティクル -->
    <div class="particles" id="particles"></div>

    <!-- BGM（森の音） -->
    <audio id="bgMusic" loop preload="auto">
        <source src="../sounds/forest.mp3" type="audio/mpeg">
    </audio>

    <!-- コントロールボタン -->
    <div class="controls">
        <a href="../index.html" class="control-btn" title="ホーム">&#8592;</a>
        <button class="control-btn" id="musicBtn" title="BGM">&#9835;</button>
    </div>

    <div class="container">
        <header>
            <div class="time-display" id="currentTime">21:30</div>
            <div class="date-display" id="currentDate">12月28日 土曜日</div>
        </header>

        <!-- ナビゲーションタブ -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-section="poem">詩</button>
            <button class="nav-tab" data-section="gratitude">感謝</button>
            <button class="nav-tab" data-section="breathing">呼吸</button>
            <button class="nav-tab" data-section="release">手放し</button>
        </div>

        <!-- 1. 今日の詩 -->
        <section class="section poem-section" id="poemSection">
            <div class="poem-content" id="poemContent">
                しばし立ち止まり<br>
                静けさの中で<br>
                自分と出会う時間
            </div>
            <p class="poem-author" id="poemAuthor">- 心の憩いの場</p>
            <button class="poem-refresh" id="newPoemBtn">別の言葉</button>
        </section>

        <!-- 2. 感謝日記 -->
        <section class="section" id="gratitudeSection" style="display: none;">
            <p class="section-label">今日の感謝</p>
            <div class="gratitude-list">
                <div class="gratitude-item">
                    <span class="gratitude-dot"></span>
                    <input type="text" class="gratitude-input" id="gratitude1" placeholder="一つ目の感謝">
                </div>
                <div class="gratitude-item">
                    <span class="gratitude-dot"></span>
                    <input type="text" class="gratitude-input" id="gratitude2" placeholder="二つ目の感謝">
                </div>
                <div class="gratitude-item">
                    <span class="gratitude-dot"></span>
                    <input type="text" class="gratitude-input" id="gratitude3" placeholder="三つ目の感謝">
                </div>
            </div>
            <button class="save-btn" id="saveGratitudeBtn">保存</button>
            <p class="saved-message" id="savedMessage">保存しました</p>
        </section>

        <!-- 3. 呼吸瞑想 -->
        <section class="section breathing-section" id="breathingSection" style="display: none;">
            <p class="section-label">4-7-8 呼吸法</p>
            <div class="breathing-visual">
                <div class="breathing-ring-outer"></div>
                <div class="breathing-ring" id="breathingCircle"></div>
                <div class="breathing-center">
                    <div class="breathing-instruction" id="breathingInstruction">開始してください</div>
                    <div class="breathing-count" id="breathingCount"></div>
                </div>
            </div>
            <div class="breathing-controls">
                <button class="breathing-btn" id="startBreathingBtn">スタート</button>
                <button class="breathing-btn" id="stopBreathingBtn">ストップ</button>
            </div>
            <div class="breathing-guide">
                4秒吸う &#8594; 7秒止める &#8594; 8秒吐く<br>
                緊張の緩和と睡眠に役立ちます
            </div>
        </section>

        <!-- 4. 心配の手放し -->
        <section class="section release-section" id="releaseSection" style="display: none;">
            <p class="section-label">心の重荷を手放しましょう</p>
            <textarea class="release-textarea" id="worryText" placeholder="今日気がかりだったことを書いてみましょう..."></textarea>
            <button class="release-btn" id="releaseBtn">手放す</button>
            <div class="release-complete" id="releaseComplete">
                <p>心が軽くなりますように。<br>穏やかな夜をお過ごしください。</p>
            </div>
        </section>

        <!-- 5. 共有セクション -->
        <section class="share-section">
            <h3>友達に共有する</h3>
            <div class="social-share">
                <button id="kakao-share" class="share-btn kakao-btn">
                    <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_small.png" alt="カカオトーク">
                    カカオトーク
                </button>
                <button id="copy-link" class="share-btn copy-btn">
                    <span>&#128279;</span>
                    リンクをコピー
                </button>
            </div>
        </section>

        <!-- 6. おやすみメッセージ -->
        <section class="goodnight-section">
            <p class="goodnight-message" id="goodnightMessage">
                今日も一日お疲れさまでした。<br>
                穏やかな夜をお過ごしください。
            </p>
        </section>

        <footer>
            <p>&copy; 2025 <a href="../index.html">BrainDetox</a></p>
        </footer>
    </div>

    <script>
        // カカオSDKの初期化
        if (window.Kakao && !window.Kakao.isInitialized()) {
            window.Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
        }

        // 詩データ
        const poems = [
            { content: "しばし立ち止まり<br>静けさの中で<br>自分と出会う時間", author: "心の憩いの場" },
            { content: "星の光の下<br>今日の自分を抱きしめ<br>明日を夢見る", author: "夜の瞑想" },
            { content: "疲れた一日の終わりに<br>月光がそっと撫でてくれる<br>この静けさは贈りもの", author: "夜の慰め" },
            { content: "完璧でなくていい<br>今日も生き抜いたこと<br>それだけで十分すごい", author: "自己肯定" },
            { content: "深く息を吸って<br>ゆっくり吐きながら<br>すべてを手放す", author: "呼吸の瞑想" },
            { content: "夜空の星のように<br>あなたも輝いています<br>ただ気づいていないだけ", author: "星のようなあなたへ" },
            { content: "今日流した汗と涙が<br>明日の自分を<br>もっと強くしてくれる", author: "成長のささやき" },
            { content: "月は毎日満ち欠けする<br>完璧な満月だけが<br>月ではないように", author: "不完全さの美しさ" },
            { content: "休んでもいい<br>立ち止まることも旅の一部<br>今この瞬間を許そう", author: "休息の哲学" },
            { content: "波が寄せて<br>引いていくように<br>辛いことも過ぎ去る", author: "自然の慰め" },
            { content: "今日という一日が<br>明日の自分への<br>応援の手紙", author: "時間の贈りもの" },
            { content: "眠る前に<br>三つの感謝を<br>枕の下に隠しておこう", author: "感謝の習慣" },
            { content: "あなたの一日は<br>誰かにとっては<br>奇跡だったかもしれない", author: "大切な存在" },
            { content: "夜は昼の終わりではなく<br>新しい始まりのための<br>充電の時間", author: "夜の意味" },
            { content: "静かな夜<br>心の声に<br>耳を傾ける時間", author: "内なる対話" }
        ];

        // おやすみメッセージ
        const goodnightMessages = [
            "今日も一日お疲れさまでした。<br>あなたは十分に頑張っています。<br>穏やかな夜をお過ごしください。",
            "つらい一日だったなら<br>もっと休んでも大丈夫です。<br>良い夢を。",
            "今日のあなたに<br>お疲れさまと言ってあげてください。<br>甘い夢の国へ。",
            "明日もまた新しいチャンスがあります。<br>今夜はゆっくり休んでください。<br>おやすみなさい！",
            "あなたの存在そのものが<br>誰かにとって大きな力になります。<br>温かい夜をお過ごしください。"
        ];

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            createParticles();
            updateTime();
            setInterval(updateTime, 1000);
            loadGratitude();
            showRandomPoem();
            showRandomGoodnight();
            setupNavTabs();
            setupBreathing();
            setupRelease();
            setupMusic();
            setupShare();
        });

        // 星の生成
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 60 + '%';
                star.style.width = (1 + Math.random() * 2) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 2) + 's';
                container.appendChild(star);
            }
        }

        // 蛍のパーティクル生成
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 12 + 's';
                particle.style.animationDuration = (10 + Math.random() * 6) + 's';
                container.appendChild(particle);
            }
        }

        // 時刻と日付の更新（JST）
        function updateTime() {
            // JST（UTC+9）
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const jst = new Date(utc + (9 * 60 * 60 * 1000));

            const hours = jst.getHours().toString().padStart(2, '0');
            const minutes = jst.getMinutes().toString().padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}`;

            // 日付の更新
            const days = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];
            const month = jst.getMonth() + 1;
            const date = jst.getDate();
            const day = days[jst.getDay()];
            document.getElementById('currentDate').textContent = `${month}月${date}日 ${day}`;
        }

        // ランダム詩
        function showRandomPoem() {
            const poem = poems[Math.floor(Math.random() * poems.length)];
            document.getElementById('poemContent').innerHTML = poem.content;
            document.getElementById('poemAuthor').textContent = '- ' + poem.author;
        }

        document.getElementById('newPoemBtn').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
                showRandomPoem();
            }, 100);
        });

        // ランダムおやすみメッセージ
        function showRandomGoodnight() {
            const message = goodnightMessages[Math.floor(Math.random() * goodnightMessages.length)];
            document.getElementById('goodnightMessage').innerHTML = message;
        }

        // ナビゲーションタブ
        function setupNavTabs() {
            const tabs = document.querySelectorAll('.nav-tab');
            const sections = {
                poem: document.getElementById('poemSection'),
                gratitude: document.getElementById('gratitudeSection'),
                breathing: document.getElementById('breathingSection'),
                release: document.getElementById('releaseSection')
            };

            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    Object.values(sections).forEach(s => s.style.display = 'none');
                    sections[this.dataset.section].style.display = 'block';
                });
            });
        }

        // 感謝日記の保存
        document.getElementById('saveGratitudeBtn').addEventListener('click', function() {
            const today = new Date().toISOString().split('T')[0];
            const gratitude = {
                date: today,
                items: [
                    document.getElementById('gratitude1').value,
                    document.getElementById('gratitude2').value,
                    document.getElementById('gratitude3').value
                ]
            };

            let gratitudeHistory = JSON.parse(localStorage.getItem('gratitudeHistory') || '[]');
            gratitudeHistory = gratitudeHistory.filter(g => g.date !== today);
            gratitudeHistory.push(gratitude);
            localStorage.setItem('gratitudeHistory', JSON.stringify(gratitudeHistory));

            const message = document.getElementById('savedMessage');
            message.classList.add('show');
            setTimeout(() => message.classList.remove('show'), 3000);
        });

        // 感謝日記の読み込み
        function loadGratitude() {
            const today = new Date().toISOString().split('T')[0];
            const history = JSON.parse(localStorage.getItem('gratitudeHistory') || '[]');
            const todayGratitude = history.find(g => g.date === today);

            if (todayGratitude) {
                document.getElementById('gratitude1').value = todayGratitude.items[0] || '';
                document.getElementById('gratitude2').value = todayGratitude.items[1] || '';
                document.getElementById('gratitude3').value = todayGratitude.items[2] || '';
            }
        }

        // 呼吸瞑想
        function setupBreathing() {
            let breathingInterval = null;
            let phase = 'ready';
            let count = 0;

            const circle = document.getElementById('breathingCircle');
            const instruction = document.getElementById('breathingInstruction');
            const countDisplay = document.getElementById('breathingCount');
            const startBtn = document.getElementById('startBreathingBtn');
            const stopBtn = document.getElementById('stopBreathingBtn');

            function updateBreathing() {
                if (phase === 'inhale') {
                    count--;
                    countDisplay.textContent = count;
                    if (count <= 0) {
                        phase = 'hold';
                        count = 7;
                        instruction.textContent = '止めて';
                        circle.className = 'breathing-ring hold';
                    }
                } else if (phase === 'hold') {
                    count--;
                    countDisplay.textContent = count;
                    if (count <= 0) {
                        phase = 'exhale';
                        count = 8;
                        instruction.textContent = '吐いて';
                        circle.className = 'breathing-ring exhale';
                    }
                } else if (phase === 'exhale') {
                    count--;
                    countDisplay.textContent = count;
                    if (count <= 0) {
                        phase = 'inhale';
                        count = 4;
                        instruction.textContent = '吸って';
                        circle.className = 'breathing-ring inhale';
                    }
                }
            }

            startBtn.addEventListener('click', function() {
                if (breathingInterval) return;

                phase = 'inhale';
                count = 4;
                instruction.textContent = '吸って';
                countDisplay.textContent = count;
                circle.className = 'breathing-ring inhale';

                breathingInterval = setInterval(updateBreathing, 1000);
            });

            stopBtn.addEventListener('click', function() {
                if (breathingInterval) {
                    clearInterval(breathingInterval);
                    breathingInterval = null;
                }
                phase = 'ready';
                instruction.textContent = '開始してください';
                countDisplay.textContent = '';
                circle.className = 'breathing-ring';
            });
        }

        // 心配の手放し
        function setupRelease() {
            const releaseBtn = document.getElementById('releaseBtn');
            const worryText = document.getElementById('worryText');
            const releaseComplete = document.getElementById('releaseComplete');

            releaseBtn.addEventListener('click', function() {
                const worry = worryText.value.trim();
                if (!worry) {
                    worryText.placeholder = '心配事を書いてください...';
                    return;
                }

                // 飛んでいくアニメーション
                const flyingWorry = document.createElement('div');
                flyingWorry.className = 'flying-worry';
                flyingWorry.textContent = worry.substring(0, 50) + (worry.length > 50 ? '...' : '');
                flyingWorry.style.left = '50%';
                flyingWorry.style.top = '50%';
                document.body.appendChild(flyingWorry);

                setTimeout(() => {
                    flyingWorry.remove();
                }, 3000);

                worryText.value = '';
                releaseComplete.classList.add('show');

                setTimeout(() => {
                    releaseComplete.classList.remove('show');
                }, 5000);
            });
        }

        // BGM - forest.mp3 の自動再生
        function setupMusic() {
            const musicBtn = document.getElementById('musicBtn');
            const bgMusic = document.getElementById('bgMusic');
            let isPlaying = false;

            bgMusic.volume = 0.4;

            function startAutoPlay() {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    musicBtn.classList.add('playing');
                    musicBtn.innerHTML = '&#128266;';
                }).catch(() => {
                    document.addEventListener('click', playOnInteraction, { once: true });
                    document.addEventListener('touchstart', playOnInteraction, { once: true });
                    document.addEventListener('keydown', playOnInteraction, { once: true });
                    document.addEventListener('scroll', playOnInteraction, { once: true });
                });
            }

            function playOnInteraction() {
                if (!isPlaying) {
                    bgMusic.play().then(() => {
                        isPlaying = true;
                        musicBtn.classList.add('playing');
                        musicBtn.innerHTML = '&#128266;';
                    });
                }
                document.removeEventListener('click', playOnInteraction);
                document.removeEventListener('touchstart', playOnInteraction);
                document.removeEventListener('keydown', playOnInteraction);
                document.removeEventListener('scroll', playOnInteraction);
            }

            startAutoPlay();

            musicBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isPlaying) {
                    bgMusic.pause();
                    isPlaying = false;
                    musicBtn.classList.remove('playing');
                    musicBtn.innerHTML = '&#128264;';
                } else {
                    bgMusic.play();
                    isPlaying = true;
                    musicBtn.classList.add('playing');
                    musicBtn.innerHTML = '&#128266;';
                }
            });
        }

            // リンクのコピー

            if (copyLinkBtn) {
                copyLinkBtn.addEventListener('click', async function() {
                    try {
                        await navigator.clipboard.writeText('https://braindetox.kr/ja/static/relaxing_day.html');
                        const originalText = this.innerHTML;
                        this.innerHTML = '<span>&#10003;</span> コピーしました！';
                        setTimeout(() => {
                            this.innerHTML = originalText;

                    } catch (err) {
                        // フォールバック: 旧型ブラウザ対応
                        const textArea = document.createElement('textarea');
                        textArea.value = 'https://braindetox.kr/ja/static/relaxing_day.html';
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        this.innerHTML = '<span>&#10003;</span> コピーしました！';
                        setTimeout(() => {
