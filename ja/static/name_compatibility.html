    <script>
        // ========== 名前値計算 ==========
        function getCharValue(char) {
            const code = char.charCodeAt(0);

            // 韓国語文字範囲 (가 ~ 힣)
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const strokeCount = {
                    cho: { 'ㄱ': 2, 'ㄲ': 4, 'ㄴ': 2, 'ㄷ': 3, 'ㄸ': 6, 'ㄹ': 5, 'ㅁ': 4, 'ㅂ': 4, 'ㅃ': 8, 'ㅅ': 2, 'ㅆ': 4, 'ㅇ': 1, 'ㅈ': 3, 'ㅉ': 6, 'ㅊ': 4, 'ㅋ': 3, 'ㅌ': 4, 'ㅍ': 4, 'ㅎ': 3 },
                    jung: { 'ㅏ': 2, 'ㅐ': 3, 'ㅑ': 3, 'ㅒ': 4, 'ㅓ': 2, 'ㅔ': 3, 'ㅕ': 3, 'ㅖ': 4, 'ㅗ': 2, 'ㅘ': 4, 'ㅙ': 5, 'ㅚ': 3, 'ㅛ': 3, 'ㅜ': 2, 'ㅝ': 4, 'ㅞ': 5, 'ㅟ': 3, 'ㅠ': 3, 'ㅡ': 1, 'ㅢ': 2, 'ㅣ': 1 },
                    jong: { '': 0, 'ㄱ': 2, 'ㄲ': 4, 'ㄳ': 4, 'ㄴ': 2, 'ㄵ': 5, 'ㄶ': 5, 'ㄷ': 3, 'ㄹ': 5, 'ㄺ': 7, 'ㄻ': 9, 'ㄼ': 9, 'ㄽ': 7, 'ㄾ': 9, 'ㄿ': 9, 'ㅀ': 8, 'ㅁ': 4, 'ㅂ': 4, 'ㅄ': 6, 'ㅅ': 2, 'ㅆ': 4, 'ㅇ': 1, 'ㅈ': 3, 'ㅊ': 4, 'ㅋ': 3, 'ㅌ': 4, 'ㅍ': 4, 'ㅎ': 3 }
                };
                const choList = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
                const jungList = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
                const jongList = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

                const base = code - 0xAC00;
                const choIdx = Math.floor(base / (21 * 28));
                const jungIdx = Math.floor((base % (21 * 28)) / 28);
                const jongIdx = base % 28;

                const cho = choList[choIdx];
                const jung = jungList[jungIdx];
                const jong = jongList[jongIdx];

                return (strokeCount.cho[cho] || 0) + (strokeCount.jung[jung] || 0) + (strokeCount.jong[jong] || 0);
            }

            // ひらがな (あ-ん)
            if (code >= 0x3041 && code <= 0x3096) {
                return ((code - 0x3041) % 10) + 1;
            }

            // カタカナ (ア-ン)
            if (code >= 0x30A1 && code <= 0x30F6) {
                return ((code - 0x30A1) % 10) + 1;
            }

            // 漢字 (CJK Unified Ideographs)
            if (code >= 0x4E00 && code <= 0x9FFF) {
                return (code % 20) + 1;
            }

            // 英文字 (A-Z, a-z)
            if (/[a-zA-Z]/.test(char)) {
                return char.toLowerCase().charCodeAt(0) - 96;
            }

            // 数字
            if (/[0-9]/.test(char)) return parseInt(char);

            return 1;
        }

        function getNameValue(name) {
            return name.split('').reduce((sum, char) => sum + getCharValue(char), 0);
        }

        function calculateCompatibility(name1, name2) {
            const value1 = getNameValue(name1);
            const value2 = getNameValue(name2);

            const combined = value1 + value2;
            const diff = Math.abs(value1 - value2);
            const product = value1 * value2;

            let score = 50;

            if (combined % 2 === 0) score += 5;
            if (combined % 7 === 0) score += 10;
            if (combined >= 20 && combined <= 80) score += 8;

            if (diff <= 5) score += 15;
            else if (diff <= 10) score += 10;
            else if (diff <= 15) score += 5;
            else score -= 5;

            const lastDigit = product % 10;
            if (lastDigit === 0 || lastDigit === 5) score += 7;
            if (lastDigit === 7 || lastDigit === 8) score += 5;

            if (name1.length === name2.length) score += 5;

            const seed = (value1 * 17 + value2 * 31) % 20;
            score += seed - 10;

            score = Math.max(1, Math.min(100, Math.round(score)));

            return score;
        }

        // ========== 結果メッセージ ==========
        const messages = {
            excellent: [
                "運命の相手です！二人はまるで運命のように出会った関係です。お互いを深く理解し、尊重する最高のパートナーになれるでしょう。",
                "素晴らしい相性です！二人なら、どんな困難も乗り越えられます。お互いにとって最高の贈り物のような存在です。",
                "完璧なハーモニーを奏でる二人！一緒にいるすべての瞬間が特別で幸せになるでしょう。おめでとうございます！"
            ],
            good: [
                "とても良い相性です！お互いの長所を引き出し合う関係になれるでしょう。一緒に成長する素敵なパートナーシップを期待してください。",
                "良い縁ですね！お互いを思いやる気持ちがあれば、より深い関係に発展できます。",
                "ケミストリーが良いです！二人が一緒にいると楽しいことがたくさんあるでしょう。お互いのエネルギーがよく合っています。"
            ],
            normal: [
                "普通の相性ですが、努力すれば良い関係になれます！お互いを理解しようとする心が大切です。",
                "一般的な縁です。でも、本当の関係は努力で作るもの。お互いに興味を持ってみてください。",
                "無難な相性です！お互いの違いを尊重し、たくさん対話すれば、より良い関係になれるでしょう。"
            ],
            low: [
                "チャレンジングな相性です！でも、心配しないでください。違いを認めて尊重すれば、むしろ特別な関係になれる可能性があります。",
                "簡単ではない相性ですが、本当の愛はすべてを乗り越えられます。お互いのための努力が必要です。",
                "ユニークな組み合わせです！違う点が多いですが、だからこそ学ぶことも多いはず。オープンな心で接してみてください。"
            ]
        };

        function getGradeInfo(score) {
            if (score >= 80) return { grade: '運命の相手', class: 'grade-excellent', type: 'excellent' };
            if (score >= 60) return { grade: '良い相性', class: 'grade-good', type: 'good' };
            if (score >= 40) return { grade: '普通の相性', class: 'grade-normal', type: 'normal' };
            return { grade: '努力が必要', class: 'grade-low', type: 'low' };
        }

        function getRandomMessage(type) {
            const msgList = messages[type];
            return msgList[Math.floor(Math.random() * msgList.length)];
        }

        function showResult(name1, name2, score) {
            const gradeInfo = getGradeInfo(score);

            document.getElementById('resultName1').textContent = name1;
            document.getElementById('resultName2').textContent = name2;
            document.getElementById('resultScore').textContent = score + '%';
            document.getElementById('resultGrade').textContent = gradeInfo.grade;
            document.getElementById('resultGrade').className = 'result-grade ' + gradeInfo.class;
            document.getElementById('resultMessage').textContent = getRandomMessage(gradeInfo.type);

            document.getElementById('inputCard').style.display = 'none';
            document.getElementById('resultCard').classList.add('show');
        }

        function resetTest() {
            document.getElementById('name1').value = '';
            document.getElementById('name2').value = '';
            document.getElementById('inputCard').style.display = 'block';
            document.getElementById('resultCard').classList.remove('show');
        }

        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // ========== イベントリスナー ==========
        document.getElementById('checkBtn').addEventListener('click', () => {
            const name1 = document.getElementById('name1').value.trim();
            const name2 = document.getElementById('name2').value.trim();

            if (!name1 || !name2) {
                showToast('二人の名前を入力してください！');
                return;
            }

            const score = calculateCompatibility(name1, name2);
            showResult(name1, name2, score);
        });

        document.getElementById('retryBtn').addEventListener('click', resetTest);

        // Enterキーで送信
        document.querySelectorAll('.name-input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('checkBtn').click();
                }
            });
        });

        // 結果をコピー
        document.getElementById('copyResult').addEventListener('click', () => {
            const name1 = document.getElementById('resultName1').textContent;
            const name2 = document.getElementById('resultName2').textContent;
            const score = document.getElementById('resultScore').textContent;
            const grade = document.getElementById('resultGrade').textContent;

            const text = `💕 名前相性診断の結果 💕\n\n${name1} ❤️ ${name2}\n相性スコア: ${score}\n結果: ${grade}\n\n🔗 自分もテストする: https://braindetox.kr/ja/static/name_compatibility.html`;

            navigator.clipboard.writeText(text).then(() => {
                showToast('結果がコピーされました！');
            }).catch(() => {
                showToast('コピーに失敗しました。');
            });
        });

        // カカオトーク共有
        document.getElementById('shareKakao').addEventListener('click', () => {
            if (typeof Kakao === 'undefined') {
                showToast('カカオトーク共有を準備中です。');
                return;
            }

            if (!Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            const name1 = document.getElementById('resultName1').textContent;
            const name2 = document.getElementById('resultName2').textContent;
            const score = document.getElementById('resultScore').textContent;

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: '💕 名前相性診断の結果',
                    description: `${name1} ❤️ ${name2}\n相性スコア: ${score}`,
                    imageUrl: 'https://braindetox.kr/site_logo.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/ja/static/name_compatibility.html',
                        webUrl: 'https://braindetox.kr/ja/static/name_compatibility.html'
                    }
                },
                buttons: [
                    {
                        title: '自分もテストする',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/ja/static/name_compatibility.html',
                            webUrl: 'https://braindetox.kr/ja/static/name_compatibility.html'
                        }
                    }
                ]
            });
        });

        // ========== 広告ロード ==========
        document.addEventListener('DOMContentLoaded', () => {
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch (e) {}
        });
    </script>
</body>
</html>
