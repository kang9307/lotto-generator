            padding: 16px 20px;
            background: var(--bg-secondary);
        }

        .option-group {
            margin-bottom: 16px;
        }

        .option-group:last-child {
            margin-bottom: 0;
        }

        .option-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
        }

        .option-row {
            display: flex;
            gap: 8px;
        }

        .count-btn {
            flex: 1;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .count-btn.active {
            background: var(--accent);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .count-btn:hover:not(.active) {
            border-color: var(--accent);
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-radius: 10px;
        }

        .toggle-label {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            transition: 0.3s;
            border-radius: 28px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }

        /* Generate Button */
        .generate-section {
            padding: 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .generate-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            background: var(--accent);
            color: var(--text-primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .generate-btn:hover {
            background: var(--accent-hover);
        }

        .generate-btn:active {
            transform: scale(0.98);
        }

        /* Results */

            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

            display: flex;

            color: var(--text-primary);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: var(--accent-hover);
        }

        .copy-btn:active {

        }

        .copy-btn.copied {
            background: var(--success);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .empty-text {
            font-size: 1rem;
        }

        /* Footer */
        .footer {
            padding: 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);

        .footer-links {

        .share-btn:active {

        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;

            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* Install Banner */
        .install-banner {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 1500;
            display: none;
            animation: slideUp 0.3s ease;
            border: 1px solid var(--border-color);
            max-width: 448px;
            margin: 0 auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .install-banner.show {
            display: block;
        }

        .install-banner-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .install-banner-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #5856d6 0%, #af52de 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .install-banner-title {
            font-size: 0.95rem;

        }

        .install-banner-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .install-banner-close {

        .install-steps {

        // ========================================
        // State
        // ========================================
        let count = 1;
        let generatedNicknames = [];

        // ========================================
        // Functions
        // ========================================
        function setCount(n) {
            count = n;
            document.querySelectorAll('.count-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.count) === n);
            });
            vibrate();
        }

        function generate() {
            const addNumber = document.getElementById('add-number').checked;
            generatedNicknames = [];

            for (let i = 0; i < count; i++) {
                const adj = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
                const noun = NOUNS[Math.floor(Math.random() * NOUNS.length)];
                let nickname = adj + noun;

                if (addNumber) {
                    const num = Math.floor(Math.random() * 9999) + 1;
                    nickname += num;
                }

                generatedNicknames.push(nickname);
            }

            renderResults();
            vibrate();
        }

        function renderResults() {
            const emptyState = document.getElementById('empty-state');
            const container = document.getElementById('results-container');
            const list = document.getElementById('results-list');

            if (generatedNicknames.length === 0) {
                emptyState.style.display = 'block';
                container.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            container.style.display = 'block';

            list.innerHTML = generatedNicknames.map((nickname, index) => `
                <div class="nickname-card">
                    <span class="nickname-text">${nickname}</span>
                    <button class="copy-btn" id="copy-btn-${index}" onclick="copyNickname('${nickname}', ${index})">复制</button>
                </div>
            `).join('');
        }

        function copyNickname(nickname, index) {
            navigator.clipboard.writeText(nickname).then(() => {
                const btn = document.getElementById(`copy-btn-${index}`);
                btn.textContent = '完成!';
                btn.classList.add('copied');
                showToast('已复制！');

                setTimeout(() => {
                    btn.textContent = '复制';
                    btn.classList.remove('copied');
                }, 1500);
            }).catch(() => {
                showToast('复制 失败');
            });
            vibrate();
        }

        function copyAll() {
            if (generatedNicknames.length === 0) return;

            const text = generatedNicknames.join('\n');
            navigator.clipboard.writeText(text).then(() => {
                showToast(`${generatedNicknames.length}개 昵称이 已复制！`);
            }).catch(() => {
                showToast('复制 失败');
            });
            vibrate();
        }

        function shareKakao() {
            if (!window.Kakao) {
                showToast('카카오톡 SDK 로드 失败');
                return;
            }

            if (!Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            const description = generatedNicknames.length > 0
                ? `生成된 昵称: ${generatedNicknames.slice(0, 3).join(', ')}${generatedNicknames.length > 3 ? ' 외 ' + (generatedNicknames.length - 3) + '개' : ''}`
                : '형용사+명사 조합으로 4만가지 이상의 독특한 昵称을 生成해보세요!';

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: '随机 昵称 生成기',
                    description: description,
                    imageUrl: 'https://braindetox.kr/static/images/nickname_og.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/static/nickname_generator.html',
                        webUrl: 'https://braindetox.kr/static/nickname_generator.html'
                    }
                },
                buttons: [
                    {
                        title: '나도 만들어보기',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/static/nickname_generator.html',
                            webUrl: 'https://braindetox.kr/static/nickname_generator.html'
                        }
                    }
                ]
            });
        }

        // ========================================
        // Utilities
        // ========================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function vibrate() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        // ========================================
        // Install Banner
        // ========================================
        function showInstallBanner() {
            if (localStorage.getItem('nickname_installDismissed') === 'forever') return;
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            if (sessionStorage.getItem('nickname_installDismissed')) return;

            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);

            if (isIOS) {
                document.getElementById('ios-steps').style.display = 'block';
            } else if (isAndroid) {
                document.getElementById('android-steps').style.display = 'block';
            } else {
                document.getElementById('desktop-steps').style.display = 'block';
            }

            setTimeout(() => {
                document.getElementById('install-banner').classList.add('show');
            }, 5000);
        }

        function closeInstallBanner() {
            document.getElementById('install-banner').classList.remove('show');
            sessionStorage.setItem('nickname_installDismissed', 'true');
        }

        function closeInstallBannerForever() {
            document.getElementById('install-banner').classList.remove('show');
            localStorage.setItem('nickname_installDismissed', 'forever');
            showToast('다시 표시하지 않습니다');
        }

        // ========================================
        // Initialize
        // ========================================
        function init() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/static/nickname_sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            }

            showInstallBanner();
        }

        document.addEventListener('DOMContentLoaded', init);
