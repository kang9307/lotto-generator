        /* 신택스 하이라이팅 */
        .json-key { color: var(--json-key); }
        .json-string { color: var(--json-string); }
        .json-number { color: var(--json-number); }
        .json-boolean { color: var(--json-boolean); }
        .json-null { color: var(--json-null); }

        /* 트리 뷰 */

        .tree-toggle:hover {

        .status-valid {

        /* 뷰 모드 탭 */

        /* 파일 업로드 */

        @media (max-width: 640px) {

<body>
    <div class="bg-pattern"></div>

    <div class="container">
        <header>
            <span class="badge">개발자 도구</span>
            <h1>JSON 포맷터</h1>
            <p class="subtitle">JSON 데이터를 보기 좋게 정렬하고 유효성을 검사하세요.<br>Pretty Print, Minify, 트리 뷰, 신택스 하이라이팅을 지원합니다.</p>
        </header>

        <div class="card">
            <div class="card-header">
                <div class="card-icon">{ }</div>
                <div class="card-title">JSON 편집기</div>
            </div>

            <!-- 툴바 -->
            <div class="toolbar">
                <div class="toolbar-group">
                    <button class="toolbar-btn active" data-indent="2" onclick="setIndent(2)">2 Space</button>
                    <button class="toolbar-btn" data-indent="4" onclick="setIndent(4)">4 Space</button>
                    <button class="toolbar-btn" data-indent="tab" onclick="setIndent('tab')">Tab</button>
                </div>
                <button class="btn btn-primary" onclick="formatJSON()">
                    <span>✨</span> 정렬하기
                </button>
                <button class="btn btn-secondary" onclick="minifyJSON()">
                    <span>📦</span> 압축하기
                </button>
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">
                    <span>📁</span> 파일 업로드
                </button>
                <input type="file" id="fileInput" class="file-input" accept=".json,.txt" onchange="handleFileUpload(event)">
                <button class="btn btn-secondary" onclick="loadSample()">
                    <span>📋</span> 샘플
                </button>
                <button class="btn btn-secondary" onclick="clearAll()">
                    <span>🗑️</span> 초기화
                </button>
            </div>

            <!-- 에러 바 -->
            <div class="error-bar" id="errorBar">
                <span>⚠️</span>
                <span id="errorMessage"></span>
            </div>

            <!-- 상태 바 -->
            <div class="status-bar">
                <div class="status-item">
                    <span id="validStatus">⏳ 입력 대기 중</span>
                </div>
                <div class="status-item">
                    <span id="sizeInfo">0 bytes</span>
                </div>
            </div>

            <!-- 에디터 -->
            <div class="editor-container">
                <div class="editor-panel">
                    <div class="editor-label">
                        <span>입력</span>
                    </div>
                    <textarea
                        class="editor-textarea"
                        id="inputArea"
                        placeholder="JSON을 여기에 붙여넣기 하세요..."
                        oninput="validateInput()"
                    ></textarea>
                </div>
                <div class="editor-panel">
                    <div class="editor-label">
                        <span>출력</span>
                        <div class="view-tabs">
                            <button class="view-tab active" onclick="setViewMode('text')">텍스트</button>
                            <button class="view-tab" onclick="setViewMode('tree')">트리</button>
                        </div>
                    </div>
                    <div class="output-area" id="outputArea"></div>
                </div>
            </div>

            <!-- 공유 버튼 -->
            <div class="share-buttons">
                <button class="btn btn-success" onclick="copyOutput()">
                    <span>📋</span> 복사하기
                </button>
                <button class="btn btn-secondary" onclick="downloadJSON()">
                    <span>💾</span> 다운로드
                </button>
                <button class="btn btn-secondary" onclick="shareKakao()">
                    <span>💬</span> 카카오톡 공유
                </button>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 <a href="https://braindetox.kr">BrainDetox</a>. All rights reserved.</p>
            <p style="margin-top: 8px;">모든 처리는 브라우저에서 이루어지며 서버로 전송되지 않습니다.</p>
        </footer>
    </div>

    <!-- 토스트 -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== 상태 관리 ==========
        const state = {
            indent: 2,
            viewMode: 'text',
            lastFormatted: '',
            isValid: false
        };

        // ========== 카카오 SDK 초기화 ==========
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }
        });

        // ========== 들여쓰기 설정 ==========
        function setIndent(indent) {
            state.indent = indent;
            document.querySelectorAll('.toolbar-btn[data-indent]').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.indent === String(indent)) {
                    btn.classList.add('active');
                }
            });
            if (state.isValid && document.getElementById('inputArea').value.trim()) {
                formatJSON();
            }
        }

        // ========== 뷰 모드 설정 ==========
        function setViewMode(mode) {
            state.viewMode = mode;
            document.querySelectorAll('.view-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            if (state.lastFormatted) {
                displayOutput(state.lastFormatted);
            }
        }

        // ========== 입력 검증 ==========
        function validateInput() {
            const input = document.getElementById('inputArea').value.trim();
            const errorBar = document.getElementById('errorBar');
            const errorMessage = document.getElementById('errorMessage');
            const validStatus = document.getElementById('validStatus');
            const sizeInfo = document.getElementById('sizeInfo');

            // 크기 표시
            const bytes = new Blob([input]).size;
            sizeInfo.textContent = formatBytes(bytes);

            if (!input) {
                errorBar.classList.remove('show');
                validStatus.innerHTML = '⏳ 입력 대기 중';
                validStatus.className = 'status-item';
                state.isValid = false;
                return;
            }

            try {
                JSON.parse(input);
                errorBar.classList.remove('show');
                validStatus.innerHTML = '✅ 유효한 JSON';
                validStatus.className = 'status-valid';
                state.isValid = true;
            } catch (e) {
                const match = e.message.match(/position (\d+)/);
                let errorText = e.message;
                if (match) {
                    const pos = parseInt(match[1]);
                    const lines = input.substring(0, pos).split('\n');
                    const line = lines.length;
                    const col = lines[lines.length - 1].length + 1;
                    errorText = `${e.message} (${line}행, ${col}열)`;
                }
                errorMessage.textContent = errorText;
                errorBar.classList.add('show');
                validStatus.innerHTML = '❌ 잘못된 JSON';
                validStatus.className = 'status-invalid';
                state.isValid = false;
            }
        }

        // ========== JSON 정렬 ==========
        function formatJSON() {
            const input = document.getElementById('inputArea').value.trim();
            if (!input) {
                showToast('JSON을 입력해주세요.');
                return;
            }

            try {
                const parsed = JSON.parse(input);
                let indentStr = state.indent === 'tab' ? '\t' : state.indent;
                const formatted = JSON.stringify(parsed, null, indentStr);
                state.lastFormatted = formatted;
                displayOutput(formatted);
                showToast('JSON이 정렬되었습니다.');
            } catch (e) {
                showToast('유효하지 않은 JSON입니다.');
            }
        }

        // ========== JSON 압축 ==========
        function minifyJSON() {
            const input = document.getElementById('inputArea').value.trim();
            if (!input) {
                showToast('JSON을 입력해주세요.');
                return;
            }

            try {
                const parsed = JSON.parse(input);
                const minified = JSON.stringify(parsed);
                state.lastFormatted = minified;
                displayOutput(minified);
                showToast('JSON이 압축되었습니다.');
            } catch (e) {
                showToast('유효하지 않은 JSON입니다.');
            }
        }

        // ========== 출력 표시 ==========
        function displayOutput(json) {
            const outputArea = document.getElementById('outputArea');

            if (state.viewMode === 'tree') {
                try {
                    const parsed = JSON.parse(json);
                    outputArea.innerHTML = renderTree(parsed);
                } catch (e) {
                    outputArea.innerHTML = highlightJSON(json);
                }
            } else {
                outputArea.innerHTML = highlightJSON(json);
            }
        }

        // ========== 신택스 하이라이팅 ==========
        function highlightJSON(json) {
            return json
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?)/g, function(match) {
                    let cls = 'json-string';
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                        match = match.replace(/:$/, '') + ':';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                })
                .replace(/\b(true|false)\b/g, '<span class="json-boolean">$1</span>')
                .replace(/\bnull\b/g, '<span class="json-null">null</span>')
                .replace(/\b(-?\d+\.?\d*([eE][+-]?\d+)?)\b/g, '<span class="json-number">$1</span>');
        }

        // ========== 트리 뷰 렌더링 ==========
        function renderTree(obj, key = null) {
            const type = Array.isArray(obj) ? 'array' : typeof obj;
            let html = '<div class="tree-item">';

            if (key !== null) {
                html += `<span class="json-key">"${key}"</span>: `;
            }

            if (type === 'object' && obj !== null) {
                const keys = Object.keys(obj);
                if (keys.length === 0) {
                    html += '{}';
                } else {
                    html += `<span class="tree-toggle" onclick="toggleTree(this)">▼</span>{`;
                    html += '<div class="tree-children">';
                    keys.forEach((k, i) => {
                        html += renderTree(obj[k], k);
                        if (i < keys.length - 1) html += ',';
                    });
                    html += '</div>}';
                }
            } else if (type === 'array') {
                if (obj.length === 0) {
                    html += '[]';
                } else {
                    html += `<span class="tree-toggle" onclick="toggleTree(this)">▼</span>[`;
                    html += '<div class="tree-children">';
                    obj.forEach((item, i) => {
                        html += renderTree(item);
                        if (i < obj.length - 1) html += ',';
                    });
                    html += '</div>]';
                }
            } else if (type === 'string') {
                html += `<span class="json-string">"${escapeHtml(obj)}"</span>`;
            } else if (type === 'number') {
                html += `<span class="json-number">${obj}</span>`;
            } else if (type === 'boolean') {
                html += `<span class="json-boolean">${obj}</span>`;
            } else if (obj === null) {
                html += '<span class="json-null">null</span>';
            }

            html += '</div>';
            return html;
        }

        function toggleTree(element) {
            const parent = element.parentElement;
            parent.classList.toggle('tree-collapsed');
            element.textContent = parent.classList.contains('tree-collapsed') ? '▶' : '▼';
        }

        // ========== 파일 업로드 ==========
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('inputArea').value = e.target.result;
                validateInput();
                formatJSON();
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ========== 샘플 로드 ==========
        function loadSample() {
            const sample = {
                "name": "BrainDetox JSON 포맷터",
                "version": "1.0.0",
                "description": "온라인 JSON 정렬 및 검증 도구",
                "features": ["Pretty Print", "Minify", "트리 뷰", "신택스 하이라이팅"],
                "author": {
                    "name": "BrainDetox",
                    "website": "https://braindetox.kr"
                },
                "isOpenSource": true,
                "rating": 4.9,
                "users": null
            };
            document.getElementById('inputArea').value = JSON.stringify(sample);
            validateInput();
            formatJSON();
        }

        // ========== 초기화 ==========
        function clearAll() {
            document.getElementById('inputArea').value = '';
            document.getElementById('outputArea').innerHTML = '';
            document.getElementById('errorBar').classList.remove('show');
            document.getElementById('validStatus').innerHTML = '⏳ 입력 대기 중';
            document.getElementById('validStatus').className = 'status-item';
            document.getElementById('sizeInfo').textContent = '0 bytes';
            state.lastFormatted = '';
            state.isValid = false;
            showToast('초기화되었습니다.');
        }

        // ========== 복사 ==========
        function copyOutput() {
            if (!state.lastFormatted) {
                showToast('복사할 내용이 없습니다.');
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(state.lastFormatted).then(() => {
                    showToast('클립보드에 복사되었습니다.');
                }).catch(() => {
                    fallbackCopy(state.lastFormatted);
                });
            } else {
                fallbackCopy(state.lastFormatted);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('클립보드에 복사되었습니다.');
            } catch (err) {
                showToast('복사에 실패했습니다.');
            }
            document.body.removeChild(textarea);
        }

        // ========== 다운로드 ==========
        function downloadJSON() {
            if (!state.lastFormatted) {
                showToast('다운로드할 내용이 없습니다.');
                return;
            }

            const blob = new Blob([state.lastFormatted], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'formatted.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('다운로드가 시작되었습니다.');
        }

        // ========== 카카오톡 공유 ==========
        function shareKakao() {
            if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
                showToast('카카오톡 공유를 준비 중입니다.');
                return;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: 'JSON 포맷터 - 온라인 JSON 정렬 도구',
                    description: 'JSON 데이터를 보기 좋게 정렬하고 유효성을 검사하세요. Pretty Print, Minify, 트리 뷰 지원!',
                    imageUrl: 'https://braindetox.kr/site_logo.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/static/json_formatter.html',
                        webUrl: 'https://braindetox.kr/static/json_formatter.html'
                    }
                },
                buttons: [
                    {
                        title: 'JSON 포맷터 사용하기',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/static/json_formatter.html',
                            webUrl: 'https://braindetox.kr/static/json_formatter.html'
                        }
                    }
                ]
            });
        }

        // ========== 유틸리티 함수 ==========
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 bytes';
            const k = 1024;
            const sizes = ['bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

    </script>
</body>
