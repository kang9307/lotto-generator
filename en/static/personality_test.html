T Thinking</span><span class="dimension-label ${scores.F>scores.T?'active':''}" style="${scores.F>scores.T?'background:'+r.color:''}">F Feeling</span></div><div class="dimension-bar"><div class="dimension-fill" style="width:${(scores.T/tTF)*100}%;background:${r.color}"></div></div><div class="dimension-percent">${Math.round((scores.T/tTF)*100)}% : ${Math.round((scores.F/tTF)*100)}%</div></div><div class="dimension-item"><div class="dimension-labels"><span class="dimension-label ${scores.J>=scores.P?'active':''}" style="${scores.J>=scores.P?'background:'+r.color:''}">J Judging</span><span class="dimension-label ${scores.P>scores.J?'active':''}" style="${scores.P>scores.J?'background:'+r.color:''}">P Perceiving</span></div><div class="dimension-bar"><div class="dimension-fill" style="width:${(scores.J/tJP)*100}%;background:${r.color}"></div></div><div class="dimension-percent">${Math.round((scores.J/tJP)*100)}% : ${Math.round((scores.P/tJP)*100)}%</div></div></div><div class="result-section"><div class="section-title"><span class="section-icon">📖</span>${type} Description</div><p class="description-text">${r.description.replace(/\n\n/g,'</p><p class="description-text" style="margin-top:16px">')}</p></div><div class="result-section"><div class="section-title"><span class="section-icon">🧩</span>Cognitive Functions</div><div class="cognitive-stack">${r.cognitiveStack.map(c=>`<div class="cognitive-item"><div class="cognitive-rank">${c.rank}</div><div class="cognitive-func" style="color:${r.color}">${c.func}</div><div class="cognitive-name">${c.name}</div></div>`).join('')}</div></div><div class="result-section"><div class="section-title"><span class="section-icon">💼</span>Career Paths</div><div class="career-list">${r.careers.map(c=>`<div class="career-item"><span class="career-icon">✨</span><span>${c}</span></div>`).join('')}</div><p class="description-text" style="margin-top:16px">${r.workStyle}</p></div><div class="result-section"><div class="section-title"><span class="section-icon">💕</span>Romance Style</div><p class="description-text">${r.romance.style}</p><div style="margin-top:16px"><div style="font-weight:600;margin-bottom:8px;color:${r.color}">💪 Strengths</div><div class="trait-list">${r.romance.strengths.map(s=>`<span class="trait-tag">${s}</span>`).join('')}</div></div><div style="margin-top:16px"><div style="font-weight:600;margin-bottom:8px;color:var(--warning)">⚠️ Caution</div><p class="description-text">${r.romance.caution}</p></div></div><div class="result-section"><div class="section-title"><span class="section-icon">⭐</span>Strengths</div><div class="trait-list">${r.strengths.map(s=>`<span class="trait-tag">${s}</span>`).join('')}</div></div><div class="result-section"><div class="section-title"><span class="section-icon">🌱</span>Growth Areas</div><div class="trait-list">${r.growth.map(g=>`<span class="trait-tag">${g}</span>`).join('')}</div></div><div class="result-section"><div class="section-title"><span class="section-icon">🌟</span>Famous ${type}s</div><div class="celeb-list" style="grid-template-columns:repeat(2,1fr)">${r.celebrities.map(c=>`<div class="celeb-item"><span class="celeb-emoji">👤</span><span>${c}</span></div>`).join('')}</div></div><div class="result-section"><div class="section-title"><span class="section-icon">💑</span>Best Matches</div><div class="compat-list">${r.compatibility.map((c,i)=>`<div class="compat-item"><span class="compat-rank">${i+1}</span><div><div class="compat-type" style="color:${typeResults[c.type].color}">${c.type}</div><div class="compat-name">${c.name}</div></div></div>`).join('')}</div></div><div class="share-section"><div class="section-title"><span class="section-icon">📤</span>Share Results</div><div class="share-buttons"><button class="share-btn" onclick="saveImage()"><span class="share-btn-icon">📷</span><span class="share-btn-text">Save Image</span></button><button class="share-btn" onclick="copyLink()"><span class="share-btn-icon">🔗</span><span class="share-btn-text">Copy Link</span></button></div></div><button class="retry-btn" onclick="retryTest()">Take Test Again</button>`;document.getElementById('resultContent').innerHTML=html;window.scrollTo(0,0)}
function saveImage(){const el=document.getElementById('resultCapture');html2canvas(el,{backgroundColor:'#000',scale:2}).then(c=>{const l=document.createElement('a');l.download='personality_result.png';l.href=c.toDataURL();l.click();showToast('Image saved')})}
function copyLink(){navigator.clipboard.writeText('https://braindetox.kr/en/static/personality_test.html').then(()=>{showToast('Link copied')})}
function retryTest(){currentQuestion=0;answers=[];scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};document.getElementById('resultScreen').classList.remove('active');document.getElementById('startScreen').classList.add('active')}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function shareTwitter(){const text='16 Personality Types Test - Discover your true personality with 48 questions!';const url='https://braindetox.kr/en/static/personality_test.html';window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`,'_blank')}
function copyTestLink(){navigator.clipboard.writeText('https://braindetox.kr/en/static/personality_test.html').then(()=>{showToast('Link copied!')})}
</script>
</body>
</html>
