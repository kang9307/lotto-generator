<body>
    <div class="bg-pattern"></div>

    <div class="container">
        <header>
            <span class="badge">무료 생성기</span>
            <h1>QR 코드 생성기</h1>
            <p class="subtitle">텍스트나 URL을 QR 코드로 쉽게 변환하세요.<br>크기, 색상을 자유롭게 조절하고 PNG로 다운로드할 수 있습니다.</p>
        </header>

        <!-- 입력 카드 -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon">QR</div>
                <div class="card-title">QR 코드 설정</div>
            </div>

            <!-- 텍스트/URL 입력 -->
            <div class="input-group">
                <label for="qrInput">텍스트 또는 URL 입력</label>
                <textarea id="qrInput" placeholder="변환할 텍스트 또는 URL을 입력하세요. (예: https://braindetox.kr)"></textarea>
            </div>

            <!-- 크기 슬라이더 -->
            <div class="slider-group">
                <label>
                    <span>QR 코드 크기</span>
                    <span class="slider-value" id="sizeValue">300px</span>
                </label>
                <input type="range" id="qrSize" min="100" max="500" value="300" step="10" oninput="updateSizeLabel()">
            </div>

            <!-- 색상 선택 -->
            <div class="color-row">
                <div class="color-group">
                    <label>전경색 (QR 코드)</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="fgColor" value="#000000" onchange="updateColorHex('fg')">
                        <span class="color-hex" id="fgHex">#000000</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>배경색</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="bgColor" value="#ffffff" onchange="updateColorHex('bg')">
                        <span class="color-hex" id="bgHex">#ffffff</span>
                    </div>
                </div>
            </div>

            <!-- 생성 버튼 -->
            <button class="btn btn-primary" onclick="generateQR()">
                QR 코드 생성하기
            </button>

            <!-- QR 코드 출력 영역 -->
            <div class="qr-output" id="qrOutput">
                <div class="qr-canvas-wrapper" id="qrCanvasWrapper">
                    <div id="qrCanvas"></div>
                </div>
                <div class="qr-info" id="qrInfo"></div>

                <!-- 다운로드 / 클립보드 복사 -->
                <div class="action-buttons">
                    <button class="btn btn-success" onclick="downloadPNG()">
                        PNG 다운로드
                    </button>
                    <button class="btn btn-secondary" onclick="copyToClipboard()">
                        클립보드 복사
                    </button>
                </div>
            </div>
        </div>

        <!-- 공유 카드 -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon">></div>
                <div class="card-title">공유하기</div>

                <button class="btn btn-secondary" onclick="shareKakao()">
                    카카오톡 공유

                    링크 복사

    <div class="toast" id="toast"></div>

    <script>
        // ========== 카카오 SDK 초기화 ==========
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }
        });

        // ========== 크기 라벨 업데이트 ==========
        function updateSizeLabel() {
            const size = document.getElementById('qrSize').value;
            document.getElementById('sizeValue').textContent = size + 'px';
        }

        // ========== 색상 HEX 표시 업데이트 ==========
        function updateColorHex(type) {
            if (type === 'fg') {
                document.getElementById('fgHex').textContent = document.getElementById('fgColor').value;
            } else {
                document.getElementById('bgHex').textContent = document.getElementById('bgColor').value;
            }
        }

        // ========== QR 코드 인스턴스 ==========
        let qrInstance = null;

        // ========== QR 코드 생성 ==========
        function generateQR() {
            const input = document.getElementById('qrInput').value.trim();
            if (!input) {
                showToast('텍스트 또는 URL을 입력해주세요.');
                return;
            }

            const size = parseInt(document.getElementById('qrSize').value);
            const fgColor = document.getElementById('fgColor').value;
            const bgColor = document.getElementById('bgColor').value;
            const container = document.getElementById('qrCanvas');

            // 기존 QR 코드 제거
            container.innerHTML = '';
            if (qrInstance) {
                qrInstance.clear();
                qrInstance = null;
            }

            try {
                qrInstance = new QRCode(container, {
                    text: input,
                    width: size,
                    height: size,
                    colorDark: fgColor,
                    colorLight: bgColor,
                    correctLevel: QRCode.CorrectLevel.M
                });

                // 출력 영역 표시
                document.getElementById('qrOutput').classList.add('show');

                // 캔버스 래퍼 배경을 bgColor로 설정
                document.getElementById('qrCanvasWrapper').style.background = bgColor;

                // 정보 표시
                const byteLength = new Blob([input]).size;
                document.getElementById('qrInfo').textContent =
                    size + 'x' + size + 'px | ' + byteLength + ' bytes | 오류 보정: M (15%)';

                showToast('QR 코드가 생성되었습니다.');
            } catch (error) {
                showToast('QR 코드 생성에 실패했습니다: ' + error.message);
            }
        }

        // ========== QR 캔버스 가져오기 ==========
        function getQRCanvas() {
            const container = document.getElementById('qrCanvas');
            return container.querySelector('canvas');
        }

        // ========== PNG 다운로드 ==========
        function downloadPNG() {
            const canvas = getQRCanvas();
            if (!canvas) {
                showToast('먼저 QR 코드를 생성해주세요.');
                return;
            }

            const link = document.createElement('a');
            link.download = 'qr_code_' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('PNG 파일이 다운로드됩니다.');
        }

        // ========== 클립보드 복사 ==========
        function copyToClipboard() {
            const canvas = getQRCanvas();
            if (!canvas) {
                showToast('먼저 QR 코드를 생성해주세요.');
                return;
            }

            canvas.toBlob(function(blob) {
                if (navigator.clipboard && navigator.clipboard.write) {
                    const item = new ClipboardItem({ 'image/png': blob });
                    navigator.clipboard.write([item]).then(function() {
                        showToast('QR 코드가 클립보드에 복사되었습니다.');
                    }).catch(function() {
                        fallbackCopyText();
                    });
                } else {
                    fallbackCopyText();
                }
            }, 'image/png');
        }

        function fallbackCopyText() {
            const canvas = getQRCanvas();
            if (!canvas) return;
            const dataUrl = canvas.toDataURL('image/png');
            const textarea = document.createElement('textarea');
            textarea.value = dataUrl;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('QR 코드 이미지 데이터가 복사되었습니다.');
            } catch (err) {
                showToast('클립보드 복사에 실패했습니다.');
            }
            document.body.removeChild(textarea);
        }

        // ========== 페이지 URL 복사 ==========
        function copyPageUrl() {
            const url = 'https://braindetox.kr/static/qr_code_generator.html';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function() {
                    showToast('링크가 클립보드에 복사되었습니다.');
                }).catch(function() {
                    fallbackCopyPageUrl(url);
                });
            } else {
                fallbackCopyPageUrl(url);
            }
        }

        function fallbackCopyPageUrl(url) {
            const textarea = document.createElement('textarea');
            textarea.value = url;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('링크가 클립보드에 복사되었습니다.');
            } catch (err) {
                showToast('복사에 실패했습니다.');
            }
            document.body.removeChild(textarea);
        }

        // ========== 카카오톡 공유 ==========
        function shareKakao() {
            if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
                showToast('카카오톡 공유를 준비 중입니다.');
                return;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: 'QR 코드 생성기 - 무료 온라인 도구',
                    description: '텍스트나 URL을 QR 코드로 쉽게 변환하세요. 크기, 색상 조절 가능. PNG 다운로드 지원!',
                    imageUrl: 'https://braindetox.kr/site_logo.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/static/qr_code_generator.html',
                        webUrl: 'https://braindetox.kr/static/qr_code_generator.html'
                    }
                },
                buttons: [
                    {
                        title: 'QR 코드 생성기 사용하기',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/static/qr_code_generator.html',
                            webUrl: 'https://braindetox.kr/static/qr_code_generator.html'
                        }
                    }
                ]
            });
        }

        // ========== 토스트 알림 ==========
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(function() {
                toast.classList.remove('show');
            }, 2000);
        }

        // ========== Enter 키로 생성 ==========
        document.getElementById('qrInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateQR();
            }
        });
    </script>
</body>
</html>
