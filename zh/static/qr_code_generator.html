<body>
    <div class="bg-pattern"></div>

    <div class="container">
        <header>
            <span class="badge">免费生成器</span>
            <h1>QR码生成器</h1>
            <p class="subtitle">轻松将文本或URL转换为QR码。<br>自由调节大小和颜色，并可下载为PNG格式。</p>
        </header>

        <!-- 输入卡片 -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon">QR</div>
                <div class="card-title">QR码设置</div>
            </div>

            <!-- 文本/URL输入 -->
            <div class="input-group">
                <label for="qrInput">输入文本或URL</label>
                <textarea id="qrInput" placeholder="请输入要转换的文本或URL。（例如：https://braindetox.kr）"></textarea>
            </div>

            <!-- 大小滑块 -->
            <div class="slider-group">
                <label>
                    <span>QR码大小</span>
                    <span class="slider-value" id="sizeValue">300px</span>
                </label>
                <input type="range" id="qrSize" min="100" max="500" value="300" step="10" oninput="updateSizeLabel()">
            </div>

            <!-- 颜色选择 -->
            <div class="color-row">
                <div class="color-group">
                    <label>前景色（QR码）</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="fgColor" value="#000000" onchange="updateColorHex('fg')">
                        <span class="color-hex" id="fgHex">#000000</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>背景色</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="bgColor" value="#ffffff" onchange="updateColorHex('bg')">
                        <span class="color-hex" id="bgHex">#ffffff</span>
                    </div>
                </div>
            </div>

            <!-- 生成按钮 -->
            <button class="btn btn-primary" onclick="generateQR()">
                生成QR码
            </button>

            <!-- QR码输出区域 -->
            <div class="qr-output" id="qrOutput">
                <div class="qr-canvas-wrapper" id="qrCanvasWrapper">
                    <div id="qrCanvas"></div>
                </div>
                <div class="qr-info" id="qrInfo"></div>

                <!-- 下载 / 复制到剪贴板 -->
                <div class="action-buttons">
                    <button class="btn btn-success" onclick="downloadPNG()">
                        下载PNG
                    </button>
                    <button class="btn btn-secondary" onclick="copyToClipboard()">
                        复制到剪贴板
                    </button>
                </div>
            </div>
        </div>

        <!-- 分享卡片 -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon">></div>
                <div class="card-title">分享</div>
            </div>
            <div class="share-buttons">
                <button class="btn btn-secondary" onclick="shareKakao()">
                    通过KakaoTalk分享
                </button>
                <button class="btn btn-secondary" onclick="copyPageUrl()">
                    复制链接
                </button>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 <a href="https://braindetox.kr">BrainDetox</a>. All rights reserved.</p>
            <p style="margin-top: 8px;">所有处理均在浏览器中完成，不会发送到服务器。</p>
        </footer>
    </div>

    <!-- 提示框 -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== Kakao SDK 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }
        });

        // ========== 大小标签更新 ==========
        function updateSizeLabel() {
            const size = document.getElementById('qrSize').value;
            document.getElementById('sizeValue').textContent = size + 'px';
        }

        // ========== 颜色HEX显示更新 ==========
        function updateColorHex(type) {
            if (type === 'fg') {
                document.getElementById('fgHex').textContent = document.getElementById('fgColor').value;
            } else {
                document.getElementById('bgHex').textContent = document.getElementById('bgColor').value;
            }
        }

        // ========== QR码实例 ==========
        let qrInstance = null;

        // ========== QR码生成 ==========
        function generateQR() {
            const input = document.getElementById('qrInput').value.trim();
            if (!input) {
                showToast('请输入文本或URL。');
                return;
            }

            const size = parseInt(document.getElementById('qrSize').value);
            const fgColor = document.getElementById('fgColor').value;
            const bgColor = document.getElementById('bgColor').value;
            const container = document.getElementById('qrCanvas');

            // 删除现有QR码
            container.innerHTML = '';
            if (qrInstance) {
                qrInstance.clear();
                qrInstance = null;
            }

            try {
                qrInstance = new QRCode(container, {
                    text: input,
                    width: size,
                    height: size,
                    colorDark: fgColor,
                    colorLight: bgColor,
                    correctLevel: QRCode.CorrectLevel.M
                });

                // 显示输出区域
                document.getElementById('qrOutput').classList.add('show');

                // 将画布容器背景设置为bgColor
                document.getElementById('qrCanvasWrapper').style.background = bgColor;

                // 显示信息
                const byteLength = new Blob([input]).size;
                document.getElementById('qrInfo').textContent =
                    size + 'x' + size + 'px | ' + byteLength + ' bytes | ' + '纠错等级: M (15%)';

                showToast('QR码已生成。');
            } catch (error) {
                showToast('QR码生成失败：' + error.message);
            }
        }

        // ========== 获取QR画布 ==========
        function getQRCanvas() {
            const container = document.getElementById('qrCanvas');
            return container.querySelector('canvas');
        }

        // ========== PNG下载 ==========
        function downloadPNG() {
            const canvas = getQRCanvas();
            if (!canvas) {
                showToast('请先生成QR码。');
                return;
            }

            const link = document.createElement('a');
            link.download = 'qr_code_' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('正在下载PNG文件。');
        }

        // ========== 复制到剪贴板 ==========
        function copyToClipboard() {
            const canvas = getQRCanvas();
            if (!canvas) {
                showToast('请先生成QR码。');
                return;
            }

            canvas.toBlob(function(blob) {
                if (navigator.clipboard && navigator.clipboard.write) {
                    const item = new ClipboardItem({ 'image/png': blob });
                    navigator.clipboard.write([item]).then(function() {
                        showToast('QR码已复制到剪贴板。');
                    }).catch(function() {
                        fallbackCopyText();
                    });
                } else {
                    fallbackCopyText();
                }
            }, 'image/png');
        }

        function fallbackCopyText() {
            const canvas = getQRCanvas();
            if (!canvas) return;
            const dataUrl = canvas.toDataURL('image/png');
            const textarea = document.createElement('textarea');
            textarea.value = dataUrl;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('QR码图像数据已复制。');
            } catch (err) {
                showToast('复制到剪贴板失败。');
            }
            document.body.removeChild(textarea);
        }

        // ========== 复制页面URL ==========
        function copyPageUrl() {
            const url = 'https://braindetox.kr/zh/static/qr_code_generator.html';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function() {
                    showToast('链接已复制到剪贴板。');
                }).catch(function() {
                    fallbackCopyPageUrl(url);
                });
            } else {
                fallbackCopyPageUrl(url);
            }
        }

        function fallbackCopyPageUrl(url) {
            const textarea = document.createElement('textarea');
            textarea.value = url;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('链接已复制到剪贴板。');
            } catch (err) {
                showToast('复制失败。');
            }
            document.body.removeChild(textarea);
        }

        // ========== KakaoTalk分享 ==========
        function shareKakao() {
            if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
                showToast('正在准备KakaoTalk分享。');
                return;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: 'QR码生成器 - 免费在线工具',
                    description: '轻松将文本或URL转换为QR码。可调节大小和颜色。支持PNG下载！',
                    imageUrl: 'https://braindetox.kr/site_logo.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/zh/static/qr_code_generator.html',
                        webUrl: 'https://braindetox.kr/zh/static/qr_code_generator.html'
                    }
                },
                buttons: [
                    {
                        title: '使用QR码生成器',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/zh/static/qr_code_generator.html',
                            webUrl: 'https://braindetox.kr/zh/static/qr_code_generator.html'
                        }
                    }
                ]
            });
        }

        // ========== 提示通知 ==========
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(function() {
                toast.classList.remove('show');
            }, 2000);
        }

        // ========== 按Enter键生成 ==========
        document.getElementById('qrInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateQR();
            }
        });
    </script>
</body>
