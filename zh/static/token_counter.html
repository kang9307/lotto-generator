<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Token 计算器</h1>
            <p>GPT · Claude API Token 与费用估算</p>
        </header>

        <!-- Model Selection -->
        <div class="model-section">
            <label class="model-label">选择模型</label>
            <div class="model-grid">
                <button class="model-btn gpt active" data-model="gpt-4o" onclick="selectModel('gpt-4o')">
                    <div class="model-name">GPT-4o</div>
                    <div class="model-price">$2.5 / $10 per 1M</div>
                </button>
                <button class="model-btn gpt" data-model="gpt-4-turbo" onclick="selectModel('gpt-4-turbo')">
                    <div class="model-name">GPT-4 Turbo</div>
                    <div class="model-price">$10 / $30 per 1M</div>
                </button>
                <button class="model-btn gpt" data-model="gpt-3.5-turbo" onclick="selectModel('gpt-3.5-turbo')">
                    <div class="model-name">GPT-3.5 Turbo</div>
                    <div class="model-price">$0.5 / $1.5 per 1M</div>
                </button>
                <button class="model-btn claude" data-model="claude-3.5-sonnet" onclick="selectModel('claude-3.5-sonnet')">
                    <div class="model-name">Claude 3.5 Sonnet</div>
                    <div class="model-price">$3 / $15 per 1M</div>
                </button>
                <button class="model-btn claude" data-model="claude-3-opus" onclick="selectModel('claude-3-opus')">
                    <div class="model-name">Claude 3 Opus</div>
                    <div class="model-price">$15 / $75 per 1M</div>
                </button>
                <button class="model-btn claude" data-model="claude-3-haiku" onclick="selectModel('claude-3-haiku')">
                    <div class="model-name">Claude 3 Haiku</div>
                    <div class="model-price">$0.25 / $1.25 per 1M</div>
                </button>
            </div>
        </div>

        <!-- Text Area -->
        <div class="textarea-section">
            <textarea
                class="text-input"
                id="text-input"
                placeholder="请输入要计算 Token 数的文本..."
                oninput="calculateTokens()"
            ></textarea>
            <div class="text-actions">
                <button class="action-btn" onclick="clearText()">🗑️ 清除</button>
                <button class="action-btn" onclick="pasteText()">📋 粘贴</button>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="main-stat">
                <div class="main-stat-label">Token 数</div>
                <div class="main-stat-value"><span id="token-count">0</span><span class="main-stat-unit">tokens</span></div>
                <div class="loading-indicator" id="loading">计算中...</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">字符数</div>
                    <div class="stat-value"><span id="char-count">0</span><span class="unit">字</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">单词数</div>
                    <div class="stat-value"><span id="word-count">0</span><span class="unit">个</span></div>
                </div>
                <div class="stat-card highlight">
                    <div class="stat-label">输入费用（预估）</div>
                    <div class="stat-value cost"><span id="input-cost">$0.000</span></div>
                </div>
                <div class="stat-card highlight">
                    <div class="stat-label">输出费用（预估）</div>
                    <div class="stat-value cost"><span id="output-cost">$0.000</span></div>
                </div>
            </div>
        </div>

        <div class="share-section">
            <button class="share-btn share-kakao" onclick="shareKakao()">💬 Kakao 分享</button>
            <button class="share-btn share-copy" onclick="copyResult()">📋 复制结果</button>
        </div>

        </div>
        <div class="install-banner-buttons">
            <button class="btn-later" onclick="closeInstallBanner()">稍后再说</button>
            <button class="btn-dismiss" onclick="closeInstallBannerForever()">不再提示</button>
        </div>
    </div>

    <!-- Kakao SDK -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.5.0/kakao.min.js"></script>

    <!-- js-tiktoken for accurate token counting -->
    <script type="module">
        import { getEncoding } from 'https://esm.sh/js-tiktoken@1.0.12';

        // Make encoder available globally
        window.tiktoken = null;
        window.tiktokenReady = false;

        try {
            window.tiktoken = getEncoding('cl100k_base');
            window.tiktokenReady = true;
            console.log('Tiktoken loaded successfully');
            // Recalculate if there's already text
            if (document.getElementById('text-input')?.value) {
                window.calculateTokens();
            }
        } catch (e) {
            console.error('Failed to load tiktoken:', e);
        }
    </script>

    <script>
        // ========================================
        // Model Pricing (per 1M tokens, 2024)
        // ========================================
        const MODEL_PRICING = {
            'gpt-4o': { input: 2.5, output: 10, type: 'gpt' },
            'gpt-4-turbo': { input: 10, output: 30, type: 'gpt' },
            'gpt-3.5-turbo': { input: 0.5, output: 1.5, type: 'gpt' },
            'claude-3.5-sonnet': { input: 3, output: 15, type: 'claude' },
            'claude-3-opus': { input: 15, output: 75, type: 'claude' },
            'claude-3-haiku': { input: 0.25, output: 1.25, type: 'claude' }
        };

        // ========================================
        // State
        // ========================================
        let currentModel = 'gpt-4o';
        let stats = {
            tokens: 0,
            chars: 0,
            words: 0,
            inputCost: 0,
            outputCost: 0
        };

        // ========================================
        // Model Selection
        // ========================================
        function selectModel(model) {
            currentModel = model;
            document.querySelectorAll('.model-btn').forEach(btn => {
                const isActive = btn.dataset.model === model;
                btn.classList.toggle('active', isActive);
            });
            calculateTokens();
            vibrate();
        }

        // ========================================
        // Token Calculation
        // ========================================
        function calculateTokens() {
            const text = document.getElementById('text-input').value;

            // Basic stats
            stats.chars = text.length;
            const koreanWords = (text.match(/[가-힣]+/g) || []).length;
            const englishWords = (text.match(/[a-zA-Z]+/g) || []).length;
            stats.words = koreanWords + englishWords;

            // Token calculation
            if (window.tiktokenReady && window.tiktoken && MODEL_PRICING[currentModel].type === 'gpt') {
                // Use tiktoken for GPT models
                try {
                    const tokens = window.tiktoken.encode(text);
                    stats.tokens = tokens.length;
                } catch (e) {
                    stats.tokens = estimateTokens(text);
                }
            } else {
                // Estimate for Claude or if tiktoken not loaded
                stats.tokens = estimateTokens(text);
            }

            // Cost calculation
            const pricing = MODEL_PRICING[currentModel];
            stats.inputCost = (stats.tokens / 1000000) * pricing.input;
            stats.outputCost = (stats.tokens / 1000000) * pricing.output;

            renderStats();
        }

        function estimateTokens(text) {
            if (!text) return 0;

            // Count different character types
            const koreanChars = (text.match(/[가-힣]/g) || []).length;
            const englishChars = (text.match(/[a-zA-Z]/g) || []).length;
            const numbers = (text.match(/[0-9]/g) || []).length;
            const spaces = (text.match(/\s/g) || []).length;
            const punctuation = (text.match(/[^\w\s가-힣]/g) || []).length;

            // Estimation rules:
            // - Korean: ~1.5 chars per token (due to BPE)
            // - English: ~4 chars per token
            // - Numbers: ~2 chars per token
            // - Spaces: ~4 spaces per token
            // - Punctuation: ~1 per token
            const tokens = Math.ceil(
                koreanChars / 1.5 +
                englishChars / 4 +
                numbers / 2 +
                spaces / 4 +
                punctuation
            );

            return Math.max(tokens, 0);
        }

        function renderStats() {
            document.getElementById('token-count').textContent = stats.tokens.toLocaleString();
            document.getElementById('char-count').textContent = stats.chars.toLocaleString();
            document.getElementById('word-count').textContent = stats.words.toLocaleString();
            document.getElementById('input-cost').textContent = formatCost(stats.inputCost);
            document.getElementById('output-cost').textContent = formatCost(stats.outputCost);
        }

        function formatCost(cost) {
            if (cost < 0.001) return '$0.000';
            if (cost < 1) return '$' + cost.toFixed(4);
            return '$' + cost.toFixed(3);
        }

        // ========================================
        // Text Actions
        // ========================================
        function clearText() {
            document.getElementById('text-input').value = '';
            calculateTokens();
            showToast('文本已清除');
            vibrate();
        }

        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('text-input').value = text;
                calculateTokens();
                showToast('粘贴完成');
            } catch (err) {
                showToast('需要剪贴板访问权限');
            }
            vibrate();
        }

        // ========================================
        // Share Functions
        // ========================================
        function shareKakao() {
            if (!window.Kakao) {
                showToast('Kakao SDK 加载失败');
                return;
            }

            if (!Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: 'Token 计算器',
                    description: `${currentModel}: ${stats.tokens.toLocaleString()} tokens | 输入 ${formatCost(stats.inputCost)} | 输出 ${formatCost(stats.outputCost)}`,
                    imageUrl: 'https://braindetox.kr/static/images/token_counter_og.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/static/token_counter.html',
                        webUrl: 'https://braindetox.kr/static/token_counter.html'
                    }
                },
                buttons: [
                    {
                        title: '去计算 Token',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/static/token_counter.html',
                            webUrl: 'https://braindetox.kr/static/token_counter.html'
                        }
                    }
                ]
            });
        }

        function copyResult() {
            const text = `🔢 Token 计算结果

📊 模型：${currentModel}
🎯 Token 数：${stats.tokens.toLocaleString()} tokens
📝 字符数：${stats.chars.toLocaleString()} 字
💰 输入费用：${formatCost(stats.inputCost)}
💰 输出费用：${formatCost(stats.outputCost)}

👉 https://braindetox.kr/static/token_counter.html`;

            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制');
            }).catch(() => {
                showToast('复制失败');
            });
        }

        // ========================================
        // Utilities
        // ========================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function vibrate() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        // ========================================
        // Install Banner
        // ========================================
        function showInstallBanner() {
            if (localStorage.getItem('token_installDismissed') === 'forever') return;
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            if (sessionStorage.getItem('token_installDismissed')) return;

            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);

            if (isIOS) {
                document.getElementById('ios-steps').style.display = 'block';
            } else if (isAndroid) {
                document.getElementById('android-steps').style.display = 'block';
            } else {
                document.getElementById('desktop-steps').style.display = 'block';
            }

            setTimeout(() => {
                document.getElementById('install-banner').classList.add('show');
            }, 5000);
        }

        function closeInstallBanner() {
            document.getElementById('install-banner').classList.remove('show');
            sessionStorage.setItem('token_installDismissed', 'true');
        }

        function closeInstallBannerForever() {
            document.getElementById('install-banner').classList.remove('show');
            localStorage.setItem('token_installDismissed', 'forever');
            showToast('已设置不再提示');
        }

        // ========================================
        // Initialize
        // ========================================
        // Make calculateTokens available globally for the module script
        window.calculateTokens = calculateTokens;

        function init() {
            calculateTokens();

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/static/token_counter_sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            }

            showInstallBanner();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
