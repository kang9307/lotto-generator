<body>

    <div class="container">

        <!-- 画像アップロード -->

                        <input type="range" id="outputWidth" min="30" max="200" value="100">
                        <span class="slider-value" id="outputWidthVal">100</span>

                        <button class="chip" data-charset="detailed">詳細</button>

                        <button class="chip" data-charset="minimal">ミニマル</button>
                    </div>
                </div>
                <div class="control-item">
                    <div class="control-label">カラーモード</div>
                    <div class="chip-group" id="colorGroup">

                    </div>
                    <div class="toggle-row">
                        <span class="toggle-label">暗い背景</span>

        <div class="output-area" id="outputArea">

                <div class="action-buttons">

        <footer>

    <canvas id="hiddenCanvas" style="display:none"></canvas>

    <script>
    // ========== 文字セット ==========
    const charsets = {
        simple: ' .:-=+*#%@',
        detailed: ' .\'`^",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$',
        block: ' ░▒▓█',
        minimal: ' .:░█'
    };

    let currentCharset = 'simple';
    let currentColorMode = 'mono';
    let inverted = false;
    let darkBg = true;
    let loadedImage = null;

    // ========== ドラッグ＆ドロップ ==========
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault(); dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault(); dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            showToast('画像ファイルのみ対応しています。');
            return;
        }
        if (file.size > 10 * 1024 * 1024) {
            showToast('ファイルサイズは10MB以下のみ可能です。');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                loadedImage = img;
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('previewInfo').textContent = `${img.width} × ${img.height}px · ${(file.size / 1024).toFixed(1)}KB`;
                document.getElementById('previewArea').style.display = 'block';
                convert();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // ========== 変換 ==========
    function convert() {
        if (!loadedImage) return;

        const outputWidth = parseInt(document.getElementById('outputWidth').value);
        const charset = charsets[currentCharset];
        const img = loadedImage;

        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');

        const aspectRatio = img.height / img.width;
        const charAspect = 0.5;
        const outputHeight = Math.round(outputWidth * aspectRatio * charAspect);

        canvas.width = outputWidth;
        canvas.height = outputHeight;
        ctx.drawImage(img, 0, 0, outputWidth, outputHeight);

        const imageData = ctx.getImageData(0, 0, outputWidth, outputHeight);
        const pixels = imageData.data;

        const outputEl = document.getElementById('asciiOutput');

        if (currentColorMode === 'color') {
            let html = '';
            for (let y = 0; y < outputHeight; y++) {
                for (let x = 0; x < outputWidth; x++) {
                    const idx = (y * outputWidth + x) * 4;
                    const r = pixels[idx], g = pixels[idx + 1], b = pixels[idx + 2];
                    let brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
                    if (inverted) brightness = 1 - brightness;
                    const charIdx = Math.floor(brightness * (charset.length - 1));
                    const ch = charset[charIdx] === ' ' ? '&nbsp;' : charset[charIdx];
                    html += `<span style="color:rgb(${r},${g},${b})">${ch}</span>`;
                }
                html += '\n';
            }
            outputEl.innerHTML = html;
        } else {
            let text = '';
            for (let y = 0; y < outputHeight; y++) {
                for (let x = 0; x < outputWidth; x++) {
                    const idx = (y * outputWidth + x) * 4;
                    const r = pixels[idx], g = pixels[idx + 1], b = pixels[idx + 2];
                    let brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
                    if (inverted) brightness = 1 - brightness;
                    const charIdx = Math.floor(brightness * (charset.length - 1));
                    text += charset[charIdx];
                }
                text += '\n';
            }
            outputEl.textContent = text;
        }

        outputEl.style.background = darkBg ? '#0d1117' : '#f8f9fa';
        if (currentColorMode === 'mono') {
            outputEl.style.color = darkBg ? '#e6edf3' : '#1a1a1a';
        }

        document.getElementById('outputArea').style.display = 'block';
    }

    // ========== コントロールイベント ==========
    document.getElementById('outputWidth').addEventListener('input', function() {
        document.getElementById('outputWidthVal').textContent = this.value;
        convert();
    });

    document.getElementById('charsetGroup').addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        document.querySelectorAll('#charsetGroup .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentCharset = chip.dataset.charset;
        convert();
    });

    document.getElementById('colorGroup').addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        document.querySelectorAll('#colorGroup .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentColorMode = chip.dataset.color;
        convert();
    });

    function toggleInvert() {
        inverted = !inverted;
        document.getElementById('invertToggle').classList.toggle('active', inverted);
        convert();
    }

    function toggleDarkBg() {
        darkBg = !darkBg;
        document.getElementById('darkBgToggle').classList.toggle('active', darkBg);
        convert();
    }

    // ========== コピー/保存 ==========
    function copyAscii() {
        const el = document.getElementById('asciiOutput');
        const text = el.textContent || el.innerText;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => showToast('テキストがコピーされました。'));
        } else {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); showToast('テキストがコピーされました。'); }
            catch(e) { showToast('コピーに失敗しました。'); }
            document.body.removeChild(ta);
        }
    }

    function saveAsText() {
        const el = document.getElementById('asciiOutput');
        const text = el.textContent || el.innerText;
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.download = 'ascii_art.txt';
        a.href = URL.createObjectURL(blob);
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function saveAsImage() {
        const el = document.getElementById('asciiOutput');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        const fontSize = 10;
        const lineHeight = fontSize * 1.1;
        const lines = (el.textContent || el.innerText).split('\n').filter(l => l.length > 0);
        if (lines.length === 0) return;

        const maxLen = Math.max(...lines.map(l => l.length));
        const charWidth = fontSize * 0.6;

        canvas.width = Math.ceil(maxLen * charWidth) + 20;
        canvas.height = Math.ceil(lines.length * lineHeight) + 20;

        ctx.fillStyle = darkBg ? '#0d1117' : '#f8f9fa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + 'px "JetBrains Mono", "Courier New", monospace';

        if (currentColorMode === 'color' && el.querySelectorAll('span').length > 0) {
            let charIdx = 0;
            const spans = el.querySelectorAll('span');
            let x = 10, y = fontSize + 5;
            spans.forEach(span => {
                const ch = span.textContent === '\u00a0' ? ' ' : span.textContent;
                if (ch === '\n') { x = 10; y += lineHeight; return; }
                ctx.fillStyle = span.style.color || '#e6edf3';
                ctx.fillText(ch, x, y);
                x += charWidth;
            });
        } else {
            ctx.fillStyle = darkBg ? '#e6edf3' : '#1a1a1a';
            lines.forEach((line, i) => {
                ctx.fillText(line, 10, (i + 1) * lineHeight + 5);
            });
        }

        const a = document.createElement('a');
        a.download = 'ascii_art.png';
        a.href = canvas.toDataURL();
        a.click();
    }

    // ========== 共有 ==========
    function showToast(msg) {
        const t = document.createElement('div');
        t.className = 'toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.classList.add('show'), 10);
        setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2000);
    }

    function shareKakao() {
        if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
            showToast('カカオトーク共有を準備中です。');
            return;
        }
        Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
                title: 'ASCIIアート変換器',
                description: '画像をASCII文字アートに変換しましょう！カラー/モノクロモード対応。',
                imageUrl: 'https://braindetox.kr/site_logo.png',
                link: { mobileWebUrl: window.location.href, webUrl: window.location.href }
            },
            buttons: [{ title: 'ASCIIアートを作る', link: { mobileWebUrl: window.location.href, webUrl: window.location.href } }]
        });
    }

    function copyLink() {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(window.location.href).then(() => showToast('リンクがコピーされました。'));
        } else {
            const ta = document.createElement('textarea');
            ta.value = window.location.href; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); showToast('リンクがコピーされました。'); } catch(e) { showToast('コピーに失敗しました。'); }
            document.body.removeChild(ta);
        }
    }

    // ========== 初期化 ==========
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
            Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
        }
    });
    </script>
