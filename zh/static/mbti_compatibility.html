    <script>
        const MBTI_TYPES = ['ISTJ', 'ISFJ', 'INFJ', 'INTJ', 'ISTP', 'ISFP', 'INFP', 'INTP',
                           'ESTP', 'ESFP', 'ENFP', 'ENTP', 'ESTJ', 'ESFJ', 'ENFJ', 'ENTJ'];

        const MBTI_NAMES = {
            'ISTJ': '严谨的物流师',
            'ISFJ': '勇敢的守护者',
            'INFJ': '善意的倡导者',
            'INTJ': '缜密的战略家',
            'ISTP': '百变的鉴赏家',
            'ISFP': '好奇的艺术家',
            'INFP': '热忱的调停者',
            'INTP': '理性的思考者',
            'ESTP': '敢于冒险的实干家',
            'ESFP': '自由奔放的表演者',
            'ENFP': '充满活力的运动家',
            'ENTP': '热爱辩论的辩论家',
            'ESTJ': '严明的管理者',
            'ESFJ': '社交型的执政者',
            'ENFJ': '富有正义感的主人公',
            'ENTJ': '大胆的统帅'
        };

        function getCompatibilityLevel(score) {
            if (score >= 90) return '梦幻组合';
            if (score >= 80) return '绝佳配对';
            if (score >= 70) return '良好配对';
            if (score >= 60) return '尚可配对';
            if (score >= 50) return '需要努力的配对';
            return '充满挑战的配对';
        }

        function calculateCompatibility(mbti1, mbti2) {
            let baseScore = 50;
            let romanceScore = 50;
            let friendScore = 50;
            let workScore = 50;

            const e1 = mbti1[0], e2 = mbti2[0];
            const s1 = mbti1[1], s2 = mbti2[1];
            const t1 = mbti1[2], t2 = mbti2[2];
            const j1 = mbti1[3], j2 = mbti2[3];

            if (e1 !== e2) {
                baseScore += 8; romanceScore += 10; friendScore += 5; workScore += 8;
            } else {
                baseScore += 5; romanceScore += 5; friendScore += 10; workScore += 5;
            }

            if (s1 === s2) {
                baseScore += 15; romanceScore += 18; friendScore += 15; workScore += 15;
            } else {
                baseScore += 5; romanceScore += 5; friendScore += 8; workScore += 10;
            }

            if (t1 !== t2) {
                baseScore += 12; romanceScore += 15; friendScore += 10; workScore += 8;
            } else {
                baseScore += 8; romanceScore += 8; friendScore += 12; workScore += 12;
            }

            if (j1 !== j2) {
                baseScore += 10; romanceScore += 12; friendScore += 8; workScore += 6;
            } else {
                baseScore += 7; romanceScore += 7; friendScore += 10; workScore += 12;
            }

            const goldenPairs = {
                'ENFP-INFJ': 15, 'INFJ-ENFP': 15,
                'ENTP-INFJ': 14, 'INFJ-ENTP': 14,
                'ENFP-INTJ': 14, 'INTJ-ENFP': 14,
                'ENTP-INTJ': 13, 'INTJ-ENTP': 13,
                'INFP-ENFJ': 13, 'ENFJ-INFP': 13,
                'INTP-ENTJ': 12, 'ENTJ-INTP': 12,
                'ISFJ-ESTP': 10, 'ESTP-ISFJ': 10,
                'ISTJ-ESFP': 10, 'ESFP-ISTJ': 10,
                'ISFP-ESTJ': 10, 'ESTJ-ISFP': 10,
                'ISTP-ESFJ': 10, 'ESFJ-ISTP': 10
            };

            const pairKey = `${mbti1}-${mbti2}`;
            if (goldenPairs[pairKey]) {
                baseScore += goldenPairs[pairKey];
                romanceScore += goldenPairs[pairKey] + 5;
                friendScore += goldenPairs[pairKey];
                workScore += goldenPairs[pairKey] - 2;
            }

            if (mbti1 === mbti2) {
                baseScore += 5; friendScore += 10; workScore += 8;
            }

            baseScore = Math.min(Math.max(baseScore, 30), 98);
            romanceScore = Math.min(Math.max(romanceScore, 25), 99);
            friendScore = Math.min(Math.max(friendScore, 30), 98);
            workScore = Math.min(Math.max(workScore, 35), 97);

            return { total: baseScore, romance: romanceScore, friend: friendScore, work: workScore };
        }

        function generateDescriptions(mbti1, mbti2, scores) {
            const name1 = MBTI_NAMES[mbti1];
            const name2 = MBTI_NAMES[mbti2];

            let romanceDesc = '';
            let friendDesc = '';
            let workDesc = '';

            if (scores.romance >= 85) {
                romanceDesc = `${mbti1}（${name1}）与 ${mbti2}（${name2}）能够深度理解、彼此互补，形成理想的恋爱关系。彼此的差异反而成为魅力，非常有可能发展出共同成长的关系。`;
            } else if (scores.romance >= 70) {
                romanceDesc = `${mbti1} 与 ${mbti2} 能给彼此带来良好的激励。虽然存在小差异，但通过这些差异可以更广泛地理解对方，用心经营就能培育出深厚的爱情。`;
            } else if (scores.romance >= 55) {
                romanceDesc = `${mbti1} 与 ${mbti2} 由于观点不同，初期可能会有些困难。但只要相互承认并尊重差异，就能形成独特的和谐。`;
            } else {
                romanceDesc = `${mbti1} 与 ${mbti2} 在价值观或生活方式上差异较大。维持关系需要大量的理解与沟通，但同样也蕴含着成长的机会。`;
            }

            if (scores.friend >= 85) {
                friendDesc = `两种类型能很好地理解彼此的想法，容易产生共鸣。在一起时会感到轻松愉快，是能够长久维系友情的组合。`;
            } else if (scores.friend >= 70) {
                friendDesc = `拥有不同的视角，可以交流丰富多样的话题。能成为为对方打开新视野的好朋友，保持适度距离将使关系更加融洽。`;
            } else if (scores.friend >= 55) {
                friendDesc = `起初可能难以互相理解，但随着时间的推移会逐渐发现对方的优点。找到共同兴趣后便能拉近距离。`;
            } else {
                friendDesc = `性格差异较大，拉近距离可能需要时间。但只要彼此尊重差异，意外地也能成为好朋友。`;
            }

            if (scores.work >= 85) {
                workDesc = `在工作中能够发挥出协同效应的组合。彼此弥补不足，能够高效地达成目标。团队协作非常出色。`;
            } else if (scores.work >= 70) {
                workDesc = `只要明确分工就能成为不错的团队。发挥各自优势、弥补彼此弱项，可以提升工作效率。`;
            } else if (scores.work >= 55) {
                workDesc = `工作风格可能有所不同，初期需要磨合。明确的沟通与分工能够提升协作效率。`;
            } else {
                workDesc = `工作方式与优先级可能不同，容易产生摩擦。尊重彼此方式、保持明确沟通则可实现协作。`;
            }

            return { romance: romanceDesc, friend: friendDesc, work: workDesc };
        }

        function generateProsCons(mbti1, mbti2, scores) {
            const pros = [];
            const cons = [];

            const e1 = mbti1[0], e2 = mbti2[0];
            const s1 = mbti1[1], s2 = mbti2[1];
            const t1 = mbti1[2], t2 = mbti2[2];
            const j1 = mbti1[3], j2 = mbti2[3];

            if (e1 !== e2) {
                pros.push('内向与外向互补平衡');
                cons.push('需协调社交活动频率');
            } else if (e1 === 'E') {
                pros.push('一同享受充满活力的时光');
                cons.push('有时可能缺少安静的独处时间');
            } else {
                pros.push('相互尊重个人空间');
                cons.push('对社交活动可能较为消极');
            }

            if (s1 === s2) {
                pros.push('沟通方式相似，易于理解');
            } else {
                cons.push('需要克服对话方式上的差异');
                if (s1 === 'N' || s2 === 'N') {
                    pros.push('兼顾现实与理想');
                }
            }

            if (t1 !== t2) {
                pros.push('逻辑与感性相得益彰');
                cons.push('决策方式存在差异');
            } else if (t1 === 'T') {
                pros.push('能够进行理性对话');
                cons.push('情感表达可能略显不足');
            } else {
                pros.push('情感上容易产生共鸣');
                cons.push('决策时容易被情绪左右');
            }

            if (j1 !== j2) {
                pros.push('计划性与灵活性的平衡');
                cons.push('需要磨合生活方式');
            }

            if (scores.total >= 80) {
                pros.push('整体契合度很高');
            }

            return { pros: pros.slice(0, 4), cons: cons.slice(0, 3) };
        }

        function generateAdvice(mbti1, mbti2, scores) {
            const advices = [];

            if (scores.total >= 85) {
                advices.push('虽是天作之合的组合，但请勿把对方视为理所当然。');
                advices.push('再好的关系也需要持续用心经营，请经常表达感谢。');
            } else if (scores.total >= 70) {
                advices.push('请把彼此的不同看作可学习之处，而非缺点。');
                advices.push('定期进行深入的交流，努力去理解对方。');
            } else if (scores.total >= 55) {
                advices.push('承认并尊重差异，是关系中最关键的一点。');
                advices.push('与其批评对方的方式，不如尝试去理解。');
                advices.push('寻找共同的兴趣，创造一起享受的时光。');
            } else {
                advices.push('虽然差异很多，但彼此之间也有许多值得学习之处。');
                advices.push('需要努力站在对方的角度思考问题。');
                advices.push('从小事开始练习妥协与协调吧。');
            }

            return advices.join(' ');
        }

        let currentResult = null;

        function analyzeCompatibility() {
            const mbti1 = document.getElementById('mbti1').value;
            const mbti2 = document.getElementById('mbti2').value;

            if (!mbti1 || !mbti2) {
                showToast('请选择两个人的 MBTI');
                return;
            }

            vibrate();

            const scores = calculateCompatibility(mbti1, mbti2);
            const descriptions = generateDescriptions(mbti1, mbti2, scores);
            const prosCons = generateProsCons(mbti1, mbti2, scores);
            const advice = generateAdvice(mbti1, mbti2, scores);

            currentResult = { mbti1, mbti2, scores, descriptions, prosCons, advice };

            document.getElementById('mbti-pair').textContent = `${mbti1} + ${mbti2}`;
            document.getElementById('score-value').textContent = `${scores.total}%`;
            document.getElementById('score-circle').style.setProperty('--score-deg', `${scores.total * 3.6}deg`);
            document.getElementById('compatibility-level').textContent = getCompatibilityLevel(scores.total);

            document.getElementById('romance-score').textContent = `${scores.romance}%`;
            document.getElementById('romance-bar').style.width = `${scores.romance}%`;
            document.getElementById('romance-desc').textContent = descriptions.romance;

            document.getElementById('friend-score').textContent = `${scores.friend}%`;
            document.getElementById('friend-bar').style.width = `${scores.friend}%`;
            document.getElementById('friend-desc').textContent = descriptions.friend;

            document.getElementById('work-score').textContent = `${scores.work}%`;
            document.getElementById('work-bar').style.width = `${scores.work}%`;
            document.getElementById('work-desc').textContent = descriptions.work;

            const prosList = document.getElementById('pros-list');
            const consList = document.getElementById('cons-list');
            prosList.innerHTML = prosCons.pros.map(p => `<li>${p}</li>`).join('');
            consList.innerHTML = prosCons.cons.map(c => `<li>${c}</li>`).join('');

            document.getElementById('advice-text').textContent = advice;

            document.getElementById('result-section').classList.add('show');
            document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.toggle('active', content.id === `tab-${tabName}`);
            });
        }

        function shareKakao() {
            if (!Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            let title = 'MBTI 配对测试';
            let description = '通过两人的 MBTI 分析恋爱、友情、职场的配对度！';

            if (currentResult) {
                title = `${currentResult.mbti1} + ${currentResult.mbti2} 配对：${currentResult.scores.total}%`;
                description = `${getCompatibilityLevel(currentResult.scores.total)}！来测试 MBTI 配对度吧。`;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: title,
                    description: description,
                    imageUrl: 'https://braindetox.kr/static/images/mbti_compatibility_og.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/zh/static/mbti_compatibility.html',
                        webUrl: 'https://braindetox.kr/zh/static/mbti_compatibility.html'
                    }
                },
                buttons: [{
                    title: '我也来测一下',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/zh/static/mbti_compatibility.html',
                        webUrl: 'https://braindetox.kr/zh/static/mbti_compatibility.html'
                    }
                }]
            });
        }

        function copyResult() {
            let text = `💕 MBTI 配对测试\n\n通过两人的 MBTI 分析配对度！\n\n👉 https://braindetox.kr/zh/static/mbti_compatibility.html`;

            if (currentResult) {
                text = `💕 MBTI 配对结果\n\n${currentResult.mbti1} + ${currentResult.mbti2}\n配对分数：${currentResult.scores.total}%（${getCompatibilityLevel(currentResult.scores.total)}）\n\n👉 https://braindetox.kr/zh/static/mbti_compatibility.html`;
            }

            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制');
            }).catch(() => {
                showToast('复制失败');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function vibrate() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        function showInstallBanner() {
            if (localStorage.getItem('mbti_compatibility_installDismissed') === 'forever') return;
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            if (sessionStorage.getItem('mbti_compatibility_installDismissed')) return;

            const banner = document.getElementById('install-banner');
            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);

            if (isIOS) {
                document.getElementById('ios-steps').style.display = 'block';
            } else if (isAndroid) {
                document.getElementById('android-steps').style.display = 'block';
            } else {
                document.getElementById('desktop-steps').style.display = 'block';
            }

            setTimeout(() => banner.classList.add('show'), 5000);
        }

        function closeInstallBanner() {
            document.getElementById('install-banner').classList.remove('show');
            sessionStorage.setItem('mbti_compatibility_installDismissed', 'true');
        }

        function closeInstallBannerForever() {
            document.getElementById('install-banner').classList.remove('show');
            localStorage.setItem('mbti_compatibility_installDismissed', 'forever');
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/mbti_compatibility_sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed'));
        }

        document.addEventListener('DOMContentLoaded', () => {
            showInstallBanner();
        });
    </script>
