    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --accent-color: #6c5ce7;
            --accent-hover: #5649c0;
            --danger-color: #ff7675;
            --success-color: #00b894;
            --card-radius: 20px;
            --font-main: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #2d3436 0%, #000000 100%);
                --glass-bg: rgba(30, 30, 30, 0.6);
                --glass-border: rgba(255, 255, 255, 0.1);
                --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
                --text-primary: #dfe6e9;
                --text-secondary: #b2bec3;
                --accent-color: #a29bfe;
                --accent-hover: #8e84f6;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        /* Glassmorphism Container */
        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        /* PC Grid Layout */
        @media (min-width: 1024px) {
            .container {
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-areas:
                    "water breath todo"
                    "timer mood todo"
                    "quote quote todo";
                align-items: stretch;
            }

            .card-water {
                grid-area: water;
            }

            .card-breath {
                grid-area: breath;
            }

            .card-timer {
                grid-area: timer;
            }

            .card-mood {
                grid-area: mood;
            }

            .card-quote {
                grid-area: quote;
            }

            .card-todo {
                grid-area: todo;
                height: 100%;
            }

            .card-todo .todo-list {
                max-height: 600px;
                flex-grow: 1;
            }
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 30px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--card-radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header-title p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .current-time {
            text-align: right;
        }

        .time-display {
            font-size: 1.8rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .date-display {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Card Styles */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--card-radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 25px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-icon {
            font-size: 1.4rem;
        }

        /* 1. Hydration Tracker */
        .water-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .water-visual {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 4px solid var(--accent-color);
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .water-level {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #74b9ff, #0984e3);
            transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.8;
        }

        .water-text {
            position: relative;
            z-index: 2;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        .water-controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            border: none;
            outline: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: var(--font-main);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: rgba(108, 92, 231, 0.1);
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        /* 2. Breathing Exercise */
        .breath-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            min-height: 200px;
        }

        .breath-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--success-color);
            opacity: 0.2;
            transform: scale(1);
            transition: transform 4s ease-in-out, opacity 4s ease-in-out;
            position: absolute;
        }

        .breath-text {
            position: relative;
            z-index: 2;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
        }

        .breath-controls {
            margin-top: 20px;
        }

        /* 3. Focus Timer */
        .timer-display {
            font-size: 3.5rem;
            font-weight: 700;
            text-align: center;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .timer-presets {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--glass-border);
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* 4. Todo List */
        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .todo-input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.5);
            font-family: var(--font-main);
            font-size: 1rem;
            color: var(--text-primary);
        }

        .todo-input:focus {
            outline: 2px solid var(--accent-color);
            background: rgba(255, 255, 255, 0.8);
        }

        .todo-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.3);
            margin-bottom: 8px;
            border-radius: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .todo-text {
            flex-grow: 1;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .todo-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            padding: 5px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .todo-delete:hover {
            opacity: 1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .current-time {
                text-align: left;
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: baseline;
            }

            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Gamification */
        .xp-container {
            width: 100%;
            margin-top: 15px;
        }

        .xp-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }

        .xp-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), var(--success-color));
            width: 0%;
            transition: width 0.5s ease;
        }

        .level-badge {
            background: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 8px;
            vertical-align: middle;
        }

        /* Mood Tracker */
        .mood-grid {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .mood-btn {
            font-size: 2rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            opacity: 0.5;
            filter: grayscale(0.8);
        }

        .mood-btn:hover {
            transform: scale(1.2);
            opacity: 0.8;
            filter: grayscale(0);
        }

        .mood-btn.selected {
            transform: scale(1.3);
            opacity: 1;
            filter: grayscale(0);
        }

        /* Confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* Quote */
        .quote-card {
            /* grid-column: 1 / -1; REMOVED */
            text-align: center;
            font-style: italic;
            color: var(--text-secondary);
            font-size: 1.1rem;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>

<body>
    <canvas id="confetti-canvas"></canvas>

    <header>
        <div class="header-title">
            <h1>My Day <span class="level-badge" id="levelBadge">Lv.1</span></h1>
            <p>A dashboard for a healthy, productive day</p>
            <div class="xp-container">
                <div class="xp-info">
                    <span>XP</span>
                    <span id="xpText">0 / 100</span>
                </div>
                <div class="xp-bar">
                    <div class="xp-fill" id="xpFill"></div>
                </div>
            </div>
        </div>
        <div class="current-time">
            <div class="time-display" id="clock">00:00</div>
            <div class="date-display" id="date">Monday, January 1</div>
        </div>
    </header>

    <div class="container">
        <!-- 1. Hydration Card -->
        <div class="card card-water">
            <div class="card-header">
                <div class="card-title">
                    <span class="card-icon">💧</span> Hydration
                </div>
                <div style="font-size: 0.9rem; color: var(--text-secondary);">Goal: 2000ml</div>
            </div>
            <div class="water-container">
                <div class="water-visual">
                    <div class="water-level" id="waterLevel"></div>
                    <div class="water-text"><span id="waterCount">0</span>ml</div>
                </div>
                <div class="water-controls">
                    <button class="btn btn-outline btn-sm" id="btnWaterMinus"
                        onclick="window.adjustWater(-250)">-250ml</button>
                    <button class="btn btn-primary" id="btnWaterPlus" onclick="window.adjustWater(250)">+250ml</button>
                </div>
            </div>
        </div>

        <!-- 2. Breathing Card -->
        <div class="card card-breath">
            <div class="card-header">
                <div class="card-title">
                    <span class="card-icon">🧘</span> Breathing Exercise
                </div>
            </div>
            <div class="breath-container" id="breathContainer">
                <div class="breath-circle" id="breathCircle"></div>
                <div class="breath-text" id="breathText">Ready</div>
            </div>
            <div class="breath-controls" style="text-align: center;">
                <button class="btn btn-primary" id="breathBtn" onclick="window.toggleBreathing()">Start</button>
            </div>
        </div>

        <!-- 3. Focus Timer Card -->
        <div class="card card-timer">
            <div class="card-header">
                <div class="card-title">
                    <span class="card-icon">⏱️</span> Focus Timer
                </div>
            </div>
            <div class="timer-presets">
                <button class="preset-btn" data-time="25" onclick="window.setTimer(25)">25 min</button>
                <button class="preset-btn" data-time="50" onclick="window.setTimer(50)">50 min</button>
                <button class="preset-btn" data-time="10" onclick="window.setTimer(10)">10 min</button>
            </div>
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-controls">
                <button class="btn btn-primary" id="timerBtn" onclick="window.toggleTimer()">Start</button>
                <button class="btn btn-outline" id="timerResetBtn" onclick="window.resetTimer()">Reset</button>
            </div>
        </div>

        <!-- 4. Todo Card -->
        <div class="card card-todo">
            <div class="card-header">
                <div class="card-title">
                    <span class="card-icon">✅</span> To-Do List
                </div>
                <div style="font-size: 0.9rem; color: var(--text-secondary);" id="todoCount">0/0 done</div>
            </div>
            <div class="todo-input-group">
                <input type="text" class="todo-input" id="todoInput" placeholder="Enter a task..."
                    onkeypress="if(event.key === 'Enter') window.addTodo()">
                <button class="btn btn-primary" id="btnAddTodo" onclick="window.addTodo()">Add</button>
            </div>
            <ul class="todo-list" id="todoList">
                <!-- Todo Items will be added here -->
            </ul>
        </div>
        <!-- 5. Mood Card -->
        <div class="card card-mood">
            <div class="card-header">
                <div class="card-title">
                    <span class="card-icon">😊</span> Today's Mood
                </div>
            </div>
            <div class="mood-grid">
                <button class="mood-btn" onclick="window.setMood('happy')">😄</button>
                <button class="mood-btn" onclick="window.setMood('good')">🙂</button>
                <button class="mood-btn" onclick="window.setMood('neutral')">😐</button>
                <button class="mood-btn" onclick="window.setMood('sad')">😞</button>
                <button class="mood-btn" onclick="window.setMood('tired')">😫</button>
            </div>
        </div>

        <!-- 6. Quote Card -->
        <div class="card quote-card card-quote">
            <p id="quoteText">"You've got this today!"</p>
        </div>
    </div>

    <script>
        // --- Global Error Handling ---
        window.onerror = function (msg, url, line) {
            console.error("Global Error: " + msg + "\nurl: " + url + "\nline: " + line);
        };

        // --- Safe Storage Wrapper ---
        const Storage = {
            get: (key, def) => {
                try {
                    return localStorage.getItem(key) || def;
                } catch (e) {
                    console.warn('LocalStorage access denied:', e);
                    return def;
                }
            },
            set: (key, val) => {
                try {
                    localStorage.setItem(key, val);
                } catch (e) {
                    console.warn('LocalStorage access denied:', e);
                }
            }
        };

        // --- Core Logic (Global Scope) ---
        let waterAmount = 0;
        const waterGoal = 2000;
        let isBreathing = false;
        let breathInterval;
        let timerTime = 25 * 60;
        let initialTime = 25 * 60;
        let timerInterval;
        let isTimerRunning = false;
        let todos = [];
        let userXP = 0;
        let userLevel = 1;
        let userMood = '';

        // Initialize Data
        try {
            waterAmount = parseInt(Storage.get('myday_water', '0'));
            todos = JSON.parse(Storage.get('myday_todos', '[]'));
            userXP = parseInt(Storage.get('myday_xp', '0'));
            userLevel = parseInt(Storage.get('myday_level', '1'));
            userMood = Storage.get('myday_mood', '');
        } catch (e) {
            console.error("Data init error", e);
        }

        // --- Functions ---

        // 0. Gamification & Visuals
        function updateXP(amount) {
            userXP += amount;
            const maxXP = userLevel * 100;
            if (userXP >= maxXP) {
                userXP -= maxXP;
                userLevel++;
                confetti();
                // alert(`Congrats! You reached level ${userLevel}! 🎉`); // Optional alert
            }
            updateXPUI();
            saveData();
        }

        function updateXPUI() {
            const xpText = document.getElementById('xpText');
            const xpFill = document.getElementById('xpFill');
            const levelBadge = document.getElementById('levelBadge');
            const maxXP = userLevel * 100;

            if (xpText) xpText.textContent = `${userXP} / ${maxXP}`;
            if (xpFill) xpFill.style.width = `${(userXP / maxXP) * 100}%`;
            if (levelBadge) levelBadge.textContent = `Lv.${userLevel}`;
        }

        window.setMood = function (mood) {
            userMood = mood;
            document.querySelectorAll('.mood-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.onclick.toString().includes(mood)) {
                    btn.classList.add('selected');
                }
            });
            saveData();
        };

        function updateGreeting() {
            const hour = new Date().getHours();
            const title = document.querySelector('.header-title p');
            let greeting = "A dashboard for a healthy, productive day";
            if (hour >= 5 && hour < 12) greeting = "Good morning! ☀️ Start your day with energy.";
            else if (hour >= 12 && hour < 18) greeting = "Keep going this afternoon! ☕ How about a short break?";
            else if (hour >= 18 && hour < 22) greeting = "Great work today. 🌙 Have a relaxing evening.";
            else greeting = "It's late. 🛌 Get some good rest for tomorrow.";
            if (title) title.textContent = greeting;
        }

        function updateQuote() {
            const quotes = [
                "Small changes lead to big results.",
                "If you don't walk today, you'll have to run tomorrow.",
                "Health is your greatest asset.",
                "Rest is recovery, not laziness.",
                "You are getting better today."
            ];
            const quoteText = document.getElementById('quoteText');
            if (quoteText) quoteText.textContent = `" ${quotes[Math.floor(Math.random() * quotes.length)]} "`;
        }

        // Simple Confetti
        function confetti() {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            for (let i = 0; i < 100; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    size: Math.random() * 10 + 5,
                    speed: Math.random() * 5 + 2
                });
            }

            let animationId;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                pieces.forEach(p => {
                    p.y += p.speed;
                    if (p.y < canvas.height) active = true;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                if (active) animationId = requestAnimationFrame(animate);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            animate();
        }

        // 1. Water
        window.adjustWater = function (amount) {
            console.log("adjustWater called", amount);
            waterAmount += amount;
            if (waterAmount < 0) waterAmount = 0;
            updateWaterUI();
            if (amount > 0) updateXP(10);
            saveData();
        };

        function updateWaterUI() {
            const countEl = document.getElementById('waterCount');
            const levelEl = document.getElementById('waterLevel');
            if (countEl) countEl.textContent = waterAmount;
            if (levelEl) {
                const percentage = Math.min((waterAmount / waterGoal) * 100, 100);
                levelEl.style.height = `${percentage}%`;
            }
        }

        // 2. Breathing
        window.toggleBreathing = function () {
            const btn = document.getElementById('breathBtn');
            const text = document.getElementById('breathText');
            const circle = document.getElementById('breathCircle');

            if (isBreathing) {
                isBreathing = false;
                clearInterval(breathInterval);
                if (btn) {
                    btn.textContent = "Start";
                    btn.classList.remove('btn-outline');
                    btn.classList.add('btn-primary');
                }
                if (text) text.textContent = "Ready";
                if (circle) {
                    circle.style.transform = 'scale(1)';
                    circle.style.opacity = '0.2';
                }
            } else {
                isBreathing = true;
                if (btn) {
                    btn.textContent = "Stop";
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-outline');
                }
                breathCycle();
                breathInterval = setInterval(breathCycle, 8000);
            }
        };

        function breathCycle() {
            const text = document.getElementById('breathText');
            const circle = document.getElementById('breathCircle');

            if (text) text.textContent = "Breathe in...";
            if (circle) {
                circle.style.transform = 'scale(2.5)';
                circle.style.opacity = '0.6';
            }

            setTimeout(() => {
                if (!isBreathing) return;
                if (text) text.textContent = "Breathe out...";
                if (circle) {
                    circle.style.transform = 'scale(1)';
                    circle.style.opacity = '0.2';
                }
            }, 4000);
        }

        // 3. Timer
        window.setTimer = function (minutes) {
            if (isTimerRunning) window.toggleTimer();
            initialTime = minutes * 60;
            timerTime = initialTime;
            updateTimerDisplay();
        };

        window.toggleTimer = function () {
            const btn = document.getElementById('timerBtn');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                if (btn) {
                    btn.textContent = "Start";
                    btn.classList.remove('btn-outline');
                    btn.classList.add('btn-primary');
                }
            } else {
                if (timerTime <= 0) timerTime = initialTime;
                isTimerRunning = true;
                if (btn) {
                    btn.textContent = "Pause";
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-outline');
                }

                timerInterval = setInterval(() => {
                    timerTime--;
                    updateTimerDisplay();
                    if (timerTime <= 0) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        if (btn) {
                            btn.textContent = "Start";
                            btn.classList.remove('btn-outline');
                            btn.classList.add('btn-primary');
                        }
                        alert("Focus session complete!");
                    }
                }, 1000);
            }
        };

        window.resetTimer = function () {
            if (isTimerRunning) window.toggleTimer();
            timerTime = initialTime;
            updateTimerDisplay();
        };

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimerDisplay() {
            const display = document.getElementById('timerDisplay');
            if (display) display.textContent = formatTime(timerTime);
        }

        // 4. Todo
        window.addTodo = function () {
            const input = document.getElementById('todoInput');
            if (!input) return;
            const text = input.value.trim();
            if (text) {
                todos.push({ text, completed: false });
                input.value = '';
                renderTodos();
                updateXP(20);
            }
        };

        window.toggleTodo = function (index) {
            todos[index].completed = !todos[index].completed;
            if (todos[index].completed) updateXP(20);
            renderTodos();
        };

        window.deleteTodo = function (index) {
            todos.splice(index, 1);
            renderTodos();
        };

        function renderTodos() {
            const list = document.getElementById('todoList');
            if (!list) return;
            list.innerHTML = '';

            let completedCount = 0;

            todos.forEach((todo, index) => {
                if (todo.completed) completedCount++;

                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''} onchange="window.toggleTodo(${index})">
                    <span class="todo-text">${todo.text}</span>
                    <button class="todo-delete" onclick="window.deleteTodo(${index})">✕</button>
                `;
                list.appendChild(li);
            });

            const countEl = document.getElementById('todoCount');
            if (countEl) countEl.textContent = `${completedCount}/${todos.length} done`;
            saveData();
        }

        function saveData() {
            Storage.set('myday_water', waterAmount);
            Storage.set('myday_todos', JSON.stringify(todos));
            Storage.set('myday_xp', userXP);
            Storage.set('myday_level', userLevel);
            Storage.set('myday_mood', userMood);
        }

        // --- Initialization ---
        window.onload = function () {
            console.log("Window loaded");

            // Attach Listeners (Redundant but safe)
            const btnWaterMinus = document.getElementById('btnWaterMinus');
            const btnWaterPlus = document.getElementById('btnWaterPlus');
            if (btnWaterMinus) btnWaterMinus.onclick = () => window.adjustWater(-250);
            if (btnWaterPlus) btnWaterPlus.onclick = () => window.adjustWater(250);

            const breathBtn = document.getElementById('breathBtn');
            if (breathBtn) breathBtn.onclick = window.toggleBreathing;

            const timerBtn = document.getElementById('timerBtn');
            const timerResetBtn = document.getElementById('timerResetBtn');
            if (timerBtn) timerBtn.onclick = window.toggleTimer;
            if (timerResetBtn) timerResetBtn.onclick = window.resetTimer;

            const presetBtns = document.querySelectorAll('.preset-btn');
            presetBtns.forEach(btn => {
                btn.onclick = (e) => {
                    const time = parseInt(e.target.dataset.time);
                    window.setTimer(time);
                };
            });

            const btnAddTodo = document.getElementById('btnAddTodo');
            const todoInput = document.getElementById('todoInput');
            if (btnAddTodo) btnAddTodo.onclick = window.addTodo;
            if (todoInput) todoInput.onkeypress = (e) => {
                if (e.key === 'Enter') window.addTodo();
            };

            // Initial Render
            updateWaterUI();
            updateXPUI();
            updateGreeting();
            updateQuote();
            if (userMood) window.setMood(userMood);

            // Clock
            function updateTime() {
                const now = new Date();
                const clockEl = document.getElementById('clock');
                const dateEl = document.getElementById('date');
                if (clockEl) clockEl.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                if (dateEl) dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

                const lastDate = Storage.get('myday_last_date', '');
                const todayStr = now.toDateString();
                if (lastDate !== todayStr) {
                    resetDailyStats();
                    Storage.set('myday_last_date', todayStr);
                }
            }
            setInterval(updateTime, 1000);
            updateTime();
        };

        function resetDailyStats() {
            waterAmount = 0;
            updateWaterUI();
            saveData();
        }
    </script>
</body>

</html>
