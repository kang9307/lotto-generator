        </div>

        <!-- iOS -->
        <div class="install-steps" id="ios-steps" style="display: none;">
            <div class="install-step">
                <span class="step-num">1</span>
                <span>点击底部的<strong style="color:#ff9500">分享按钮</strong></span>
            </div>
            <div class="install-step">
                <span class="step-num">2</span>
                <span>选择<strong style="color:#ff9500">"添加到主屏幕"</strong></span>
            </div>
        </div>

        <!-- Android -->
        <div class="install-steps" id="android-steps" style="display: none;">
            <div class="install-step">
                <span class="step-num">1</span>
                <span>点击浏览器菜单 <strong style="color:#ff9500">(⋮)</strong></span>
            </div>
            <div class="install-step">
                <span class="step-num">2</span>
                <span>选择<strong style="color:#ff9500">"添加到主屏幕"</strong>或<strong style="color:#ff9500">"安装应用"</strong></span>
            </div>
        </div>

        <!-- Desktop -->
        <div class="install-steps" id="desktop-steps" style="display: none;">
            <div class="install-step">
                <span class="step-num">1</span>
                <span>点击地址栏中的<strong style="color:#ff9500">安装图标</strong></span>
            </div>
        </div>

        <div class="install-banner-buttons">
            <button class="btn-later" onclick="closeInstallBanner()">稍后</button>
            <button class="btn-dismiss" onclick="closeInstallBannerForever()">不再显示</button>
        </div>
    </div>

    <!-- Kakao SDK -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.5.0/kakao.min.js"></script>

    <script>
        // ========================================
        // State
        // ========================================
        let currentValue = '0';
        let exchangeRate = null; // CNY per 1 KRW
        let krwPerForeign = null; // KRW per 1 CNY
        let isForeignToKrw = true; // true: CNY→KRW, false: KRW→CNY
        let lastUpdate = null;

        // ========================================
        // Exchange Rate API
        // ========================================
        async function fetchExchangeRate() {
            const rateDisplay = document.getElementById('rate-value');
            const updateDisplay = document.getElementById('rate-update');

            try {
                // Using exchangerate-api.com free tier
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/KRW');
                const data = await response.json();

                if (data && data.rates && data.rates.CNY) {
                    exchangeRate = data.rates.CNY; // CNY per 1 KRW
                    krwPerForeign = 1 / exchangeRate; // KRW per 1 CNY

                    // Display rate as KRW per 1 CNY
                    const krwPerUnit = Math.round(1 * krwPerForeign);
                    rateDisplay.textContent = krwPerUnit.toLocaleString();
                    rateDisplay.classList.remove('rate-loading', 'rate-error');

                    lastUpdate = new Date();
                    updateDisplay.textContent = `${lastUpdate.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })} 更新`;

                    // Save to localStorage
                    localStorage.setItem('cny_rate', JSON.stringify({
                        exchangeRate,
                        krwPerForeign,
                        timestamp: lastUpdate.getTime()
                    }));

                    updateDisplay();
                }
            } catch (error) {
                console.error('Failed to fetch exchange rate:', error);

                // Try to load from cache
                const cached = localStorage.getItem('cny_rate');
                if (cached) {
                    const data = JSON.parse(cached);
                    exchangeRate = data.exchangeRate;
                    krwPerForeign = data.krwPerForeign;

                    const krwPerUnit = Math.round(1 * krwPerForeign);
                    rateDisplay.textContent = krwPerUnit.toLocaleString();
                    updateDisplay.innerHTML = '<span style="color:#ff9500">缓存汇率</span>';
                } else {
                    // Fallback rate (approximate)
                    exchangeRate = 1 / 185; // CNY per 1 KRW
                    krwPerForeign = 1 / exchangeRate;

                    const krwPerUnit = Math.round(1 * krwPerForeign);
                    rateDisplay.textContent = krwPerUnit.toLocaleString();
                    rateDisplay.classList.add('rate-error');
                    updateDisplay.innerHTML = '<span style="color:#ff3b30">汇率加载失败</span>';
                }

                updateDisplay();
            }
        }

        // ========================================
        // Calculator Functions
        // ========================================
        function inputDigit(digit) {
            if (currentValue === '0') {
                currentValue = digit;
            } else if (currentValue.length < 15) {
                currentValue += digit;
            }
            updateDisplay();
            vibrate();
        }

        function clearAll() {
            currentValue = '0';
            updateDisplay();
            vibrate();
        }

        function backspace() {
            if (currentValue.length > 1) {
                currentValue = currentValue.slice(0, -1);
            } else {
                currentValue = '0';
            }
            updateDisplay();
            vibrate();
        }

        function toggleSign() {
            if (currentValue !== '0') {
                if (currentValue.startsWith('-')) {
                    currentValue = currentValue.slice(1);
                } else {
                    currentValue = '-' + currentValue;
                }
                updateDisplay();
            }
            vibrate();
        }

        function percentage() {
            const num = parseFloat(currentValue);
            currentValue = String(num / 100);
            updateDisplay();
            vibrate();
        }

        function addZeros(count) {
            if (currentValue === '0') {
                currentValue = '1' + '0'.repeat(count);
            } else if (currentValue.length + count <= 15) {
                currentValue += '0'.repeat(count);
            }
            updateDisplay();
            vibrate();
        }

        function setAmount(amount) {
            currentValue = String(amount);
            updateDisplay();
            vibrate();
        }

        function toggleMode() {
            isForeignToKrw = !isForeignToKrw;

            const modeText = document.getElementById('mode-text');
            const inputLabel = document.getElementById('input-label');
            const resultLabel = document.getElementById('result-label');

            if (isForeignToKrw) {
                modeText.textContent = 'CNY → KRW';
                inputLabel.textContent = '人民币 (CNY)';
                resultLabel.textContent = '韩元 (KRW)';
            } else {
                modeText.textContent = 'KRW → CNY';
                inputLabel.textContent = '韩元 (KRW)';
                resultLabel.textContent = '人民币 (CNY)';
            }

            currentValue = '0';
            updateDisplay();
            vibrate();
        }

        // ========================================
        // Display Update
        // ========================================
        function updateDisplay() {
            const foreignDisplay = document.getElementById('foreign-display');
            const krwDisplay = document.getElementById('krw-display');

            const inputNum = parseFloat(currentValue) || 0;
            let resultNum = 0;

            if (krwPerForeign) {
                if (isForeignToKrw) {
                    resultNum = inputNum * krwPerForeign;
                } else {
                    resultNum = inputNum * exchangeRate;
                }
            }

            // Format input
            const formattedInput = formatNumber(inputNum);
            const inputUnit = isForeignToKrw ? '¥' : '₩';
            foreignDisplay.innerHTML = `${formattedInput}<span class="foreign-unit">${inputUnit}</span>`;

            // Format result
            const formattedResult = formatNumber(Math.round(resultNum));
            const resultPrefix = isForeignToKrw ? '₩' : '';
            const resultSuffix = isForeignToKrw ? '' : ' ¥';
            krwDisplay.textContent = `${resultPrefix}${formattedResult}${resultSuffix}`;

            // Adjust font size based on length
            adjustFontSize(foreignDisplay, formattedInput.length, 'foreign');
            adjustFontSize(krwDisplay, formattedResult.length, 'krw');
        }

        function formatNumber(num) {
            return num.toLocaleString('zh-CN');
        }

        function adjustFontSize(element, length, type) {
            element.classList.remove('small', 'smaller');

            if (type === 'foreign') {
                if (length > 15) {
                    element.classList.add('smaller');
                } else if (length > 10) {
                    element.classList.add('small');
                }
            } else {
                if (length > 12) {
                    element.classList.add('smaller');
                } else if (length > 8) {
                    element.classList.add('small');
                }
            }
        }

        // ========================================
        // Haptic Feedback
        // ========================================
        function vibrate() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        // ========================================
        // Share Functions
        // ========================================
        function shareKakao() {
            if (!window.Kakao) {
                showToast('KakaoTalk SDK 加载失败');
                return;
            }

            if (!Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            const inputNum = parseFloat(currentValue) || 0;
            let resultNum = 0;

            if (krwPerForeign) {
                resultNum = isForeignToKrw ? inputNum * krwPerForeign : inputNum * exchangeRate;
            }

            const inputText = isForeignToKrw
                ? `${formatNumber(inputNum)} CNY`
                : `${formatNumber(inputNum)} KRW`;
            const resultText = isForeignToKrw
                ? `${formatNumber(Math.round(resultNum))} KRW`
                : `${formatNumber(Math.round(resultNum))} CNY`;

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: '人民币汇率计算器',
                    description: `${inputText} = ${resultText}`,
                    imageUrl: 'https://braindetox.kr/static/images/vnd_calculator_og.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/zh/static/cny_krw_calculator.html',
                        webUrl: 'https://braindetox.kr/zh/static/cny_krw_calculator.html'
                    }
                },
                buttons: [
                    {
                        title: '计算汇率',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/zh/static/cny_krw_calculator.html',
                            webUrl: 'https://braindetox.kr/zh/static/cny_krw_calculator.html'
                        }
                    }
                ]
            });
        }

        function copyResult() {
            const inputNum = parseFloat(currentValue) || 0;
            let resultNum = 0;

            if (krwPerForeign) {
                resultNum = isForeignToKrw ? inputNum * krwPerForeign : inputNum * exchangeRate;
            }

            const inputText = isForeignToKrw
                ? `${formatNumber(inputNum)} CNY`
                : `${formatNumber(inputNum)} KRW`;
            const resultText = isForeignToKrw
                ? `${formatNumber(Math.round(resultNum))} KRW`
                : `${formatNumber(Math.round(resultNum))} CNY`;

            const text = `💱 人民币汇率换算\n${inputText} = ${resultText}\n\nhttps://braindetox.kr/zh/static/cny_krw_calculator.html`;

            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制！');
            }).catch(() => {
                showToast('复制失败');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ========================================
        // Keyboard Support
        // ========================================
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                inputDigit(e.key);
            } else if (e.key === 'Backspace') {
                backspace();
            } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
                clearAll();
            }
        });

        // ========================================
        // Install Banner Functions
        // ========================================
        function showInstallBanner() {
            if (localStorage.getItem('vndCalc_installDismissed') === 'forever') {
                return;
            }

            if (window.matchMedia('(display-mode: standalone)').matches) {
                return;
            }

            if (sessionStorage.getItem('vndCalc_installDismissed')) {
                return;
            }

            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);

            if (isIOS) {
                document.getElementById('ios-steps').style.display = 'block';
            } else if (isAndroid) {
                document.getElementById('android-steps').style.display = 'block';
            } else {
                document.getElementById('desktop-steps').style.display = 'block';
            }

            setTimeout(() => {
                document.getElementById('install-banner').classList.add('show');
            }, 3000);
        }

        function closeInstallBanner() {
            document.getElementById('install-banner').classList.remove('show');
            sessionStorage.setItem('vndCalc_installDismissed', 'true');
        }

        function closeInstallBannerForever() {
            document.getElementById('install-banner').classList.remove('show');
            localStorage.setItem('vndCalc_installDismissed', 'forever');
            showToast('不再显示');
        }

        // ========================================
        // Initialize
        // ========================================
        function init() {
            fetchExchangeRate();
            updateDisplay();

            // Refresh rate every 5 minutes
            setInterval(fetchExchangeRate, 5 * 60 * 1000);

            // Register Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/static/vnd_krw_sw.js')
                    .then((registration) => {
                        console.log('SW registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('SW registration failed:', error);
                    });
            }

            // Show install banner
            showInstallBanner();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
