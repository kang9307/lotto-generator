        // ========== 更新测试界面 ==========
        function updateTestUI() {
            const plate = plates[currentStep];
            const progress = ((currentStep + 1) / plates.length) * 100;

            document.getElementById('progressText').textContent = `${currentStep + 1} / ${plates.length}`;
            document.getElementById('progressPercent').textContent = `${Math.round(progress)}%`;
            document.getElementById('progressFill').style.width = `${progress}%`;

            drawPlate(plate);
            generateAnswerButtons(plate);
        }

        // ========== 绘制Canvas色板 (改进版) ==========
        function getRandomRadius() {
            const rand = Math.random();
            if (rand < 0.15) return 2 + Math.random() * 2;
            if (rand < 0.35) return 4 + Math.random() * 3;
            if (rand < 0.60) return 7 + Math.random() * 4;
            if (rand < 0.85) return 11 + Math.random() * 4;
            return 15 + Math.random() * 5;
        }

        function pickColor(colors) {
            const base = colors[Math.floor(Math.random() * colors.length)];
            const variation = 18;
            return [
                Math.max(0, Math.min(255, base[0] + (Math.random() - 0.5) * variation)),
                Math.max(0, Math.min(255, base[1] + (Math.random() - 0.5) * variation)),
                Math.max(0, Math.min(255, base[2] + (Math.random() - 0.5) * variation))
            ];
        }

        function drawPlate(plate) {
            const canvas = document.getElementById('plateCanvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2;

            ctx.clearRect(0, 0, width, height);

            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.clip();

            const bgBase = plate.bgColors[0];
            ctx.fillStyle = `rgb(${bgBase[0]}, ${bgBase[1]}, ${bgBase[2]})`;
            ctx.fillRect(0, 0, width, height);

            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = width;
            maskCanvas.height = height;
            const maskCtx = maskCanvas.getContext('2d');

            maskCtx.fillStyle = 'black';
            maskCtx.fillRect(0, 0, width, height);
            maskCtx.fillStyle = 'white';
            maskCtx.font = `900 ${height * 0.48}px Arial Black, Arial, sans-serif`;
            maskCtx.textAlign = 'center';
            maskCtx.textBaseline = 'middle';
            maskCtx.fillText(plate.number, centerX, centerY);

            const maskData = maskCtx.getImageData(0, 0, width, height).data;

            const dots = [];
            const maxAttempts = 12000;
            const minGap = 0.5;

            for (let i = 0; i < maxAttempts; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.sqrt(Math.random()) * (radius - 2);
                const x = centerX + Math.cos(angle) * dist;
                const y = centerY + Math.sin(angle) * dist;
                const r = getRandomRadius();

                if (x - r < centerX - radius + 1 || x + r > centerX + radius - 1 ||
                    y - r < centerY - radius + 1 || y + r > centerY + radius - 1) {
                    continue;
                }

                let overlaps = false;
                for (const dot of dots) {
                    const d = Math.hypot(x - dot.x, y - dot.y);
                    if (d < r + dot.r + minGap) {
                        overlaps = true;
                        break;
                    }
                }

                if (!overlaps) {
                    const px = Math.floor(x);
                    const py = Math.floor(y);
                    if (px >= 0 && px < width && py >= 0 && py < height) {
                        const idx = (py * width + px) * 4;
                        const isNumber = maskData[idx] > 128;
                        dots.push({ x, y, r, isNumber });
                    }
                }
            }

            dots.sort((a, b) => b.r - a.r);

            for (const dot of dots) {
                const colors = dot.isNumber ? plate.fgColors : plate.bgColors;
                const [r, g, b] = pickColor(colors);

                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
                ctx.fill();
            }

            ctx.restore();
        }

        // ========== 生成答案按钮 ==========
        function generateAnswerButtons(plate) {
            const grid = document.getElementById('answerGrid');
            grid.innerHTML = '';

            plate.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = opt;
                btn.onclick = () => submitAnswer(opt);
                grid.appendChild(btn);
            });

            const noBtn = document.createElement('button');
            noBtn.className = 'answer-btn no-number';
            noBtn.textContent = '看不到数字';
            noBtn.onclick = () => submitAnswer(null);
            grid.appendChild(noBtn);
        }

        // ========== 提交答案 ==========
        function submitAnswer(answer) {
            const plate = plates[currentStep];
            const isCorrect = answer === plate.number;

            answers.push({
                plateId: plate.id,
                type: plate.type,
                correctAnswer: plate.number,
                userAnswer: answer,
                isCorrect: isCorrect
            });

            currentStep++;

            if (currentStep >= plates.length) {
                showResult();
            } else {
                updateTestUI();
            }
        }

        // ========== 显示结果 ==========
        function showResult() {
            const analysis = analyzeResults();

            document.getElementById('resultIcon').textContent = analysis.icon;
            document.getElementById('resultTitle').textContent = analysis.title;
            document.getElementById('resultDescription').textContent = analysis.description;
            document.getElementById('totalCount').textContent = plates.length;
            document.getElementById('correctCount').textContent = analysis.correct;
            document.getElementById('wrongCount').textContent = analysis.wrong;

            showScreen('resultScreen');
        }

        // ========== 分析结果 ==========
        function analyzeResults() {
            let pdWrong = 0;
            let tritanWrong = 0;
            let correct = 0;

            answers.forEach(ans => {
                if (ans.isCorrect) {
                    correct++;
                } else {
                    if (ans.type === 'protan-deutan') pdWrong++;
                    if (ans.type === 'tritan') tritanWrong++;
                }
            });

            const wrong = answers.length - correct;
            let resultType = 'normal';

            if (pdWrong >= 3) {
                resultType = 'protan-deutan';
            } else if (tritanWrong >= 2) {
                resultType = 'tritan';
            } else if (pdWrong >= 1 || tritanWrong >= 1) {
                resultType = 'mild';
            }

            const data = resultData[resultType];
            return {
                type: resultType,
                icon: data.icon,
                title: data.title,
                description: data.description,
                correct: correct,
                wrong: wrong
            };
        }

        // ========== 重新测试 ==========
        function restartTest() {
            currentStep = 0;
            answers = [];
            showScreen('startScreen');
        }

        // ========== 复制结果 ==========
        function copyResult() {
            const title = document.getElementById('resultTitle').textContent;
            const correct = document.getElementById('correctCount').textContent;
            const total = document.getElementById('totalCount').textContent;

            const text = `👁️ 色盲测试结果\n\n` +
                        `结果: ${title}\n` +
                        `得分: ${correct}/${total} 正确\n\n` +
                        `参加测试: https://braindetox.kr/zh/static/color_blindness_test.html`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('结果已复制！');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('结果已复制！');
            } catch (err) {
                showToast('复制失败。');
            }
            document.body.removeChild(textarea);
        }
