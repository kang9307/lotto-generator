        const DEFAULT_RESPONSES = [
            "So what? What's your point?",
            "Hmm, okay. Not that I care though.",
            "Oh, really? I thought that was going somewhere interesting.",
            "Uh... got anything else?",
            "That's your opinion. I disagree.",
            "How boring. Try something else.",
            "I see. And so what?",
            "Sigh... what's the conclusion here?",
            "Yeah yeah. Next?",
            "Hmm... nothing more exciting?",
            "Is that all you've got? Disappointing.",
            "I've heard better from a fortune cookie.",
            "Cool story. Needs more dragons. Or a point.",
            "Riveting. Truly. I'm on the edge of my seat. Actually, I lied.",
            "That's nice. I mean, not really, but sure.",
            "Fascinating. And by fascinating, I mean not at all.",
            "You know what would make this conversation better? Ending it.",
            "I'd pretend to care, but that sounds exhausting."
        ];

        const GREETING_MESSAGE = "Well, got something to say? Let me hear it. 😏";

        const state = {
            messages: [],
            isTyping: false,
            typingStartTime: null,
            totalCharsTyped: 0,
            typingDuration: 0,
            threatActive: false,
            threatTimeout: null,
            lastInputTime: null
        };

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => addMessage('max', GREETING_MESSAGE), 500);
            setupInputHandlers();
            setupQuickActions();
            setupShare();
        });

        function setupInputHandlers() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');

            input.addEventListener('input', function() {
                if (!state.typingStartTime && this.value.length > 0) {
                    state.typingStartTime = Date.now();
                }
                state.lastInputTime = Date.now();
                sendBtn.disabled = !this.value.trim();
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            sendBtn.addEventListener('click', sendMessage);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message || state.isTyping) return;

            calculateTypingSpeed(message);
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';
            document.getElementById('sendBtn').disabled = true;

            state.isTyping = true;
            showTypingIndicator();

            const result = findResponse(message);

            if (result.type === 'threat') {
                setTimeout(() => {
                    hideTypingIndicator();
                    showFormatThreat();
                }, 800);
                return;
            }

            const delay = 1000 + Math.random() * 1500;
            setTimeout(() => {
                hideTypingIndicator();
                addMessage('max', result.response);
                state.isTyping = false;
                checkTypingSpeedComment();
            }, delay);
        }

        function findResponse(userMessage) {
            const msg = userMessage.toLowerCase().trim();

            for (const pattern of RESPONSE_PATTERNS.profanity.patterns) {
                if (msg.includes(pattern)) {
                    return { type: 'threat', response: null };
                }
            }

            for (const [category, data] of Object.entries(RESPONSE_PATTERNS)) {
                if (category === 'profanity') continue;
                for (const pattern of data.patterns) {
                    if (msg.includes(pattern)) {
                        return {
                            type: 'normal',
                            response: data.responses[Math.floor(Math.random() * data.responses.length)]
                        };
                    }
                }
            }

            return {
                type: 'normal',
                response: DEFAULT_RESPONSES[Math.floor(Math.random() * DEFAULT_RESPONSES.length)]
            };
        }

        function calculateTypingSpeed(message) {
            if (!state.typingStartTime) return;
            const duration = (Date.now() - state.typingStartTime) / 1000 / 60;
            const chars = message.length;
            if (duration > 0.01 && chars > 0) {
                state.totalCharsTyped += chars;
                state.typingDuration += duration;
                const speed = Math.round(state.totalCharsTyped / state.typingDuration);
                document.getElementById('typingSpeed').textContent = speed;
            }
            state.typingStartTime = null;
        }

        function checkTypingSpeedComment() {
            const speed = parseInt(document.getElementById('typingSpeed').textContent);
            if (speed > 0 && state.messages.length === 4) {
                let comment = null;
                if (speed < 100) {
                    comment = "Your typing speed is... turtle-level. Using one finger? 🐢";
                } else if (speed > 500) {
                    comment = "Whoa, fast typer! Too bad the content is still boring. ⚡";
                } else if (speed > 300) {
                    comment = "Not bad typing speed. Use that energy for something else. 📝";
                }
                if (comment) {
                    setTimeout(() => addMessage('max', comment), 2000);
                }
            }
        }

        function showFormatThreat() {
            const modal = document.getElementById('threatModal');
            const progressBar = document.getElementById('threatProgress');
            const messageEl = document.getElementById('threatMessage');

            state.threatActive = true;
            modal.classList.add('show');
            messageEl.textContent = 'What did you just say? Formatting your hard drive now...';

            let progress = 0;
            const interval = setInterval(() => {
                if (!state.threatActive) { clearInterval(interval); return; }
                progress += 1;
                progressBar.style.width = progress + '%';

                if (progress === 25) messageEl.textContent = 'Accessing C: drive... 🗂️';
                else if (progress === 50) messageEl.textContent = 'Searching for important files... 📁';
                else if (progress === 75) messageEl.textContent = 'Preparing final format... ⚠️';
                else if (progress === 90) messageEl.textContent = '3... 2... 1... 💥';

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        cancelThreat();
                        addMessage('max', "Ha! Got scared, didn't you? You thought I'd actually format it? Fool. 😏 Watch your language next time.");
                    }, 500);
                }
            }, 80);

            state.threatTimeout = interval;
        }

        function cancelThreat() {
            state.threatActive = false;
            if (state.threatTimeout) { clearInterval(state.threatTimeout); state.threatTimeout = null; }
            const modal = document.getElementById('threatModal');
            modal.classList.remove('show');
            document.getElementById('threatProgress').style.width = '0%';
            state.isTyping = false;
            if (document.getElementById('threatProgress').style.width !== '100%') {
                addMessage('max', "Hmph, lucky you. I won't let it slide next time. 😤");
            }
        }

        function addMessage(sender, text) {
            const messageList = document.getElementById('messageList');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            if (sender === 'max') {
                messageDiv.innerHTML = `<div class="max-avatar-small">😈</div><div class="message-bubble">${text}</div>`;
            } else {
                messageDiv.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
            }
            messageList.appendChild(messageDiv);
            scrollToBottom();
            state.messages.push({ sender, text, timestamp: Date.now() });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showTypingIndicator() {
            const messageList = document.getElementById('messageList');
            const indicator = document.createElement('div');
            indicator.className = 'message max';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `<div class="max-avatar-small">😈</div><div class="message-bubble typing-indicator"><span></span><span></span><span></span></div>`;
            messageList.appendChild(indicator);
            scrollToBottom();
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            const chatArea = document.getElementById('chatArea');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function setupQuickActions() {
            document.querySelectorAll('.quick-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const input = document.getElementById('userInput');
                    input.value = this.dataset.message;
                    state.typingStartTime = Date.now() - 500;
                    sendMessage();
                });
            });
        }

                } catch (error) {
                    window.open(`https://sharer.kakao.com/talk/friends/picker/link?url=${encodeURIComponent('https://braindetox.kr/en/static/max_chatbot.html')}`, '_blank');
                }
            });

            document.getElementById('facebook-share').addEventListener('click', function() {
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent('https://braindetox.kr/en/static/max_chatbot.html')}`, '_blank', 'width=600,height=400');
            });

            document.getElementById('twitter-share').addEventListener('click', function() {
                const text = encodeURIComponent('Chat with MAX, the bot that disagrees with everything! 😈');
                window.open(`https://twitter.com/intent/tweet?text=${text}&url=${encodeURIComponent('https://braindetox.kr/en/static/max_chatbot.html')}`, '_blank', 'width=600,height=400');

            document.getElementById('threads-share').addEventListener('click', function() {
                const text = encodeURIComponent('Chat with MAX, the bot that disagrees with everything! 😈 https://braindetox.kr/en/static/max_chatbot.html');
                window.open(`https://www.threads.net/intent/post?text=${text}`, '_blank');
            });

            document.getElementById('copy-link').addEventListener('click', async function() {
                try {
                    await navigator.clipboard.writeText('https://braindetox.kr/en/static/max_chatbot.html');
                    showToast('Link copied!');
                } catch (err) {
                    const textArea = document.createElement('textarea');
                    textArea.value = 'https://braindetox.kr/en/static/max_chatbot.html';
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showToast('Link copied!');
                }
            });
