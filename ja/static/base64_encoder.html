        /* リアルタイム変換トグル */
        .realtime-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .realtime-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            cursor: pointer;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--border-color);
            border-radius: 12px;
            transition: all 0.3s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: var(--accent);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(20px);
        }

        .btn-convert:hover {
            transform: translateY(-2px);

        /* トースト */

            font-size: 14px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);

        /* レスポンシブ 640px */

            }

            .realtime-toggle {
                flex-wrap: wrap;

        }

<body>
    <div class="bg-pattern"></div>

    <div class="container">
        <header>
            <span class="badge">エンコーディングツール</span>
            <h1>Base64 エンコーダー/デコーダー</h1>
            <p class="subtitle">テキストをBase64にエンコードしたり、Base64をテキストにデコードできます。<br>UTF-8文字を完全にサポートしています。</p>
        </header>

        <!-- モード切替 -->
        <div class="mode-toggle">
            <div class="mode-toggle-group">
                <button class="mode-btn active-encode" id="btnEncode" onclick="setMode('encode')">エンコード</button>
                <button class="mode-btn" id="btnDecode" onclick="setMode('decode')">デコード</button>
            </div>
        </div>

        <!-- リアルタイム変換トグル -->
        <div class="realtime-toggle">
            <label class="toggle-switch">
                <input type="checkbox" id="realtimeToggle" checked onchange="toggleRealtime()">
                <span class="toggle-slider"></span>
            </label>
            <span class="realtime-label">リアルタイム変換</span>
            <span style="font-size: 12px; color: var(--text-muted); margin-left: auto;">入力時に自動で変換されます</span>
        </div>

        <!-- エラーバー -->
        <div class="error-bar" id="errorBar">
            <span>&#9888;</span>
            <span id="errorMessage"></span>
        </div>

        <!-- 入力カード -->
        <div class="card" id="inputCard">
            <div class="card-header">
                <div class="card-header-left">
                    <div class="card-icon" id="inputIcon">Aa</div>
                    <div class="card-title" id="inputTitle">テキスト入力</div>
                </div>
                <div class="card-actions">
                    <span class="char-count" id="inputCount">0文字 / 0 bytes</span>
                    <button class="btn btn-sm btn-secondary" onclick="copyInput()" title="入力をコピー">コピー</button>
                    <button class="btn btn-sm btn-danger" onclick="clearInput()" title="入力をクリア">クリア</button>
                </div>
            </div>
            <div class="textarea-wrapper">
                <textarea
                    class="editor-textarea"
                    id="inputArea"
                    placeholder="エンコードするテキストを入力してください..."
                    oninput="onInputChange()"
                ></textarea>
            </div>
        </div>

        <!-- 変換ボタン -->
        <div class="action-buttons">
            <button class="btn btn-convert encode" id="convertBtn" onclick="convert()">
                <span id="convertIcon">&#9660;</span> <span id="convertText">Base64にエンコード</span>
            </button>
        </div>

        <!-- 出力カード -->
        <div class="card" id="outputCard">
            <div class="card-header">
                <div class="card-header-left">
                    <div class="card-icon" id="outputIcon">B64</div>
                    <div class="card-title" id="outputTitle">Base64 出力</div>
                </div>
                <div class="card-actions">
                    <span class="char-count" id="outputCount">0文字 / 0 bytes</span>
                    <button class="btn btn-sm btn-success" onclick="copyOutput()" title="出力をコピー">コピー</button>
                    <button class="btn btn-sm btn-danger" onclick="clearOutput()" title="出力をクリア">クリア</button>
                </div>
            </div>
            <div class="textarea-wrapper">
                <textarea
                    class="editor-textarea code-output"
                    id="outputArea"
                    placeholder="変換結果がここに表示されます..."

            <button class="btn btn-secondary" onclick="swapInputOutput()">
                <span>&#8645;</span> 入出力を入れ替え

                <span>&#128172;</span> カカオトークで共有
            </button>

    <script>
        // ========== 状態管理 ==========
        const state = {
            mode: 'encode',     // 'encode' | 'decode'
            realtime: true
        };

        // ========== カカオSDK初期化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }
        });

        // ========== モード切替 ==========
        function setMode(mode) {
            state.mode = mode;
            const btnEncode = document.getElementById('btnEncode');
            const btnDecode = document.getElementById('btnDecode');
            const inputTitle = document.getElementById('inputTitle');
            const outputTitle = document.getElementById('outputTitle');
            const inputIcon = document.getElementById('inputIcon');
            const outputIcon = document.getElementById('outputIcon');
            const inputArea = document.getElementById('inputArea');
            const convertBtn = document.getElementById('convertBtn');
            const convertText = document.getElementById('convertText');

            if (mode === 'encode') {
                btnEncode.className = 'mode-btn active-encode';
                btnDecode.className = 'mode-btn';
                inputTitle.textContent = 'テキスト入力';
                outputTitle.textContent = 'Base64 出力';
                inputIcon.textContent = 'Aa';
                outputIcon.textContent = 'B64';
                inputArea.placeholder = 'エンコードするテキストを入力してください...';
                convertBtn.className = 'btn btn-convert encode';
                convertText.textContent = 'Base64にエンコード';
            } else {
                btnEncode.className = 'mode-btn';
                btnDecode.className = 'mode-btn active-decode';
                inputTitle.textContent = 'Base64 入力';
                outputTitle.textContent = 'テキスト出力';
                inputIcon.textContent = 'B64';
                outputIcon.textContent = 'Aa';
                inputArea.placeholder = 'デコードするBase64文字列を入力してください...';
                convertBtn.className = 'btn btn-convert decode';
                convertText.textContent = 'テキストにデコード';
            }

            // エラーをリセット
            hideError();

            // リアルタイムモードなら即座に変換
            if (state.realtime && inputArea.value.trim()) {
                convert();
            }
        }

        // ========== リアルタイム変換トグル ==========
        function toggleRealtime() {
            state.realtime = document.getElementById('realtimeToggle').checked;
            if (state.realtime && document.getElementById('inputArea').value.trim()) {
                convert();
            }
        }

        // ========== 入力変更イベント ==========
        function onInputChange() {
            updateInputCount();
            hideError();

            if (state.realtime) {
                convert();
            }
        }

        // ========== Base64 エンコード (UTF-8対応) ==========
        function utf8Encode(str) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(str);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        // ========== Base64 デコード (UTF-8対応) ==========
        function utf8Decode(base64Str) {
            const binary = atob(base64Str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

        // ========== 変換実行 ==========
        function convert() {
            const input = document.getElementById('inputArea').value;
            const outputArea = document.getElementById('outputArea');

            if (!input) {
                outputArea.value = '';
                updateOutputCount();
                hideError();
                return;
            }

            try {
                let result;
                if (state.mode === 'encode') {
                    result = utf8Encode(input);
                } else {
                    // Base64 バリデーションチェック
                    const cleanInput = input.replace(/\s/g, '');
                    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(cleanInput)) {
                        showError('無効なBase64文字列です。Base64にはA-Z、a-z、0-9、+、/、=の文字のみ使用できます。');
                        outputArea.value = '';
                        updateOutputCount();
                        return;
                    }
                    result = utf8Decode(cleanInput);
                }

                outputArea.value = result;
                hideError();
                updateOutputCount();
            } catch (e) {
                if (state.mode === 'decode') {
                    showError('デコード失敗：正しいBase64文字列かどうかご確認ください。');
                } else {
                    showError('エンコード失敗：' + e.message);
                }
                outputArea.value = '';
                updateOutputCount();
            }
        }

        // ========== 文字数更新 ==========
        function updateInputCount() {
            const input = document.getElementById('inputArea').value;
            const chars = input.length;
            const bytes = new Blob([input]).size;
            document.getElementById('inputCount').textContent = chars.toLocaleString() + '文字 / ' + formatBytes(bytes);
        }

        function updateOutputCount() {
            const output = document.getElementById('outputArea').value;
            const chars = output.length;
            const bytes = new Blob([output]).size;
            document.getElementById('outputCount').textContent = chars.toLocaleString() + '文字 / ' + formatBytes(bytes);
        }

        // ========== エラー表示 ==========
        function showError(message) {
            const errorBar = document.getElementById('errorBar');
            document.getElementById('errorMessage').textContent = message;
            errorBar.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorBar').classList.remove('show');
        }

        // ========== コピー ==========
        function copyInput() {
            copyToClipboard(document.getElementById('inputArea').value, '入力内容がコピーされました。');
        }

        function copyOutput() {
            copyToClipboard(document.getElementById('outputArea').value, '出力結果がコピーされました。');
        }

        function copyToClipboard(text, successMessage) {
            if (!text) {
                showToast('コピーする内容がありません。');
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(successMessage);
                }).catch(() => {
                    fallbackCopy(text, successMessage);
                });
            } else {
                fallbackCopy(text, successMessage);
            }
        }

        function fallbackCopy(text, successMessage) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMessage);
            } catch (err) {
                showToast('コピーに失敗しました。');
            }
            document.body.removeChild(textarea);
        }

        // ========== クリア ==========
        function clearInput() {
            document.getElementById('inputArea').value = '';
            updateInputCount();
            hideError();
            if (state.realtime) {
                document.getElementById('outputArea').value = '';
                updateOutputCount();
            }
            showToast('入力がクリアされました。');
        }

        function clearOutput() {
            document.getElementById('outputArea').value = '';
            updateOutputCount();
            showToast('出力がクリアされました。');
        }

        // ========== 入出力入れ替え ==========
        function swapInputOutput() {
            const inputArea = document.getElementById('inputArea');
            const outputArea = document.getElementById('outputArea');
            const currentOutput = outputArea.value;

            if (!currentOutput) {
                showToast('入れ替える出力内容がありません。');
                return;
            }

            inputArea.value = currentOutput;
            outputArea.value = '';
            updateInputCount();
            updateOutputCount();
            hideError();

            // モード切替
            if (state.mode === 'encode') {
                setMode('decode');
            } else {
                setMode('encode');
            }

            // リアルタイムモードなら自動変換
            if (state.realtime) {
                convert();
            }

            showToast('入出力が入れ替えられました。');
        }

        // ========== カカオトーク共有 ==========
        function shareKakao() {
            if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
                showToast('カカオトーク共有を準備中です。');
                return;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: 'Base64 エンコーダー/デコーダー - オンラインエンコーディング変換ツール',
                    description: 'テキストをBase64にエンコードしたり、Base64をテキストにデコードできます。UTF-8完全対応！',
                    imageUrl: 'https://braindetox.kr/site_logo.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/ja/static/base64_encoder.html',
                        webUrl: 'https://braindetox.kr/ja/static/base64_encoder.html'
                    }
                },
                buttons: [
                    {
                        title: 'Base64変換ツールを使う',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/ja/static/base64_encoder.html',
                            webUrl: 'https://braindetox.kr/ja/static/base64_encoder.html'
                        }
                    }
                ]
            });
        }

        // ========== ユーティリティ関数 ==========
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 bytes';
            const k = 1024;
            const sizes = ['bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // ========== 初期化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            updateInputCount();
            updateOutputCount();
        });
    </script>
</body>
</html>
