        .option-label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; display: block; }
        .option-row { display: flex; gap: 8px; }
        .count-btn { flex: 1; padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-secondary); font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }

        .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg-tertiary); border-radius: 10px; }

        .toggle-switch { position: relative; width: 50px; height: 28px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-tertiary); border: 1px solid var(--border-color); transition: 0.3s; border-radius: 28px; }
        .toggle-slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 2px; bottom: 2px; background-color: white; transition: 0.3s; border-radius: 50%; }
        .toggle-switch input:checked + .toggle-slider { background-color: var(--accent); border-color: var(--accent); }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(22px); }
        .generate-section { padding: 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        .generate-btn { width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 600; background: var(--accent); color: var(--text-primary); border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .copy-all-btn:hover { border-color: var(--accent); }
        .results-list { display: flex; flex-direction: column; gap: 10px; }
        .nickname-card { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; transition: all 0.2s; }

        .copy-btn { padding: 8px 16px; font-size: 0.8rem; background: var(--accent); color: var(--text-primary); border: none; border-radius: 16px; cursor: pointer; transition: all 0.2s; }

        .toast.show { opacity: 1; }
        @media (min-width: 481px) { .container { border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); } }

<body>
    <div class="container">
        <header class="header">
            <h1>Random Nickname Generator</h1>
            <p>40,000+ unique nicknames from adjective + noun combos</p>
        </header>

        <div class="options-section">
            <div class="option-group">
                <label class="option-label">Number of nicknames</label>
                <div class="option-row">
                    <button class="count-btn active" data-count="1" onclick="setCount(1)">1</button>
                    <button class="count-btn" data-count="3" onclick="setCount(3)">3</button>
                    <button class="count-btn" data-count="5" onclick="setCount(5)">5</button>
                    <button class="count-btn" data-count="10" onclick="setCount(10)">10</button>
                </div>
            </div>
            <div class="option-group">
                <div class="toggle-row">
                    <span class="toggle-label">Add numbers (e.g. BraveTiger123)</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="add-number">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="generate-section">
            <button class="generate-btn" onclick="generate()">
                <span>&#x1F3B2;</span>
                <span>Generate Nicknames</span>
            </button>
        </div>

        <div class="results-section">
            <div id="empty-state" class="empty-state">
                <div class="empty-icon">&#x1F3F7;&#xFE0F;</div>
                <div class="empty-text">Press the button to generate nicknames</div>
            </div>
            <div id="results-container" style="display: none;">
                <div class="results-header">
                    <span class="results-title">Generated Nicknames</span>
                    <button class="copy-all-btn" onclick="copyAll()">Copy All</button>
                </div>
                <div class="results-list" id="results-list"></div>
            </div>
        </div>

        <div class="share-section">
            <button class="share-btn share-kakao" onclick="shareKakao()">&#x1F4AC; Share on KakaoTalk</button>
        </div>

        <footer class="footer">
            <div class="footer-links">
                <a href="/en/static_index.html">Tools</a>
                <a href="/en/">Home</a>
            </div>
            <p>&copy; 2025 BrainDetox</p>
        </footer>
    </div>

    <div class="toast" id="toast">Copied!</div>

    <script>
        const ADJECTIVES = [
            'brave','mighty','clever','gentle','fierce','shy','wild','calm','proud','noble',
            'swift','silent','golden','silver','crystal','shadow','crimson','azure','scarlet','emerald',
            'dancing','singing','running','flying','sleeping','dreaming','laughing','roaring','blazing','glowing',
            'mystic','magic','cosmic','stellar','phantom','spectral','ethereal','divine','ancient','eternal',
            'super','ultra','mega','hyper','turbo','cyber','neon','pixel','quantum','atomic',
            'happy','lonely','angry','sleepy','hungry','thirsty','tired','lively','cheerful','gloomy',
            'tiny','giant','colossal','mini','massive','petite','towering','vast','little','grand',
            'frozen','burning','molten','stormy','misty','foggy','sunny','cloudy','windy','rainy',
            'royal','regal','imperial','majestic','graceful','elegant','fancy','humble','bold','daring',
            'cunning','wise','foolish','witty','quirky','odd','strange','weird','crazy','mad',
            'iron','steel','bronze','copper','jade','ruby','sapphire','diamond','obsidian','amber',
            'dark','bright','radiant','dim','shiny','matte','glossy','dull','vivid','pale',
            'quick','slow','steady','rapid','hasty','lazy','active','agile','nimble','sluggish',
            'holy','wicked','cursed','blessed','sacred','profane','arcane','primal','feral','tame',
            'lone','twin','triple','prime','omega','alpha','beta','delta','sigma','nova',
            'hidden','secret','lost','found','broken','whole','perfect','flawed','raw','pure',
            'north','south','east','west','lunar','solar','astral','void','chaos','order',
            'lucky','doomed','chosen','fallen','risen','reborn','undying','fearless','ruthless','silent',
            'chrome','plasma','vapor','thunder','frost','flame','storm','ocean','forest','mountain',
            'savage','serene','tranquil','furious','mellow','harsh','tender','rugged','sleek','rustic'
        ];

        const NOUNS = [
            'Tiger','Lion','Fox','Wolf','Eagle','Hawk','Dolphin','Phoenix','Dragon','Bear',
            'Falcon','Panther','Cobra','Viper','Raven','Owl','Shark','Whale','Jaguar','Lynx',
            'Panda','Koala','Otter','Penguin','Parrot','Swan','Crane','Stag','Stallion','Bison',
            'Wizard','Knight','Ninja','Samurai','Paladin','Ranger','Archer','Mage','Druid','Monk',
            'Pirate','Viking','Spartan','Gladiator','Sentinel','Guardian','Hunter','Scout','Rogue','Warden',
            'Zeus','Odin','Thor','Athena','Apollo','Artemis','Poseidon','Hades','Loki','Freya',
            'Valkyrie','Titan','Colossus','Golem','Sphinx','Hydra','Griffin','Chimera','Kraken','Cerberus',
            'Star','Moon','Sun','Storm','Thunder','Blaze','Frost','Shadow','Dawn','Dusk',
            'Comet','Nebula','Galaxy','Pulsar','Quasar','Eclipse','Aurora','Zenith','Horizon','Vortex',
            'Sword','Shield','Arrow','Crown','Scepter','Hammer','Spear','Dagger','Axe','Blade',
            'Cherry','Mango','Lemon','Berry','Peach','Melon','Grape','Apple','Plum','Kiwi',
            'Mountain','River','Ocean','Forest','Desert','Valley','Canyon','Glacier','Volcano','Island',
            'Castle','Tower','Bridge','Temple','Fortress','Citadel','Bastion','Haven','Sanctum','Vault',
            'Rocket','Jet','Comet','Shuttle','Cruiser','Bomber','Striker','Drifter','Racer','Rider',
            'Warrior','Champion','Legend','Hero','Sage','Oracle','Prophet','Mystic','Phantom','Specter',
            'Ember','Spark','Flare','Bolt','Surge','Wave','Tide','Gale','Breeze','Torrent',
            'Pixel','Byte','Cipher','Glitch','Matrix','Vector','Nexus','Prism','Core','Node',
            'Serpent','Mantis','Scorpion','Spider','Beetle','Hornet','Wasp','Firefly','Moth','Cricket',
            'Prince','Queen','King','Baron','Duke','Count','Lord','Lady','Empress','Sultan',
            'Ace','Maverick','Rebel','Outlaw','Nomad','Wanderer','Seeker','Dreamer','Voyager','Pioneer'
        ];

        let count = 1;
        let generatedNicknames = [];

        function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

        function setCount(n) {
            count = n;
            document.querySelectorAll('.count-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.count) === n);
            });
            vibrate();
        }

        function generate() {
            const addNumber = document.getElementById('add-number').checked;
            generatedNicknames = [];
            for (let i = 0; i < count; i++) {
                const adj = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
                const noun = NOUNS[Math.floor(Math.random() * NOUNS.length)];
                let nickname = capitalize(adj) + noun;
                if (addNumber) { nickname += (Math.floor(Math.random() * 9999) + 1); }
                generatedNicknames.push(nickname);
            }
            renderResults();
            vibrate();
        }

        function renderResults() {
            const emptyState = document.getElementById('empty-state');
            const container = document.getElementById('results-container');
            const list = document.getElementById('results-list');
            if (generatedNicknames.length === 0) { emptyState.style.display = 'block'; container.style.display = 'none'; return; }
            emptyState.style.display = 'none';
            container.style.display = 'block';
            list.innerHTML = generatedNicknames.map((nickname, index) => `
                <div class="nickname-card">
                    <span class="nickname-text">${nickname}</span>
                    <button class="copy-btn" id="copy-btn-${index}" onclick="copyNickname('${nickname}', ${index})">Copy</button>
                </div>
            `).join('');
        }

        function copyNickname(nickname, index) {
            navigator.clipboard.writeText(nickname).then(() => {
                const btn = document.getElementById('copy-btn-' + index);
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                showToast('Copied to clipboard');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
            }).catch(() => { showToast('Copy failed'); });
            vibrate();
        }

        function copyAll() {
            if (generatedNicknames.length === 0) return;
            navigator.clipboard.writeText(generatedNicknames.join('\n')).then(() => {
                showToast(generatedNicknames.length + ' nicknames copied');
            }).catch(() => { showToast('Copy failed'); });
            vibrate();
        }

        function shareKakao() {
            if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) { showToast('Preparing KakaoTalk...'); return; }
            const desc = generatedNicknames.length > 0
                ? 'Generated: ' + generatedNicknames.slice(0, 3).join(', ') + (generatedNicknames.length > 3 ? ' +' + (generatedNicknames.length - 3) + ' more' : '')
                : 'Generate 40,000+ unique nicknames from adjective + noun combos!';
            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: { title: 'Random Nickname Generator', description: desc, imageUrl: 'https://braindetox.kr/site_logo.png', link: { mobileWebUrl: 'https://braindetox.kr/en/static/nickname_generator.html', webUrl: 'https://braindetox.kr/en/static/nickname_generator.html' } },
                buttons: [{ title: 'Try it too', link: { mobileWebUrl: 'https://braindetox.kr/en/static/nickname_generator.html', webUrl: 'https://braindetox.kr/en/static/nickname_generator.html' } }]
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function vibrate() { if ('vibrate' in navigator) navigator.vibrate(10); }

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
        });
    </script>
