    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-card-hover: #273449;
            --border-color: #334155;
            --border-accent: #3b82f6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: rgba(59, 130, 246, 0.1);
            --success: #10b981;
            --success-light: rgba(16, 185, 129, 0.1);
            --warning: #f59e0b;
            --warning-light: rgba(245, 158, 11, 0.1);
            --error: #ef4444;
            --error-light: rgba(239, 68, 68, 0.1);
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.4);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 20px;
        }

        .badge {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-light);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
        }

        /* 비밀번호 출력 영역 */
        .password-display {
            position: relative;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 64px;
        }

        .password-text {
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            line-height: 1.4;
            word-break: break-all;
            color: var(--text-primary);
            user-select: all;
            letter-spacing: 1px;
        }

        .password-text .char-upper { color: #f8c555; }
        .password-text .char-lower { color: #98c379; }
        .password-text .char-number { color: #d19a66; }
        .password-text .char-special { color: #e06c75; }

        .password-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        /* 강도 표시 */
        .strength-container {
            margin-bottom: 24px;
        }

        .strength-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .strength-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .strength-value {
            font-size: 13px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .strength-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease, background 0.4s ease;
            width: 0%;
        }

        .strength-weak .strength-fill { width: 25%; background: var(--error); }
        .strength-weak .strength-value { color: var(--error); background: var(--error-light); }

        .strength-medium .strength-fill { width: 50%; background: var(--warning); }
        .strength-medium .strength-value { color: var(--warning); background: var(--warning-light); }

        .strength-strong .strength-fill { width: 75%; background: #3b82f6; }
        .strength-strong .strength-value { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }

        .strength-very-strong .strength-fill { width: 100%; background: var(--success); }
        .strength-very-strong .strength-value { color: var(--success); background: var(--success-light); }

        /* 설정 영역 */
        .settings-group {
            margin-bottom: 24px;
        }

        .setting-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .setting-label span:last-child {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-weight: 600;
        }

        /* 슬라이더 */
        .slider-container {
            position: relative;
            margin-bottom: 8px;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg-primary);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--gradient-primary);
            cursor: pointer;
            border: 2px solid var(--bg-card);
            box-shadow: var(--shadow-md);
            transition: transform 0.2s;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .slider::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--gradient-primary);
            cursor: pointer;
            border: 2px solid var(--bg-card);
            box-shadow: var(--shadow-md);
        }

        .slider-ticks {
            display: flex;
            justify-content: space-between;
            padding: 4px 2px 0;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 체크박스 */
        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .checkbox-item:hover {
            border-color: var(--accent);
            background: var(--bg-card-hover);
        }

        .checkbox-item.checked {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .checkbox-item input[type="checkbox"] {
            display: none;
        }

        .checkbox-custom {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .checkbox-item.checked .checkbox-custom {
            background: var(--accent);
            border-color: var(--accent);
        }

        .checkbox-item.checked .checkbox-custom::after {
            content: '';
            width: 6px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-top: -2px;
        }

        .checkbox-info {
            flex: 1;
        }

        .checkbox-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .checkbox-desc {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* 버튼 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }

        .btn-success {
            background: var(--gradient-success);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-icon {
            padding: 10px;
            min-width: 40px;
        }

        .btn-generate {
            width: 100%;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* 히스토리 */
        .history-section {
            margin-top: 4px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }

        .history-item:hover {
            border-color: var(--accent);
        }

        .history-index {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            min-width: 20px;
        }

        .history-password {
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-primary);
            word-break: break-all;
            letter-spacing: 0.5px;
        }

        .history-meta {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .history-copy-btn {
            padding: 6px 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .history-copy-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .history-empty {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* 공유 버튼 */
        .share-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* 푸터 */
        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 반응형 */
        @media (max-width: 640px) {
            .container {
                padding: 16px 12px 32px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .card {
                padding: 20px 16px;
            }

            .password-display {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 16px;
            }

            .password-text {
                font-size: 15px;
                text-align: center;
            }

            .password-actions {
                justify-content: center;
            }

            .checkbox-group {
                grid-template-columns: 1fr;
            }

            .share-buttons {
                flex-direction: column;
            }

            .share-buttons .btn {
                width: 100%;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn-group .btn {
                width: 100%;
            }

            .history-item {
                flex-wrap: wrap;
                gap: 8px;
            }

            .history-meta {
                order: 4;
                width: 100%;
            }
        }
    </style>

    <div class="bg-pattern"></div>

    <div class="container">
        <header>

                <div class="password-actions">
                    <button class="btn btn-icon btn-secondary" onclick="copyToClipboard()" title="복사">📋</button>
                    <button class="btn btn-icon btn-secondary" onclick="generatePassword()" title="새로 생성">🔄</button>
                </div>
            </div>

            <!-- 강도 표시 -->
            <div class="strength-container" id="strengthContainer">
                <div class="strength-header">
                    <span class="strength-label">비밀번호 강도</span>
                    <span class="strength-value" id="strengthValue">-</span>
                </div>
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
            </div>

            <!-- 길이 설정 -->
            <div class="settings-group">
                <div class="setting-label">
                    <span>비밀번호 길이</span>
                    <span id="lengthValue">16</span>
                </div>
                <div class="slider-container">
                    <input type="range" class="slider" id="lengthSlider" min="8" max="128" value="16" oninput="updateLength(this.value)">
                </div>
                <div class="slider-ticks">
                    <span>8</span>
                    <span>32</span>
                    <span>64</span>
                    <span>96</span>
                    <span>128</span>
                </div>
            </div>

            <!-- 문자 종류 설정 -->
            <div class="settings-group">
                <div class="setting-label">
                    <span>문자 종류</span>
                </div>
                <div class="checkbox-group">
                    <label class="checkbox-item checked" id="cb-uppercase" onclick="toggleCheckbox('uppercase')">
                        <input type="checkbox" checked>
                        <div class="checkbox-custom"></div>
                        <div class="checkbox-info">
                            <div class="checkbox-title">대문자</div>
                            <div class="checkbox-desc">A-Z</div>
                        </div>
                    </label>
                    <label class="checkbox-item checked" id="cb-lowercase" onclick="toggleCheckbox('lowercase')">
                        <input type="checkbox" checked>
                        <div class="checkbox-custom"></div>
                        <div class="checkbox-info">
                            <div class="checkbox-title">소문자</div>
                            <div class="checkbox-desc">a-z</div>
                        </div>
                    </label>
                    <label class="checkbox-item checked" id="cb-numbers" onclick="toggleCheckbox('numbers')">
                        <input type="checkbox" checked>
                        <div class="checkbox-custom"></div>
                        <div class="checkbox-info">
                            <div class="checkbox-title">숫자</div>
                            <div class="checkbox-desc">0-9</div>
                        </div>
                    </label>
                    <label class="checkbox-item checked" id="cb-special" onclick="toggleCheckbox('special')">
                        <input type="checkbox" checked>
                        <div class="checkbox-custom"></div>
                        <div class="checkbox-info">
                            <div class="checkbox-title">특수문자</div>
                            <div class="checkbox-desc">!@#$%^&*</div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- 생성 버튼 -->
            <button class="btn btn-primary btn-generate" onclick="generatePassword()">
                🔑 비밀번호 생성
            </button>

            <!-- 공유 버튼 -->
            <div class="share-buttons">
                <button class="btn btn-success" onclick="copyToClipboard()">
                    📋 비밀번호 복사
                </button>
                <button class="btn btn-secondary" onclick="shareKakao()">
                    💬 카카오톡 공유
                </button>
            </div>
        </div>

        <!-- 히스토리 카드 -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon">📜</div>
                <div class="card-title">생성 히스토리</div>
            </div>
            <div class="history-section">
                <div class="history-list" id="historyList">
                    <div class="history-empty">아직 생성된 비밀번호가 없습니다.</div>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 <a href="https://braindetox.kr">BrainDetox</a>. All rights reserved.</p>
            <p style="margin-top: 8px;">모든 처리는 브라우저에서 이루어지며 서버로 전송되지 않습니다.</p>
        </footer>
    </div>

    <!-- 토스트 -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== 상태 관리 ==========
        const state = {
            length: 16,
            uppercase: true,
            lowercase: true,
            numbers: true,
            special: true,
            currentPassword: '',
            history: []
        };

        const CHAR_SETS = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            special: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };

        // ========== 카카오 SDK 초기화 ==========
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }
            // 페이지 로드 시 자동 생성
            generatePassword();
        });

        // ========== 길이 업데이트 ==========
        function updateLength(value) {
            state.length = parseInt(value);
            document.getElementById('lengthValue').textContent = value;
        }

        // ========== 체크박스 토글 ==========
        function toggleCheckbox(type) {
            const item = document.getElementById('cb-' + type);
            const checkbox = item.querySelector('input[type="checkbox"]');

            // 최소 1개는 선택되어야 함
            const activeCount = [state.uppercase, state.lowercase, state.numbers, state.special].filter(Boolean).length;
            if (state[type] && activeCount <= 1) {
                showToast('최소 하나의 문자 종류는 선택해야 합니다.');
                return;
            }

            state[type] = !state[type];
            checkbox.checked = state[type];
            item.classList.toggle('checked', state[type]);
        }

        // ========== 비밀번호 생성 ==========
        function generatePassword() {
            let charset = '';
            if (state.uppercase) charset += CHAR_SETS.uppercase;
            if (state.lowercase) charset += CHAR_SETS.lowercase;
            if (state.numbers) charset += CHAR_SETS.numbers;
            if (state.special) charset += CHAR_SETS.special;

            if (charset.length === 0) {
                showToast('최소 하나의 문자 종류를 선택하세요.');
                return;
            }

            // crypto API를 사용한 안전한 랜덤 생성
            let password = '';
            const array = new Uint32Array(state.length);
            crypto.getRandomValues(array);

            for (let i = 0; i < state.length; i++) {
                password += charset[array[i] % charset.length];
            }

            // 선택된 각 문자 종류가 최소 1개씩 포함되도록 보장
            const guaranteeChars = [];
            if (state.uppercase) guaranteeChars.push({ set: CHAR_SETS.uppercase, regex: /[A-Z]/ });
            if (state.lowercase) guaranteeChars.push({ set: CHAR_SETS.lowercase, regex: /[a-z]/ });
            if (state.numbers) guaranteeChars.push({ set: CHAR_SETS.numbers, regex: /[0-9]/ });
            if (state.special) guaranteeChars.push({ set: CHAR_SETS.special, regex: /[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/ });

            let passwordArr = password.split('');
            const posArray = new Uint32Array(guaranteeChars.length);
            crypto.getRandomValues(posArray);
            const charArray = new Uint32Array(guaranteeChars.length);
            crypto.getRandomValues(charArray);

            guaranteeChars.forEach((item, idx) => {
                if (!item.regex.test(password)) {
                    const pos = posArray[idx] % state.length;
                    passwordArr[pos] = item.set[charArray[idx] % item.set.length];
                }
            });

            password = passwordArr.join('');
            state.currentPassword = password;

            // 화면 표시 (문자 종류별 색상)
            displayPassword(password);

            // 강도 계산
            calculateStrength(password);

            // 히스토리 추가
            addToHistory(password);
        }

        // ========== 비밀번호 표시 (색상 분류) ==========
        function displayPassword(password) {
            const container = document.getElementById('passwordText');
            let html = '';

            for (let i = 0; i < password.length; i++) {
                const char = password[i];
                let cls = 'char-lower';

                if (/[A-Z]/.test(char)) cls = 'char-upper';
                else if (/[0-9]/.test(char)) cls = 'char-number';
                else if (/[^a-zA-Z0-9]/.test(char)) cls = 'char-special';

                html += '<span class="' + cls + '">' + escapeHtml(char) + '</span>';
            }

            container.innerHTML = html;
        }

        // ========== 강도 계산 ==========
        function calculateStrength(password) {
            let score = 0;
            const len = password.length;

            // 길이 점수
            if (len >= 8) score += 1;
            if (len >= 12) score += 1;
            if (len >= 16) score += 1;
            if (len >= 24) score += 1;
            if (len >= 32) score += 1;

            // 문자 종류 점수
            if (/[a-z]/.test(password)) score += 1;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^a-zA-Z0-9]/.test(password)) score += 1;

            // 엔트로피 보너스
            const uniqueChars = new Set(password.split('')).size;
            if (uniqueChars >= 10) score += 1;
            if (uniqueChars >= 20) score += 1;

            // 강도 레벨 결정
            const container = document.getElementById('strengthContainer');
            const valueEl = document.getElementById('strengthValue');

            // 기존 클래스 제거
            container.className = 'strength-container';

            if (score <= 3) {
                container.classList.add('strength-weak');
                valueEl.textContent = '약함';
            } else if (score <= 5) {
                container.classList.add('strength-medium');
                valueEl.textContent = '보통';
            } else if (score <= 8) {
                container.classList.add('strength-strong');
                valueEl.textContent = '강함';
            } else {
                container.classList.add('strength-very-strong');
                valueEl.textContent = '매우 강함';
            }
        }

        // ========== 히스토리 ==========
        function addToHistory(password) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                            now.getMinutes().toString().padStart(2, '0') + ':' +
                            now.getSeconds().toString().padStart(2, '0');

            state.history.unshift({
                password: password,
                length: password.length,
                time: timeStr
            });

            // 최대 5개 유지
            if (state.history.length > 5) {
                state.history = state.history.slice(0, 5);
            }

            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyList');

            if (state.history.length === 0) {
                container.innerHTML = '<div class="history-empty">아직 생성된 비밀번호가 없습니다.</div>';
                return;
            }

            let html = '';
            state.history.forEach((item, index) => {
                const maskedPassword = item.password.length > 30
                    ? item.password.substring(0, 15) + '...' + item.password.substring(item.password.length - 10)
                    : item.password;

                html += '<div class="history-item">';
                html += '<span class="history-index">#' + (index + 1) + '</span>';
                html += '<span class="history-password">' + escapeHtml(maskedPassword) + '</span>';
                html += '<span class="history-meta">' + item.length + '자 | ' + item.time + '</span>';
                html += '<button class="history-copy-btn" onclick="copyHistoryItem(' + index + ')">복사</button>';
                html += '</div>';
            });

            container.innerHTML = html;
        }

        function copyHistoryItem(index) {
            const password = state.history[index].password;
            copyText(password);
        }

        // ========== 복사 ==========
        function copyToClipboard() {
            if (!state.currentPassword) {
                showToast('먼저 비밀번호를 생성하세요.');
                return;
            }
            copyText(state.currentPassword);
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showToast('클립보드에 복사되었습니다.');
                }).catch(function() {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('클립보드에 복사되었습니다.');
            } catch (err) {
                showToast('복사에 실패했습니다.');
            }
            document.body.removeChild(textarea);
        }

        // ========== 카카오톡 공유 ==========
        function shareKakao() {
            if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
                showToast('카카오톡 공유를 준비 중입니다.');
                return;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: '비밀번호 생성기 - 안전한 랜덤 비밀번호',
                    description: '안전한 랜덤 비밀번호를 즉시 생성하세요. 길이, 문자 종류를 자유롭게 설정하고, 강도를 확인할 수 있습니다.',
                    imageUrl: 'https://braindetox.kr/site_logo.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/static/password_generator.html',
                        webUrl: 'https://braindetox.kr/static/password_generator.html'
                    }
                },
                buttons: [
                    {
                        title: '비밀번호 생성기 사용하기',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/static/password_generator.html',
                            webUrl: 'https://braindetox.kr/static/password_generator.html'
                        }
                    }
                ]
            });
        }

        // ========== 유틸리티 ==========
        function showToast(message) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 2000);
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
