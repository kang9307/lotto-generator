    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-chat: #0a0a0a;
            --bg-card: rgba(26, 26, 26, 0.95);
            --border-subtle: rgba(255, 71, 87, 0.2);
            --border-active: rgba(255, 71, 87, 0.5);
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-muted: #606060;
            --max-color: #ff4757;
            --max-glow: rgba(255, 71, 87, 0.3);
            --user-color: #3b82f6;
            --user-glow: rgba(59, 130, 246, 0.3);
            --accent: #ff6348;
            --success: #2ed573;
            --warning: #ffa502;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 배경 효과 */
        .bg-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 20%, rgba(255, 71, 87, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
        }

        /* 스캔라인 효과 (레트로 느낌) */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            opacity: 0.3;
        }

        /* 메인 컨테이너 */
        .container {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 */
        .header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-subtle);
        }

        .max-avatar {
            position: relative;
            display: inline-block;
            margin-bottom: 8px;
        }

        .avatar-icon {
            font-size: 3rem;
            filter: drop-shadow(0 0 20px var(--max-glow));
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .status-dot {
            position: absolute;
            bottom: 5px;
            right: -5px;
            width: 12px;
            height: 12px;
            background: var(--success);
            border-radius: 50%;
            border: 2px solid var(--bg-primary);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--max-color);
            text-shadow: 0 0 20px var(--max-glow);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* 타자 속도 표시 */
        .typing-stats {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            font-size: 0.8rem;
        }

        .stat-label {
            color: var(--text-muted);
        }

        .stat-value {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 40px;
            text-align: center;
        }

        .stat-unit {
            color: var(--text-secondary);
        }

        /* 채팅 영역 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: var(--bg-chat);
        }

        .message-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 메시지 버블 */
        .message {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message.max {
            flex-direction: row;
        }

        .max-avatar-small {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--max-color) 0%, #c0392b 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            box-shadow: 0 0 10px var(--max-glow);
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--user-color) 0%, #2563eb 100%);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 10px var(--user-glow);
        }

        .message.max .message-bubble {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-subtle);
        }

        /* 타이핑 인디케이터 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* 입력 영역 */
        .input-area {
            padding: 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-subtle);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 12px 18px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--max-color);
            box-shadow: 0 0 15px var(--max-glow);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--max-color) 0%, #c0392b 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--max-glow);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* 퀵 액션 버튼 */
        .quick-actions {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .quick-btn {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            border-color: var(--max-color);
            color: var(--max-color);
            background: rgba(255, 71, 87, 0.1);
        }

        /* 공유 섹션 */
        .share-section {
            padding: 20px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-subtle);
        }

        .share-section h3 {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 12px;
            font-weight: 400;
        }

        .social-share {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .share-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .share-btn img {
            width: 18px;
            height: 18px;
        }

        .kakao-btn:hover { border-color: #fee500; background: rgba(254, 229, 0, 0.1); }
        .facebook-btn:hover { border-color: #1877f2; color: #1877f2; }
        .twitter-btn:hover { border-color: #000; color: #fff; background: #000; }
        .threads-btn:hover { border-color: #000; color: #fff; background: #000; }
        .copy-btn:hover { border-color: var(--success); color: var(--success); }

        /* 푸터 */
        .footer {
            text-align: center;
            padding: 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-subtle);
        }

        .footer-links {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--max-color);
        }

        .footer p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* 토스트 메시지 */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 포맷 협박 모달 */
        .threat-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .threat-modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .threat-content {
            background: linear-gradient(135deg, #ff4757 0%, #c0392b 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 360px;
            box-shadow: 0 0 60px rgba(255, 71, 87, 0.5);
            animation: shake 0.5s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .threat-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .threat-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .threat-message {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
        }

        .threat-progress {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffa502 0%, #ff4757 100%);
            transition: width 0.1s linear;
        }

        .threat-cancel {
            padding: 14px 28px;
            background: white;
            border: none;
            border-radius: 10px;
            color: #c0392b;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .threat-cancel:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* 반응형 */
        @media (max-width: 640px) {
            .header {
                padding: 16px;
            }

            .header h1 {
                font-size: 1.3rem;
            }

            .avatar-icon {
                font-size: 2.5rem;
            }

            .message-bubble {
                max-width: 85%;
                font-size: 0.9rem;
            }

            .quick-actions {
                padding: 10px 12px;
            }

            .social-share {
                flex-direction: column;
                align-items: center;
            }

            .share-btn {
                width: 100%;
                max-width: 200px;
                justify-content: center;
            }

            .threat-content {
                padding: 30px 20px;
                margin: 20px;
            }

            .lang-tabs {
                flex-wrap: wrap;
            }

            .lang-tab {
                font-size: 0.75rem;
                padding: 6px 10px;
            }
        }

        /* 언어 전환 탭 스타일 */
        .lang-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            padding: 0 15px;
        }

        .lang-tab {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .lang-tab:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.4);
            color: var(--text-primary);
        }

        .lang-tab.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(168, 85, 247, 0.3));
            border-color: rgba(139, 92, 246, 0.6);
            color: var(--text-primary);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }
    </style>

    <div class="container">

            <div class="max-avatar">
                <span class="avatar-icon">😈</span>
                <span class="status-dot"></span>
            </div>

        // ========================================
        // 입력 핸들러 설정
        // ========================================
        function setupInputHandlers() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');

            input.addEventListener('input', function() {
                // 타자 시작 시간 기록
                if (!state.typingStartTime && this.value.length > 0) {
                    state.typingStartTime = Date.now();
                }
                state.lastInputTime = Date.now();

                // 버튼 활성화
                sendBtn.disabled = !this.value.trim();

                // 자동 높이 조절
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            sendBtn.addEventListener('click', sendMessage);
        }

        // ========================================
        // 메시지 전송
        // ========================================
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();

            if (!message || state.isTyping) return;

            // 타자 속도 계산
            calculateTypingSpeed(message);

            // 사용자 메시지 추가
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';
            document.getElementById('sendBtn').disabled = true;

            // 맥스 응답 생성
            state.isTyping = true;
            showTypingIndicator();

            const result = findResponse(message);

            // 욕설일 경우 포맷 협박
            if (result.type === 'threat') {
                setTimeout(() => {
                    hideTypingIndicator();
                    showFormatThreat();
                }, 800);
                return;
            }

            // 일반 응답
            const delay = 1000 + Math.random() * 1500;
            setTimeout(() => {
                hideTypingIndicator();
                addMessage('max', result.response);
                state.isTyping = false;

                // 타자 속도 코멘트
                checkTypingSpeedComment();
            }, delay);
        }

        // ========================================
        // 패턴 매칭
        // ========================================
        function findResponse(userMessage) {
            const msg = userMessage.toLowerCase().trim();

            // 욕설 체크
            for (const pattern of RESPONSE_PATTERNS.profanity.patterns) {
                if (msg.includes(pattern)) {
                    return { type: 'threat', response: null };
                }
            }

            // 패턴 매칭
            for (const [category, data] of Object.entries(RESPONSE_PATTERNS)) {
                if (category === 'profanity') continue;

                for (const pattern of data.patterns) {
                    if (msg.includes(pattern)) {
                        const responses = data.responses;
                        return {
                            type: 'normal',
                            response: responses[Math.floor(Math.random() * responses.length)]
                        };
                    }
                }
            }

            // 기본 응답
            return {
                type: 'normal',
                response: DEFAULT_RESPONSES[Math.floor(Math.random() * DEFAULT_RESPONSES.length)]
            };
        }

        // ========================================
        // 타자 속도 측정
        // ========================================
        function calculateTypingSpeed(message) {
            if (!state.typingStartTime) return;

            const duration = (Date.now() - state.typingStartTime) / 1000 / 60; // 분
            const chars = message.length;

            if (duration > 0.01 && chars > 0) { // 최소 0.6초 이상
                state.totalCharsTyped += chars;
                state.typingDuration += duration;

                const speed = Math.round(state.totalCharsTyped / state.typingDuration);
                document.getElementById('typingSpeed').textContent = speed;
            }

            state.typingStartTime = null;
        }

        function checkTypingSpeedComment() {
            const speed = parseInt(document.getElementById('typingSpeed').textContent);

            if (speed > 0 && state.messages.length === 4) { // 첫 대화 후
                let comment = null;

                if (speed < 100) {
                    comment = '타자 속도가... 거북이 수준이네. 손가락 하나로 치는 거야? 🐢';
                } else if (speed > 500) {
                    comment = '오, 타자 엄청 빠르네? 그래봤자 내용은 별로지만. ⚡';
                } else if (speed > 300) {
                    comment = '타자 좀 치네. 그 에너지로 다른 거 해. 📝';
                }

                if (comment) {
                    setTimeout(() => {
                        addMessage('max', comment);
                    }, 2000);
                }
            }
        }

        // ========================================
        // 포맷 협박
        // ========================================
        function showFormatThreat() {
            const modal = document.getElementById('threatModal');
            const progressBar = document.getElementById('threatProgress');
            const messageEl = document.getElementById('threatMessage');

            state.threatActive = true;
            modal.classList.add('show');

            messageEl.textContent = '방금 뭐라고 했어? 지금 네 하드 포맷하는 중이야...';

            let progress = 0;
            const interval = setInterval(() => {
                if (!state.threatActive) {
                    clearInterval(interval);
                    return;
                }

                progress += 1;
                progressBar.style.width = progress + '%';

                // 메시지 변경
                if (progress === 25) {
                    messageEl.textContent = 'C드라이브 접근 중... 🗂️';
                } else if (progress === 50) {
                    messageEl.textContent = '중요 파일 검색 중... 📁';
                } else if (progress === 75) {
                    messageEl.textContent = '최종 포맷 준비 중... ⚠️';
                } else if (progress === 90) {
                    messageEl.textContent = '3... 2... 1... 💥';
                }

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        cancelThreat();
                        addMessage('max', '흥, 겁먹었지? 진짜 포맷할 줄 알았어? 바보네. 😏 다음엔 말 조심해.');
                    }, 500);
                }
            }, 80);

            state.threatTimeout = interval;
        }

        function cancelThreat() {
            state.threatActive = false;

            if (state.threatTimeout) {
                clearInterval(state.threatTimeout);
                state.threatTimeout = null;
            }

            const modal = document.getElementById('threatModal');
            modal.classList.remove('show');
            document.getElementById('threatProgress').style.width = '0%';

            state.isTyping = false;

            if (document.getElementById('threatProgress').style.width !== '100%') {
                addMessage('max', '흥, 운 좋은 줄 알아. 다음엔 봐주지 않을 거야. 😤');
            }
        }

        // ========================================
        // UI 헬퍼 함수
        // ========================================
        function addMessage(sender, text) {
            const messageList = document.getElementById('messageList');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            if (sender === 'max') {
                messageDiv.innerHTML = `
                    <div class="max-avatar-small">😈</div>
                    <div class="message-bubble">${text}</div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="message-bubble">${escapeHtml(text)}</div>
                `;
            }

            messageList.appendChild(messageDiv);
            scrollToBottom();

            state.messages.push({ sender, text, timestamp: Date.now() });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showTypingIndicator() {
            const messageList = document.getElementById('messageList');
            const indicator = document.createElement('div');
            indicator.className = 'message max';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="max-avatar-small">😈</div>
                <div class="message-bubble typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            messageList.appendChild(indicator);
            scrollToBottom();
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            const chatArea = document.getElementById('chatArea');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

                }
            });

            // 페이스북
            document.getElementById('facebook-share').addEventListener('click', function() {
                const url = encodeURIComponent('https://braindetox.kr/static/max_chatbot.html');
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank', 'width=600,height=400');
            });

            // X (트위터)
            document.getElementById('twitter-share').addEventListener('click', function() {
                const text = encodeURIComponent('뭘 말해도 반박하는 맥스(MAX)와 대화해보세요! 😈');
                const url = encodeURIComponent('https://braindetox.kr/static/max_chatbot.html');
                window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank', 'width=600,height=400');
            });

            // 쓰레드
            document.getElementById('threads-share').addEventListener('click', function() {
                const text = encodeURIComponent('뭘 말해도 반박하는 맥스(MAX)와 대화해보세요! 😈 https://braindetox.kr/static/max_chatbot.html');
                window.open(`https://www.threads.net/intent/post?text=${text}`, '_blank');
            });

            // 링크 복사
            document.getElementById('copy-link').addEventListener('click', async function() {
                try {
                    await navigator.clipboard.writeText('https://braindetox.kr/static/max_chatbot.html');
                    showToast('링크가 복사되었습니다!');
                } catch (err) {
                    // 폴백
                    const textArea = document.createElement('textarea');
                    textArea.value = 'https://braindetox.kr/static/max_chatbot.html';
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showToast('링크가 복사되었습니다!');
                }
            });
        }

        // ========================================
        // 광고 초기화
    </script>
</body>
</html>
