            '黄昏','极光','天顶','地平','传说','最强','终极','至高','无敌','绝对',
            '闪电','疾风','烈火','冰封','飓风','雷鸣','流星','彗星','银河','太古',
            '绝美','威猛','清澈','狂野','凛然','豪爽','崇高','典雅','飘渺','强悍'
        ];

        const NOUNS = [
            '老虎','狮子','狐狸','灰狼','雄鹰','苍鹰','海豚','凤凰','龙','黑熊',
            '猎隼','黑豹','眼镜蛇','毒蛇','乌鸦','猫头鹰','鲨鱼','蓝鲸','美洲豹','猞猁',
            '熊猫','考拉','水獭','企鹅','鹦鹉','天鹅','仙鹤','雄鹿','骏马','野牛',
            '法师','骑士','忍者','武士','圣骑士','游侠','弓箭手','魔导师','德鲁伊','武僧',
            '海盗','维京','斯巴达','角斗士','哨兵','守护者','猎人','斥候','盗贼','守望者',
            '宙斯','奥丁','雷神','雅典娜','阿波罗','月神','海神','冥王','洛基','芙蕾雅',
            '女武神','泰坦','巨像','石魔','狮身人','九头蛇','狮鹫','奇美拉','海妖','地狱犬',
            '星辰','明月','太阳','风暴','雷电','烈焰','寒霜','暗影','黎明','黄昏',
            '彗星','星云','银河','脉冲星','类星体','日蚀','极光','天顶','地平线','漩涡',
            '长剑','盾牌','神箭','王冠','权杖','战锤','长枪','匕首','战斧','利刃',
            '樱花','梅花','莲花','菊花','牡丹','百合','紫藤','茶花','玫瑰','枫叶',
            '高山','大河','海洋','森林','沙漠','峡谷','深渊','冰川','火山','孤岛',
            '城堡','高塔','石桥','神殿','堡垒','要塞','圣域','避难所','圣堂','宝库',
            '火箭','战舰','飞船','羽翼','巡洋舰','王牌','突击者','漂泊者','赛车手','骑手',
            '战士','勇者','传说','英雄','贤者','先知','预言家','幻术师','幽灵','亡魂',
            '火花','闪光','耀斑','闪电','浪涌','潮汐','疾风','微风','洪流','灯火',
            '代码','数据','密码','电路','矩阵','核心','节点','密钥','光线','齿轮',
            '巨蟒','螳螂','蝎子','蜘蛛','甲虫','黄蜂','萤火虫','蝴蝶','飞蛾','蝉',
            '王子','女王','国王','男爵','公爵','伯爵','领主','公主','皇帝','将军',
            '霸主','叛逆者','亡命者','游牧民','流浪者','探索者','梦想家','冒险者','航行者','先驱者'
        ];

        let count = 1;
        let generatedNicknames = [];

        function setCount(n) {
            count = n;
            document.querySelectorAll('.count-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.count) === n);
            });
            vibrate();
        }

        function generate() {
            const addNumber = document.getElementById('add-number').checked;
            generatedNicknames = [];
            for (let i = 0; i < count; i++) {
                const adj = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
                const noun = NOUNS[Math.floor(Math.random() * NOUNS.length)];
                let nickname = adj + noun;
                if (addNumber) { nickname += (Math.floor(Math.random() * 9999) + 1); }
                generatedNicknames.push(nickname);
            }
            renderResults();
            vibrate();
        }

        function renderResults() {
            const emptyState = document.getElementById('empty-state');
            const container = document.getElementById('results-container');
            const list = document.getElementById('results-list');
            if (generatedNicknames.length === 0) { emptyState.style.display = 'block'; container.style.display = 'none'; return; }
            emptyState.style.display = 'none';
            container.style.display = 'block';
            list.innerHTML = generatedNicknames.map((nickname, index) => `
                <div class="nickname-card">
                    <span class="nickname-text">${nickname}</span>
                    <button class="copy-btn" id="copy-btn-${index}" onclick="copyNickname('${nickname}', ${index})">复制</button>
                </div>
            `).join('');
        }

        function copyNickname(nickname, index) {
            navigator.clipboard.writeText(nickname).then(() => {
                const btn = document.getElementById('copy-btn-' + index);
                btn.textContent = '完成！';
                btn.classList.add('copied');
                showToast('已复制到剪贴板');
                setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
            }).catch(() => { showToast('复制失败'); });
            vibrate();
        }

        function copyAll() {
            if (generatedNicknames.length === 0) return;
            navigator.clipboard.writeText(generatedNicknames.join('\n')).then(() => {
                showToast('已复制' + generatedNicknames.length + '个昵称');
            }).catch(() => { showToast('复制失败'); });
            vibrate();
        }

        function shareKakao() {
            if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) { showToast('正在准备KakaoTalk...'); return; }
            const desc = generatedNicknames.length > 0
                ? '生成结果: ' + generatedNicknames.slice(0, 3).join('、') + (generatedNicknames.length > 3 ? ' 等' + (generatedNicknames.length - 3) + '个' : '')
                : '形容词+名词组合超过4万种独特昵称！';
            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: { title: '随机昵称生成器', description: desc, imageUrl: 'https://braindetox.kr/site_logo.png', link: { mobileWebUrl: 'https://braindetox.kr/zh/static/nickname_generator.html', webUrl: 'https://braindetox.kr/zh/static/nickname_generator.html' } },
                buttons: [{ title: '我也来试试', link: { mobileWebUrl: 'https://braindetox.kr/zh/static/nickname_generator.html', webUrl: 'https://braindetox.kr/zh/static/nickname_generator.html' } }]
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function vibrate() { if ('vibrate' in navigator) navigator.vibrate(10); }

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
        });
    </script>
