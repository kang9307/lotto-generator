            --border-accent: #3b82f6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: rgba(59, 130, 246, 0.1);
            --success: #10b981;
            --success-light: rgba(16, 185, 129, 0.1);

            --warning-light: rgba(245, 158, 11, 0.1);
            --error: #ef4444;
            --error-light: rgba(239, 68, 68, 0.1);
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.4);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 背景渐变 */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* 头部 */
        header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 20px;
        }

        .badge {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
        }

        /* 标签导航 */
        .tab-nav {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .tab-nav::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex-shrink: 0;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
        }

        .tab-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 卡片 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-light);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
        }

        /* 分类面板 */
        .category-panel {
            display: none;
        }

        .category-panel.active {
            display: block;
        }

        /* 转换区域 */
        .converter-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .unit-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .unit-input-group {
            flex: 1;
        }

        .unit-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .unit-input-wrapper {
            position: relative;
        }

        .unit-input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            font-size: 18px;
            font-weight: 500;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .unit-input-wrapper input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .unit-input-wrapper input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 15px;
        }

        .unit-select-group {
            width: 160px;
            flex-shrink: 0;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper select {
            width: 100%;
            padding: 14px 36px 14px 16px;
            font-size: 15px;
            font-weight: 500;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
            appearance: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .select-wrapper select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .select-wrapper::after {
            content: '\25BC';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: var(--text-muted);
            pointer-events: none;
        }

        /* 交换按钮 */
        .swap-btn-wrapper {
            display: flex;
            justify-content: center;
            margin: 4px 0;
        }

        .swap-btn {
            width: 44px;
            height: 44px;
            background: var(--accent-light);
            border: 2px solid var(--accent);
            border-radius: 50%;
            color: var(--accent);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swap-btn:hover {
            background: var(--accent);
            color: white;
            transform: rotate(180deg);
        }

        .swap-btn svg {
            width: 20px;
            height: 20px;
        }

        /* 结果显示 */
        .result-display {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-top: 8px;
            text-align: center;
        }

        .result-formula {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--success);
            word-break: break-all;
        }

        .result-value .result-unit {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        /* 预设（常用转换） */
        .preset-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .preset-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }

        .preset-btn {
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            text-align: left;
        }

        .preset-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .preset-btn .preset-label {
            font-weight: 500;
            display: block;
            margin-bottom: 2px;
        }

        .preset-btn .preset-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 分享按钮 */
        .share-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .share-title {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 12px;
        }

        .share-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .share-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .share-btn.kakao {
            background: #FEE500;
            color: #000;
        }

        .share-btn.copy {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .share-btn:hover {
            transform: translateY(-2px);
        }


        /* 页脚 */
        footer {
            text-align: center;
            padding: 24px 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        footer a:hover {
            color: var(--accent);
        }

        /* 提示 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .container {
                padding: 16px 12px 32px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .card {
                padding: 20px 16px;
            }

            .unit-row {
                flex-direction: column;
                gap: 8px;
            }

            .unit-select-group {
                width: 100%;
            }

            .unit-input-wrapper input {
                font-size: 16px;
            }

            .result-value {
                font-size: 20px;
            }

            .preset-grid {
                grid-template-columns: 1fr 1fr;
            }

            .share-buttons {
                flex-direction: column;
            }

            .share-btn {
                justify-content: center;
            }

            .tab-nav {
                gap: 4px;
            }

            .tab-btn {
                padding: 8px 14px;
                font-size: 13px;
            }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>

            mal: 18039             // 1斗 = 10升 = 约18039mL (约18L)
        };

        // 单位显示名称
        const UNIT_LABELS = {
            // 长度
            mm: 'mm', cm: 'cm', m: 'm', km: 'km',
            inch: 'inch', feet: 'feet', yard: 'yard', mile: 'mile',
            ja: '尺', chi: '寸', ri: '里',
            // 重量
            mg: 'mg', g: 'g', kg: 'kg', ton: 'ton',
            oz: 'oz', lb: 'lb', geun: '斤', gwan: '贯',
            // 温度
            celsius: '\u2103', fahrenheit: '\u2109', kelvin: 'K',
            // 面积
            cm2: 'cm\u00B2', m2: 'm\u00B2', km2: 'km\u00B2',
            ha: 'ha', acre: 'acre', pyeong: '坪', sqft: 'ft\u00B2',
            // 体积
            mL: 'mL', L: 'L', m3: 'm\u00B3',
            gallon: '加仑', floz: 'fl oz', cup: '杯',
            hop: '合', doe: '升', mal: '斗'
        };

        // ========== 转换函数 ==========
        function convertLength(value, fromUnit, toUnit) {
            if (fromUnit === toUnit) return value;
            const meters = value * LENGTH_TO_M[fromUnit];
            return meters / LENGTH_TO_M[toUnit];
        }

        function convertWeight(value, fromUnit, toUnit) {
            if (fromUnit === toUnit) return value;
            const grams = value * WEIGHT_TO_G[fromUnit];
            return grams / WEIGHT_TO_G[toUnit];
        }

        function convertTemperature(value, fromUnit, toUnit) {
            if (fromUnit === toUnit) return value;

            // 首先转换为摄氏度
            let celsius;
            switch (fromUnit) {
                case 'celsius': celsius = value; break;
                case 'fahrenheit': celsius = (value - 32) * 5 / 9; break;
                case 'kelvin': celsius = value - 273.15; break;
            }

            // 从摄氏度转换为目标单位
            switch (toUnit) {
                case 'celsius': return celsius;
                case 'fahrenheit': return celsius * 9 / 5 + 32;
                case 'kelvin': return celsius + 273.15;
            }
        }

        function convertArea(value, fromUnit, toUnit) {
            if (fromUnit === toUnit) return value;
            const m2 = value * AREA_TO_M2[fromUnit];
            return m2 / AREA_TO_M2[toUnit];
        }

        function convertVolume(value, fromUnit, toUnit) {
            if (fromUnit === toUnit) return value;
            const ml = value * VOLUME_TO_ML[fromUnit];
            return ml / VOLUME_TO_ML[toUnit];
        }

        // 分类转换函数映射
        const CONVERTERS = {
            length: convertLength,
            weight: convertWeight,
            temperature: convertTemperature,
            area: convertArea,
            volume: convertVolume
        };

        // ========== 结果格式化 ==========
        function formatResult(value) {
            if (value === 0) return '0';
            const abs = Math.abs(value);
            if (abs >= 1000000 || abs < 0.000001) {
                return value.toExponential(6);
            }
            // 去除小数点后不必要的0，最多10位
            let result = value.toPrecision(10);
            // 去除末尾的0
            if (result.includes('.')) {
                result = result.replace(/\.?0+$/, '');
            }
            // 添加千位分隔符（仅整数部分）
            const parts = result.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        // ========== 实时转换（双向） ==========
        let lastEditDirection = 'from'; // 追踪最后编辑的方向

        function performConversion(category, direction) {
            const fromInput = document.getElementById(`${category}-from-input`);
            const toInput = document.getElementById(`${category}-to-input`);
            const fromUnit = document.getElementById(`${category}-from-unit`).value;
            const toUnit = document.getElementById(`${category}-to-unit`).value;
            const formulaEl = document.getElementById(`${category}-formula`);
            const resultEl = document.getElementById(`${category}-result-value`);
            const converter = CONVERTERS[category];

            let sourceInput, targetInput, srcUnit, tgtUnit;

            if (direction === 'from') {
                sourceInput = fromInput;
                targetInput = toInput;
                srcUnit = fromUnit;
                tgtUnit = toUnit;
            } else {
                sourceInput = toInput;
                targetInput = fromInput;
                srcUnit = toUnit;
                tgtUnit = fromUnit;
            }

            const rawValue = sourceInput.value.replace(/,/g, '');
            const value = parseFloat(rawValue);

            if (isNaN(value) || rawValue === '') {
                targetInput.value = '';
                formulaEl.textContent = '输入数值即可实时转换';
                resultEl.textContent = '-';
                return;
            }

            const result = converter(value, srcUnit, tgtUnit);
            const formatted = formatResult(result);
            targetInput.value = formatted;

            // 结果显示（始终以from -> to方向显示）
            const fromVal = direction === 'from' ? value : result;
            const toVal = direction === 'from' ? result : value;
            formulaEl.textContent = `${formatResult(fromVal)} ${UNIT_LABELS[fromUnit]} = `;
            resultEl.innerHTML = `${formatResult(toVal)}<span class="result-unit">${UNIT_LABELS[toUnit]}</span>`;
        }

        // ========== 事件监听器注册 ==========
        const categories = ['length', 'weight', 'temperature', 'area', 'volume'];

        categories.forEach(category => {
            // 输入框事件（from）
            const fromInput = document.getElementById(`${category}-from-input`);
            fromInput.addEventListener('input', () => {
                lastEditDirection = 'from';
                performConversion(category, 'from');
            });

            // 输入框事件（to）- 反向转换
            const toInput = document.getElementById(`${category}-to-input`);
            toInput.addEventListener('input', () => {
                lastEditDirection = 'to';
                performConversion(category, 'to');
            });

            // 单位更改时重新计算
            const fromUnit = document.getElementById(`${category}-from-unit`);
            fromUnit.addEventListener('change', () => {
                performConversion(category, lastEditDirection);
            });

            const toUnit = document.getElementById(`${category}-to-unit`);
            toUnit.addEventListener('change', () => {
                performConversion(category, lastEditDirection);
            });

            // 交换按钮
            const swapBtn = document.querySelector(`.swap-btn[data-category="${category}"]`);
            swapBtn.addEventListener('click', () => {
                const fromUnitEl = document.getElementById(`${category}-from-unit`);
                const toUnitEl = document.getElementById(`${category}-to-unit`);
                const fromInputEl = document.getElementById(`${category}-from-input`);
                const toInputEl = document.getElementById(`${category}-to-input`);

                // 交换单位
                const tempUnit = fromUnitEl.value;
                fromUnitEl.value = toUnitEl.value;
                toUnitEl.value = tempUnit;

                // 交换值
                const tempVal = fromInputEl.value;
                fromInputEl.value = toInputEl.value;
                toInputEl.value = tempVal;

                // 重新计算
                lastEditDirection = 'from';
                performConversion(category, 'from');
            });
        });

        // ========== 标签切换 ==========
        const tabBtns = document.querySelectorAll('.tab-btn');
        const panels = document.querySelectorAll('.category-panel');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const category = btn.dataset.category;

                // 激活标签
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // 激活面板
                panels.forEach(p => p.classList.remove('active'));
                document.getElementById(`panel-${category}`).classList.add('active');
            });
        });

        // ========== 应用预设 ==========
        function applyPreset(category, fromUnit, toUnit, value) {
            // 激活对应标签
            tabBtns.forEach(b => b.classList.remove('active'));
            document.querySelector(`.tab-btn[data-category="${category}"]`).classList.add('active');
            panels.forEach(p => p.classList.remove('active'));
            document.getElementById(`panel-${category}`).classList.add('active');

            // 设置单位
            document.getElementById(`${category}-from-unit`).value = fromUnit;
            document.getElementById(`${category}-to-unit`).value = toUnit;

            // 设置值
            document.getElementById(`${category}-from-input`).value = value;

            // 执行转换
            lastEditDirection = 'from';
            performConversion(category, 'from');

            // 滚动
            document.getElementById(`panel-${category}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ========== KakaoTalk 分享 ==========
        document.getElementById('kakaoShare').addEventListener('click', () => {
            if (!window.Kakao) {
                showToast('无法加载KakaoTalk SDK。');
                return;
            }

            if (!window.Kakao.isInitialized()) {
                window.Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            try {
                const shareMethod = window.Kakao.Share || window.Kakao.Link;
                if (shareMethod) {
                    shareMethod.sendDefault({
                        objectType: 'feed',
                        content: {
                            title: '单位转换器 - 万能单位转换工具',
                            description: '实时转换长度、重量、温度、面积和体积！支持公制、英制和韩国传统单位。',
                            imageUrl: 'https://braindetox.kr/site_logo.png',
                            link: {
                                mobileWebUrl: 'https://braindetox.kr/zh/static/unit_converter.html',
                                webUrl: 'https://braindetox.kr/zh/static/unit_converter.html'
                            }
                        },
                        buttons: [
                            {
                                title: '使用单位转换器',
                                link: {
                                    mobileWebUrl: 'https://braindetox.kr/zh/static/unit_converter.html',
                                    webUrl: 'https://braindetox.kr/zh/static/unit_converter.html'
                                }
                            }
                        ]
                    });
                }
            } catch (error) {
                console.error('Kakao分享错误:', error);
                showToast('分享时发生错误。');
            }
        });

        // ========== 复制结果 ==========
        document.getElementById('copyResult').addEventListener('click', () => {
            // 查找当前活动分类
            const activePanel = document.querySelector('.category-panel.active');
            if (!activePanel) return;

            const category = activePanel.id.replace('panel-', '');
            const fromInput = document.getElementById(`${category}-from-input`);
            const toInput = document.getElementById(`${category}-to-input`);
            const fromUnit = document.getElementById(`${category}-from-unit`).value;
            const toUnit = document.getElementById(`${category}-to-unit`).value;

            if (!fromInput.value && !toInput.value) {
                showToast('请先输入要转换的值。');
                return;
            }

            const categoryNames = {
                length: '长度', weight: '重量', temperature: '温度',
                area: '面积', volume: '体积'
            };

            const text = `[单位转换结果 - ${categoryNames[category]}]
${fromInput.value} ${UNIT_LABELS[fromUnit]} = ${toInput.value} ${UNIT_LABELS[toUnit]}

https://braindetox.kr/zh/static/unit_converter.html`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('结果已复制到剪贴板。');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        });

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('结果已复制到剪贴板。');
            } catch (err) {
                showToast('复制失败。');
            }
            document.body.removeChild(textarea);
        }

        // ========== 提示 ==========
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

    </script>
</body>
