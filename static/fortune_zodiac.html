    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-muted: #636366;
            --accent: #f39c12;
            --accent-hover: #f5b041;
            --accent-light: rgba(243, 156, 18, 0.15);
            --border-color: #3a3a3c;
            --gold-gradient: linear-gradient(135deg, #f39c12 0%, #e74c3c 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 24px 20px;
            text-align: center;
            background: var(--gold-gradient);
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .today-date {
            font-size: 0.85rem;
            margin-top: 8px;
            opacity: 0.8;
        }

        /* Input Section */
        .input-section {
            padding: 24px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .input-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .date-input {
            width: 100%;
            max-width: 280px;
            padding: 14px 16px;
            font-size: 1.1rem;
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 16px;
        }

        .date-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .check-btn {
            width: 100%;
            max-width: 280px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            background: var(--gold-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .check-btn:active {
            transform: scale(0.98);
        }

        /* Result Section */
        .result-section {
            display: none;
            padding: 24px 20px;
            flex: 1;
        }

        .result-section.show {
            display: block;
        }

        /* Zodiac Info */
        .zodiac-info {
            text-align: center;
            padding: 30px 20px;
            background: var(--gold-gradient);
            border-radius: 20px;
            margin-bottom: 24px;
        }

        .zodiac-icon {
            font-size: 5rem;
            margin-bottom: 12px;
        }

        .zodiac-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .zodiac-year {
            font-size: 1rem;
            opacity: 0.8;
        }

        .zodiac-element {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        /* Personality */
        .personality-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .personality-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .traits {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .trait-tag {
            padding: 6px 12px;
            background: var(--accent-light);
            border-radius: 16px;
            font-size: 0.8rem;
            color: var(--accent);
        }

        /* Fortune Tabs */
        .fortune-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .fortune-tab {
            flex: 1;
            min-width: 70px;
            padding: 10px 6px;
            font-size: 0.85rem;
            font-weight: 500;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            text-align: center;
        }

        .fortune-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* Fortune Content */
        .fortune-content {
            display: none;
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .fortune-content.active {
            display: block;
        }

        .fortune-level {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .fortune-stars {
            font-size: 1.2rem;
            color: var(--accent);
        }

        .fortune-level-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
        }

        .fortune-message {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Lucky Info */
        .lucky-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .lucky-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .lucky-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .lucky-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .lucky-icon {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        /* Year Fortune */
        .year-fortune {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--accent);
        }

        .year-fortune-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .year-fortune-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* Share Section */
        .share-section {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .share-btn {
            flex: 1;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .share-btn:active {
            transform: scale(0.95);
        }

        .btn-kakao {
            background: #fee500;
            color: #000;
            border: none;
        }

        .btn-copy {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        /* Footer */
        .footer {
            padding: 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 8px;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2000;
        }

        .toast.show {
            opacity: 1;
        }

        /* Install Banner */
        .install-banner {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            max-width: 448px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 1500;
            animation: slideUp 0.3s ease;
        }

        .install-banner.show {
            display: block;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .install-banner-close {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .install-banner-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .install-banner-icon {
            font-size: 2rem;
        }

        .install-banner-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .install-banner-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .install-steps {
            margin-bottom: 12px;
        }

        .install-step {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .step-num {
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
        }

        .install-banner-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-later, .btn-dismiss {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-later {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-dismiss {
            background: var(--accent);
            border: none;
            color: white;
        }

        /* Responsive */
        @media (min-width: 481px) {
            .container {
                border-left: 1px solid var(--border-color);
                border-right: 1px solid var(--border-color);
            }
        }

        @media (max-width: 360px) {
            .zodiac-icon {
                font-size: 4rem;
            }
            .lucky-section {
                gap: 8px;
            }
            .lucky-item {
                padding: 12px 8px;
            }
        }
    </style>
</head>

            const index = (year - 1900) % 12;
            return ZODIAC_ORDER[index < 0 ? index + 12 : index];
        }

        // ========================================
        // Seeded Random for Consistent Fortune
        // ========================================
        function getDailySeed(zodiacKey) {
            const today = new Date();
            const dateString = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
            const zodiacValue = zodiacKey.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            return parseInt(dateString) + zodiacValue;
        }

        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function selectFromArray(array, seed) {
            const index = Math.floor(seededRandom(seed) * array.length);
            return array[index];
        }

        // ========================================
        // Fortune Generation
        // ========================================
        function generateDailyFortune(zodiacKey) {
            const baseSeed = getDailySeed(zodiacKey);

            // 각 운세별 레벨 결정 (1-5)
            const overallLevel = Math.floor(seededRandom(baseSeed) * 5) + 1;
            const moneyLevel = Math.floor(seededRandom(baseSeed + 1000) * 5) + 1;
            const loveLevel = Math.floor(seededRandom(baseSeed + 2000) * 5) + 1;
            const healthLevel = Math.floor(seededRandom(baseSeed + 3000) * 5) + 1;

            // 메시지 선택
            const overallMsg = selectFromArray(FORTUNE_MESSAGES.overall.find(f => f.level === overallLevel).messages, baseSeed + 100);
            const moneyMsg = selectFromArray(FORTUNE_MESSAGES.money.find(f => f.level === moneyLevel).messages, baseSeed + 1100);
            const loveMsg = selectFromArray(FORTUNE_MESSAGES.love.find(f => f.level === loveLevel).messages, baseSeed + 2100);
            const healthMsg = selectFromArray(FORTUNE_MESSAGES.health.find(f => f.level === healthLevel).messages, baseSeed + 3100);

            // 행운 정보
            const luckyNumbers = [];
            for (let i = 0; i < 3; i++) {
                let num;
                do {
                    num = Math.floor(seededRandom(baseSeed + 4000 + i * 100) * 45) + 1;
                } while (luckyNumbers.includes(num));
                luckyNumbers.push(num);
            }
            luckyNumbers.sort((a, b) => a - b);

            const luckyColor = selectFromArray(LUCKY_COLORS, baseSeed + 5000);
            const luckyDirection = selectFromArray(LUCKY_DIRECTIONS, baseSeed + 6000);

            return {
                overall: { level: overallLevel, message: overallMsg },
                money: { level: moneyLevel, message: moneyMsg },
                love: { level: loveLevel, message: loveMsg },
                health: { level: healthLevel, message: healthMsg },
                lucky: {
                    numbers: luckyNumbers.join(', '),
                    color: luckyColor,
                    direction: luckyDirection
                }
            };
        }

            let title = '띠별 운세 - 12지신 오늘의 운세';
            let description = '생년월일로 알아보는 띠별 운세를 확인해보세요!';

            if (currentResult) {
                title = `${currentResult.zodiacInfo.icon} ${currentResult.zodiacInfo.name} 오늘의 운세`;
                description = `종합운 ${getStars(currentResult.fortune.overall.level)} - 띠별 운세를 확인해보세요!`;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: title,
                    description: description,
                    imageUrl: 'https://braindetox.kr/static/images/fortune_zodiac_og.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/static/fortune_zodiac.html',
                        webUrl: 'https://braindetox.kr/static/fortune_zodiac.html'
                    }
                },
                buttons: [{
                    title: '내 운세 보기',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/static/fortune_zodiac.html',
                        webUrl: 'https://braindetox.kr/static/fortune_zodiac.html'
                    }
                }]
            });
        }

        function copyResult() {
            let text = `🐲 띠별 운세\n\n생년월일로 알아보는 12지신 오늘의 운세\n\n👉 https://braindetox.kr/static/fortune_zodiac.html`;

            if (currentResult) {
                text = `${currentResult.zodiacInfo.icon} ${currentResult.zodiacInfo.name} 오늘의 운세\n\n종합운: ${getStars(currentResult.fortune.overall.level)}\n행운의 숫자: ${currentResult.fortune.lucky.numbers}\n행운의 색상: ${currentResult.fortune.lucky.color}\n\n👉 https://braindetox.kr/static/fortune_zodiac.html`;
            }

            navigator.clipboard.writeText(text).then(() => {
                showToast('복사되었습니다');
            }).catch(() => {
                showToast('복사에 실패했습니다');
            });
        }

        // ========================================
        // Utility Functions
        // ========================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function vibrate() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            const weekday = weekdays[date.getDay()];
            return `${year}년 ${month}월 ${day}일 (${weekday})`;
        }

        // ========================================
        // PWA Install Banner
        // ========================================
        function showInstallBanner() {
            if (localStorage.getItem('fortune_zodiac_installDismissed') === 'forever') return;
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            if (sessionStorage.getItem('fortune_zodiac_installDismissed')) return;

            const banner = document.getElementById('install-banner');
            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);

            if (isIOS) {
                document.getElementById('ios-steps').style.display = 'block';
            } else if (isAndroid) {
                document.getElementById('android-steps').style.display = 'block';
            } else {
                document.getElementById('desktop-steps').style.display = 'block';
            }

            setTimeout(() => banner.classList.add('show'), 5000);
        }

        function closeInstallBanner() {
            document.getElementById('install-banner').classList.remove('show');
            sessionStorage.setItem('fortune_zodiac_installDismissed', 'true');
        }

        function closeInstallBannerForever() {
            document.getElementById('install-banner').classList.remove('show');
            localStorage.setItem('fortune_zodiac_installDismissed', 'forever');
        }

        // ========================================
        // Service Worker
        // ========================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/fortune_zodiac_sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed'));
        }

        // ========================================
        // Init
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('today-date').textContent = formatDate(new Date());
            showInstallBanner();

            // Set default date to reasonable year
            const dateInput = document.getElementById('birthdate');
            dateInput.max = new Date().toISOString().split('T')[0];
        });
    </script>
</body>
</html>
