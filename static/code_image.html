    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-card-hover: #273449;
            --border-color: #334155;
            --border-accent: #3b82f6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: rgba(59, 130, 246, 0.1);
            --success: #10b981;
            --success-light: rgba(16, 185, 129, 0.1);
            --warning: #f59e0b;
            --warning-light: rgba(245, 158, 11, 0.1);
            --error: #ef4444;
            --error-light: rgba(239, 68, 68, 0.1);
            --purple: #8b5cf6;
            --purple-light: rgba(139, 92, 246, 0.1);
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.4);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* 헤더 */
        header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 16px;
        }

        .badge {
            display: inline-block;
            background: var(--purple-light);
            color: var(--purple);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }

        /* 메인 레이아웃 */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            align-items: start;
        }

        /* 컨트롤 패널 */
        .control-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            position: sticky;
            top: 20px;
        }

        .control-section {
            margin-bottom: 20px;
        }

        .control-section:last-child {
            margin-bottom: 0;
        }

        .control-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .control-row {
            display: flex;
            gap: 8px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* 배경 그라데이션 선택 */
        .gradient-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
            padding: 4px;
        }

        .gradient-btn {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .gradient-btn:hover {
            transform: scale(1.1);
            z-index: 1;
        }

        .gradient-btn.active {
            border-color: #fff;
            box-shadow: 0 0 0 2px var(--accent);
        }

        /* 토글 스위치 */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .toggle-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            transition: 0.3s;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle input:checked + .toggle-slider {
            background: var(--accent);
            border-color: var(--accent);
        }

        .toggle input:checked + .toggle-slider:before {
            transform: translateX(20px);
            background: white;
        }

        /* 버튼 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-group .btn {
            flex: 1;
        }

        /* 에디터 영역 */
        .editor-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .code-input-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .code-input-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .code-input-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .char-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        .code-input {
            width: 100%;
            min-height: 200px;
            padding: 20px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
        }

        .code-input:focus {
            outline: none;
        }

        .code-input::placeholder {
            color: var(--text-muted);
        }

        /* 프리뷰 영역 */
        .preview-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .preview-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .preview-container {
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            background: repeating-conic-gradient(var(--bg-secondary) 0% 25%, var(--bg-primary) 0% 50%) 50% / 20px 20px;
        }

        /* 코드 카드 (캡처 대상) */
        .code-card {
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 12px 24px -8px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 100%;
            padding: 32px;
            position: relative;
        }

        .code-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .code-card-inner {
            border-radius: 10px;
            padding: 20px;
            overflow: hidden;
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.3),
                0 2px 4px -1px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* 윈도우 컨트롤 (macOS 스타일) */
        .window-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .window-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .window-dot.red { background: #ff5f56; }
        .window-dot.yellow { background: #ffbd2e; }
        .window-dot.green { background: #27ca40; }

        /* 코드 블록 */
        .code-block {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre;
            tab-size: 2;
            margin: 0;
            padding: 0;
            background: transparent !important;
        }

        .code-block code {
            font-family: inherit;
            background: transparent !important;
        }

        /* 라인 넘버 스타일 오버라이드 */
        .line-numbers .line-numbers-rows {
            border-right: 1px solid rgba(255,255,255,0.1);
            padding-right: 12px;
        }

        .line-numbers-rows > span:before {
            color: rgba(255,255,255,0.3);
        }

        /* 광고 */
        .ad-container {
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            border: 1px dashed var(--border-color);
        }

        /* 푸터 */
        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-secondary);
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 테마별 코드 스타일 */
        .theme-dracula { background: #282a36; color: #f8f8f2; }
        .theme-monokai { background: #272822; color: #f8f8f2; }
        .theme-github-dark { background: #0d1117; color: #c9d1d9; }
        .theme-one-dark { background: #282c34; color: #abb2bf; }
        .theme-nord { background: #2e3440; color: #d8dee9; }
        .theme-synthwave { background: #2b213a; color: #f0e8d6; }
        .theme-night-owl { background: #011627; color: #d6deeb; }
        .theme-material { background: #263238; color: #eeffff; }

        /* 모바일 컨트롤 토글 */
        .mobile-toggle {
            display: none;
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 16px;
            text-align: left;
        }

        .mobile-toggle::after {
            content: '▼';
            float: right;
            transition: transform 0.3s;
        }

        .mobile-toggle.active::after {
            transform: rotate(180deg);
        }

        /* 반응형 - 태블릿 */
        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 280px 1fr;
                gap: 16px;
            }

            .control-panel {
                padding: 16px;
            }

            .gradient-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        /* 반응형 - 모바일 */
        @media (max-width: 768px) {
            .mobile-toggle {
                display: block;
            }

            .main-layout {
                grid-template-columns: 1fr;
            }

            .control-panel {
                position: static;
                display: none;
            }

            .control-panel.show {
                display: block;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 13px;
            }

            .preview-container {
                padding: 16px;
            }

            .code-card {
                padding: 16px;
            }

            .code-card-inner {
                padding: 16px;
            }

            .code-block {
                font-size: 12px;
            }

            .btn-group {
                flex-direction: column;
            }
        }

        /* 반응형 - 작은 모바일 */
        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }

            header {
                margin-bottom: 16px;
            }

            .gradient-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }

            .preview-container {
                padding: 12px;
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="container">
        <header>
            <span class="badge">🎨 Developer Tool</span>
            <h1>코드 이미지 생성기</h1>
            <p class="subtitle">소스코드를 아름다운 이미지로 변환하세요<br>트위터, 블로그, SNS 공유에 최적화</p>
        </header>

        <!-- 모바일 컨트롤 토글 -->
        <button class="mobile-toggle" id="mobileToggle">
            🎛️ 스타일 설정
        </button>

        <div class="main-layout">
            <!-- 컨트롤 패널 -->
            <div class="control-panel" id="controlPanel">
                <div class="control-section">
                    <label class="control-label">프로그래밍 언어</label>
                    <select id="languageSelect">
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="csharp">C#</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                        <option value="php">PHP</option>
                        <option value="ruby">Ruby</option>
                        <option value="swift">Swift</option>
                        <option value="kotlin">Kotlin</option>
                        <option value="sql">SQL</option>
                        <option value="bash">Bash</option>
                        <option value="yaml">YAML</option>
                        <option value="json">JSON</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="markdown">Markdown</option>
                    </select>
                </div>

                <div class="control-section">
                    <label class="control-label">테마</label>
                    <select id="themeSelect">
                        <option value="dracula">Dracula</option>
                        <option value="monokai">Monokai</option>
                        <option value="github-dark">GitHub Dark</option>
                        <option value="one-dark">One Dark</option>
                        <option value="nord">Nord</option>
                        <option value="synthwave">Synthwave</option>
                        <option value="night-owl">Night Owl</option>
                        <option value="material">Material</option>
                    </select>
                </div>

                <div class="control-section">
                    <label class="control-label">배경 (31가지, 첫 번째는 투명)</label>
                    <div class="gradient-grid" id="gradientGrid"></div>
                </div>

                <div class="control-section">
                    <label class="control-label">설정</label>
                    <div class="control-row">
                        <div style="flex: 1;">
                            <label class="control-label" style="font-size: 12px;">패딩</label>
                            <select id="paddingSelect">
                                <option value="16">작게</option>
                                <option value="32" selected>보통</option>
                                <option value="48">크게</option>
                                <option value="64">아주 크게</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label class="control-label" style="font-size: 12px;">폰트 크기</label>
                            <select id="fontSizeSelect">
                                <option value="12">12px</option>
                                <option value="14" selected>14px</option>
                                <option value="16">16px</option>
                                <option value="18">18px</option>
                                <option value="20">20px</option>
                            </select>
                        </div>
                    </div>
                    <div class="control-row" style="margin-top: 8px;">
                        <div style="flex: 1;">
                            <label class="control-label" style="font-size: 12px;">카드 너비</label>
                            <select id="widthSelect">
                                <option value="auto" selected>자동 (내용에 맞춤)</option>
                                <option value="480">480px</option>
                                <option value="600">600px</option>
                                <option value="720">720px</option>
                                <option value="800">800px</option>
                                <option value="100%">전체 너비</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="control-section">
                    <div class="toggle-row">
                        <span class="toggle-label">윈도우 버튼 표시</span>
                        <label class="toggle">
                            <input type="checkbox" id="showWindowControls" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="toggle-row">
                        <span class="toggle-label">라인 번호 표시</span>
                        <label class="toggle">
                            <input type="checkbox" id="showLineNumbers" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>

                <div class="control-section">
                    <div class="btn-group">
                        <button class="btn btn-primary" id="downloadBtn">
                            📥 PNG 다운로드
                        </button>
                    </div>
                    <div class="btn-group" style="margin-top: 8px;">
                        <button class="btn btn-secondary" id="copyBtn">
                            📋 복사
                        </button>
                        <button class="btn btn-secondary" id="shareBtn">
                            💬 카카오톡
                        </button>
                    </div>
                </div>
            </div>

            <!-- 에디터 영역 -->
            <div class="editor-area">
                <!-- 코드 입력 -->
                <div class="code-input-wrapper">
                    <div class="code-input-header">
                        <span class="code-input-title">📝 코드 입력</span>
                        <span class="char-count" id="charCount">0자</span>
                    </div>
                    <textarea class="code-input" id="codeInput" placeholder="여기에 코드를 붙여넣으세요...">function greeting(name) {
    const message = `Hello, ${name}!`;
    console.log(message);
    return message;
}

// 함수 호출
greeting("World");</textarea>
                </div>

                <!-- 프리뷰 -->
                <div class="preview-wrapper">
                    <div class="preview-header">
                        <span class="preview-title">👁️ 미리보기</span>
                    </div>
                    <div class="preview-container">
                        <div class="code-card" id="codeCard">
                            <div class="code-card-inner theme-dracula" id="codeCardInner">
                                <div class="window-controls" id="windowControls">
                                    <div class="window-dot red"></div>
                                    <div class="window-dot yellow"></div>
                                    <div class="window-dot green"></div>
                                </div>
                                <pre class="code-block line-numbers" id="codeBlock"><code class="language-javascript" id="codeContent"></code></pre>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 광고 -->
                <div class="ad-container">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-7911569280980377"
                         data-ad-slot="auto"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                </div>
            </div>
        </div>

        <!-- 푸터 -->
        <footer>
            <div class="footer-links">
                <a href="../index.html">홈</a>
                <a href="../static_index.html">도구 목록</a>
                <a href="../blog.html">블로그</a>
            </div>
            <p>&copy; 2025 <a href="https://braindetox.kr">BrainDetox</a>. All rights reserved.</p>
        </footer>
    </div>

    <!-- 토스트 -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== 31가지 그라데이션 (배경 없음 포함) ==========
        const gradients = [
            // 배경 없음 (투명)
            'none',
            // 퍼플/블루 계열
            'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)',
            'linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%)',
            'linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%)',
            'linear-gradient(135deg, #6366f1 0%, #ec4899 100%)',
            // 핑크/레드 계열
            'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
            'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
            'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            'linear-gradient(135deg, #f472b6 0%, #ec4899 100%)',
            'linear-gradient(135deg, #ef4444 0%, #f97316 100%)',
            // 시안/그린 계열
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
            'linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%)',
            'linear-gradient(135deg, #10b981 0%, #34d399 100%)',
            // 오렌지/옐로우 계열
            'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
            'linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%)',
            'linear-gradient(135deg, #ff8c00 0%, #ff6b6b 100%)',
            'linear-gradient(135deg, #fde68a 0%, #fca5a5 100%)',
            'linear-gradient(135deg, #fdba74 0%, #f472b6 100%)',
            // 파스텔 계열
            'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
            'linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%)',
            'linear-gradient(135deg, #c1dfc4 0%, #deecdd 100%)',
            'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)',
            'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)',
            // 다크 계열
            'linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%)',
            'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)',
            'linear-gradient(135deg, #232526 0%, #414345 100%)',
            'linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%)',
            'linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)'
        ];

        // ========== 상태 ==========
        let currentGradient = gradients[0];
        let currentTheme = 'dracula';
        let currentLanguage = 'javascript';

        // ========== DOM 요소 ==========
        const codeInput = document.getElementById('codeInput');
        const codeBlock = document.getElementById('codeBlock');
        const codeContent = document.getElementById('codeContent');
        const codeCard = document.getElementById('codeCard');
        const codeCardInner = document.getElementById('codeCardInner');
        const windowControls = document.getElementById('windowControls');
        const charCount = document.getElementById('charCount');

        const languageSelect = document.getElementById('languageSelect');
        const themeSelect = document.getElementById('themeSelect');
        const paddingSelect = document.getElementById('paddingSelect');
        const fontSizeSelect = document.getElementById('fontSizeSelect');
        const widthSelect = document.getElementById('widthSelect');
        const showWindowControls = document.getElementById('showWindowControls');
        const showLineNumbers = document.getElementById('showLineNumbers');
        const gradientGrid = document.getElementById('gradientGrid');

        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const shareBtn = document.getElementById('shareBtn');
        const mobileToggle = document.getElementById('mobileToggle');
        const controlPanel = document.getElementById('controlPanel');

        // ========== 초기화 ==========
        function init() {
            // 그라데이션 버튼 생성
            createGradientButtons();

            // 초기 설정 적용
            updatePreview();
            updateBackground();
            updatePadding();
            updateFontSize();
            updateWidth();
            updateCharCount();

            // 이벤트 리스너 설정
            setupEventListeners();
        }

        // ========== 그라데이션 버튼 생성 ==========
        function createGradientButtons() {
            gradientGrid.innerHTML = '';
            gradients.forEach((gradient, index) => {
                const btn = document.createElement('button');
                btn.className = 'gradient-btn' + (index === 0 ? ' active' : '');
                if (gradient === 'none') {
                    btn.style.background = 'repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 50% / 8px 8px';
                    btn.title = '배경 없음';
                    btn.innerHTML = '<span style="font-size:10px;color:#666;">✕</span>';
                    btn.style.display = 'flex';
                    btn.style.alignItems = 'center';
                    btn.style.justifyContent = 'center';
                } else {
                    btn.style.background = gradient;
                    btn.title = `배경 ${index}`;
                }
                btn.dataset.gradient = gradient;
                gradientGrid.appendChild(btn);
            });
        }

        // ========== 이벤트 리스너 ==========
        function setupEventListeners() {
            // 코드 입력 - 즉시 반영
            codeInput.addEventListener('input', () => {
                updatePreview();
                updateCharCount();
            });

            // 언어 선택 - 즉시 반영
            languageSelect.addEventListener('change', (e) => {
                currentLanguage = e.target.value;
                updatePreview();
            });

            // 테마 선택 - 즉시 반영
            themeSelect.addEventListener('change', (e) => {
                currentTheme = e.target.value;
                updateTheme();
            });

            // 그라데이션 선택 - 즉시 반영
            gradientGrid.addEventListener('click', (e) => {
                const btn = e.target.closest('.gradient-btn');
                if (btn) {
                    document.querySelectorAll('.gradient-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentGradient = btn.dataset.gradient;
                    updateBackground();
                }
            });

            // 패딩 - 즉시 반영
            paddingSelect.addEventListener('change', updatePadding);

            // 폰트 크기 - 즉시 반영
            fontSizeSelect.addEventListener('change', updateFontSize);

            // 너비 - 즉시 반영
            widthSelect.addEventListener('change', updateWidth);

            // 윈도우 컨트롤 토글 - 즉시 반영
            showWindowControls.addEventListener('change', () => {
                windowControls.style.display = showWindowControls.checked ? 'flex' : 'none';
            });

            // 라인 넘버 토글 - 즉시 반영
            showLineNumbers.addEventListener('change', () => {
                if (showLineNumbers.checked) {
                    codeBlock.classList.add('line-numbers');
                } else {
                    codeBlock.classList.remove('line-numbers');
                }
                updatePreview();
            });

            // 다운로드
            downloadBtn.addEventListener('click', downloadImage);

            // 복사
            copyBtn.addEventListener('click', copyImage);

            // 공유
            shareBtn.addEventListener('click', shareKakao);

            // 모바일 토글
            mobileToggle.addEventListener('click', () => {
                mobileToggle.classList.toggle('active');
                controlPanel.classList.toggle('show');
            });
        }

        // ========== 업데이트 함수들 ==========
        function updatePreview() {
            const code = codeInput.value || '// 코드를 입력하세요';
            codeContent.className = `language-${currentLanguage}`;
            codeContent.textContent = code;
            Prism.highlightElement(codeContent);
        }

        function updateTheme() {
            codeCardInner.className = `code-card-inner theme-${currentTheme}`;
        }

        function updateBackground() {
            if (currentGradient === 'none') {
                codeCard.style.background = 'transparent';
                codeCard.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1)';
            } else {
                codeCard.style.background = currentGradient;
                codeCard.style.boxShadow = '0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 12px 24px -8px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1)';
            }
        }

        function updatePadding() {
            const padding = paddingSelect.value + 'px';
            codeCard.style.padding = padding;
        }

        function updateFontSize() {
            const fontSize = fontSizeSelect.value + 'px';
            codeBlock.style.fontSize = fontSize;
        }

        function updateWidth() {
            const width = widthSelect.value;
            if (width === 'auto') {
                codeCard.style.width = 'auto';
                codeCard.style.minWidth = '320px';
                codeCard.style.maxWidth = '100%';
            } else if (width === '100%') {
                codeCard.style.width = '100%';
                codeCard.style.minWidth = 'auto';
                codeCard.style.maxWidth = 'none';
            } else {
                codeCard.style.width = width + 'px';
                codeCard.style.minWidth = 'auto';
                codeCard.style.maxWidth = '100%';
            }
        }

        function updateCharCount() {
            charCount.textContent = codeInput.value.length + '자';
        }

        // ========== 이미지 다운로드 ==========
        async function downloadImage() {
            try {
                downloadBtn.disabled = true;
                downloadBtn.textContent = '⏳ 생성 중...';

                const canvas = await html2canvas(codeCard, {
                    backgroundColor: null,
                    scale: 2,
                    useCORS: true,
                    logging: false
                });

                const link = document.createElement('a');
                link.download = `code-image-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                showToast('이미지가 다운로드되었습니다!');
            } catch (err) {
                showToast('다운로드에 실패했습니다.');
                console.error(err);
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.textContent = '📥 PNG 다운로드';
            }
        }

        // ========== 이미지 복사 ==========
        async function copyImage() {
            try {
                copyBtn.disabled = true;
                copyBtn.textContent = '⏳';

                const canvas = await html2canvas(codeCard, {
                    backgroundColor: null,
                    scale: 2,
                    useCORS: true,
                    logging: false
                });

                canvas.toBlob(async (blob) => {
                    try {
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                        showToast('이미지가 클립보드에 복사되었습니다!');
                    } catch (err) {
                        showToast('복사 실패. 대신 다운로드해주세요.');
                    }
                }, 'image/png');
            } catch (err) {
                showToast('복사에 실패했습니다.');
                console.error(err);
            } finally {
                copyBtn.disabled = false;
                copyBtn.textContent = '📋 복사';
            }
        }

        // ========== 카카오톡 공유 ==========
        function shareKakao() {
            if (typeof Kakao === 'undefined') {
                showToast('카카오톡 공유를 준비 중입니다.');
                return;
            }

            if (!Kakao.isInitialized()) {
                Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: '🎨 코드 이미지 생성기',
                    description: '소스코드를 예쁜 이미지로 변환하세요! 30가지 배경, 8가지 테마 지원',
                    imageUrl: 'https://braindetox.kr/site_logo.png',
                    link: {
                        mobileWebUrl: 'https://braindetox.kr/static/code_image.html',
                        webUrl: 'https://braindetox.kr/static/code_image.html'
                    }
                },
                buttons: [
                    {
                        title: '코드 이미지 만들기',
                        link: {
                            mobileWebUrl: 'https://braindetox.kr/static/code_image.html',
                            webUrl: 'https://braindetox.kr/static/code_image.html'
                        }
                    }
                ]
            });
        }

        // ========== 토스트 ==========
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ========== 초기화 실행 ==========
        document.addEventListener('DOMContentLoaded', init);

        // ========== 광고 로드 ==========
        document.addEventListener('DOMContentLoaded', () => {
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch (e) {}
        });
    </script>
</body>
