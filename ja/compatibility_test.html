            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: #666;
            min-width: 150px;
            text-align: center;
        }
        
        .compatibility-tab.active {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: white;
            border-color: #ff9a9e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.3);

        .compatibility-tab:hover {
            transform: translateY(-2px);

            display: none;

        }
        
        .compatibility-section.active {
            display: block;
        }
        
        .input-form {
            background: white;
            border-radius: 20px;

            margin: 30px auto;

            margin-bottom: 10px;
            text-align: center;

            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #ff9a9e;
            box-shadow: 0 0 0 3px rgba(255, 154, 158, 0.1);

        .input-half {

        }

            padding: 15px 20px;

            box-shadow: 0 0 0 3px rgba(255, 154, 158, 0.1);

            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;

            display: block;

            box-shadow: 0 8px 25px rgba(255, 154, 158, 0.4);
        }
        
        .compatibility-result {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin: 30px auto;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: none;
            text-align: center;
        }
        
        .compatibility-result.active {
            display: block;
            animation: slideUp 0.6s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .compatibility-score {
            font-size: 4rem;
            font-weight: bold;
            color: #ff9a9e;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);

            margin: 25px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        
        .compatibility-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .detail-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

            margin-bottom: 10px;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .detail-card .score {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .detail-card .description {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .share-section {
            margin-top: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        
        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .share-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            min-width: 120px;
            justify-content: center;
        }
        
        .share-btn img {
            width: 18px;
            height: 18px;
        }
        
        .kakao-btn {
            background: #FEE500;
            color: #3C1E1E;
        }
        
        .facebook-btn {
            background: #1877F2;
            color: white;
        }
        
        .twitter-btn {
            background: #1DA1F2;
            color: white;
        }
        
        .threads-btn {
            background: #000;
            color: white;
        }
        
        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .compatibility-intro h1 {

            .input-row {

            .compatibility-score {

            }
            
            .compatibility-details {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .share-buttons {
                gap: 10px;
            }
            
            .share-btn {
                padding: 10px 18px;
                font-size: 0.8rem;
                min-width: 100px;
                border-radius: 8px;
            }
        }
        
        @media (max-width: 480px) {
            .compatibility-intro h1 {

            }
            
            .compatibility-tab {
                width: 200px;
            }
            
            .compatibility-score {
                font-size: 2.5rem;
            }
        }

    <!-- 헤더 含む -->
    <div id="header-placeholder"></div>

    <div class="container">
        <!-- 메인 소개 섹션 -->
        <div class="compatibility-intro">
            <h1>💝 相性テスト</h1>
            <p>이름, 生年月日, MBTI, 별자리로 確認하는 완벽한 相性 分석</p>
            <p>연인, 친구, 가족과의 특별한 인연을 確認해보세요</p>
        </div>

        <!-- 탭 メニュー -->
        <div class="compatibility-tabs">
            <div class="compatibility-tab active" data-tab="name">
                📝 이름 & 生年月日
            </div>
            <div class="compatibility-tab" data-tab="mbti">
                🧠 MBTI 相性
            </div>
            <div class="compatibility-tab" data-tab="zodiac">
                ⭐ 별자리 相性
            </div>
        </div>

        <!-- 이름 & 生年月日 相性 섹션 -->
        <div class="compatibility-section active" id="name-section">
            <div class="input-form">
                <h3 style="text-align: center; margin-bottom: 30px; color: #333;">📝 이름 & 生年月日 相性</h3>
                
                <div class="input-group">
                    <label class="input-label">첫 번째 사람</label>
                    <div class="input-row">
                        <div class="input-half">
                            <input type="text" class="input-field" id="name1" placeholder="이름을 入力하세요">
                        </div>
                        <div class="input-half">
                            <input type="date" class="input-field" id="birth1">
                        </div>
                    </div>
                </div>
                
                <div class="input-group">
                    <label class="input-label">두 번째 사람</label>
                    <div class="input-row">
                        <div class="input-half">
                            <input type="text" class="input-field" id="name2" placeholder="이름을 入力하세요">
                        </div>
                        <div class="input-half">
                            <input type="date" class="input-field" id="birth2">
                        </div>
                    </div>
                </div>
                
                <button class="test-button" onclick="calculateNameCompatibility()">
                    💝 相性 確認する
                </button>
            </div>
        </div>

        <!-- MBTI 相性 섹션 -->
        <div class="compatibility-section" id="mbti-section">
            <div class="input-form">
                <h3 style="text-align: center; margin-bottom: 30px; color: #333;">🧠 MBTI 相性</h3>
                
                <div class="input-group">
                    <label class="input-label">첫 번째 사람의 MBTI</label>
                    <select class="select-field" id="mbti1">
                        <option value="">MBTI를 選択하세요</option>
                        <option value="INTJ">INTJ (건축가)</option>
                        <option value="INTP">INTP (논리술사)</option>
                        <option value="ENTJ">ENTJ (통솔자)</option>
                        <option value="ENTP">ENTP (변론가)</option>
                        <option value="INFJ">INFJ (옹호자)</option>
                        <option value="INFP">INFP (중재자)</option>
                        <option value="ENFJ">ENFJ (선도자)</option>
                        <option value="ENFP">ENFP (활동가)</option>
                        <option value="ISTJ">ISTJ (현실注意자)</option>
                        <option value="ISFJ">ISFJ (수호자)</option>
                        <option value="ESTJ">ESTJ (경영자)</option>
                        <option value="ESFJ">ESFJ (집정관)</option>
                        <option value="ISTP">ISTP (가상인)</option>
                        <option value="ISFP">ISFP (모험가)</option>
                        <option value="ESTP">ESTP (사업가)</option>
                        <option value="ESFP">ESFP (연はい인)</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label class="input-label">두 번째 사람의 MBTI</label>
                    <select class="select-field" id="mbti2">
                        <option value="">MBTI를 選択하세요</option>
                        <option value="INTJ">INTJ (건축가)</option>
                        <option value="INTP">INTP (논리술사)</option>
                        <option value="ENTJ">ENTJ (통솔자)</option>
                        <option value="ENTP">ENTP (변론가)</option>
                        <option value="INFJ">INFJ (옹호자)</option>
                        <option value="INFP">INFP (중재자)</option>
                        <option value="ENFJ">ENFJ (선도자)</option>
                        <option value="ENFP">ENFP (활동가)</option>
                        <option value="ISTJ">ISTJ (현실注意자)</option>
                        <option value="ISFJ">ISFJ (수호자)</option>
                        <option value="ESTJ">ESTJ (경영자)</option>
                        <option value="ESFJ">ESFJ (집정관)</option>
                        <option value="ISTP">ISTP (가상인)</option>
                        <option value="ISFP">ISFP (모험가)</option>
                        <option value="ESTP">ESTP (사업가)</option>
                        <option value="ESFP">ESFP (연はい인)</option>
                    </select>
                </div>
                
                <button class="test-button" onclick="calculateMBTICompatibility()">
                    💝 MBTI 相性 確認する
                </button>
            </div>
        </div>

        <!-- 별자리 相性 섹션 -->
        <div class="compatibility-section" id="zodiac-section">
            <div class="input-form">
                <h3 style="text-align: center; margin-bottom: 30px; color: #333;">⭐ 별자리 相性</h3>
                
                <div class="input-group">
                    <label class="input-label">첫 번째 사람의 별자리</label>
                    <select class="select-field" id="zodiac1">
                        <option value="">별자리를 選択하세요</option>
                        <option value="양자리">양자리 (3.21 ~ 4.19)</option>
                        <option value="황소자리">황소자리 (4.20 ~ 5.20)</option>
                        <option value="쌍둥金利리">쌍둥金利리 (5.21 ~ 6.21)</option>
                        <option value="게자리">게자리 (6.22 ~ 7.22)</option>
                        <option value="사자자리">사자자리 (7.23 ~ 8.22)</option>
                        <option value="처녀자리">처녀자리 (8.23 ~ 9.22)</option>
                        <option value="천칭자리">천칭자리 (9.23 ~ 10.22)</option>
                        <option value="전갈자리">전갈자리 (10.23 ~ 11.22)</option>
                        <option value="사수자리">사수자리 (11.23 ~ 12.21)</option>
                        <option value="염소자리">염소자리 (12.22 ~ 1.19)</option>
                        <option value="물병자리">물병자리 (1.20 ~ 2.18)</option>
                        <option value="물고기자리">물고기자리 (2.19 ~ 3.20)</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label class="input-label">두 번째 사람의 별자리</label>
                    <select class="select-field" id="zodiac2">
                        <option value="">별자리를 選択하세요</option>
                        <option value="양자리">양자리 (3.21 ~ 4.19)</option>
                        <option value="황소자리">황소자리 (4.20 ~ 5.20)</option>
                        <option value="쌍둥金利리">쌍둥金利리 (5.21 ~ 6.21)</option>
                        <option value="게자리">게자리 (6.22 ~ 7.22)</option>
                        <option value="사자자리">사자자리 (7.23 ~ 8.22)</option>
                        <option value="처녀자리">처녀자리 (8.23 ~ 9.22)</option>
                        <option value="천칭자리">천칭자리 (9.23 ~ 10.22)</option>
                        <option value="전갈자리">전갈자리 (10.23 ~ 11.22)</option>
                        <option value="사수자리">사수자리 (11.23 ~ 12.21)</option>
                        <option value="염소자리">염소자리 (12.22 ~ 1.19)</option>
                        <option value="물병자리">물병자리 (1.20 ~ 2.18)</option>
                        <option value="물고기자리">물고기자리 (2.19 ~ 3.20)</option>
                    </select>
                </div>
                
                <button class="test-button" onclick="calculateZodiacCompatibility()">
                    💝 별자리 相性 確認する
                </button>
            </div>
        </div>

        <!-- 相性 結果 섹션 -->
        <div class="compatibility-result" id="compatibility-result">
            <!-- 結果가 여기에 표시됩니다 -->
        </div>

            <p style="color: #666; margin-bottom: 20px;">친구들과 相性テスト를 共有해보세요!</p>

                        alert('카카오톡 SDK를 불러올 수 없습니다.');
                        return;
                    }
                    
                    // SDK リセット 確認 및 재시도
                    if (!window.Kakao.isInitialized()) {
                        window.Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
                    }
                    
                    try {
                        if (window.Kakao.Share) {
                            window.Kakao.Share.sendDefault({
                                objectType: 'feed',
                                content: {
                                    title: '💝 相性テスト',
                                    description: '이름, 生年月日, MBTI, 별자리로 確認하는 완벽한 相性テスト! 연인, 친구, 가족과의 相性도를 재미있게 確認해보세요.',

                                    link: {
                                        mobileWebUrl: window.location.href,
                                        webUrl: window.location.href
                                    }
                                },
                                buttons: [
                                    {
                                        title: '나도 相性テスト하기',
                                        link: {
                                            mobileWebUrl: window.location.href,
                                            webUrl: window.location.href
                                        }
                                    }
                                ]
                            });
                        } else if (window.Kakao.Link) {
                            window.Kakao.Link.sendDefault({
                                objectType: 'feed',
                                content: {
                                    title: '💝 相性テスト',
                                    description: '이름, 生年月日, MBTI, 별자리로 確認하는 완벽한 相性テスト! 연인, 친구, 가족과의 相性도를 재미있게 確認해보세요.',
                                    imageUrl: 'https://braindetox.kr/images/compatibility_test_bg.png',
                                    link: {
                                        mobileWebUrl: window.location.href,
                                        webUrl: window.location.href
                                    }
                                },
                                buttons: [
                                    {
                                        title: '나도 相性テスト하기',
                                        link: {
                                            mobileWebUrl: window.location.href,
                                            webUrl: window.location.href
                                        }
                                    }
                                ]
                            });
                        } else {
                            window.open(`https://sharer.kakao.com/talk/friends/picker/link?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent('💝 相性テスト - 이름, 生年月日, MBTI, 별자리로 確認하는 완벽한 相性テスト!')}`, 'kakaotalk_share', 'width=350, height=650');

                    }
                });
            }

                    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                    const shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`;
                    
                    if (isMobile) {
                        window.location.href = shareUrl;
                    } else {
                        window.open(shareUrl, 'facebook-share-dialog', 'width=626,height=436');
                    }
                });
            }
            
            // X(트위터) 共有 버튼
            const twitterShareBtn = document.getElementById('twitter-share');

                twitterShareBtn.addEventListener('click', function() {

                    window.open(shareUrl, 'twitter-share-dialog', 'width=626,height=436');
                });
            }
            
            // Threadsで共有 버튼
            const threadsShareBtn = document.getElementById('threads-share');
            if (threadsShareBtn) {
                threadsShareBtn.addEventListener('click', function() {
                    const currentUrl = window.location.href;
                    const tempTextArea = document.createElement('textarea');
                    tempTextArea.value = currentUrl;
                    document.body.appendChild(tempTextArea);
                    tempTextArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempTextArea);
                    alert('リンクがコピーされました！. 쓰레드 앱에 붙여넣기하여 共有하세요!');
                });
            }
            
            // リンクをコピー 버튼
            const linkCopyBtn = document.getElementById('link-copy');
            if (linkCopyBtn) {
                linkCopyBtn.addEventListener('click', function() {
                    const currentUrl = window.location.href;
                    const tempTextArea = document.createElement('textarea');

                    document.body.appendChild(tempTextArea);
                    tempTextArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempTextArea);
                    alert('リンクがコピーされました！!');
