let currentQuestion=0,answers=[],scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
function startTest(){document.getElementById('startScreen').classList.remove('active');document.getElementById('testScreen').classList.add('active');showQuestion(0)}
function showQuestion(i){const q=questions[i];document.getElementById('questionNumber').textContent=`質問 ${i+1}`;document.getElementById('questionText').textContent=q.text;const p=((i)/questions.length)*100;document.getElementById('progressFill').style.width=`${p}%`;document.getElementById('progressNum').textContent=`${i+1}/${questions.length}`;document.getElementById('progressPercent').textContent=`${Math.round(p)}%`;document.getElementById('prevBtn').disabled=i===0;document.getElementById('nextBtn').textContent=i===questions.length-1?'結果を見る':'次へ';document.querySelectorAll('.answer-btn').forEach(btn=>btn.classList.remove('selected'));if(answers[i]){document.querySelectorAll('.answer-btn').forEach(btn=>{if(parseInt(btn.querySelector('.answer-score').textContent)===answers[i])btn.classList.add('selected')})}}
function selectAnswer(s){answers[currentQuestion]=s;document.querySelectorAll('.answer-btn').forEach(btn=>{btn.classList.remove('selected');if(parseInt(btn.querySelector('.answer-score').textContent)===s)btn.classList.add('selected')})}
function prevQuestion(){if(currentQuestion>0){currentQuestion--;showQuestion(currentQuestion)}}
function nextQuestion(){if(!answers[currentQuestion]){showToast('回答を選択してください');return}if(currentQuestion<questions.length-1){currentQuestion++;showQuestion(currentQuestion)}else{calculateResult()}}
function calculateResult(){document.getElementById('testScreen').classList.remove('active');document.getElementById('loadingScreen').classList.add('active');scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};questions.forEach((q,i)=>{scores[q.direction]+=answers[i]});const type=[scores.E>=scores.I?'E':'I',scores.S>=scores.N?'S':'N',scores.T>=scores.F?'T':'F',scores.J>=scores.P?'J':'P'].join('');setTimeout(()=>{document.getElementById('loadingScreen').classList.remove('active');document.getElementById('resultScreen').classList.add('active');showResult(type)},2000)}
function showResult(type){const r=typeResults[type];const tEI=scores.E+scores.I,tSN=scores.S+scores.N,tTF=scores.T+scores.F,tJP=scores.J+scores.P;let html=`<div class="result-header" id="resultCapture"><div class="result-type-badge" style="background:${r.color}20;color:${r.color}">${r.group==='analyst'?'分析家':r.group==='diplomat'?'外交官':r.group==='sentinel'?'番人':'探検家'}</div><div class="result-type-code" style="color:${r.color}">${type}</div><div class="result-nickname">${r.nickname}</div><div class="result-tagline">${r.tagline}</div></div><div class="result-section"><div class="section-title"><span class="section-icon">📊</span>傾向分析</div><div class="dimension-item"><div class="dimension-labels"><span class="dimension-label ${scores.E>=scores.I?'active':''}" style="${scores.E>=scores.I?'background:'+r.color:''}">E 外向型</span><span class="dimension-label ${scores.I>scores.E?'active':''}" style="${scores.I>scores.E?'background:'+r.color:''}">I 内向型</span></div><div class="dimension-bar"><div class="dimension-fill" style="width:${(scores.E/tEI)*100}%;background:${r.color}"></div></div><div class="dimension-percent">${Math.round((scores.E/tEI)*100)}% : ${Math.round((scores.I/tEI)*100)}%</div></div><div class="dimension-item"><div class="dimension-labels"><span class="dimension-label ${scores.S>=scores.N?'active':''}" style="${scores.S>=scores.N?'background:'+r.color:''}">S 感覚型</span><span class="dimension-label ${scores.N>scores.S?'active':''}" style="${scores.N>scores.S?'background:'+r.color:''}">N 直観型</span></div><div class="dimension-bar"><div class="dimension-fill" style="width:${(scores.S/tSN)*100}%;background:${r.color}"></div></div><div class="dimension-percent">${Math.round((scores.S/tSN)*100)}% : ${Math.round((scores.N/tSN)*100)}%</div></div><div class="dimension-item"><div class="dimension-labels"><span class="dimension-label ${scores.T>=scores.F?'active':''}" style="${scores.T>=scores.F?'background:'+r.color:''}">T 思考型</span><span class="dimension-label ${scores.F>scores.T?'active':''}" style="${scores.F>scores.T?'background:'+r.color:''}">F 感情型</span></div><div class="dimension-bar"><div class="dimension-fill" style="width:${(scores.T/tTF)*100}%;background:${r.color}"></div></div><div class="dimension-percent">${Math.round((scores.T/tTF)*100)}% : ${Math.round((scores.F/tTF)*100)}%</div></div><div class="dimension-item"><div class="dimension-labels"><span class="dimension-label ${scores.J>=scores.P?'active':''}" style="${scores.J>=scores.P?'background:'+r.color:''}">J 判断型</span><span class="dimension-label ${scores.P>scores.J?'active':''}" style="${scores.P>scores.J?'background:'+r.color:''}">P 知覚型</span></div><div class="dimension-bar"><div class="dimension-fill" style="width:${(scores.J/tJP)*100}%;background:${r.color}"></div></div><div class="dimension-percent">${Math.round((scores.J/tJP)*100)}% : ${Math.round((scores.P/tJP)*100)}%</div></div></div><div class="result-section"><div class="section-title"><span class="section-icon">📖</span>${type}タイプの説明</div><p class="description-text">${r.description.replace(/\n\n/g,'</p><p class="description-text" style="margin-top:16px">')}</p></div><div class="result-section"><div class="section-title"><span class="section-icon">🧩</span>認知機能スタック</div><div class="cognitive-stack">${r.cognitiveStack.map(c=>`<div class="cognitive-item"><div class="cognitive-rank">${c.rank}</div><div class="cognitive-func" style="color:${r.color}">${c.func}</div><div class="cognitive-name">${c.name}</div></div>`).join('')}</div></div><div class="result-section"><div class="section-title"><span class="section-icon">💼</span>おすすめの職業</div><div class="career-list">${r.careers.map(c=>`<div class="career-item"><span class="career-icon">✨</span><span>${c}</span></div>`).join('')}</div><p class="description-text" style="margin-top:16px">${r.workStyle}</p></div><div class="result-section"><div class="section-title"><span class="section-icon">💕</span>恋愛スタイル</div><p class="description-text">${r.romance.style}</p><div style="margin-top:16px"><div style="font-weight:600;margin-bottom:8px;color:${r.color}">💪 強み</div><div class="trait-list">${r.romance.strengths.map(s=>`<span class="trait-tag">${s}</span>`).join('')}</div></div><div style="margin-top:16px"><div style="font-weight:600;margin-bottom:8px;color:var(--warning)">⚠️ 注意点</div><p class="description-text">${r.romance.caution}</p></div></div><div class="result-section"><div class="section-title"><span class="section-icon">⭐</span>強み</div><div class="trait-list">${r.strengths.map(s=>`<span class="trait-tag">${s}</span>`).join('')}</div></div><div class="result-section"><div class="section-title"><span class="section-icon">🌱</span>成長ポイント</div><div class="trait-list">${r.growth.map(g=>`<span class="trait-tag">${g}</span>`).join('')}</div></div><div class="result-section"><div class="section-title"><span class="section-icon">🌟</span>同じタイプの有名人</div><div class="celeb-list" style="grid-template-columns:repeat(2,1fr)">${r.celebrities.map(c=>`<div class="celeb-item"><span class="celeb-emoji">👤</span><span>${c}</span></div>`).join('')}</div></div><div class="result-section"><div class="section-title"><span class="section-icon">💑</span>相性TOP3</div><div class="compat-list">${r.compatibility.map((c,i)=>`<div class="compat-item"><span class="compat-rank">${i+1}</span><div><div class="compat-type" style="color:${typeResults[c.type].color}">${c.type}</div><div class="compat-name">${c.name}</div></div></div>`).join('')}</div></div><div class="share-section"><div class="section-title"><span class="section-icon">📤</span>結果をシェア</div><div class="share-buttons"><button class="share-btn" onclick="saveImage()"><span class="share-btn-icon">📷</span><span class="share-btn-text">画像を保存</span></button><button class="share-btn" onclick="copyLink()"><span class="share-btn-icon">🔗</span><span class="share-btn-text">リンクをコピー</span></button></div></div><button class="retry-btn" onclick="retryTest()">もう一度診断する</button>`;document.getElementById('resultContent').innerHTML=html;window.scrollTo(0,0)}
function saveImage(){const el=document.getElementById('resultCapture');html2canvas(el,{backgroundColor:'#000',scale:2}).then(c=>{const l=document.createElement('a');l.download='personality_result.png';l.href=c.toDataURL();l.click();showToast('画像を保存しました')})}
function copyLink(){navigator.clipboard.writeText('https://braindetox.kr/ja/static/personality_test.html').then(()=>{showToast('リンクをコピーしました')})}
function retryTest(){currentQuestion=0;answers=[];scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};document.getElementById('resultScreen').classList.remove('active');document.getElementById('startScreen').classList.add('active')}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function shareTwitter(){const text='16タイプ性格診断 - 48問であなたの本当の性格を発見！';const url='https://braindetox.kr/ja/static/personality_test.html';window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`,'_blank')}
function copyTestLink(){navigator.clipboard.writeText('https://braindetox.kr/ja/static/personality_test.html').then(()=>{showToast('リンクをコピーしました')})}
</script>
