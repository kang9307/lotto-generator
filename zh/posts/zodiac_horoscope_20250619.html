                love: '一起享受美食、分享欢乐时光可以成为关系的积极催化剂。',
                money: '财运较好，可以尝试一些带来小乐趣的活动。',

                advice: '通过满足个人喜好的活动来主动提升幸福感是有益的。',

                luckyColor: '粉色',
                luckScores: { love: 4, money: 5, work: 4 }
            }
        };

        let luckChart = null;

        const zodiacSelector = document.getElementById('zodiac-selector');
        const contentDisplay = document.getElementById('content-display');

        const zodiacTitle = document.getElementById('zodiac-title');
        const overallAnalysis = document.getElementById('overall-analysis');
        const detailsList = document.getElementById('details-list');
        const luckInfo = document.getElementById('luck-info');
        const birthYearList = document.getElementById('birth-year-list');

        function updateDisplay(zodiacName) {
            const data = horoscopeData[zodiacName];
            if (!data) return;

            contentDisplay.style.opacity = 0;

            setTimeout(() => {
                zodiacTitle.innerHTML = `${data.emoji} ${zodiacName}`;
                overallAnalysis.textContent = data.overall;

                detailsList.innerHTML = `
                    <p><strong class="font-semibold text-sky-600">❤️ 爱情运:</strong> ${data.love}</p>
                    <p><strong class="font-semibold text-sky-600">💰 财运:</strong> ${data.money}</p>
                    <p><strong class="font-semibold text-sky-600">👨‍💼 事业运:</strong> ${data.work}</p>
                `;

                luckInfo.innerHTML = `
                    <p><strong class="font-semibold text-sky-600">✨ 建议:</strong> ${data.advice}</p>
                    <p><strong class="font-semibold text-sky-600">🎲 幸运号码:</strong> ${data.luckyNumber}</p>
                    <p><strong class="font-semibold text-sky-600">🎨 幸运颜色:</strong> <span class="font-bold">${data.luckyColor}</span></p>
                `;

                birthYearList.innerHTML = Object.entries(data.birthYears).map(([year, text]) =>
                    `<div class="bg-slate-50 p-3 rounded-lg"><strong class="font-semibold">${year}</strong><p class="mt-1 text-slate-600">${text}</p></div>`
                ).join('');

                updateChart(data.luckScores);
                contentDisplay.style.opacity = 1;

            }, 200);
        }

        function updateChart(scores) {
            const chartCtx = document.getElementById('luck-chart').getContext('2d');

            if (luckChart) {
                luckChart.destroy();
            }

            luckChart = new Chart(chartCtx, {
                type: 'radar',
                data: {
                    labels: ['❤️ 爱情运', '💰 财运', '👨‍💼 事业运'],
                    datasets: [{
                        label: '各领域运势能量',
                        data: [scores.love, scores.money, scores.work],
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(59, 130, 246, 1)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgba(59, 130, 246, 1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(0, 0, 0, 0.1)' },
                            grid: { color: 'rgba(0, 0, 0, 0.1)' },
                            pointLabels: {
                                font: { size: 14, weight: 'bold' },
                                color: '#334155'
                            },
                            ticks: {
                                backdropColor: 'rgba(255, 255, 255, 0.7)',
                                color: '#64748b',
                                stepSize: 1
                            },
                            suggestedMin: 0,
                            suggestedMax: 5
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.r !== null) {
                                        label += `${context.parsed.r}分`;
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });
        }

        function handleZodiacClick(e, zodiacName) {
            document.querySelectorAll('.zodiac-btn').forEach(btn => btn.classList.remove('selected'));
            e.currentTarget.classList.add('selected');
            updateDisplay(zodiacName);
        }

        window.addEventListener('DOMContentLoaded', () => {
            Object.keys(horoscopeData).forEach(zodiacName => {
                const data = horoscopeData[zodiacName];
                const button = document.createElement('button');
                button.className = 'zodiac-btn flex flex-col items-center justify-center p-3 bg-white rounded-lg shadow-sm border border-slate-200 hover:bg-sky-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500';
                button.innerHTML = `
                    <span class="text-3xl">${data.emoji}</span>
                    <span class="mt-1 text-sm font-semibold">${zodiacName}</span>
                `;
                button.addEventListener('click', (e) => handleZodiacClick(e, zodiacName));
                zodiacSelector.appendChild(button);
            });

            const firstButton = zodiacSelector.querySelector('.zodiac-btn');
            if (firstButton) {
                firstButton.classList.add('selected');
                updateDisplay(Object.keys(horoscopeData)[0]);
            }
        });

        // 社交分享功能
        document.addEventListener('DOMContentLoaded', function() {
            const kakaoShareBtn = document.getElementById('kakao-share');
            if (kakaoShareBtn) {
                kakaoShareBtn.addEventListener('click', function() {
                    if (!window.Kakao) return;
                    if (!window.Kakao.isInitialized()) window.Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
                    if (window.Kakao.Share) {
                        window.Kakao.Share.sendDefault({
                            objectType: 'feed',
                            content: { title: document.title, description: document.querySelector('meta[name="description"]')?.content || '', imageUrl: 'https://braindetox.kr/site_logo.png', link: { mobileWebUrl: location.href, webUrl: location.href } },
                            buttons: [{ title: '在网页中查看', link: { mobileWebUrl: location.href, webUrl: location.href } }]
                        });
                    }
                });
            }
            const facebookShareBtn = document.getElementById('facebook-share');
            if (facebookShareBtn) facebookShareBtn.addEventListener('click', () => window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(location.href), '_blank'));
            const twitterShareBtn = document.getElementById('twitter-share');
            if (twitterShareBtn) twitterShareBtn.addEventListener('click', () => window.open('https://twitter.com/intent/tweet?url=' + encodeURIComponent(location.href) + '&text=' + encodeURIComponent(document.title), '_blank'));
            const threadsShareBtn = document.getElementById('threads-share');
            if (threadsShareBtn) {
                threadsShareBtn.addEventListener('click', function() {
                    navigator.clipboard.writeText(location.href);
                    alert('链接已复制。请粘贴到 Threads 应用中分享！');
                });
            }
            const linkCopyBtn = document.getElementById('link-copy');
            if (linkCopyBtn) linkCopyBtn.addEventListener('click', () => { navigator.clipboard.writeText(location.href); alert('链接已复制！'); });
        });

    </script>
