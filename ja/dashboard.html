    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-card-hover: #273449;
            --border-color: #334155;
            --border-accent: #3b82f6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: rgba(59, 130, 246, 0.1);
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.4);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .bg-pattern {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 20%, rgba(59,130,246,0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139,92,246,0.06) 0%, transparent 50%);
        }
        .container {
            position: relative; z-index: 1;
            max-width: 1400px; margin: 0 auto; padding: 20px 16px 40px;
        }
        .header {
            text-align: center; margin-bottom: 30px; padding: 32px 24px 24px;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
        }
        .badge {
            display: inline-block; background: var(--accent-light); color: var(--accent);
            font-size: 12px; font-weight: 600; padding: 6px 14px;
            border-radius: 20px; margin-bottom: 16px;
            border: 1px solid rgba(59,130,246,0.3);
        }
        h1 {
            font-size: 28px; font-weight: 700; margin-bottom: 12px;
            background: var(--gradient-primary);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
        .live-indicator {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(34,197,94,0.15); padding: 6px 14px;
            border-radius: 50px; border: 1px solid rgba(34,197,94,0.2);
            font-size: 13px; font-weight: 500; color: var(--success);
        }
        .live-dot {
            width: 6px; height: 6px; background: #22c55e;
            border-radius: 50%; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }
        .update-time { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
        .stats-grid {
            display: grid; grid-template-columns: repeat(6, 1fr);
            gap: 14px; margin-bottom: 28px;
        }
        .stat-card {
            background: var(--bg-card); border-radius: var(--radius-md);
            padding: 20px; border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm); transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 2px; background: var(--gradient-primary);
            opacity: 0; transition: opacity 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .stat-card:hover::before { opacity: 1; }
        .stat-icon { font-size: 20px; margin-bottom: 8px; }
        .stat-number {
            font-size: 2em; font-weight: 700; line-height: 1; margin-bottom: 6px;
            color: var(--text-primary);
        }
        .stat-label {
            font-size: 12px; color: var(--text-secondary); font-weight: 500;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .charts-container {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 20px; margin-bottom: 28px;
        }
        .chart-card {
            background: var(--bg-card); border-radius: var(--radius-md);
            padding: 20px; border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm); height: 340px;
        }
        .chart-title {
            text-align: center; margin-bottom: 16px;
            font-size: 15px; font-weight: 600; color: var(--text-primary);
        }
        .chart-container { height: 260px; position: relative; }
        .posts-section {
            background: var(--bg-card); border-radius: var(--radius-md);
            padding: 20px; border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm); margin-bottom: 28px;
        }
        .posts-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px; margin-top: 16px;
        }
        .post-card {
            display: block; background: rgba(51,65,85,0.4); border-radius: var(--radius-sm);
            padding: 16px; border: 1px solid rgba(148,163,184,0.1);
            transition: all 0.2s; text-decoration: none; color: inherit;
        }
        .post-card:hover { background: rgba(51,65,85,0.6); transform: translateY(-2px); }
        .post-title { font-weight: 600; font-size: 13px; line-height: 1.4; margin-bottom: 8px; color: var(--text-primary); }
        .post-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
        .post-category {
            display: inline-block; background: rgba(99,102,241,0.2);
            color: #c7d2fe; padding: 3px 10px; border-radius: 12px;
            font-size: 11px; font-weight: 500;
            border: 1px solid rgba(99,102,241,0.3);
        }
        .share-group {
            display: flex; gap: 12px; margin-top: 24px; justify-content: center;
        }
        .share-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 20px; border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); background: var(--bg-secondary);
            color: var(--text-primary); cursor: pointer; font-size: 14px;
            transition: all 0.2s;
        }
        .share-btn:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
        footer {
            text-align: center; margin-top: 32px; padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted); font-size: 13px;
        }
        footer a { color: var(--accent); text-decoration: none; }
        .toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card); color: var(--text-primary);
            padding: 14px 28px; border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg); z-index: 10000; opacity: 0;
            transition: all 0.3s ease;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .charts-container { grid-template-columns: 1fr; }
            h1 { font-size: 24px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stat-card { padding: 14px; }
            .stat-number { font-size: 1.6em; }
            .chart-card { height: 300px; }
            .chart-container { height: 220px; }
            .share-group { flex-direction: column; }
            .share-btn { width: 100%; justify-content: center; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-number { font-size: 1.4em; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(30,41,75,0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.4); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.6); }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="container">
        <div class="header">
            <span class="badge">リアルタイム分析</span>
            <h1>BrainDetox プロジェクトダッシュボード</h1>
            <p class="subtitle">ブログ記事の統計、カテゴリ分布、人気キーワードを一目で確認できます。</p>
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span>リアルタイムモニタリング</span>
            </div>
            <div class="update-time">最終更新: <span id="lastUpdate">-</span></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon">📁</div><div class="stat-number" id="totalFiles">-</div><div class="stat-label">総ファイル数</div></div>
            <div class="stat-card"><div class="stat-icon">📝</div><div class="stat-number" id="totalPosts">-</div><div class="stat-label">総ポスト数</div></div>
            <div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-number" id="featuredPosts">-</div><div class="stat-label">ガイド記事</div></div>
            <div class="stat-card"><div class="stat-icon">📂</div><div class="stat-number" id="categories">-</div><div class="stat-label">カテゴリ</div></div>
            <div class="stat-card"><div class="stat-icon">🏷️</div><div class="stat-number" id="totalKeywords">-</div><div class="stat-label">キーワード</div></div>
            <div class="stat-card"><div class="stat-icon">📏</div><div class="stat-number" id="avgTitleLength">-</div><div class="stat-label">平均タイトル長</div></div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">カテゴリ別ポスト分布</div>
                <div class="chart-container"><canvas id="categoryChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title" id="monthlyTitle">月別投稿トレンド</div>
                <div class="chart-container"><canvas id="monthlyChart"></canvas></div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">人気キーワード TOP 10</div>
                <div class="chart-container"><canvas id="keywordChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">ファイルタイプ分布</div>
                <div class="chart-container"><canvas id="fileTypeChart"></canvas></div>
            </div>
        </div>

        <div class="posts-section">
            <div class="chart-title">最新ポスト</div>
            <div class="posts-grid" id="recentPosts"></div>
        </div>

        <div class="share-group">
            <button class="share-btn" onclick="shareKakao()">💬 カカオトーク共有</button>
            <button class="share-btn" onclick="copyLink()">📋 リンクコピー</button>
        </div>

        <footer>
            <p>&copy; 2025 <a href="https://braindetox.kr">BrainDetox</a>. All rights reserved.</p>
        </footer>
    </div>

    <script>
    let dashData = null;
    let chartInstances = {};
    const COLORS = ['#60a5fa','#a78bfa','#f472b6','#06d6a0','#fbbf24','#f87171','#34d399','#a1a1aa','#fb7185','#38bdf8','#818cf8','#4ade80','#facc15','#f97316','#e879f9','#22d3ee','#84cc16','#ef4444','#6366f1'];
    function updateTime() {
        document.getElementById('lastUpdate').textContent = new Date().toLocaleString('ja-JP', {
            year:'numeric', month:'2-digit', day:'2-digit',
            hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
        });
    }

    async function loadData() {
        try {
            const r = await fetch('./dashboard-data.json?t=' + Date.now());
            dashData = await r.json();
            renderStats();
            renderCharts();
            renderPosts();
        } catch(e) { console.error('データ読み込み失敗:', e); }
    }

    function renderStats() {
        const s = dashData.stats;
        document.getElementById('totalFiles').textContent = s.totalFiles.toLocaleString();
        document.getElementById('totalPosts').textContent = s.totalPosts.toLocaleString();
        document.getElementById('featuredPosts').textContent = s.featuredPosts;
        document.getElementById('categories').textContent = s.categories;
        document.getElementById('totalKeywords').textContent = s.totalKeywords.toLocaleString();
        document.getElementById('avgTitleLength').textContent = s.avgTitleLength + '文字';
    }

    function dc(n) { if(chartInstances[n]) { chartInstances[n].destroy(); chartInstances[n]=null; } }

    function renderCharts() {
        // カテゴリドーナツ
        dc('cat');
        const cc = Object.entries(dashData.categoryCount).sort(([,a],[,b])=>b-a);
        chartInstances.cat = new Chart(document.getElementById('categoryChart'), {
            type:'doughnut',
            data:{ labels:cc.map(([k])=>k), datasets:[{ data:cc.map(([,v])=>v), backgroundColor:COLORS, borderWidth:2, borderColor:'rgba(30,41,75,0.8)' }] },
            options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{ color:'#e2e8f0', font:{size:10}, padding:6, usePointStyle:true } } } }
        });

        // 月別トレンド
        dc('mon');
        const years = Object.keys(dashData.monthlyTrend).sort();
        document.getElementById('monthlyTitle').textContent = '月別投稿トレンド (' + years.join(', ') + ')';
        const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
        const ds = years.map((y,i) => {
            const yd = dashData.monthlyTrend[y];
            return { label:y+'年', data:months.map((_,j)=>yd[j+1]||0), borderColor:COLORS[i], backgroundColor:COLORS[i]+'20', borderWidth:2, fill:true, tension:0.4, pointBackgroundColor:COLORS[i], pointBorderColor:'#fff', pointBorderWidth:1, pointRadius:4 };
        });
        chartInstances.mon = new Chart(document.getElementById('monthlyChart'), {
            type:'line', data:{ labels:months, datasets:ds },
            options:{ responsive:true, maintainAspectRatio:false,
                scales:{ y:{ beginAtZero:true, grid:{color:'rgba(148,163,184,0.1)'}, ticks:{color:'#94a3b8',font:{size:11}} }, x:{ grid:{display:false}, ticks:{color:'#94a3b8',font:{size:11}} } },
                plugins:{ legend:{ display:years.length>1, labels:{color:'#e2e8f0',font:{size:11},usePointStyle:true} } }
            }
        });

        // キーワード TOP 10
        dc('kw');
        const kw = dashData.topKeywords.slice(0,10);
        chartInstances.kw = new Chart(document.getElementById('keywordChart'), {
            type:'bar',
            data:{ labels:kw.map(([k])=>k), datasets:[{ label:'使用回数', data:kw.map(([,v])=>v), backgroundColor:COLORS, borderColor:'rgba(30,41,75,0.8)', borderWidth:2, borderRadius:6, borderSkipped:false }] },
            options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y',
                scales:{ x:{ beginAtZero:true, grid:{color:'rgba(148,163,184,0.1)'}, ticks:{color:'#94a3b8',font:{size:11}} }, y:{ grid:{display:false}, ticks:{color:'#94a3b8',font:{size:10}, callback(v){const l=this.getLabelForValue(v);return l.length>10?l.substring(0,10)+'...':l;}} } },
                plugins:{ legend:{display:false} }
            }
        });

        // ファイルタイプ
        dc('ft');
        const ft = Object.entries(dashData.fileTypes).sort(([,a],[,b])=>b-a).slice(0,8);
        chartInstances.ft = new Chart(document.getElementById('fileTypeChart'), {
            type:'bar',
            data:{ labels:ft.map(([k])=>k), datasets:[{ label:'ファイル数', data:ft.map(([,v])=>v), backgroundColor:COLORS, borderColor:'rgba(30,41,75,0.8)', borderWidth:2, borderRadius:6, borderSkipped:false }] },
            options:{ responsive:true, maintainAspectRatio:false,
                scales:{ y:{ beginAtZero:true, grid:{color:'rgba(148,163,184,0.1)'}, ticks:{color:'#94a3b8',font:{size:11}} }, x:{ grid:{display:false}, ticks:{color:'#94a3b8',font:{size:11}} } },
                plugins:{ legend:{display:false} }
            }
        });
    }

    function renderPosts() {
        document.getElementById('recentPosts').innerHTML = dashData.posts.map(p =>
            `<a class="post-card" href="./posts/${p.filename}"><div class="post-title">${p.title}</div><div class="post-meta">${p.date}</div><span class="post-category">${p.category}</span></a>`
        ).join('');
    }

    function showToast(m) {
        const t=document.createElement('div'); t.className='toast'; t.textContent=m;
        document.body.appendChild(t);
        setTimeout(()=>t.classList.add('show'),10);
        setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2000);
    }
    function shareKakao() {
        if(typeof Kakao==='undefined'||!Kakao.isInitialized()){showToast('カカオトーク共有を準備中です。');return;}
        Kakao.Share.sendDefault({ objectType:'feed', content:{ title:'BrainDetox プロジェクトダッシュボード', description:'ブログ記事の統計、人気キーワード、トレンドを一目で!', imageUrl:'https://braindetox.kr/site_logo.png', link:{mobileWebUrl:location.href,webUrl:location.href} }, buttons:[{title:'ダッシュボードを見る',link:{mobileWebUrl:location.href,webUrl:location.href}}] });
    }
    function copyLink() {
        if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(()=>showToast('リンクがコピーされました。'));}
        else{const a=document.createElement('textarea');a.value=location.href;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');showToast('リンクがコピーされました。');}catch(e){showToast('コピーに失敗しました。');}document.body.removeChild(a);}
    }

    document.addEventListener('DOMContentLoaded', function() {
        if(typeof Kakao!=='undefined'&&!Kakao.isInitialized()) Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
        updateTime();
        loadData();
        setInterval(updateTime, 1000);
    });
    </script>
</body>
</html>
