    <style>
        :root {
            --bg-deep: #0b1120;
            --bg-night: #101828;
            --bg-card: rgba(16, 24, 48, 0.85);
            --border-subtle: rgba(80, 100, 140, 0.3);
            --text-primary: #e8ecf4;
            --text-secondary: #a8b4c8;
            --text-muted: #6878a0;
            --accent: #c9b896;
            --accent-glow: rgba(201, 184, 150, 0.35);
            --accent-soft: rgba(201, 184, 150, 0.1);
            --moonlight: rgba(220, 225, 240, 0.08);
            --moonlight-glow: rgba(200, 210, 235, 0.15);
            --star-color: rgba(255, 255, 240, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: linear-gradient(180deg, #0b1120 0%, #0d1628 40%, #101c35 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 달밤 그라데이션 배경 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 120% 80% at 75% 15%, rgba(200, 210, 235, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse 80% 60% at 20% 80%, rgba(60, 80, 140, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 90% 70%, rgba(100, 120, 180, 0.05) 0%, transparent 40%);
            animation: moonlightShift 25s ease-in-out infinite alternate;
        }

        @keyframes moonlightShift {
            0% {
                background:
                    radial-gradient(ellipse 120% 80% at 75% 15%, rgba(200, 210, 235, 0.12) 0%, transparent 50%),
                    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(60, 80, 140, 0.08) 0%, transparent 50%),
                    radial-gradient(ellipse 60% 40% at 90% 70%, rgba(100, 120, 180, 0.05) 0%, transparent 40%);
            }
            50% {
                background:
                    radial-gradient(ellipse 100% 70% at 70% 20%, rgba(200, 210, 235, 0.15) 0%, transparent 55%),
                    radial-gradient(ellipse 70% 50% at 25% 75%, rgba(60, 80, 140, 0.1) 0%, transparent 45%),
                    radial-gradient(ellipse 50% 50% at 85% 60%, rgba(100, 120, 180, 0.06) 0%, transparent 45%);
            }
            100% {
                background:
                    radial-gradient(ellipse 110% 75% at 80% 10%, rgba(200, 210, 235, 0.1) 0%, transparent 50%),
                    radial-gradient(ellipse 90% 55% at 15% 85%, rgba(60, 80, 140, 0.12) 0%, transparent 55%),
                    radial-gradient(ellipse 55% 45% at 95% 65%, rgba(100, 120, 180, 0.07) 0%, transparent 50%);
            }
        }

        /* 별들 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: var(--star-color);
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 달 */
        .moon {
            position: fixed;
            top: 8%;
            right: 12%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                rgba(255, 255, 250, 0.95) 0%,
                rgba(230, 235, 245, 0.8) 40%,
                rgba(200, 210, 230, 0.6) 70%,
                rgba(180, 190, 210, 0.4) 100%);
            box-shadow:
                0 0 40px rgba(220, 225, 240, 0.4),
                0 0 80px rgba(200, 210, 235, 0.25),
                0 0 120px rgba(180, 195, 220, 0.15);
            pointer-events: none;
            z-index: 0;
            animation: moonGlow 8s ease-in-out infinite alternate;
        }

        @keyframes moonGlow {
            0% {
                box-shadow:
                    0 0 40px rgba(220, 225, 240, 0.4),
                    0 0 80px rgba(200, 210, 235, 0.25),
                    0 0 120px rgba(180, 195, 220, 0.15);
            }
            100% {
                box-shadow:
                    0 0 50px rgba(220, 225, 240, 0.5),
                    0 0 100px rgba(200, 210, 235, 0.3),
                    0 0 150px rgba(180, 195, 220, 0.2);
            }
        }

        /* 떠다니는 파티클 (반딧불이) */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 220, 0.9);
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 6px rgba(255, 255, 200, 0.6);
            animation: firefly 12s infinite;
        }

        @keyframes firefly {
            0% {
                opacity: 0;
                transform: translateY(80vh) translateX(0) scale(0.5);
            }
            15% {
                opacity: 0.8;
            }
            50% {
                transform: translateY(40vh) translateX(30px) scale(1);
            }
            85% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: translateY(0vh) translateX(-20px) scale(0.5);
            }
        }

        /* 메인 컨테이너 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 24px;
            min-height: 100vh;
        }

        /* 헤더 */
        header {
            text-align: center;
            padding: 60px 0 40px;
        }

        .time-display {
            font-size: 4.5rem;
            font-weight: 200;
            letter-spacing: -3px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-shadow: 0 0 60px var(--accent-glow);
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* 네비게이션 */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 40px 0;
            padding: 6px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(10px);
        }

        .nav-tab {
            flex: 1;
            padding: 14px 10px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-tab:hover {
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--accent-soft) 0%, var(--purple-soft) 100%);
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* 섹션 공통 */
        .section {
            margin-bottom: 24px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 시구절 */
        .poem-section {
            text-align: center;
            padding: 48px 0;
        }

        .poem-content {
            font-family: 'Noto Serif KR', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 2.4;
            color: var(--text-primary);
            margin-bottom: 36px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        .poem-author {
            font-size: 0.9rem;
            color: var(--accent);
            font-style: italic;
            opacity: 0.8;
        }

        .poem-refresh {
            margin-top: 48px;
            padding: 14px 28px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .poem-refresh:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        /* 감사 일기 */
        .gratitude-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .gratitude-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .gratitude-dot {
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, var(--accent), #9370db);
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 12px var(--accent-glow);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .gratitude-input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 0;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .gratitude-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 2px 15px -5px var(--accent-glow);
        }

        .gratitude-input::placeholder {
            color: var(--text-muted);
        }

        .save-btn {
            margin-top: 28px;
            padding: 16px 36px;
            background: linear-gradient(135deg, var(--accent) 0%, #c4956a 100%);
            border: none;
            border-radius: 10px;
            color: var(--bg-deep);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px var(--accent-glow);
        }

        .saved-message {
            margin-top: 16px;
            color: var(--accent);
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .saved-message.show {
            opacity: 1;
        }

        /* 호흡 명상 */
        .breathing-section {
            text-align: center;
            padding: 32px 0;
        }

        .breathing-visual {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 48px auto;
        }

        .breathing-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            border: 2px solid rgba(200, 210, 235, 0.5);
            border-radius: 50%;
            opacity: 0.4;
            transition: all 4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 30px rgba(200, 210, 235, 0.3), inset 0 0 25px rgba(200, 210, 235, 0.15);
        }

        .breathing-ring-outer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 1px solid rgba(147, 112, 219, 0.3);
            border-radius: 50%;
            animation: breatheOuter 8s ease-in-out infinite;
        }

        @keyframes breatheOuter {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }

        .breathing-guide {

            text-align: center;

        .release-textarea {
            width: 100%;

            font-size: 1rem;
            font-family: inherit;
            resize: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .release-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .release-textarea::placeholder {
            color: var(--text-muted);
        }

        .release-btn {
            margin-top: 24px;
            padding: 16px 36px;
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: 10px;
            color: var(--accent);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .release-btn:hover {
            background: linear-gradient(135deg, var(--accent) 0%, #c4956a 100%);

        .flying-worry {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 0.9rem;
            color: var(--text-muted);

            backdrop-filter: blur(10px);

        @keyframes flyAway {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        }

        .release-complete {
            display: none;
            padding: 28px;
            margin-top: 28px;
            text-align: center;
        }

        .release-complete.show {
            display: block;

        .release-complete p {

        /* 공유 섹션 */

        .share-btn:hover {

        }

        .share-btn img {

        .kakao-btn:hover {

        .copy-btn:hover {
            border-color: var(--accent);

        /* 좋은 밤 메시지 */

            text-align: center;

            margin-top: 40px;
            border-top: 1px solid var(--border-subtle);
        }

        .goodnight-message {
            font-family: 'Noto Serif KR', Georgia, serif;
            font-size: 1.15rem;
            line-height: 2.2;

        }

        /* 푸터 */
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            color: var(--accent);
        }

        /* 컨트롤 버튼들 */
        .controls {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .control-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(1.05);
        }

        .control-btn.playing {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* 반응형 */
        @media (max-width: 600px) {
            .container {
                padding: 0 18px;

            header {
                padding: 48px 0 28px;

            .time-display {
                font-size: 3.2rem;
            }

                width: 180px;
                height: 180px;

                height: 130px;

            .breathing-ring.inhale {
                width: 170px;
                height: 170px;
            }

                width: 80px;
                height: 80px;
            }

            .controls {
                top: 16px;
                right: 16px;
                gap: 8px;
            }

            .control-btn {
                width: 42px;
                height: 42px;
                font-size: 1rem;
            }

            .breathing-controls {
                flex-direction: column;
            }

            .save-btn,
            .release-btn,
            .poem-refresh {
                width: 100%;

                flex-direction: column;
                align-items: center;
            }

            .share-btn {
                width: 100%;
                max-width: 200px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<h1 style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">하루 마무리 힐링 - 감사일기, 호흡명상, 걱정 내려놓기 | 무료 온라인 힐링</h1>
    <!-- 배경 그라데이션 -->
    <div class="bg-gradient"></div>

    <!-- 달 -->
    <div class="moon"></div>

    <!-- 별들 -->
    <div class="stars" id="stars"></div>

    <!-- 반딧불이 파티클 -->
    <div class="particles" id="particles"></div>

    <!-- 배경 음악 (숲소리) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="../sounds/forest.mp3" type="audio/mpeg">
    </audio>

    <!-- 컨트롤 버튼들 -->
    <div class="controls">
        <a href="../index.html" class="control-btn" title="홈">&#8592;</a>
        <button class="control-btn" id="musicBtn" title="배경 음악">&#9835;</button>
    </div>

    <div class="container">
        <header>
            <div class="time-display" id="currentTime">21:30</div>
            <div class="date-display" id="currentDate">12월 28일 토요일</div>
        </header>

        <!-- 네비게이션 탭 -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-section="poem">시구절</button>
            <button class="nav-tab" data-section="gratitude">감사</button>
            <button class="nav-tab" data-section="breathing">호흡</button>
            <button class="nav-tab" data-section="release">내려놓기</button>
        </div>

        <!-- 1. 오늘의 시구절 -->
        <section class="section poem-section" id="poemSection">
            <div class="poem-content" id="poemContent">
                잠시 멈추어<br>
                고요함 속에서<br>
                나를 만나는 시간
            </div>
            <p class="poem-author" id="poemAuthor">- 마음의 쉼터</p>
            <button class="poem-refresh" id="newPoemBtn">다른 글귀</button>
        </section>

        <!-- 2. 감사 일기 -->
        <section class="section" id="gratitudeSection" style="display: none;">
            <p class="section-label">오늘 감사한 것</p>
            <div class="gratitude-list">
                <div class="gratitude-item">
                    <span class="gratitude-dot"></span>
                    <input type="text" class="gratitude-input" id="gratitude1" placeholder="첫 번째 감사">
                </div>
                <div class="gratitude-item">
                    <span class="gratitude-dot"></span>
                    <input type="text" class="gratitude-input" id="gratitude2" placeholder="두 번째 감사">
                </div>
                <div class="gratitude-item">
                    <span class="gratitude-dot"></span>
                    <input type="text" class="gratitude-input" id="gratitude3" placeholder="세 번째 감사">
                </div>
            </div>
            <button class="save-btn" id="saveGratitudeBtn">저장</button>
            <p class="saved-message" id="savedMessage">저장되었습니다</p>
        </section>

        <!-- 3. 호흡 명상 -->
        <section class="section breathing-section" id="breathingSection" style="display: none;">
            <p class="section-label">4-7-8 호흡법</p>
            <div class="breathing-visual">
                <div class="breathing-ring-outer"></div>
                <div class="breathing-ring" id="breathingCircle"></div>
                <div class="breathing-center">
                    <div class="breathing-instruction" id="breathingInstruction">시작하세요</div>
                    <div class="breathing-count" id="breathingCount"></div>
                </div>
            </div>
            <div class="breathing-controls">
                <button class="breathing-btn" id="startBreathingBtn">시작</button>
                <button class="breathing-btn" id="stopBreathingBtn">정지</button>
            </div>
            <div class="breathing-guide">
                4초 들이쉬기 &#8594; 7초 참기 &#8594; 8초 내쉬기<br>
                긴장 완화와 수면에 도움이 됩니다
            </div>
        </section>

        <!-- 4. 걱정 내려놓기 -->
        <section class="section release-section" id="releaseSection" style="display: none;">
            <p class="section-label">마음의 짐을 내려놓으세요</p>
            <textarea class="release-textarea" id="worryText" placeholder="오늘 마음에 걸렸던 것들을 적어보세요..."></textarea>
            <button class="release-btn" id="releaseBtn">놓아주기</button>
            <div class="release-complete" id="releaseComplete">
                <p>마음이 가벼워졌기를 바랍니다.<br>편안한 밤 되세요.</p>
            </div>
        </section>

        <!-- 5. 공유 섹션 -->
        <section class="share-section">
            <h3>친구에게 공유하기</h3>
            <div class="social-share">
                <button id="kakao-share" class="share-btn kakao-btn">
                    <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_small.png" alt="카카오톡">
                    카카오톡
                </button>
                <button id="copy-link" class="share-btn copy-btn">
                    <span>&#128279;</span>
                    링크 복사
                </button>
            </div>
        </section>

        <!-- 6. 좋은 밤 메시지 -->
        <section class="goodnight-section">
            <p class="goodnight-message" id="goodnightMessage">
                오늘 하루도 수고 많으셨어요.<br>
                편안한 밤 되세요.
            </p>
        </section>

        <footer>
            <p>&copy; 2025 <a href="../index.html">BrainDetox</a></p>
        </footer>
    </div>

    <script>
        // 카카오 SDK 초기화
        if (window.Kakao && !window.Kakao.isInitialized()) {
            window.Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
        }

        // 시구절 데이터
        const poems = [
            { content: "잠시 멈추어<br>고요함 속에서<br>나를 만나는 시간", author: "마음의 쉼터" },
            { content: "별빛 아래<br>오늘의 나를 안아주며<br>내일을 꿈꾼다", author: "저녁의 명상" },
            { content: "지친 하루 끝에<br>달빛이 쓰다듬어 주는<br>이 고요함이 선물", author: "밤의 위로" },
            { content: "완벽하지 않아도 괜찮아<br>오늘도 살아낸 것만으로<br>충분히 대단해", author: "자기 긍정" },
            { content: "숨을 깊이 들이쉬고<br>천천히 내쉬며<br>모든 것을 내려놓는다", author: "호흡의 명상" },
            { content: "밤하늘의 별들처럼<br>당신도 빛나고 있어요<br>스스로 모를 뿐", author: "별빛 같은 당신에게" },
            { content: "오늘 흘린 땀과 눈물이<br>내일의 나를<br>더 단단하게 만들 거야", author: "성장의 속삭임" },
            { content: "달은 매일 차고 기우는데<br>완벽한 보름달만<br>달이 아닌 것처럼", author: "불완전함의 아름다움" },
            { content: "쉬어가도 괜찮아<br>멈춤도 여정의 일부<br>지금 이 순간을 허락해", author: "쉼의 철학" },
            { content: "파도가 밀려왔다<br>물러가는 것처럼<br>힘든 일도 지나가리", author: "자연의 위로" },
            { content: "오늘 하루가<br>내일의 나에게<br>보내는 응원의 편지", author: "시간의 선물" },
            { content: "잠들기 전<br>세 가지 감사를<br>베개 밑에 숨겨두세요", author: "감사의 습관" },
            { content: "당신의 하루가<br>누군가에겐<br>기적이었을 거예요", author: "소중한 존재" },
            { content: "밤은 낮의 끝이 아니라<br>새로운 시작을 위한<br>충전의 시간", author: "밤의 의미" },
            { content: "고요한 밤<br>마음의 소리에<br>귀 기울이는 시간", author: "내면의 대화" }
        ];

        // 좋은 밤 메시지
        const goodnightMessages = [
            "오늘 하루도 수고 많으셨어요.<br>당신은 충분히 잘하고 있어요.<br>편안한 밤 되세요.",
            "힘든 하루였다면<br>더 많이 쉬어도 괜찮아요.<br>좋은 꿈 꾸세요.",
            "오늘의 당신에게<br>수고했다고 말해주세요.<br>달콤한 꿈나라로.",
            "내일은 또 다른 기회가 있어요.<br>오늘 밤은 푹 쉬세요.<br>굿나잇!",
            "당신의 존재 자체가<br>누군가에겐 큰 힘이 됩니다.<br>포근한 밤 되세요."
        ];

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            createParticles();
            updateTime();
            setInterval(updateTime, 1000);
            loadGratitude();
            showRandomPoem();
            showRandomGoodnight();
            setupNavTabs();
            setupBreathing();
            setupRelease();
            setupMusic();
            setupShare();
        });

        // 별 생성
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 60 + '%';
                star.style.width = (1 + Math.random() * 2) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 2) + 's';
                container.appendChild(star);
            }
        }

        // 반딧불이 파티클 생성
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 12 + 's';
                particle.style.animationDuration = (10 + Math.random() * 6) + 's';
                container.appendChild(particle);
            }
        }

        // 시간 및 날짜 업데이트 (KST)
        function updateTime() {
            // KST 시간 계산 (UTC+9)
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const kst = new Date(utc + (9 * 60 * 60 * 1000));

            const hours = kst.getHours().toString().padStart(2, '0');
            const minutes = kst.getMinutes().toString().padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}`;

            // 날짜 업데이트
            const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            const month = kst.getMonth() + 1;
            const date = kst.getDate();
            const day = days[kst.getDay()];
            document.getElementById('currentDate').textContent = `${month}월 ${date}일 ${day}`;
        }

        // 랜덤 시구절
        function showRandomPoem() {
            const poem = poems[Math.floor(Math.random() * poems.length)];
            document.getElementById('poemContent').innerHTML = poem.content;
            document.getElementById('poemAuthor').textContent = '- ' + poem.author;
        }

        document.getElementById('newPoemBtn').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
                showRandomPoem();
            }, 100);
        });

        // 랜덤 좋은 밤 메시지
        function showRandomGoodnight() {
            const message = goodnightMessages[Math.floor(Math.random() * goodnightMessages.length)];
            document.getElementById('goodnightMessage').innerHTML = message;
        }

        // 네비게이션 탭
        function setupNavTabs() {
            const tabs = document.querySelectorAll('.nav-tab');
            const sections = {
                poem: document.getElementById('poemSection'),
                gratitude: document.getElementById('gratitudeSection'),
                breathing: document.getElementById('breathingSection'),
                release: document.getElementById('releaseSection')
            };

            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    Object.values(sections).forEach(s => s.style.display = 'none');
                    sections[this.dataset.section].style.display = 'block';
                });
            });
        }

        // 감사 일기 저장
        document.getElementById('saveGratitudeBtn').addEventListener('click', function() {
            const today = new Date().toISOString().split('T')[0];
            const gratitude = {
                date: today,
                items: [
                    document.getElementById('gratitude1').value,
                    document.getElementById('gratitude2').value,
                    document.getElementById('gratitude3').value
                ]
            };

            let gratitudeHistory = JSON.parse(localStorage.getItem('gratitudeHistory') || '[]');
            gratitudeHistory = gratitudeHistory.filter(g => g.date !== today);
            gratitudeHistory.push(gratitude);
            localStorage.setItem('gratitudeHistory', JSON.stringify(gratitudeHistory));

            const message = document.getElementById('savedMessage');
            message.classList.add('show');
            setTimeout(() => message.classList.remove('show'), 3000);
        });

        // 감사 일기 불러오기
        function loadGratitude() {
            const today = new Date().toISOString().split('T')[0];
            const history = JSON.parse(localStorage.getItem('gratitudeHistory') || '[]');
            const todayGratitude = history.find(g => g.date === today);

            if (todayGratitude) {
                document.getElementById('gratitude1').value = todayGratitude.items[0] || '';
                document.getElementById('gratitude2').value = todayGratitude.items[1] || '';
                document.getElementById('gratitude3').value = todayGratitude.items[2] || '';
            }
        }

        // 호흡 명상
        function setupBreathing() {
            let breathingInterval = null;
            let phase = 'ready';
            let count = 0;

            const circle = document.getElementById('breathingCircle');
            const instruction = document.getElementById('breathingInstruction');
            const countDisplay = document.getElementById('breathingCount');
            const startBtn = document.getElementById('startBreathingBtn');
            const stopBtn = document.getElementById('stopBreathingBtn');

            function updateBreathing() {
                if (phase === 'inhale') {
                    count--;
                    countDisplay.textContent = count;
                    if (count <= 0) {
                        phase = 'hold';
                        count = 7;
                        instruction.textContent = '참으세요';
                        circle.className = 'breathing-ring hold';
                    }
                } else if (phase === 'hold') {
                    count--;
                    countDisplay.textContent = count;
                    if (count <= 0) {
                        phase = 'exhale';
                        count = 8;
                        instruction.textContent = '내쉬세요';
                        circle.className = 'breathing-ring exhale';
                    }
                } else if (phase === 'exhale') {
                    count--;
                    countDisplay.textContent = count;
                    if (count <= 0) {
                        phase = 'inhale';
                        count = 4;
                        instruction.textContent = '들이쉬세요';
                        circle.className = 'breathing-ring inhale';
                    }
                }
            }

            startBtn.addEventListener('click', function() {
                if (breathingInterval) return;

                phase = 'inhale';
                count = 4;
                instruction.textContent = '들이쉬세요';
                countDisplay.textContent = count;
                circle.className = 'breathing-ring inhale';

                breathingInterval = setInterval(updateBreathing, 1000);
            });

            stopBtn.addEventListener('click', function() {
                if (breathingInterval) {
                    clearInterval(breathingInterval);
                    breathingInterval = null;
                }
                phase = 'ready';
                instruction.textContent = '시작하세요';
                countDisplay.textContent = '';
                circle.className = 'breathing-ring';
            });
        }

        // 걱정 내려놓기
        function setupRelease() {
            const releaseBtn = document.getElementById('releaseBtn');
            const worryText = document.getElementById('worryText');
            const releaseComplete = document.getElementById('releaseComplete');

            releaseBtn.addEventListener('click', function() {
                const worry = worryText.value.trim();
                if (!worry) {
                    worryText.placeholder = '걱정을 적어주세요...';
                    return;
                }

                // 날아가는 애니메이션
                const flyingWorry = document.createElement('div');
                flyingWorry.className = 'flying-worry';
                flyingWorry.textContent = worry.substring(0, 50) + (worry.length > 50 ? '...' : '');
                flyingWorry.style.left = '50%';
                flyingWorry.style.top = '50%';
                document.body.appendChild(flyingWorry);

                setTimeout(() => {
                    flyingWorry.remove();
                }, 3000);

                worryText.value = '';
                releaseComplete.classList.add('show');

                setTimeout(() => {
                    releaseComplete.classList.remove('show');
                }, 5000);
            });
        }

        // 배경 음악 - forest.mp3 자동 재생
        function setupMusic() {
            const musicBtn = document.getElementById('musicBtn');
            const bgMusic = document.getElementById('bgMusic');
            let isPlaying = false;

            bgMusic.volume = 0.4;

            function startAutoPlay() {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    musicBtn.classList.add('playing');
                    musicBtn.innerHTML = '&#128266;';
                }).catch(() => {
                    document.addEventListener('click', playOnInteraction, { once: true });
                    document.addEventListener('touchstart', playOnInteraction, { once: true });
                    document.addEventListener('keydown', playOnInteraction, { once: true });
                    document.addEventListener('scroll', playOnInteraction, { once: true });
                });
            }

            function playOnInteraction() {
                if (!isPlaying) {
                    bgMusic.play().then(() => {
                        isPlaying = true;
                        musicBtn.classList.add('playing');
                        musicBtn.innerHTML = '&#128266;';
                    });
                }
                document.removeEventListener('click', playOnInteraction);
                document.removeEventListener('touchstart', playOnInteraction);
                document.removeEventListener('keydown', playOnInteraction);
                document.removeEventListener('scroll', playOnInteraction);
            }

            startAutoPlay();

            musicBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isPlaying) {
                    bgMusic.pause();
                    isPlaying = false;
                    musicBtn.classList.remove('playing');
                    musicBtn.innerHTML = '&#128264;';
                } else {
                    bgMusic.play();
                    isPlaying = true;
                    musicBtn.classList.add('playing');
                    musicBtn.innerHTML = '&#128266;';
                }
            });
        }

        // 소셜 공유 기능

            const kakaoShareBtn = document.getElementById('kakao-share');

                kakaoShareBtn.addEventListener('click', function() {

                        alert('카카오톡 SDK를 불러올 수 없습니다.');
                        return;
                    }

                    if (!window.Kakao.isInitialized()) {
                        window.Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
                    }

                    try {

                                        webUrl: 'https://braindetox.kr/static/relaxing_day.html'
                                    }
                                },
                                buttons: [
                                    {
                                        title: '지금 시작하기',
                                        link: {
                                            mobileWebUrl: 'https://braindetox.kr/static/relaxing_day.html',
                                            webUrl: 'https://braindetox.kr/static/relaxing_day.html'
                                        }
                                    }
                                ]
                            });
                        } else if (window.Kakao.Link) {
                            window.Kakao.Link.sendDefault({
                                objectType: 'feed',
                                content: {
                                    title: '하루 마무리 힐링',
                                    description: '4-7-8 호흡 명상, 감사 일기, 힐링 시구절로 하루를 평온하게 마무리하세요.',
                                    imageUrl: 'https://braindetox.kr/static/images/relaxing_day_og.png',
                                    link: {
                                        mobileWebUrl: 'https://braindetox.kr/static/relaxing_day.html',
                                        webUrl: 'https://braindetox.kr/static/relaxing_day.html'
                                    }
                                },
                                buttons: [
                                    {
                                        title: '지금 시작하기',
                                        link: {
                                            mobileWebUrl: 'https://braindetox.kr/static/relaxing_day.html',
                                            webUrl: 'https://braindetox.kr/static/relaxing_day.html'
                                        }
                                    }
                                ]
                            });
                        }
                    } catch (error) {
                        console.error('카카오톡 공유 중 오류 발생:', error);
                        window.open(`https://sharer.kakao.com/talk/friends/picker/link?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent('하루 마무리 힐링')}`, 'kakaotalk_share', 'width=350, height=650');
                    }
                });
            }

            // 링크 복사
            const copyLinkBtn = document.getElementById('copy-link');
            if (copyLinkBtn) {
                copyLinkBtn.addEventListener('click', async function() {
                    try {
                        await navigator.clipboard.writeText('https://braindetox.kr/static/relaxing_day.html');
                        const originalText = this.innerHTML;
                        this.innerHTML = '<span>&#10003;</span> 복사됨!';
                        setTimeout(() => {
                            this.innerHTML = originalText;
                        }, 2000);
                    } catch (err) {
                        // 폴백: 구형 브라우저 지원
                        const textArea = document.createElement('textarea');
                        textArea.value = 'https://braindetox.kr/static/relaxing_day.html';
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        this.innerHTML = '<span>&#10003;</span> 복사됨!';
                        setTimeout(() => {
                            this.innerHTML = '<span>&#128279;</span> 링크 복사';
                        }, 2000);
                    }
                });
            }
        }
    </script>
