<body>

            <div class="time-input-group">

                    <label>小时</label>

                        <span>小时</span>
                    </div>
                </div>
                <div class="time-input-wrapper">

                    <div class="time-input">
                        <input type="number" id="meetingMinutes" value="0" min="0" max="59" step="5">

        </div>

        <div class="card">

                <thead><tr><th>职级</th><th>时薪</th><th>人数</th><th>小计</th></tr></thead>
                <tbody id="attendeeList"></tbody>
            </table>
        </div>

        <div class="ad-container">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7911569280980377" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
        </div>

        <div class="card result-card">
            <div class="card-header">
                <div class="card-icon">💰</div>
                <span class="card-title">计算结果</span>
            </div>
            <div class="total-cost">
                <div class="total-cost-label">会议总成本</div>
                <div class="total-cost-value" id="totalCost">₩0</div>
            </div>
            <div class="result-stats">
                <div class="stat-item"><div class="stat-label">参会人数</div><div class="stat-value" id="totalAttendees">0人</div></div>
                <div class="stat-item"><div class="stat-label">会议时长</div><div class="stat-value" id="meetingDuration">0分钟</div></div>
                <div class="stat-item"><div class="stat-label">每分钟成本</div><div class="stat-value" id="costPerMinute">₩0</div></div>
            </div>
            <div class="share-group">
                <button class="share-btn" id="copyResult">📋 复制结果</button>
                <button class="share-btn kakao" id="shareKakao">💬 分享到KakaoTalk</button>
            </div>
            <p class="data-source">※ 时薪数据基于韩国平均工资统计（2025年）</p>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon">💡</div>
                <span class="card-title">高效会议小贴士</span>
            </div>
            <div class="tips-grid">
                <div class="tip-item"><span class="tip-icon">⏰</span><span class="tip-text">以30分钟为单位设置会议</span></div>
                <div class="tip-item"><span class="tip-icon">👤</span><span class="tip-text">只邀请必要的参会者</span></div>
                <div class="tip-item"><span class="tip-icon">📝</span><span class="tip-text">提前分享会议议程</span></div>
                <div class="tip-item"><span class="tip-icon">✅</span><span class="tip-text">撰写并分享会议记录</span></div>
            </div>
        </div>

        <footer><p>&copy; 2025 <a href="https://braindetox.kr">BrainDetox</a>. All rights reserved.</p></footer>
    </div>

    <script>
        const positions = [
            { id: 'staff', name: '职员', hourlyRate: 17300 },
            { id: 'senior', name: '主任', hourlyRate: 21600 },
            { id: 'manager', name: '科长', hourlyRate: 27400 },
            { id: 'deputy', name: '副经理', hourlyRate: 34600 },
            { id: 'general', name: '经理', hourlyRate: 43300 },
            { id: 'executive', name: '高管', hourlyRate: 72100 }
        ];
        const state = { hours: 1, minutes: 0, attendees: {} };
        positions.forEach(p => state.attendees[p.id] = 0);

        function formatKRW(amount) { return '₩' + Math.round(amount).toLocaleString(); }

        function renderAttendeeTable() {
            document.getElementById('attendeeList').innerHTML = positions.map(pos => `
                <tr>
                    <td><span class="position-name">${pos.name}</span></td>
                    <td><span class="hourly-rate">${formatKRW(pos.hourlyRate)}/小时</span></td>
                    <td><div class="count-control"><button class="count-btn" onclick="updateCount('${pos.id}', -1)">−</button><input type="number" class="count-input" id="count-${pos.id}" value="0" min="0" max="99" onchange="setCount('${pos.id}', this.value)"><button class="count-btn" onclick="updateCount('${pos.id}', 1)">+</button></div></td>
                    <td><span class="subtotal" id="subtotal-${pos.id}">${formatKRW(0)}</span></td>
                </tr>
            `).join('');
        }

        function updateCount(positionId, delta) {
            const input = document.getElementById(`count-${positionId}`);
            const newValue = Math.max(0, Math.min(99, parseInt(input.value) + delta));
            input.value = newValue;
            state.attendees[positionId] = newValue;
            calculateCost();
        }
        function setCount(positionId, value) {
            const newValue = Math.max(0, Math.min(99, parseInt(value) || 0));
            document.getElementById(`count-${positionId}`).value = newValue;
            state.attendees[positionId] = newValue;
            calculateCost();
        }

        document.getElementById('meetingHours').addEventListener('input', (e) => { state.hours = Math.max(0, Math.min(24, parseInt(e.target.value) || 0)); e.target.value = state.hours; calculateCost(); });
        document.getElementById('meetingMinutes').addEventListener('input', (e) => { state.minutes = Math.max(0, Math.min(59, parseInt(e.target.value) || 0)); e.target.value = state.minutes; calculateCost(); });

        function calculateCost() {
            const totalMinutes = (state.hours * 60) + state.minutes;
            const totalHours = totalMinutes / 60;
            let totalCost = 0, totalAttendees = 0;
            positions.forEach(pos => {
                const count = state.attendees[pos.id] || 0;
                const subtotal = count * pos.hourlyRate * totalHours;
                totalCost += subtotal; totalAttendees += count;
                const el = document.getElementById(`subtotal-${pos.id}`);
                el.textContent = formatKRW(subtotal);
                el.classList.toggle('has-value', subtotal > 0);
            });
            document.getElementById('totalCost').textContent = formatKRW(totalCost);
            document.getElementById('totalAttendees').textContent = `${totalAttendees}人`;
            let durationText = '';
            if (state.hours > 0) durationText += `${state.hours}小时`;
            if (state.minutes > 0) durationText += `${state.minutes}分钟`;
            document.getElementById('meetingDuration').textContent = durationText || '0分钟';
            document.getElementById('costPerMinute').textContent = formatKRW(totalMinutes > 0 ? totalCost / totalMinutes : 0);
        }

        document.getElementById('copyResult').addEventListener('click', () => {
            const resultText = `📊 会议成本计算结果\n\n⏱️ 会议时长: ${document.getElementById('meetingDuration').textContent}\n👥 参会人数: ${document.getElementById('totalAttendees').textContent}\n💰 总成本: ${document.getElementById('totalCost').textContent}\n📈 每分钟: ${document.getElementById('costPerMinute').textContent}\n\n🔗 立即计算: https://braindetox.kr/zh/static/meeting_calculator.html`;
            navigator.clipboard.writeText(resultText).then(() => { const btn = document.getElementById('copyResult'); const original = btn.innerHTML; btn.innerHTML = '✓ 已复制'; setTimeout(() => btn.innerHTML = original, 2000); });
        });

        document.getElementById('shareKakao').addEventListener('click', () => {
            if (!window.Kakao) return;
            if (!window.Kakao.isInitialized()) window.Kakao.init('e06d0ee93e450a11bc6451d46e09cd88');
            try {
                Kakao.Share.sendDefault({
                    objectType: 'feed',
                    content: { title: '会议成本计算结果', description: `${document.getElementById('totalAttendees').textContent}参会${document.getElementById('meetingDuration').textContent}: ${document.getElementById('totalCost').textContent}`, imageUrl: 'https://braindetox.kr/site_logo.png', link: { mobileWebUrl: 'https://braindetox.kr/zh/static/meeting_calculator.html', webUrl: 'https://braindetox.kr/zh/static/meeting_calculator.html' } },
                    buttons: [{ title: '立即计算', link: { mobileWebUrl: 'https://braindetox.kr/zh/static/meeting_calculator.html', webUrl: 'https://braindetox.kr/zh/static/meeting_calculator.html' } }]
                });
            } catch (e) { console.error(e); }
        });

        renderAttendeeTable();
        calculateCost();
        document.addEventListener('DOMContentLoaded', () => { try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {} });
    </script>
